# fly.toml app configuration file generated for jupr-staging on 2026-02-10T19:41:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# force rebuild

app = 'jupr-staging'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm to avoid cold starts for our community-facing app.
  # Staging should mirror production runtime behavior.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

