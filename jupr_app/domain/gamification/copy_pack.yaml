style_guide:
  voice: "sports_documentary"
  notes:
    - "Never say: requirement, criteria, unlock condition, formula."
    - "Hints are cryptic; do not include explicit thresholds."
    - "Tape excerpts may include numbers that happened (truth hidden in story)."
    - "Foreshadowing implies proximity without checklists or commands."

badges:

  # ------------------------------------------------------------
  # Participation Milestones (existing)
  # ------------------------------------------------------------

  participant:
    name: "Participant"
    lore: "Every career starts the same way: a name on the sheet and a moment on tape."
    hint: "The archive doesn’t recognize potential. Only appearances."
    tape_excerpts:
      - |
        The ledger opens with a simple entry.
        No hype. No headlines.
        Just proof you were here.
      - |
        First stamp in the file.
        The season gets a little more real now.
      - |
        The tape room marks the beginning.
        Everything after this is earned.
    highlight:
      titles:
        - "The File Opens"
        - "First Stamp"
      bodies:
        - |
          It starts quietly.
          One match, one entry, one line in the ledger.
        - |
          The archive has you now.
          And it doesn’t forget.
    foreshadow: null

  dedicated_participant_50:
    name: "Dedicated Participant"
    lore: "Fifty matches is where routine becomes identity."
    hint: "The schedule is starting to recognize you."
    tape_excerpts:
      - |
        Fifty times on tape.
        Not all of them pretty.
        All of them yours.
      - |
        The ledger flips another page.
        Your name is already printed on it.
      - |
        A quiet milestone.
        The kind that only grinders ever reach.
    highlight:
      titles:
        - "The Grind Shows"
        - "Fifty Logged"
      bodies:
        - |
          The camera kept rolling.
          You kept showing up.
        - |
          Some players have highlights.
          You have a body of work.
    foreshadow:
      titles:
        - "The Counter’s Climbing"
      bodies:
        - |
          The total keeps rising.
          This isn’t a cameo anymore.

  lifetime_participant_200:
    name: "Lifetime Participant"
    lore: "Two hundred matches doesn’t happen by accident. It happens by refusing to disappear."
    hint: "The archive is getting heavy."
    tape_excerpts:
      - |
        Two hundred matches in the file.
        Not a flash.
        A legacy-in-progress.
      - |
        The ledger doesn’t hand these out.
        It records them.
        You forced its hand.
      - |
        Two hundred times under pressure.
        The tape room calls that a career.
    highlight:
      titles:
        - "A Career on Tape"
        - "Two Hundred"
      bodies:
        - |
          This isn’t a hot streak.
          This is years of choosing the match.
        - |
          The archive is thick with your nights.
          And it’s still recording.
    foreshadow:
      titles:
        - "The File Gets Heavier"
      bodies:
        - |
          You’re not far now.
          The ledger is already making room.

  # ------------------------------------------------------------
  # Participation & Habit Loop (your edited set)
  # ------------------------------------------------------------

  first_win:
    name: "First Win"
    lore: "The first win doesn’t crown you. It introduces you."
    hint: "There’s an empty space in the win column with your name on it."
    tape_excerpts:
      - |
        The first W hits the ledger.
        Small on paper.
        Loud in the room.
      - |
        You didn’t just play.
        You finished.
        The archive noticed.
      - |
        One match, one turn of fate.
        The tape room labels it: "Start."
    highlight:
      titles:
        - "The First Mark"
        - "It Counts Now"
      bodies:
        - |
          The file changes the moment a win appears.
          Everything after this has context.
        - |
          You can’t be “almost” anymore.
          The tape has you closing.
    foreshadow: null

  weekly_regular:
    name: "Weekly Regular"
    lore: "Championship stories start as routines nobody celebrates."
    hint: "The schedule is starting to recognize a pattern."
    tape_excerpts:
      - |
        Four weeks in a row on tape.
        The league stops calling it luck.
      - |
        Another week, another appearance.
        The routine becomes a presence.
      - |
        The calendar tried to break the rhythm.
        It failed.
    highlight:
      titles:
        - "The Routine Becomes Real"
        - "The Schedule Remembers"
      bodies:
        - |
          Week after week, you were there.
          That’s how stories start before they have names.
        - |
          Consistency isn’t loud.
          Until it is.
    foreshadow:
      titles:
        - "The Pattern is Forming"
        - "Three Weeks on Tape"
      bodies:
        - |
          The rhythm is undeniable now.
          One more week and the archive stops asking questions.
        - |
          The league is starting to expect you.
          Expectations are dangerous.

  iron_week:
    name: "Iron Week"
    lore: "Some weeks are a single chapter. Some weeks are a series."
    hint: "A week can hold more than one night of work."
    tape_excerpts:
      - |
        Three different days.
        Same focus.
        The week didn’t get easier—you got steadier.
      - |
        The tape room logs another date.
        Then another.
        Then another.
      - |
        A week with repeated footsteps.
        The kind that builds a season.
    highlight:
      titles:
        - "Work Week"
        - "Three Nights of Proof"
      bodies:
        - |
          You didn’t wait for momentum.
          You scheduled it.
        - |
          The archive shows the same thing on different nights:
          you showed up.
    foreshadow:
      titles:
        - "The Week Has Pages Left"
      bodies:
        - |
          You’ve started the run.
          The tape room is watching for the third stamp.

  marathon_month:
    name: "Marathon Month"
    lore: "Forty matches in a month is the kind of volume that reshapes a ranking table."
    hint: "The month is getting heavy."
    tape_excerpts:
      - |
        Forty matches.
        The body learns the pace.
        The mind learns the noise.
      - |
        The calendar ran out of excuses.
        You ran out of off days.
      - |
        A month becomes a montage.
        And you’re in every scene.
    highlight:
      titles:
        - "A Month on Repeat"
        - "Volume"
      bodies:
        - |
          People talk about “putting in work.”
          The tape room just shows the math.
        - |
          This wasn’t a week-long push.
          This was a month-long decision.
    foreshadow:
      titles:
        - "The Month Isn’t Finished"
      bodies:
        - |
          The pace is real.
          If it holds, the archive will have to rename the chapter.

  # ------------------------------------------------------------
  # Skill Growth & Momentum
  # ------------------------------------------------------------

  level_up:
    name: "Level Up"
    lore: "Every league has numbers that feel like doors. One of them just opened."
    hint: "A number is waiting at the edge of the page."
    tape_excerpts:
      - |
        The rating crosses a line people whisper about.
        Quietly.
        Permanently.
      - |
        A milestone doesn’t cheer.
        It just appears.
        Tonight, it appeared for you.
      - |
        The ledger changes by one threshold.
        The room changes by a little more.
    highlight:
      titles:
        - "A Door Opens"
        - "The Number Moves"
      bodies:
        - |
          It’s not just progress.
          It’s a new neighborhood in the standings.
        - |
          The league will pretend it didn’t notice.
          The tape won’t.
    foreshadow:
      titles:
        - "Close to the Line"
      bodies:
        - |
          You’re hovering near a number that changes conversations.
          The next match could do it.

  rocket_start:
    name: "Rocket Start"
    lore: "Some starts are cautious. Some starts announce themselves."
    hint: "The opening chapter is louder than expected."
    tape_excerpts:
      - |
        Early season, heavy movement.
        The league looks up and realizes you’re already climbing.
      - |
        A fast start doesn’t promise a finish.
        But it forces attention.
      - |
        The tape room labels the first stretch:
        “Acceleration.”
    highlight:
      titles:
        - "A Fast Beginning"
        - "The League Looks Up"
      bodies:
        - |
          The standings weren’t ready for this pace.
          You were.
        - |
          A start like this changes how opponents warm up.
    foreshadow:
      titles:
        - "The Start is Heating Up"
      bodies:
        - |
          The early results are stacking.
          One more clean night and the story shifts.

  most_improved_monthly:
    name: "Most Improved"
    lore: "Improvement is hard to spot in a single match. It’s undeniable over a month."
    hint: "The climb didn’t stop when the week ended."
    tape_excerpts:
      - |
        Month’s end.
        Biggest rise.
        The tape calls it persistence with direction.
      - |
        You gained ground while others held position.
        The ledger doesn’t call it talent.
        It calls it work.
      - |
        The month closes.
        Your name is the one that moved the most.
    highlight:
      titles:
        - "The Biggest Climb"
        - "A Month of Gain"
      bodies:
        - |
          This wasn’t a lucky weekend.
          This was a month-long argument with gravity.
        - |
          The league has improvers.
          And then it has you—this month.
    foreshadow:
      titles:
        - "The Month is Tilting"
      bodies:
        - |
          Your trend is hard to ignore.
          If it holds, the archive writes your name at the top of the climb.

  mountain_climber:
    name: "Mountain Climber"
    lore: "Standings don’t care who you were. They only care where you are now."
    hint: "The ladder can move faster than people expect."
    tape_excerpts:
      - |
        You didn’t jump a step.
        You cleared a section.
        The table has to redraw itself.
      - |
        Places gained.
        Noise made.
        The climb looks different from up here.
      - |
        The ledger marks a rise in position.
        The league marks a rise in concern.
    highlight:
      titles:
        - "The Table Shifts"
        - "The Climb Shows"
      bodies:
        - |
          Rankings don’t move for speeches.
          They move for results.
        - |
          The league is learning a new habit:
          checking where you are.
    foreshadow:
      titles:
        - "The Next Rung"
      bodies:
        - |
          The climb has momentum.
          One more push and the table has to make room again.

  hot_streak:
    name: "Hot Streak"
    lore: "A streak is the sport’s oldest lie detector. It reveals who you are when it keeps working."
    hint: "The tape keeps rolling. The wins keep stacking."
    tape_excerpts:
      - |
        {streak} straight.
        At some point it stops being a streak
        and starts being a reputation.
      - |
        Another win, same calm.
        The run has a shape now.
        And it points at you.
      - |
        The archive stamps the sequence.
        Match after match after match.
        No breaks in the line.
    highlight:
      titles:
        - "The Run"
        - "No Breaks in the Line"
      bodies:
        - |
          People call it “hot.”
          The tape calls it repeatable.
        - |
          A streak changes how opponents play.
          And how you breathe.
    foreshadow:
      titles:
        - "The Next One Changes the Headline"
        - "The Run is Alive"
      bodies:
        - |
          The sequence is still intact.
          One more, and the tape room upgrades the label.
        - |
          The league is waiting for the slip.
          The archive is waiting for history.

  bounce_back:
    name: "Bounce Back"
    lore: "The comeback isn’t the win. It’s the decision to keep filming."
    hint: "The lowest point sets the stage."
    tape_excerpts:
      - |
        Five losses behind you.
        One win in front of you.
        That’s how the turn begins.
      - |
        The tape shows the rough stretch.
        Then it shows you refusing to stay there.
      - |
        A streak breaks.
        Not the winning one—the losing one.
        That’s the real headline.
    highlight:
      titles:
        - "The Turn"
        - "Refused to Stay Down"
      bodies:
        - |
          The ledger looked ugly for a while.
          Then you wrote over it.
        - |
          Some players spiral.
          Some players pivot.
    foreshadow: null

  # ------------------------------------------------------------
  # Clutch & Pressure
  # ------------------------------------------------------------

  clutch_performer:
    name: "Clutch Performer"
    lore: "Close games don’t reward talent. They reward nerve."
    hint: "When the margin gets thin, someone has to blink."
    tape_excerpts:
      - |
        Tight scorelines.
        Tight moments.
        Your grip didn’t tighten with them.
      - |
        The match shrank to a handful of points.
        You still found space.
      - |
        The tape room labels your finish:
        “Composed.”
    highlight:
      titles:
        - "In the Margins"
        - "Composure Wins"
      bodies:
        - |
          The game got small.
          You got sharper.
        - |
          When it was closest, you looked calmest.
    foreshadow:
      titles:
        - "The Close Games Are Tilting"
      bodies:
        - |
          The tight ones keep landing your way.
          The archive is noticing a pattern.

  ice_in_veins:
    name: "Ice in Veins"
    lore: "Some players feel pressure. Some players apply it."
    hint: "The room gets loud. You get quiet."
    tape_excerpts:
      - |
        Close game after close game.
        Same ending.
        Your name in the win column.
      - |
        The tape shows the moment everyone tenses.
        Then it shows you walking through it.
      - |
        The match tried to shake you.
        It failed repeatedly.
    highlight:
      titles:
        - "Cold Under Heat"
        - "Pressure Didn’t Land"
      bodies:
        - |
          There are players who survive tight games.
          You control them.
        - |
          The margin begged for panic.
          You didn’t answer.
    foreshadow:
      titles:
        - "The Pressure Test"
      bodies:
        - |
          The close ones keep coming.
          And you keep looking built for them.

  # ------------------------------------------------------------
  # Dominance & Quality (your edited set)
  # ------------------------------------------------------------

  pickle_perfection:
    name: "Pickle Perfection"
    lore: "A clean sheet is the loudest silence in the sport."
    hint: "Somewhere, there’s a match where the other side never arrived on the scoreboard."
    tape_excerpts:
      - |
        {score_for}-{score_against}.
        The second number stayed at zero.
        The room didn’t.
      - |
        A perfect defense on tape.
        No leaks.
        No mercy.
      - |
        They had chances.
        They had swings.
        They didn’t have points.
    highlight:
      titles:
        - "A Clean Sheet"
        - "Zero"
      bodies:
        - |
          Some wins are arguments.
          This one was a verdict.
        - |
          The scoreboard never moved for them.
          That’s rare. That’s real.
    foreshadow: null

  blowout_artist:
    name: "Blowout Artist"
    lore: "Not every win is a win. Some are a message."
    hint: "Some scorelines become rumors before they become stats."
    tape_excerpts:
      - |
        {score_for}-{score_against}.
        A margin that changes how people talk.
      - |
        The tape shows control from start to finish.
        No swing. No doubt.
      - |
        A win with space to breathe.
        Your opponents didn’t get any.
    highlight:
      titles:
        - "A Statement Scoreline"
        - "No Doubt"
      bodies:
        - |
          The match didn’t stay close.
          Not for long.
        - |
          It wasn’t just winning.
          It was separating.
    foreshadow: null

  untouchable:
    name: "Untouchable"
    lore: "Five matches can be coincidence. Five matches like this is a climate."
    hint: "A run is hiding in the sequence."
    tape_excerpts:
      - |
        Five straight matches on tape.
        The margins add up to something unfair.
      - |
        The archive doesn’t just see wins.
        It sees domination in clusters.
      - |
        A stretch where opponents kept chasing the same outcome:
        falling behind.
    highlight:
      titles:
        - "A Stretch of Control"
        - "The Sequence"
      bodies:
        - |
          Over several matches, the same truth kept appearing:
          nobody stayed with you.
        - |
          The league doesn’t fear one great night.
          It fears weeks like this.
    foreshadow:
      titles:
        - "The Run is Building"
      bodies:
        - |
          The recent tape is trending one direction.
          If it holds, the archive will label it.

  clean_sweep_week:
    name: "Clean Sweep Week"
    lore: "A perfect week isn’t luck. It’s discipline in disguise."
    hint: "A week can be spotless."
    tape_excerpts:
      - |
        A week with no stumbles.
        Match after match, the same ending.
      - |
        Five wins in one week.
        No footnotes.
        No exceptions.
      - |
        The archive shows a rare thing:
        perfection across multiple nights.
    highlight:
      titles:
        - "No Stains"
        - "A Perfect Week"
      bodies:
        - |
          The week didn’t test you once.
          It tested you repeatedly.
          You answered every time.
        - |
          When the schedule got busy, you got cleaner.
    foreshadow:
      titles:
        - "The Week is Still Clean"
      bodies:
        - |
          The record is spotless so far.
          The tape room is watching the ending.

  high_roller:
    name: "High Roller"
    lore: "Some matches change the scoreboard. This one changed the numbers behind it."
    hint: "Big swings leave fingerprints."
    tape_excerpts:
      - |
        The match ends.
        The rating moves like it got shoved.
      - |
        A swing you can feel in the room.
        Not just on the screen.
      - |
        {elo_delta} on the line.
        The tape captures the moment it snapped one way.
    highlight:
      titles:
        - "A Rating Swing"
        - "The Stakes Were Real"
      bodies:
        - |
          This wasn’t just points.
          This was consequence.
        - |
          When the numbers moved, everyone noticed.
    foreshadow:
      titles:
        - "The Stakes Are Rising"
      bodies:
        - |
          The matches are getting heavier.
          The next one might move more than pride.

  # ------------------------------------------------------------
  # Social Graph & Versatility
  # ------------------------------------------------------------

  social_butterfly:
    name: "Social Butterfly"
    lore: "Chemistry isn’t found. It’s collected."
    hint: "New hands keep showing up beside you."
    tape_excerpts:
      - |
        Another new partner on tape.
        The archive counts a growing circle.
      - |
        {unique_partners} different teammates over time.
        Same you. Different chemistry.
      - |
        The club feels smaller when you’ve played with everyone.
        You’re getting there.
    highlight:
      titles:
        - "A Growing Circle"
        - "Chemistry Collected"
      bodies:
        - |
          You’re not building one duo.
          You’re building a network.
        - |
          Familiarity is a weapon.
          You’re assembling it.
    foreshadow:
      titles:
        - "New Faces, Same Game"
      bodies:
        - |
          The partner list is expanding.
          The archive is starting to treat it as a story.

  network_builder:
    name: "Network Builder"
    lore: "At a certain point, the club doesn’t ask who you play with. They ask who you haven’t."
    hint: "Your circle is getting big."
    tape_excerpts:
      - |
        {unique_partners} partners across the file.
        That’s not variety.
        That’s presence.
      - |
        The archive flips through names.
        Yours connects to too many to ignore.
      - |
        You’ve built a web of chemistry.
        The club is inside it now.
    highlight:
      titles:
        - "Everyone Knows the Name"
        - "A Club-Wide Network"
      bodies:
        - |
          This isn’t just playing a season.
          This is becoming part of the club’s ecosystem.
        - |
          The tape room stops calling it coincidence.
          It calls it reach.
    foreshadow:
      titles:
        - "The Circle Expands"
      bodies:
        - |
          The connections keep forming.
          Soon, the archive will have to label it.

  draft_master:
    name: "Draft Master"
    lore: "Different partners. Same outcome. That’s not luck—that’s adaptability."
    hint: "Chemistry follows you."
    tape_excerpts:
      - |
        Five different partners.
        Same calm.
        The month didn’t care who stood beside you.
      - |
        The tape room highlights a pattern:
        you win with whoever’s next to you.
      - |
        A month of rotating lineups.
        And you still found the finish.
    highlight:
      titles:
        - "Adaptable"
        - "Chemistry Follows"
      bodies:
        - |
          You didn’t need a perfect pairing.
          You made the pairing work.
        - |
          Some players need comfort.
          You needed a court.
    foreshadow:
      titles:
        - "The Month is Collecting Names"
      bodies:
        - |
          Different partners are starting to stack up.
          If it continues, the archive will call it mastery.

  swiss_army_knife:
    name: "Swiss Army Knife"
    lore: "You don’t win with one style. You win with whatever the match demands."
    hint: "You’re becoming the constant."
    tape_excerpts:
      - |
        You won with a partner everyone underrates.
        You won with one everyone fears.
        Same ending.
      - |
        The archive shows the range.
        Different teammates. Different looks.
        Same result.
      - |
        A season of changing lineups.
        And you stayed sharp in all of them.
    highlight:
      titles:
        - "The Constant"
        - "Wins in Every Form"
      bodies:
        - |
          It wasn’t the same teammate.
          It wasn’t the same matchup.
          It was the same you.
        - |
          The league can’t scout a single version of you anymore.
    foreshadow:
      titles:
        - "Range on Tape"
      bodies:
        - |
          The season is showing versatility.
          One more chapter and the archive will stamp it.

  # ------------------------------------------------------------
  # Prestige / Rarity
  # ------------------------------------------------------------

  giant_slayer:
    name: "Giant Slayer"
    lore: "Every club has giants. Every giant has a night they wish wasn’t recorded."
    hint: "The taller they stand, the harder the tape hits."
    tape_excerpts:
      - |
        A name with a high number next to it.
        And then a loss beneath it.
        You authored that.
      - |
        {opponent_name} came in towering.
        The match ended smaller.
      - |
        The ledger underlines it:
        you beat someone the room expected to win.
    highlight:
      titles:
        - "A Giant Falls"
        - "The Room Noticed"
      bodies:
        - |
          Upsets happen.
          This felt like a shift.
        - |
          The opponent had the rating.
          You had the ending.
    foreshadow:
      titles:
        - "The Giant Keeps Appearing"
      bodies:
        - |
          The matchup is circling you.
          The tape room loves a rewrite.

  david_vs_goliath:
    name: "David vs Goliath"
    lore: "The models had a favorite. The match had a different plan."
    hint: "The numbers don’t like your chances. The tape might."
    tape_excerpts:
      - |
        The forecast said no.
        The tape said yes.
        {expected_prob} and you still finished it.
      - |
        The odds were a warning sign.
        You treated them like background noise.
      - |
        A win the spreadsheet won’t understand
        without watching the match.
    highlight:
      titles:
        - "Against the Forecast"
        - "The Script Breaks"
      bodies:
        - |
          That wasn’t supposed to happen.
          Then it did.
        - |
          The league loves ratings.
          The tape loves endings.
    foreshadow:
      titles:
        - "A Rewrite is Possible"
      bodies:
        - |
          The matchup looks steep on paper.
          The tape room doesn’t trust paper.

  upset_champion:
    name: "Upset Champion"
    lore: "Once in a while, a league gets reminded that order is optional."
    hint: "There’s always one match nobody can explain."
    tape_excerpts:
      - |
        Biggest upset of the month in {league}.
        The tape room filed it under: “Uncomfortable Truth.”
      - |
        The league will talk about this one for weeks.
        Not because it was loud—
        because it was undeniable.
      - |
        A monthly moment.
        The kind that bends the room’s expectations.
    highlight:
      titles:
        - "The Month’s Shockwave"
        - "The League Remembers This"
      bodies:
        - |
          Every month has a match that breaks the pattern.
          This month, you were the match.
        - |
          The archive stamped it.
          The league replayed it.
    foreshadow:
      titles:
        - "The Month Still Has One More Twist"
      bodies:
        - |
          The league thinks it understands the month.
          The tape room disagrees.

  hall_of_fame_night:
    name: "Hall of Fame Night"
    lore: "A stacked room. A real match. The kind that feels heavier than usual."
    hint: "Some nights feel like witnesses were present."
    tape_excerpts:
