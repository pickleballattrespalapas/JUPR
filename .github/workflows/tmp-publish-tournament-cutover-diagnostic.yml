name: Publish tournament cutover diagnostic

on:
  push:
    branches: [rollback-feb8]
    paths: [.github/publish-tournament-cutover-diagnostic.trigger]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-tournament-cutover-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect cutover workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, urllib.request, zipfile, io
          from datetime import datetime, timezone
          from pathlib import Path

          api=os.environ['GITHUB_API_URL']
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response:return json.loads(response.read().decode())
          runs=get(f'{api}/repos/{repo}/actions/runs?branch=rollback-feb8&event=push&per_page=100').get('workflow_runs',[])
          wanted=['Complete production tournament cutover v2','Complete production tournament cutover','Publish production tournament completion marker','Temporary production tournament database cutover']
          report={'captured_at':datetime.now(timezone.utc).isoformat(),'workflows':[]}
          for name in wanted:
              rows=[r for r in runs if r.get('name')==name]
              if not rows:
                  report['workflows'].append({'name':name,'found':False})
                  continue
              run=rows[0]
              item={k:run.get(k) for k in ('id','name','status','conclusion','head_sha','event','created_at','updated_at','html_url')}
              item['found']=True
              jobs=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100').get('jobs',[])
              item['jobs']=[]
              for job in jobs:
                  j={k:job.get(k) for k in ('id','name','status','conclusion','started_at','completed_at')}
                  j['steps']=[{k:s.get(k) for k in ('number','name','status','conclusion')} for s in job.get('steps',[])]
                  j['failed_steps']=[s.get('name') for s in job.get('steps',[]) if s.get('conclusion')=='failure']
                  item['jobs'].append(j)
              report['workflows'].append(item)
          Path('/tmp/cutover-diagnostic.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY

      - uses: actions/checkout@v4
        with:
          ref: rollback-feb8
          fetch-depth: 0

      - name: Publish private-token diagnostic path
        run: |
          set -euo pipefail
          mkdir -p apps/web/public
          cp /tmp/cutover-diagnostic.json apps/web/public/pcs-cutover-diagnostic-7f3c9a2e.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/pcs-cutover-diagnostic-7f3c9a2e.json
          git commit -m "Publish temporary tournament cutover diagnostic"
          git push origin HEAD:rollback-feb8
