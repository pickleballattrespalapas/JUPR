name: Temporary public generator API routing verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-public-generator-api-32062'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 32062be384f3233d7f37e0089b7adfc72b558e45
      FLY_BASE: https://juprleagues-api-staging.fly.dev
      CANONICAL_ORIGIN: https://jupr-git-staging-pickleballattrespalapas1.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 20 "$FLY_BASE/health" -o evidence/health.json; then
              source_sha="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image_sha="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$source_sha image=$image_sha"
              if [ "$source_sha" = "$EXPECTED_SHA" ] && { [ -z "$image_sha" ] || [ "$image_sha" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$EXPECTED_SHA" '
            (.environment == "staging") and
            ((.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha) == $sha) and
            ((.image_build_git_sha // .image_git_sha // $sha) == $sha) and
            (.fly_app_name == "juprleagues-api-staging") and
            (.write_wave == "open") and
            (.staging_write_wave == "open") and
            (.business_data_write_wave_active == true) and
            (.write_prerequisites.email_mode == "dry_run") and
            (.write_prerequisites.live_player_update_email_enabled == false) and
            (.public_live_production_override_enabled == false) and
            (.supabase_project_ref == "sijpxjxvdtrehmqvirfi")
          ' evidence/health.json

      - name: Verify public player directory and preview endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            "$FLY_BASE/clubs/tres-palapas/players?status=active&sort=name&limit=1000" \
            -o evidence/players.json
          jq -e '(.players | type == "array") and (.players | length > 0)' evidence/players.json

          cat > evidence/preview-request.json <<'JSON'
          {
            "generator_kind": "round_robin",
            "play_format": "singles",
            "title": "API routing verification",
            "participant_names": ["Route Test A", "Route Test B", "Route Test C", "Route Test D"],
            "participant_player_ids": {},
            "total_rounds": 3,
            "court_count": 2
          }
          JSON
          curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            --data @evidence/preview-request.json \
            "$FLY_BASE/clubs/tres-palapas/play-generators/preview" \
            -o evidence/preview.json
          jq -e '(.ok == true) and (.preview.rounds | length == 3)' evidence/preview.json

      - name: Verify CORS for the canonical staging origin
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D evidence/cors-players.txt -o /dev/null --max-time 30 \
            -X OPTIONS \
            -H "Origin: $CANONICAL_ORIGIN" \
            -H 'Access-Control-Request-Method: GET' \
            "$FLY_BASE/clubs/tres-palapas/players?status=active&sort=name&limit=5"
          tr -d '\r' < evidence/cors-players.txt > evidence/cors-players-normalized.txt
          grep -qi '^access-control-allow-origin: https://jupr-git-staging-pickleballattrespalapas1\.vercel\.app$' evidence/cors-players-normalized.txt

          curl -sS -D evidence/cors-preview.txt -o /dev/null --max-time 30 \
            -X OPTIONS \
            -H "Origin: $CANONICAL_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$FLY_BASE/clubs/tres-palapas/play-generators/preview"
          tr -d '\r' < evidence/cors-preview.txt > evidence/cors-preview-normalized.txt
          grep -qi '^access-control-allow-origin: https://jupr-git-staging-pickleballattrespalapas1\.vercel\.app$' evidence/cors-preview-normalized.txt

      - name: Verify canonical routes render the deployed API base
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          for path in \
            /clubs/tres-palapas/round-robin-generator \
            /clubs/tres-palapas/ladder-generator; do
            file="evidence/$(echo "$path" | tr '/' '_' | sed 's/^_//').html"
            curl -fsS --max-time 30 \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$CANONICAL_ORIGIN$path" -o "$file"
            grep -q 'juprleagues-api-staging.fly.dev' "$file"
          done

      - name: Verify source routing contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web/app/clubs/[clubSlug]')
          paths = [
              root / 'round-robin-generator/page.tsx',
              root / 'ladder-generator/page.tsx',
              root / 'round-robin-generator/sessions/[sessionKey]/rounds/[roundNumber]/page.tsx',
              root / 'ladder-generator/sessions/[sessionKey]/rounds/[roundNumber]/page.tsx',
          ]
          for path in paths:
              source = path.read_text()
              assert 'apiBase="/api"' not in source, path
              assert 'JUPR_API_BASE_URL' in source, path
              assert 'NEXT_PUBLIC_JUPR_API_BASE_URL' in source, path
          Path('evidence/source-contract.txt').write_text('Public generator API routing contracts passed.\n')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-generator-api-routing-evidence
          path: evidence
          if-no-files-found: error
