name: Temporary deploy production tournament API safely

on:
  push:
    branches:
      - rollback-feb8
    paths:
      - .github/production-tournament-api-safe-deploy.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-tournament-api-safe-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CANDIDATE_SHA: 94dae143c89cfc44282879308531b1baad94b51b
      FLY_APP_NAME: juprleagues-api
      FLY_ORIGIN: https://juprleagues-api.fly.dev
      STATUS_CONTEXT: production-tournament-api-safe-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94dae143c89cfc44282879308531b1baad94b51b
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Deploying tournament code with production writes closed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.49"

      - name: Stage fail-closed tournament settings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          flyctl secrets set --stage --app "$FLY_APP_NAME" \
            JUPR_PRODUCTION_WRITE_POLICY=read_only \
            JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION=0 \
            JUPR_EMAIL_MODE=dry_run \
            JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS=0

      - name: Deploy exact candidate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy \
            --remote-only \
            --app "$FLY_APP_NAME" \
            --config fly.toml \
            --build-arg "JUPR_DEPLOYMENT_GIT_SHA=$CANDIDATE_SHA"

      - name: Verify exact fail-closed runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 \
              "$FLY_ORIGIN/health" -o "$RUNNER_TEMP/health.json"; then
              if python - <<'PY'
          import json, os
          payload = json.load(open(os.environ["RUNNER_TEMP"] + "/health.json", encoding="utf-8"))
          expected = os.environ["CANDIDATE_SHA"]
          assert payload.get("environment") == "production", payload
          assert payload.get("git_commit_sha") == expected, payload
          assert payload.get("image_build_git_sha") == expected, payload
          assert payload.get("production_business_write_policy") == "read_only", payload
          flags = payload.get("feature_flags") or {}
          assert flags.get("JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION") is False, flags
          assert payload.get("email_mode") in {None, "dry_run"}, payload
          PY
              then
                cat "$RUNNER_TEMP/health.json"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Production API did not attest the exact fail-closed candidate."
          exit 1

      - name: Mark deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-success.json"
          import json, os
          print(json.dumps({
            "state": "success",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Tournament code deployed with production writes closed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-success.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Mark deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-failure.json"
          import json, os
          print(json.dumps({
            "state": "failure",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Tournament API safe deployment failed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-failure.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
