name: Temporary Tournament Setup status-flicker fixer

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/tournament-setup-status-loading-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-status-loading-fix
          fetch-depth: 0

      - name: Suppress setup-status badges until detail is loaded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          panel = Path('apps/web/app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx')
          text = panel.read_text()
          old = '  const states = setupState(basics, settings, configuration);\n'
          new = '  const states = detail ? setupState(basics, settings, configuration) : {};\n'
          if text.count(old) != 1:
              raise SystemExit(f'panel status marker match count={text.count(old)}')
          panel.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_api_contract_tournament_setup_event_division_refine.py')
          test_text = tests.read_text()
          addition = '''\n\ndef test_setup_status_badges_wait_for_loaded_detail() -> None:\n    panel = read("app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")\n    assert "const states = detail ? setupState(basics, settings, configuration) : {};" in panel\n    assert "states={states}" in panel\n    assert "busy && !detail" in panel\n'''
          if 'def test_setup_status_badges_wait_for_loaded_detail()' not in test_text:
              tests.write_text(test_text.rstrip() + addition + '\n')
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_api_contract_tournament_setup_event_division_refine.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit application-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-tournament-setup-status-flicker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prevent Tournament Setup status flicker"
          git push origin HEAD:agent/tournament-setup-status-loading-fix
