name: Verify closed-ledger recovery before match-player retry

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  verify:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/verify-match-player-window-20260728d' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      EXPECTED_SHA: 8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7
      EXPECTED_SUPABASE_REF: sijpxjxvdtrehmqvirfi
      EXPECTED_EDIT_AFTER: 2026-07-29T00:55:35Z
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
    steps:
      - name: Check out isolated verifier
        uses: actions/checkout@v4
        with:
          ref: agent/verify-match-player-window-20260728d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact staging source and one-file diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$EXPECTED_SHA"
          test "$PR_HEAD_SHA" = "$(git rev-parse HEAD)"
          files="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | sort)"
          test "$files" = ".github/workflows/verify-match-player-window-20260728d.yml"

      - name: Wait for closed edit controller and its safety recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/issues/1062" > issue.json
            gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-write-session.yml/runs?event=issues&per_page=20" > session-runs.json
            SESSION_ID="$(jq -r --arg after "$EXPECTED_EDIT_AFTER" '[.workflow_runs[] | select(.display_title == "Staging write session #1062 · edited" and .created_at >= $after)] | sort_by(.created_at) | reverse | .[0].id // empty' session-runs.json)"
            SESSION_STATUS="$(jq -r --arg after "$EXPECTED_EDIT_AFTER" '[.workflow_runs[] | select(.display_title == "Staging write session #1062 · edited" and .created_at >= $after)] | sort_by(.created_at) | reverse | .[0].status // empty' session-runs.json)"
            SESSION_UPDATED="$(jq -r --arg after "$EXPECTED_EDIT_AFTER" '[.workflow_runs[] | select(.display_title == "Staging write session #1062 · edited" and .created_at >= $after)] | sort_by(.created_at) | reverse | .[0].updated_at // empty' session-runs.json)"
            if [ -n "$SESSION_ID" ] && [ "$SESSION_STATUS" = "completed" ] && [ -n "$SESSION_UPDATED" ]; then
              gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-write-recovery.yml/runs?per_page=30" > recovery-runs.json
              RECOVERY_ID="$(jq -r --arg after "$SESSION_UPDATED" '[.workflow_runs[] | select(.created_at >= $after)] | sort_by(.created_at) | .[0].id // empty' recovery-runs.json)"
              RECOVERY_STATUS="$(jq -r --arg after "$SESSION_UPDATED" '[.workflow_runs[] | select(.created_at >= $after)] | sort_by(.created_at) | .[0].status // empty' recovery-runs.json)"
              if [ -n "$RECOVERY_ID" ] && [ "$RECOVERY_STATUS" = "completed" ]; then
                printf '%s\n' "$SESSION_ID" > session-run-id.txt
                printf '%s\n' "$RECOVERY_ID" > recovery-run-id.txt
                gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$SESSION_ID/jobs?filter=all&per_page=100" > session-jobs.json
                gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_ID/jobs?filter=all&per_page=100" > recovery-jobs.json
                break
              fi
            fi
            if [ "$attempt" -eq 90 ]; then
              jq '.workflow_runs[:5] | map({id, display_title, status, conclusion, created_at, updated_at})' session-runs.json || true
              jq '.workflow_runs[:5] | map({id, display_title, status, conclusion, created_at, updated_at})' recovery-runs.json 2>/dev/null || true
              echo "Closed-ledger controller recovery did not settle in time." >&2
              exit 1
            fi
            sleep 10
          done
          jq -e --arg sha "$EXPECTED_SHA" 'select(
            .state == "closed" and
            .locked == true and
            (.body | contains("command: close")) and
            (.body | contains("candidate_sha: " + $sha)) and
            (.body | contains("expected_write_wave: none")) and
            (.body | contains("write_wave: none"))
          )' issue.json >/dev/null

      - name: Verify exact candidate remains in no-write mode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$FLY_HEALTH_URL" -o fly-health.json && \
              jq -e --arg sha "$EXPECTED_SHA" 'select(.git_commit_sha == $sha and .staging_write_wave == "none")' fly-health.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat fly-health.json 2>/dev/null || true
              echo "Staging did not remain in verified no-write mode." >&2
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          from scripts.staging_write_waves import expected_write_flags
          with open('fly-health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          expected = expected_write_flags('none')
          checks = {
              'ok': health.get('ok') is True,
              'environment': health.get('environment') == 'staging',
              'candidate': health.get('git_commit_sha') == '8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7',
              'image_candidate': health.get('image_build_git_sha') == '8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7',
              'fly_app': health.get('fly_app_name') == 'juprleagues-api-staging',
              'supabase': health.get('supabase_project_ref') == 'sijpxjxvdtrehmqvirfi',
              'wave': health.get('write_wave') == 'none' and health.get('staging_write_wave') == 'none',
              'business_inactive': health.get('business_data_write_wave_active') is False,
              'flags': health.get('controlled_write_flags') == expected,
              'email': health.get('write_prerequisites', {}).get('email_mode') == 'dry_run',
              'live_email_off': health.get('write_prerequisites', {}).get('live_player_update_email_enabled') is False,
          }
          failed = [name for name, accepted in checks.items() if not accepted]
          if failed:
              raise SystemExit('No-write verification failed: ' + ', '.join(failed))
          PY

      - name: Upload closed-ledger recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: match-player-closed-ledger-recovery
          path: |
            issue.json
            session-runs.json
            session-run-id.txt
            session-jobs.json
            recovery-runs.json
            recovery-run-id.txt
            recovery-jobs.json
            fly-health.json
          if-no-files-found: error
          retention-days: 2
