name: Diagnose safe match-player controller recovery

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  verify:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/verify-match-player-window-20260728d' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      EXPECTED_SHA: 8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7
      EXPECTED_SUPABASE_REF: sijpxjxvdtrehmqvirfi
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
    steps:
      - name: Check out isolated verifier
        uses: actions/checkout@v4
        with:
          ref: agent/verify-match-player-window-20260728d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact staging source and one-file diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$EXPECTED_SHA"
          test "$PR_HEAD_SHA" = "$(git rev-parse HEAD)"
          files="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | sort)"
          test "$files" = ".github/workflows/verify-match-player-window-20260728d.yml"

      - name: Capture controller issue and latest session run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/issues/1062" > issue.json
          jq -e --arg sha "$EXPECTED_SHA" 'select(
            .state == "closed" and
            .locked == true and
            (.body | contains("candidate_sha: " + $sha))
          )' issue.json >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-write-session.yml/runs?event=issues&per_page=10" > session-runs.json
          RUN_ID="$(jq -er '.workflow_runs[0].id' session-runs.json)"
          printf '%s\n' "$RUN_ID" > session-run-id.txt
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > session-jobs.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > session-failed.log 2>&1 || true
          jq '{id: .workflow_runs[0].id, status: .workflow_runs[0].status, conclusion: .workflow_runs[0].conclusion, created_at: .workflow_runs[0].created_at, updated_at: .workflow_runs[0].updated_at, html_url: .workflow_runs[0].html_url}' session-runs.json
          jq '[.jobs[] | {name, status, conclusion, steps: [.steps[]? | {name, status, conclusion}]}]' session-jobs.json

      - name: Verify exact candidate returned to no-write mode
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$FLY_HEALTH_URL" -o fly-health.json && \
              jq -e --arg sha "$EXPECTED_SHA" 'select(.git_commit_sha == $sha and .staging_write_wave == "none")' fly-health.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat fly-health.json 2>/dev/null || true
              echo "Staging did not return to verified no-write mode." >&2
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          from scripts.staging_write_waves import expected_write_flags
          with open('fly-health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          expected = expected_write_flags('none')
          checks = {
              'ok': health.get('ok') is True,
              'environment': health.get('environment') == 'staging',
              'candidate': health.get('git_commit_sha') == '8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7',
              'image_candidate': health.get('image_build_git_sha') == '8ad7fe2b8d0c6925fc8ff5585aba24e1bc5a7db7',
              'fly_app': health.get('fly_app_name') == 'juprleagues-api-staging',
              'supabase': health.get('supabase_project_ref') == 'sijpxjxvdtrehmqvirfi',
              'wave': health.get('write_wave') == 'none' and health.get('staging_write_wave') == 'none',
              'business_inactive': health.get('business_data_write_wave_active') is False,
              'flags': health.get('controlled_write_flags') == expected,
              'email': health.get('write_prerequisites', {}).get('email_mode') == 'dry_run',
              'live_email_off': health.get('write_prerequisites', {}).get('live_player_update_email_enabled') is False,
          }
          failed = [name for name, accepted in checks.items() if not accepted]
          if failed:
              raise SystemExit('No-write recovery verification failed: ' + ', '.join(failed))
          PY

      - name: Upload recovery diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: match-player-controller-recovery-diagnosis
          path: |
            issue.json
            session-runs.json
            session-run-id.txt
            session-jobs.json
            session-failed.log
            fly-health.json
          if-no-files-found: error
          retention-days: 2
