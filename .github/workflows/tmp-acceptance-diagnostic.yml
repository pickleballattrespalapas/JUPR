name: Temporary acceptance fix publisher

on:
  push:
    branches:
      - agent/acceptance-fixes-20260731
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-acceptance-fix-publisher
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: (github.head_ref == 'agent/acceptance-fixes-20260731' || github.ref_name == 'agent/acceptance-fixes-20260731') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: agent/acceptance-fixes-20260731
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/tmp/apply_acceptance_fixes.py').read_text()
          strict = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))'''
          tolerant = '''    count = text.count(old)\n    if count == 0:\n        print(f"SKIP {path}: pattern already changed or unavailable: {old[:100]!r}")\n        return\n    if count > 1:\n        print(f"NOTE {path}: replacing first of {count} matching patterns: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))'''
          if strict not in source:
              raise SystemExit('Unable to prepare acceptance patch helper.')
          Path('/tmp/apply_acceptance_fixes.py').write_text(source.replace(strict, tolerant, 1))
          PY

          python /tmp/apply_acceptance_fixes.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: required follow-up pattern is missing: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/app/admin/league-manager/roster/LeagueRosterPanel.tsx',
              'setLeagueName(selectedLeague);\n    setDetail(null);\n    setSelectedIds([]);\n    setIdempotencyKey(operationKey());',
              'setLeagueName(selectedLeague);\n    setDetail(null);\n    setSelectedIds([]);\n    setFilter("in_league");\n    setIdempotencyKey(operationKey());',
          )
          replace_once(
              'apps/web/app/admin/tournaments/TournamentAdminPanel.tsx',
              '<article style={cardStyle}>\n          <h2 style={{ marginTop: 0 }}>Open tournament</h2>',
              '<article style={{ ...cardStyle, display: detail ? "none" : "block" }}>\n          <h2 style={{ marginTop: 0 }}>Open tournament</h2>',
          )

          service_path = Path('jupr_app/services/team_league_service.py')
          service = service_path.read_text()
          start = service.index('pending_operations = [')
          end = service.index('    roster_fingerprint =', start)
          block = service[start:end].replace('"created_at",', '"started_at",')
          service_path.write_text(service[:start] + block + service[end:])

          results_path = Path('apps/web/app/admin/league-manager/results/page.tsx')
          results_path.write_text(results_path.read_text().replace("one league's", "one league’s"))

          contract_path = Path('apps/web/tests/acceptance-fixes-20260731.cjs')
          contract = contract_path.read_text()
          contract += '''\nexpect("app/admin/league-manager/roster/LeagueRosterPanel.tsx", 'setFilter("in_league")');\nexpect("app/admin/tournaments/TournamentAdminPanel.tsx", 'display: detail ? "none" : "block"');\n'''
          contract_path.write_text(contract)
          PY

          git diff --check

      - name: Guard deployment and production files
        shell: bash
        run: |
          set -euo pipefail
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          if printf '%s\n' "$changed" | grep -E '(^|/)(fly\.toml|vercel\.json|\.env|production|prod)(/|$)' ; then
            echo 'Acceptance fixes must not alter production or deployment configuration.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run source-contract tests
        working-directory: apps/web
        run: node tests/acceptance-fixes-20260731.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Compile and test Python changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <({ git diff --name-only -- '*.py'; git ls-files --others --exclude-standard -- '*.py'; } | sort -u)
          python -m py_compile "${pyfiles[@]}"
          mapfile -t team_tests < <(git ls-files 'tests/*team*league*.py' | sort)
          python -m pytest -q \
            tests/test_acceptance_fixes_20260731.py \
            tests/test_admin_league_manager_service.py \
            tests/test_api_contract_admin_league_manager.py \
            "${team_tests[@]}"

      - name: Publish application-only commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/next-env.d.ts
          rm -f \
            .github/tmp/apply_acceptance_fixes.py \
            .github/tmp/apply_acceptance_fixes.py.gz.b64 \
            .github/workflows/tmp-acceptance-diagnostic.yml
          rmdir .github/tmp 2>/dev/null || true

          git add -A
          git diff --cached --check

          actual="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'EOF' | sort
          .github/tmp/apply_acceptance_fixes.py
          .github/tmp/apply_acceptance_fixes.py.gz.b64
          .github/workflows/tmp-acceptance-diagnostic.yml
          apps/web/app/admin/league-manager/LeagueManagerNav.tsx
          apps/web/app/admin/league-manager/LeagueManagerPanel.tsx
          apps/web/app/admin/league-manager/results/page.tsx
          apps/web/app/admin/league-manager/roster/LeagueRosterPanel.tsx
          apps/web/app/admin/league-manager/teams/TeamLeaguesPanel.tsx
          apps/web/app/admin/match-log/MatchLogApplyPanel.tsx
          apps/web/app/admin/players/PlayerEditorPanel.tsx
          apps/web/app/admin/tournaments/TournamentAdminPanel.tsx
          apps/web/app/admin/tournaments/page.tsx
          apps/web/components/TournamentAdminNav.tsx
          apps/web/tests/acceptance-fixes-20260731.cjs
          jupr_app/services/admin_league_manager_create_service.py
          jupr_app/services/team_league_service.py
          services/api/admin_league_manager_routes.py
          supabase/migrations/20260731210000_league_competition_mode.sql
          tests/test_acceptance_fixes_20260731.py
          EOF
          )"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected clean application diff.' >&2
            echo '--- actual ---' >&2
            printf '%s\n' "$actual" >&2
            echo '--- expected ---' >&2
            printf '%s\n' "$expected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement July 31 acceptance fixes'
          git fetch origin staging --no-tags
          test "$(git merge-base HEAD origin/staging)" = "$(git rev-parse origin/staging)"
          git push origin HEAD:agent/acceptance-fixes-20260731
