name: Temporary acceptance fix validation

on:
  push:
    branches:
      - agent/acceptance-fixes-20260731
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: temporary-acceptance-fix-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/acceptance-fixes-20260731' || github.ref_name == 'agent/acceptance-fixes-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: agent/acceptance-fixes-20260731
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp/apply_acceptance_fixes.py
          git diff --check
          echo '=== changed files ==='
          git diff --name-only | sort
          echo '=== diff stat ==='
          git diff --stat

      - name: Guard deployment and production files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if printf '%s\n' "$changed" | grep -E '(^|/)(fly\.toml|vercel\.json|\.env|production|prod)(/|$)' ; then
            echo 'Acceptance fixes must not alter production or deployment configuration.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run changed source-contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(git diff --name-only -- 'apps/web/tests/*.cjs' | sort)
          if [ "${#tests[@]}" -gt 0 ]; then
            for test_file in "${tests[@]}"; do node "$test_file"; done
          else
            echo 'No changed CJS source-contract tests.'
          fi

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Compile changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git diff --name-only -- '*.py' | sort)
          if [ "${#pyfiles[@]}" -gt 0 ]; then python -m py_compile "${pyfiles[@]}"; else echo 'No changed Python files.'; fi

      - name: Run changed focused Python tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(git diff --name-only -- 'tests/test_*.py' | sort)
          if [ "${#tests[@]}" -gt 0 ]; then
            python -m pytest -q "${tests[@]}"
          else
            python -m pytest -q tests/test_admin_league_manager_service.py tests/test_api_contract_admin_league_manager.py tests/test_team_league_service.py tests/test_api_contract_admin_team_league.py
          fi

      - name: Preserve validation summary
        if: always()
        shell: bash
        run: echo "Validation completed for $(git rev-parse HEAD)."
