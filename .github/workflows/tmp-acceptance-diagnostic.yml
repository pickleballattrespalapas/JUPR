name: Temporary acceptance fix validation

on:
  push:
    branches:
      - agent/acceptance-fixes-20260731
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: temporary-acceptance-fix-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/acceptance-fixes-20260731' || github.ref_name == 'agent/acceptance-fixes-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: agent/acceptance-fixes-20260731
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp/apply_acceptance_fixes.py')
          text = path.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))'''
          new = '''    count = text.count(old)\n    if count == 0:\n        print(f"SKIP {path}: pattern already changed or unavailable: {old[:100]!r}")\n        return\n    if count > 1:\n        print(f"NOTE {path}: replacing first of {count} matching patterns: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))'''
          if old not in text:
              raise SystemExit('Unable to harden patch helper.')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/tmp/apply_acceptance_fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/admin/league-manager/results/page.tsx')
          text = path.read_text().replace("one league's", "one league’s")
          path.write_text(text)
          PY
          git diff --check
          echo '=== working tree ==='
          git status --short
          echo '=== diff stat ==='
          git diff --stat

      - name: Guard deployment and production files
        shell: bash
        run: |
          set -euo pipefail
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          if printf '%s\n' "$changed" | grep -E '(^|/)(fly\.toml|vercel\.json|\.env|production|prod)(/|$)' ; then
            echo 'Acceptance fixes must not alter production or deployment configuration.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused source-contract tests
        shell: bash
        run: node apps/web/tests/acceptance-fixes-20260731.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Compile changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <({ git diff --name-only -- '*.py'; git ls-files --others --exclude-standard -- '*.py'; } | sort -u)
          if [ "${#pyfiles[@]}" -gt 0 ]; then python -m py_compile "${pyfiles[@]}"; else echo 'No changed Python files.'; fi

      - name: Run focused Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_acceptance_fixes_20260731.py \
            tests/test_admin_league_manager_service.py \
            tests/test_api_contract_admin_league_manager.py \
            tests/test_team_league_service.py \
            tests/test_api_contract_admin_team_league.py

      - name: Preserve validation summary
        if: always()
        shell: bash
        run: echo "Validation completed for $(git rev-parse HEAD)."
