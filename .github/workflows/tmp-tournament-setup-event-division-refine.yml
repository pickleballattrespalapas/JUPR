name: Temporary Tournament Setup event/division refinement publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/tournament-setup-event-division-refine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-event-division-refine
          fetch-depth: 0

      - name: Apply Tournament Setup refinement
        run: |
          PYTHONPATH=. python scripts/tmp_tournament_setup_refine.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_production_deployment_hardening.py")
          text = path.read_text()
          old = 'assert migrations[-1] == "20261020000000"'
          new = 'assert migrations[-1] == "20261021000000"'
          if text.count(old) != 1:
              raise SystemExit(f"latest migration assertion match count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused source and migration checks
        run: |
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_event_division_refine.py \
            tests/test_production_deployment_hardening.py
          git diff --check

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-tournament-setup-event-division-refine.yml
          rm scripts/tmp_tournament_setup_refine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Tournament Setup events and divisions"
          git push origin HEAD:agent/tournament-setup-event-division-refine
