name: Temporary Tournament Setup event/division refinement publisher

on:
  push:
    branches:
      - agent/tournament-setup-event-division-refine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-event-division-refine
          fetch-depth: 0

      - name: Refine guided Tournament Setup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              target.write_text(text[:start_at] + new + text[end_at:])

          # -----------------------------------------------------------------
          # API and persistence contract for location, timezone, and sponsors.
          # -----------------------------------------------------------------
          route = "services/api/admin_tournament_setup_routes.py"
          replace_once(
              route,
              '    sponsor_markdown: str | None = None\n',
              '    sponsor_markdown: str | None = None\n'
              '    location_name: str | None = None\n'
              '    timezone: str | None = None\n'
              '    sponsors_json: list[dict[str, Any]] | None = None\n',
          )

          service = "jupr_app/services/admin_tournament_setup_service.py"
          replace_once(
              service,
              '        "sponsor_markdown": row.get("sponsor_markdown"),\n'
              '        "updated_at": row.get("updated_at"),\n',
              '        "sponsor_markdown": row.get("sponsor_markdown"),\n'
              '        "location_name": row.get("location_name"),\n'
              '        "timezone": row.get("timezone"),\n'
              '        "sponsors_json": list(row.get("sponsors_json") or []),\n'
              '        "updated_at": row.get("updated_at"),\n',
          )
          replace_once(
              service,
              '        "sponsor_markdown",\n'
              '    }\n',
              '        "sponsor_markdown",\n'
              '        "location_name",\n'
              '        "timezone",\n'
              '        "sponsors_json",\n'
              '    }\n',
          )

          repo = "jupr_app/domain/tournament_registration_repo.py"
          replace_once(
              repo,
              '        "builder_draft_updated_at",\n'
              '    ),\n',
              '        "builder_draft_updated_at",\n'
              '        "location_name",\n'
              '        "timezone",\n'
              '        "sponsors_json",\n'
              '    ),\n',
          )
          replace_once(
              repo,
              '        "sponsor_markdown": "",\n'
              '    }\n\n\n'
              'def upsert_registration_settings',
              '        "sponsor_markdown": "",\n'
              '        "location_name": "",\n'
              '        "timezone": "America/Mazatlan",\n'
              '        "sponsors_json": [],\n'
              '    }\n\n\n'
              'def upsert_registration_settings',
          )
          replace_once(
              repo,
              '        "sponsor_markdown": str(payload.get("sponsor_markdown") or ""),\n'
              '        "updated_at": _now_iso(),\n',
              '        "sponsor_markdown": str(payload.get("sponsor_markdown") or ""),\n'
              '        "location_name": str(payload.get("location_name") or "").strip(),\n'
              '        "timezone": str(payload.get("timezone") or "America/Mazatlan").strip(),\n'
              '        "sponsors_json": _json_safe_value(\n'
              '            payload.get("sponsors_json")\n'
              '            if isinstance(payload.get("sponsors_json"), list)\n'
              '            else []\n'
              '        ),\n'
              '        "updated_at": _now_iso(),\n',
          )

          # -----------------------------------------------------------------
          # Wizard panel: richer basics, separate events/divisions, direct saves.
          # -----------------------------------------------------------------
          panel = "apps/web/app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx"
          replace_once(
              panel,
              '  distinctFamilyNames,\n',
              '',
          )
          replace_once(
              panel,
              '  newDayRow,\n  newEventOptionRow,\n',
              '  newDayRow,\n  newEventFamilyRow,\n  newEventOptionRow,\n',
          )
          replace_once(
              panel,
              'import TournamentSetupEventCard from "./TournamentSetupEventCard";\n',
              'import TournamentSetupEventFamilyCard from "./TournamentSetupEventFamilyCard";\n'
              'import TournamentSetupDivisionCard from "./TournamentSetupDivisionCard";\n',
          )

          replace_once(
              panel,
              '''type BasicsDraft = {
            name: string;
            startDate: string;
            endDate: string;
          };
          ''',
              '''type SponsorDraft = {
            id: string;
            name: string;
            level: string;
            website: string;
            notes: string;
          };

          type BasicsDraft = {
            name: string;
            startDate: string;
            endDate: string;
            locationName: string;
            timezone: string;
            sponsors: SponsorDraft[];
          };
          ''',
          )

          helper_block = r'''const TIMEZONE_OPTIONS = [
            ["America/Mazatlan", "Baja California Sur · America/Mazatlan"],
            ["America/Los_Angeles", "Pacific · America/Los_Angeles"],
            ["America/Denver", "Mountain · America/Denver"],
            ["America/Phoenix", "Arizona · America/Phoenix"],
            ["America/Chicago", "Central · America/Chicago"],
            ["America/New_York", "Eastern · America/New_York"],
            ["UTC", "UTC"]
          ] as const;

          function sponsorId(): string {
            return globalThis.crypto?.randomUUID?.() || `sponsor-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          }

          function newSponsor(): SponsorDraft {
            return { id: sponsorId(), name: "", level: "", website: "", notes: "" };
          }

          function normalizeSponsors(value: unknown): SponsorDraft[] {
            if (!Array.isArray(value)) return [];
            return value
              .filter((row): row is Record<string, unknown> => Boolean(row) && typeof row === "object" && !Array.isArray(row))
              .map((row) => ({
                id: safeString(row.id) || sponsorId(),
                name: safeString(row.name),
                level: safeString(row.level),
                website: safeString(row.website),
                notes: safeString(row.notes)
              }));
          }

          function emptyBasics(name: string): BasicsDraft {
            return {
              name,
              startDate: "",
              endDate: "",
              locationName: "",
              timezone: "America/Mazatlan",
              sponsors: []
            };
          }

          function derivedEventFamilies(events: SetupRecord[], days: SetupRecord[]): SetupRecord[] {
            const rows = new Map<string, SetupRecord>();
            for (const event of events) {
              const family = safeString(event.event_family_label ?? event.event_family);
              if (!family) continue;
              const key = family.toLowerCase();
              if (rows.has(key)) continue;
              const dayReferenceValue = safeString(event.registration_day_id ?? event.assigned_day);
              const base = newEventFamilyRow(rows.size + 1, family);
              rows.set(key, {
                ...base,
                event_family: family,
                registration_day_id: dayReferenceValue,
                participant_type: safeString(event.event_type ?? event.participant_type) || "GENDER_DOUBLES",
                gender_restriction: safeString(event.gender_restriction) || "ANY",
                default_format: safeString(event.event_format_default) || "ROUND_ROBIN_PLUS_PLAYOFF",
                default_scoring: safeString(event.scoring_default) || "GAME_TO_15",
                default_waitlist: recordBoolean(event.waitlist_enabled, true),
                default_partner_board: recordBoolean(event.partner_board_enabled, true),
                default_capacity_teams: Number(event.capacity_teams) || 16,
                default_price_usd: Number(event.price_usd) || 0
              });
            }
            if (rows.size) return [...rows.values()];
            const firstDay = days.find((row) => recordBoolean(row.enabled, true)) || days[0] || {};
            return [{
              ...newEventFamilyRow(1, "Event 1"),
              registration_day_id: dayReference(firstDay)
            }];
          }

          function globalDivisionStatus(registrationStatus: unknown): string {
            const status = safeString(registrationStatus).toLowerCase();
            if (status === "open") return "open";
            if (status === "closed") return "closed";
            return "draft";
          }

          function configurationWithGlobalStatus(
            configuration: SetupConfiguration,
            registrationStatus: unknown
          ): SetupConfiguration {
            const status = globalDivisionStatus(registrationStatus);
            return {
              ...configuration,
              eventOptions: configuration.eventOptions.map((row) => ({
                ...row,
                value: { ...row.value, status }
              }))
            };
          }

          function divisionForFirstEvent(configuration: SetupConfiguration): SetupRecord {
            const value = newEventOptionRow(configuration);
            const event = configuration.eventFamilies[0]?.value || {};
            const family = eventFamilyName(event);
            const day = eventDayReference(event);
            return {
              ...value,
              event_family_label: family,
              event_family: family,
              registration_day_id: day || value.registration_day_id,
              assigned_day: day || value.assigned_day,
              event_type: safeString(event.participant_type) || value.event_type,
              participant_type: safeString(event.participant_type) || value.participant_type,
              gender_restriction: safeString(event.gender_restriction) || value.gender_restriction,
              capacity_teams: event.default_capacity_teams ?? value.capacity_teams,
              price_usd: event.default_price_usd ?? value.price_usd,
              waitlist_enabled: recordBoolean(event.default_waitlist, true),
              partner_board_enabled: recordBoolean(event.default_partner_board, true)
            };
          }

          '''
          replace_between(panel, 'function setupState(', 'function initialDaysFromTournament', helper_block + r'''function setupState(
            basics: BasicsDraft,
            settings: Record<string, unknown>,
            configuration: SetupConfiguration
          ): Partial<Record<TournamentSetupStep, TournamentSetupStepState>> {
            const issues = validateSetupConfiguration(configuration);
            const basicsComplete = Boolean(
              basics.name.trim() && basics.startDate && basics.endDate && basics.locationName.trim() && basics.timezone
            );
            const eventsComplete =
              configuration.eventFamilies.length > 0 &&
              !issues.some((issue) => issue.path.startsWith("families"));
            const divisionsComplete =
              configuration.eventOptions.length > 0 &&
              !issues.some((issue) => issue.path.startsWith("events"));
            const rulesComplete = Boolean(
              safeString(settings.registration_slug).trim() &&
                safeString(settings.registration_close_at).trim()
            );
            const scheduleComplete =
              configuration.days.length > 0 &&
              !issues.some((issue) => issue.path.startsWith("days"));
            const reviewComplete =
              basicsComplete && eventsComplete && divisionsComplete && rulesComplete && scheduleComplete;

            return {
              basics: basicsComplete ? "complete" : "in-progress",
              events: eventsComplete ? "complete" : configuration.eventFamilies.length ? "in-progress" : "not-started",
              divisions: divisionsComplete ? "complete" : configuration.eventOptions.length ? "in-progress" : "not-started",
              "registration-rules": rulesComplete ? "complete" : "in-progress",
              pricing: "in-progress",
              schedule: scheduleComplete ? "complete" : configuration.days.length ? "in-progress" : "not-started",
              review: reviewComplete ? "in-progress" : "blocked"
            };
          }

          ''')

          replace_once(
              panel,
              '''  const [basics, setBasics] = useState<BasicsDraft>({
            name: tournamentName,
            startDate: "",
            endDate: ""
          });
          ''',
              '''  const [basics, setBasics] = useState<BasicsDraft>(() =>
            emptyBasics(tournamentName)
          );
          ''',
          )
          replace_once(
              panel,
              '    setBasics({ name: tournamentName, startDate: "", endDate: "" });\n',
              '    setBasics(emptyBasics(tournamentName));\n',
          )

          hydrate = r'''function hydrate(payload: SetupDetail) {
            const draft = objectValue(payload.builder_draft);
            const publishedDays = payload.days || [];
            const draftDays = listValue(draft.days);
            const days = draftDays.length
              ? draftDays
              : publishedDays.length
                ? publishedDays
                : initialDaysFromTournament(payload.tournament);
            const draftEvents = listValue(
              Array.isArray(draft.event_options) ? draft.event_options : draft.divisions
            );
            const events = draftEvents.length ? draftEvents : payload.event_options || [];
            const draftFamilies = listValue(draft.event_families);
            const families = draftFamilies.length
              ? draftFamilies
              : derivedEventFamilies(events, days);
            const loadedSettings = payload.settings || {};

            setDetail(payload);
            setBasics({
              name: safeString(payload.tournament.name) || tournamentName,
              startDate: dateValue(payload.tournament.start_date),
              endDate: dateValue(payload.tournament.end_date),
              locationName: safeString(loadedSettings.location_name),
              timezone: safeString(loadedSettings.timezone) || "America/Mazatlan",
              sponsors: normalizeSponsors(loadedSettings.sponsors_json)
            });
            setSettings(loadedSettings);
            setConfiguration({
              days: wrapBuilderRows(days, "day"),
              eventFamilies: wrapBuilderRows(families, "family"),
              eventOptions: wrapBuilderRows(events, "event")
            });
            setImpactReview(null);
            setReviewedDraftSignature("");
          }

          '''
          replace_between(panel, 'function hydrate(payload: SetupDetail) {', 'async function loadDetail()', hydrate)

          save_basics = r'''async function saveBasics() {
            if (!detail) return;
            if (!basics.name.trim()) {
              setMessage("Tournament name is required.");
              return;
            }
            if (!basics.startDate || !basics.endDate) {
              setMessage("Start and end dates are required before continuing.");
              return;
            }
            if (basics.endDate < basics.startDate) {
              setMessage("Tournament end date cannot be before its start date.");
              return;
            }
            if (!basics.locationName.trim()) {
              setMessage("Tournament location is required before continuing.");
              return;
            }
            if (!basics.timezone) {
              setMessage("Tournament timezone is required before continuing.");
              return;
            }
            const unnamedSponsor = basics.sponsors.find((sponsor) => !sponsor.name.trim());
            if (unnamedSponsor) {
              setMessage("Every sponsor needs a name or should be removed.");
              return;
            }
            const expectedUpdatedAt = safeString(detail.tournament.updated_at);
            if (!expectedUpdatedAt) {
              setMessage("Reload the tournament before saving its basics.");
              return;
            }

            const generation = actionRequest.begin();
            setBusy(true);
            setMessage(null);
            try {
              await requestJson<WriteResponse>(
                `/admin/clubs/${encodeURIComponent(clubId)}/tournaments/setup/tournaments/${encodeURIComponent(tournamentId)}/settings`,
                {
                  method: "PATCH",
                  body: JSON.stringify({
                    location_name: basics.locationName.trim(),
                    timezone: basics.timezone,
                    sponsors_json: basics.sponsors.map((sponsor) => ({
                      id: sponsor.id,
                      name: sponsor.name.trim(),
                      level: sponsor.level.trim(),
                      website: sponsor.website.trim(),
                      notes: sponsor.notes.trim()
                    })),
                    expected_state_fingerprint: detail.state_fingerprint,
                    confirmation_text: "SAVE SETUP",
                    source: "next_tournament_setup_wizard_basics_metadata"
                  })
                }
              );
              if (!actionRequest.isCurrent(generation)) return;
              await requestJson<WriteResponse>(
                `/admin/clubs/${encodeURIComponent(clubId)}/tournaments/admin/tournaments/${encodeURIComponent(tournamentId)}`,
                {
                  method: "PATCH",
                  body: JSON.stringify({
                    name: basics.name.trim(),
                    start_date: basics.startDate,
                    end_date: basics.endDate,
                    expected_updated_at: expectedUpdatedAt,
                    confirmation_text: "SAVE TOURNAMENT",
                    source: "next_tournament_setup_wizard_basics"
                  })
                }
              );
              if (!actionRequest.isCurrent(generation)) return;
              await loadDetail();
              if (!actionRequest.isCurrent(generation)) return;
              goTo("events");
            } catch (error) {
              if (actionRequest.isCurrent(generation)) {
                setMessage(error instanceof Error ? error.message : "Unable to save tournament basics.");
              }
            } finally {
              if (actionRequest.isCurrent(generation)) setBusy(false);
            }
          }

          '''
          replace_between(panel, 'async function saveBasics(', 'async function saveDraftAndContinue(', save_basics)

          save_draft = r'''async function saveDraftAndContinue(nextStep: TournamentSetupStep) {
            if (!detail) return;
            const issues = validateSetupConfiguration(configuration);
            const relevantIssues =
              step === "events"
                ? issues.filter((issue) => issue.path.startsWith("families"))
                : step === "divisions"
                  ? issues.filter((issue) => issue.path.startsWith("events"))
                  : step === "schedule"
                    ? issues.filter(
                        (issue) =>
                          issue.path.startsWith("days") ||
                          issue.path.endsWith("registration_day_id")
                      )
                    : issues;
            if (relevantIssues.length) {
              setMessage(relevantIssues[0].message);
              return;
            }

            const generation = actionRequest.begin();
            setBusy(true);
            setMessage(null);
            try {
              const normalized = configurationWithGlobalStatus(
                configuration,
                settings.registration_status
              );
              const draft = configurationPayload(normalized);
              await requestJson<WriteResponse>(
                `/admin/clubs/${encodeURIComponent(clubId)}/tournaments/setup/tournaments/${encodeURIComponent(tournamentId)}/draft`,
                {
                  method: "PUT",
                  body: JSON.stringify({
                    ...draft,
                    saved_step: step,
                    expected_state_fingerprint: detail.state_fingerprint,
                    confirmation_text: draftConfirmation
                  })
                }
              );
              if (!actionRequest.isCurrent(generation)) return;
              await loadDetail();
              if (!actionRequest.isCurrent(generation)) return;
              goTo(nextStep);
            } catch (error) {
              if (actionRequest.isCurrent(generation)) {
                setMessage(error instanceof Error ? error.message : "Unable to save setup draft.");
              }
            } finally {
              if (actionRequest.isCurrent(generation)) setBusy(false);
            }
          }

          '''
          replace_between(panel, 'async function saveDraftAndContinue(', 'async function saveRegistrationRules(', save_draft)

          save_rules = r'''async function saveRegistrationRules() {
            if (!detail) return;
            if (!safeString(settings.registration_slug).trim()) {
              setMessage("Registration link is required before continuing.");
              return;
            }
            if (!safeString(settings.registration_close_at).trim()) {
              setMessage("Registration close date and time are required before continuing.");
              return;
            }

            const generation = actionRequest.begin();
            setBusy(true);
            setMessage(null);
            try {
              await requestJson<WriteResponse>(
                `/admin/clubs/${encodeURIComponent(clubId)}/tournaments/setup/tournaments/${encodeURIComponent(tournamentId)}/settings`,
                {
                  method: "PATCH",
                  body: JSON.stringify({
                    ...settings,
                    registration_status: safeString(settings.registration_status) || "draft",
                    expected_state_fingerprint: detail.state_fingerprint,
                    confirmation_text: settingsConfirmation
                  })
                }
              );
              if (!actionRequest.isCurrent(generation)) return;
              await loadDetail();
              if (!actionRequest.isCurrent(generation)) return;
              goTo("pricing");
            } catch (error) {
              if (actionRequest.isCurrent(generation)) {
                setMessage(error instanceof Error ? error.message : "Unable to save registration rules.");
              }
            } finally {
              if (actionRequest.isCurrent(generation)) setBusy(false);
            }
          }

          '''
          replace_between(panel, 'async function saveRegistrationRules(', 'async function reviewImpact()', save_rules)

          # Review and publish must use the global tournament registration status.
          text = Path(panel).read_text()
          old = '      const draft = publishConfigurationPayload(configuration);'
          if text.count(old) != 2:
              raise SystemExit(f"{panel}: expected two publish payload sites, found {text.count(old)}")
          new = (
              '      const normalized = configurationWithGlobalStatus(\n'
              '        configuration,\n'
              '        settings.registration_status\n'
              '      );\n'
              '      const draft = publishConfigurationPayload(normalized);'
          )
          Path(panel).write_text(text.replace(old, new))

          render_basics = r'''function renderBasics() {
            return (
              <article style={cardStyle}>
                <h2 style={{ marginTop: 0 }}>1. Tournament basics</h2>
                <p style={{ color: "#475569" }}>
                  Set the tournament identity, dates, location, timezone, and sponsors. Save and continue moves directly to Events without another confirmation.
                </p>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))",
                    gap: "0.75rem"
                  }}
                >
                  <label style={{ minWidth: 0 }}>
                    <strong>Tournament name</strong><br />
                    <input value={basics.name} onChange={(event) => setBasics((current) => ({ ...current, name: event.target.value }))} disabled={busy} style={inputStyle} />
                  </label>
                  <label style={{ minWidth: 0 }}>
                    <strong>Start date</strong><br />
                    <input type="date" value={basics.startDate} onChange={(event) => setBasics((current) => ({ ...current, startDate: event.target.value }))} disabled={busy} style={inputStyle} />
                  </label>
                  <label style={{ minWidth: 0 }}>
                    <strong>End date</strong><br />
                    <input type="date" min={basics.startDate || undefined} value={basics.endDate} onChange={(event) => setBasics((current) => ({ ...current, endDate: event.target.value }))} disabled={busy} style={inputStyle} />
                  </label>
                  <label style={{ minWidth: 0 }}>
                    <strong>Location or venue</strong><br />
                    <input value={basics.locationName} onChange={(event) => setBasics((current) => ({ ...current, locationName: event.target.value }))} placeholder="Tres Palapas Baja Pickleball Resort" disabled={busy} style={inputStyle} />
                  </label>
                  <label style={{ minWidth: 0 }}>
                    <strong>Timezone</strong><br />
                    <select value={basics.timezone} onChange={(event) => setBasics((current) => ({ ...current, timezone: event.target.value }))} disabled={busy} style={inputStyle}>
                      {TIMEZONE_OPTIONS.map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                    </select>
                  </label>
                </div>

                <section style={{ marginTop: "1.25rem" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "center", flexWrap: "wrap" }}>
                    <div>
                      <h3 style={{ margin: 0 }}>Sponsors</h3>
                      <p style={{ margin: "0.25rem 0 0", color: "#64748b" }}>Add, edit, or remove sponsors shown with this tournament.</p>
                    </div>
                    <button type="button" style={ghostButtonStyle} disabled={busy} onClick={() => setBasics((current) => ({ ...current, sponsors: [...current.sponsors, newSponsor()] }))}>Add sponsor</button>
                  </div>
                  <div style={{ display: "grid", gap: "0.75rem", marginTop: "0.75rem" }}>
                    {basics.sponsors.map((sponsor, index) => (
                      <article key={sponsor.id} style={{ ...cardStyle, background: "#f8fafc" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(175px, 1fr))", gap: "0.65rem" }}>
                          <label><strong>Sponsor name</strong><br /><input value={sponsor.name} onChange={(event) => setBasics((current) => ({ ...current, sponsors: current.sponsors.map((row) => row.id === sponsor.id ? { ...row, name: event.target.value } : row) }))} disabled={busy} style={inputStyle} /></label>
                          <label><strong>Level or label</strong><br /><input value={sponsor.level} onChange={(event) => setBasics((current) => ({ ...current, sponsors: current.sponsors.map((row) => row.id === sponsor.id ? { ...row, level: event.target.value } : row) }))} placeholder="Title sponsor" disabled={busy} style={inputStyle} /></label>
                          <label><strong>Website</strong><br /><input type="url" value={sponsor.website} onChange={(event) => setBasics((current) => ({ ...current, sponsors: current.sponsors.map((row) => row.id === sponsor.id ? { ...row, website: event.target.value } : row) }))} placeholder="https://" disabled={busy} style={inputStyle} /></label>
                          <label><strong>Notes</strong><br /><input value={sponsor.notes} onChange={(event) => setBasics((current) => ({ ...current, sponsors: current.sponsors.map((row) => row.id === sponsor.id ? { ...row, notes: event.target.value } : row) }))} disabled={busy} style={inputStyle} /></label>
                        </div>
                        <button type="button" style={{ ...ghostButtonStyle, marginTop: "0.65rem", color: "#991b1b", borderColor: "#fecaca" }} disabled={busy} onClick={() => setBasics((current) => ({ ...current, sponsors: current.sponsors.filter((row) => row.id !== sponsor.id) }))}>Remove sponsor {index + 1}</button>
                      </article>
                    ))}
                    {!basics.sponsors.length ? <p style={{ color: "#64748b" }}>No sponsors added yet.</p> : null}
                  </div>
                </section>

                <div style={{ marginTop: "1rem" }}>
                  <button
                    type="button"
                    style={buttonStyle}
                    disabled={busy || !basics.name.trim() || !basics.startDate || !basics.endDate || !basics.locationName.trim() || !basics.timezone}
                    onClick={() => void saveBasics()}
                  >
                    {busy ? "Saving…" : "Save and continue"}
                  </button>
                </div>
              </article>
            );
          }

          '''
          replace_between(panel, 'function renderBasics() {', 'function renderEvents() {', render_basics)

          render_event_division = r'''function renderEvents() {
            const familyIssues = issues.filter((issue) => issue.path.startsWith("families"));
            return (
              <div style={{ display: "grid", gap: "1rem" }}>
                <article style={cardStyle}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "flex-start", flexWrap: "wrap" }}>
                    <div>
                      <h2 style={{ marginTop: 0 }}>2. Events</h2>
                      <p style={{ color: "#475569", marginBottom: 0 }}>
                        Create the event families that organize the tournament, such as Gender Doubles on Tuesday or Mixed Doubles on Wednesday. Divisions are created separately in Step 3.
                      </p>
                    </div>
                    <button
                      type="button"
                      style={buttonStyle}
                      disabled={busy || !configuration.days.length}
                      onClick={() => setConfiguration((current) => {
                        const day = current.days.find((row) => recordBoolean(row.value.enabled, true))?.value || current.days[0]?.value || {};
                        return {
                          ...current,
                          eventFamilies: appendBuilderRow(
                            current.eventFamilies,
                            "family",
                            {
                              ...newEventFamilyRow(current.eventFamilies.length + 1),
                              registration_day_id: dayReference(day)
                            }
                          )
                        };
                      })}
                    >
                      Add event
                    </button>
                  </div>
                </article>

                {configuration.eventFamilies.map((row, index) => {
                  const family = eventFamilyName(row.value);
                  const divisions = configuration.eventOptions.filter((division) => eventFamilyName(division.value).toLowerCase() === family.toLowerCase());
                  return (
                    <TournamentSetupEventFamilyCard
                      key={row.key}
                      row={row}
                      position={index}
                      total={configuration.eventFamilies.length}
                      days={configuration.days}
                      disabled={busy}
                      issues={issuesForPath(issues, `families.${index}`)}
                      divisionCount={divisions.length}
                      onChange={(value) => setConfiguration((current) => {
                        const previousName = eventFamilyName(row.value);
                        const nextName = eventFamilyName(value);
                        const previousDay = eventDayReference(row.value);
                        const nextDay = eventDayReference(value);
                        return {
                          ...current,
                          eventFamilies: replaceBuilderRow(current.eventFamilies, row.key, value),
                          eventOptions: current.eventOptions.map((division) => {
                            if (eventFamilyName(division.value).toLowerCase() !== previousName.toLowerCase()) return division;
                            let nextValue = { ...division.value, event_family_label: nextName, event_family: nextName };
                            if (previousDay !== nextDay) {
                              nextValue = { ...nextValue, registration_day_id: nextDay, assigned_day: nextDay };
                            }
                            return { ...division, value: nextValue };
                          })
                        };
                      })}
                      onMove={(direction) => setConfiguration((current) => ({ ...current, eventFamilies: moveBuilderRow(current.eventFamilies, row.key, direction) }))}
                      onRemove={() => setConfiguration((current) => ({ ...current, eventFamilies: removeBuilderRow(current.eventFamilies, row.key) }))}
                    />
                  );
                })}

                {familyIssues.length ? (
                  <article style={{ ...cardStyle, borderColor: "#fecaca" }}>
                    <h3 style={{ marginTop: 0 }}>Items to fix before continuing</h3>
                    <ul>{familyIssues.map((issue) => <li key={`${issue.path}-${issue.message}`}>{issue.message}</li>)}</ul>
                  </article>
                ) : null}

                {footerRow(<>
                  <Link href={tournamentSetupStepHref("basics", tournamentId, basics.name || tournamentName)} style={ghostButtonStyle}>Back</Link>
                  <button type="button" style={buttonStyle} disabled={busy || !configuration.eventFamilies.length || familyIssues.length > 0} onClick={() => void saveDraftAndContinue("divisions")}>{busy ? "Saving…" : "Save and continue"}</button>
                </>)}
              </div>
            );
          }

          function renderDivisions() {
            const divisionIssues = issues.filter((issue) => issue.path.startsWith("events"));
            return (
              <div style={{ display: "grid", gap: "1rem" }}>
                <article style={cardStyle}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "flex-start", flexWrap: "wrap" }}>
                    <div>
                      <h2 style={{ marginTop: 0 }}>3. Divisions</h2>
                      <p style={{ color: "#475569", marginBottom: 0 }}>
                        Create the skill and age divisions inside each event. For example, Gender Doubles can contain 3.5, 4.0, and 3.5 · 50+ divisions.
                      </p>
                    </div>
                    <button type="button" style={buttonStyle} disabled={busy || !configuration.eventFamilies.length} onClick={() => setConfiguration((current) => ({ ...current, eventOptions: appendBuilderRow(current.eventOptions, "event", divisionForFirstEvent(current)) }))}>Add division</button>
                  </div>
                  {!configuration.eventFamilies.length ? <p role="alert" style={{ color: "#b91c1c" }}>Create an event in Step 2 before adding divisions.</p> : null}
                </article>

                {configuration.eventOptions.map((row, index) => (
                  <TournamentSetupDivisionCard
                    key={row.key}
                    row={row}
                    position={index}
                    total={configuration.eventOptions.length}
                    eventFamilies={configuration.eventFamilies}
                    disabled={busy}
                    issues={issuesForPath(issues, `events.${index}`)}
                    onChange={(value) => { setConfiguration((current) => ({ ...current, eventOptions: replaceBuilderRow(current.eventOptions, row.key, value) })); setImpactReview(null); }}
                    onMove={(direction) => setConfiguration((current) => ({ ...current, eventOptions: moveBuilderRow(current.eventOptions, row.key, direction) }))}
                    onRemove={() => setConfiguration((current) => ({ ...current, eventOptions: removeBuilderRow(current.eventOptions, row.key) }))}
                  />
                ))}

                {!configuration.eventOptions.length ? <article style={cardStyle}><p style={{ margin: 0, color: "#64748b" }}>No divisions yet. Click Add division to create the first one.</p></article> : null}
                {divisionIssues.length ? <article style={{ ...cardStyle, borderColor: "#fecaca" }}><h3 style={{ marginTop: 0 }}>Items to fix before continuing</h3><ul>{divisionIssues.map((issue) => <li key={`${issue.path}-${issue.message}`}>{issue.message}</li>)}</ul></article> : null}

                {footerRow(<>
                  <Link href={tournamentSetupStepHref("events", tournamentId, basics.name || tournamentName)} style={ghostButtonStyle}>Back</Link>
                  <button type="button" style={buttonStyle} disabled={busy || !configuration.eventOptions.length || divisionIssues.length > 0} onClick={() => void saveDraftAndContinue("registration-rules")}>{busy ? "Saving…" : "Save and continue"}</button>
                </>)}
              </div>
            );
          }

          '''
          replace_between(panel, 'function renderEvents() {', 'function renderRegistrationRules() {', render_event_division)

          # Step numbering, tournament-wide registration explanation, and direct routine saves.
          text = Path(panel).read_text()
          text = text.replace('<h2 style={{ marginTop: 0 }}>3. Registration rules</h2>', '<h2 style={{ marginTop: 0 }}>4. Registration rules</h2>')
          text = text.replace('<h2 style={{ marginTop: 0 }}>4. Pricing, extras, and fulfillment</h2>', '<h2 style={{ marginTop: 0 }}>5. Pricing, extras, and fulfillment</h2>')
          text = text.replace('<h2 style={{ marginTop: 0 }}>5. Schedule and courts</h2>', '<h2 style={{ marginTop: 0 }}>6. Schedule and courts</h2>')
          text = text.replace('<h2 style={{ marginTop: 0 }}>6. Review and open registration</h2>', '<h2 style={{ marginTop: 0 }}>7. Review and open registration</h2>')
          text = text.replace('Step {definition.number} of 6', 'Step {definition.number} of 7')
          text = text.replace('Set entry fees on the event cards', 'Set entry fees on the division cards')
          text = text.replace('href={tournamentSetupStepHref(\n                  "events",', 'href={tournamentSetupStepHref(\n                  "divisions",', 1)

          status_note = '''        <article style={{ margin: "0.75rem 0", padding: "0.75rem", borderRadius: "10px", background: "#eff6ff", color: "#1e3a8a" }}>
              <strong>Tournament-wide registration status</strong><br />
              <small>
                Registration status is controlled for the whole tournament here and in Step 7. Divisions do not have separate registration statuses. Current status: {registrationStatus}.
              </small>
            </article>
          '''
          marker = '        <div\n          style={{\n            display: "grid",\n            gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))",'
          marker_at = text.find(marker, text.find('function renderRegistrationRules()'))
          if marker_at < 0:
              raise SystemExit('registration rules grid marker not found')
          text = text[:marker_at] + status_note + text[marker_at:]

          # Replace routine confirmation dialogs with direct Save and continue buttons.
          patterns = [
              (
                  r'''<ConfirmAction\n\s+triggerLabel=\{busy \? "Saving…" : "Save and continue"\}\n\s+title="Save registration rules\?"[\s\S]*?onConfirm=\{saveRegistrationRules\}\n\s+/>''',
                  '''<button type="button" style={buttonStyle} disabled={busy || !safeString(settings.registration_slug).trim() || !safeString(settings.registration_close_at).trim()} onClick={() => void saveRegistrationRules()}>{busy ? "Saving…" : "Save and continue"}</button>'''
              ),
              (
                  r'''<ConfirmAction\n\s+triggerLabel=\{busy \? "Saving…" : "Save and continue"\}\n\s+title="Save the tournament schedule\?"[\s\S]*?onConfirm=\{\(confirmationText\) =>\n\s+saveDraftAndContinue\("review", confirmationText\)\n\s+\}\n\s+/>''',
                  '''<button type="button" style={buttonStyle} disabled={busy || !configuration.days.length || dayIssues.length > 0} onClick={() => void saveDraftAndContinue("review")}>{busy ? "Saving…" : "Save and continue"}</button>'''
              )
          ]
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'routine save pattern did not match exactly once: {pattern[:80]} count={count}')

          # Review separates Events and Divisions.
          text = text.replace(
              '["Events and formats", eventsReady, `${configuration.eventOptions.length} event(s)`],',
              '["Events", configuration.eventFamilies.length > 0, `${configuration.eventFamilies.length} event(s)`],\n              ["Divisions", eventsReady, `${configuration.eventOptions.length} division(s)`],'
          )

          # Route renderer includes Divisions.
          old_conditional = '''        ) : step === "registration-rules" ? (
              renderRegistrationRules()
          '''
          new_conditional = '''        ) : step === "divisions" ? (
              renderDivisions()
            ) : step === "registration-rules" ? (
              renderRegistrationRules()
          '''
          if old_conditional not in text:
              raise SystemExit('step conditional marker not found')
          text = text.replace(old_conditional, new_conditional, 1)
          Path(panel).write_text(text)

          # Wizard page copy.
          wizard_page = Path("apps/web/app/admin/tournaments/setup/TournamentSetupWizardPage.tsx")
          page_text = wizard_page.read_text()
          page_text = page_text.replace("Complete the six setup steps in order.", "Complete the seven setup steps in order.")
          wizard_page.write_text(page_text)

          # Builder event-family row carries a day reference.
          builder = "apps/web/app/admin/tournament-setup/tournamentSetupBuilder.ts"
          replace_once(
              builder,
              '''export function newEventFamilyRow(position: number, name = `Event ${position}`): SetupRecord {
            return {
              id: newContractId("family"),
              event_family: name,
          ''',
              '''export function newEventFamilyRow(
            position: number,
            name = `Event ${position}`,
            registrationDayId = ""
          ): SetupRecord {
            return {
              id: newContractId("family"),
              event_family: name,
              registration_day_id: registrationDayId,
          ''',
          )

          # Remove the obsolete conflated editor so it cannot regress back into use.
          obsolete = Path("apps/web/app/admin/tournaments/setup/TournamentSetupEventCard.tsx")
          if obsolete.exists():
              obsolete.unlink()

          # Migration contract and deterministic inventory tests.
          contract_path = Path("config/production_migration_contract.json")
          contract = json.loads(contract_path.read_text())
          names = set(contract["required_ledger_names"])
          names.add("tournament_setup_basics_metadata")
          contract["required_ledger_names"] = sorted(names)
          from scripts.deployment_verifier import repository_migration_content_fingerprint
          contract["repository_migration_content_sha256"] = repository_migration_content_fingerprint(Path("supabase/migrations"))
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")

          hardening = Path("tests/test_production_deployment_hardening.py")
          hardening_text = hardening.read_text()
          hardening_text = hardening_text.replace("assert len(versions) == 54", "assert len(versions) == 55")
          hardening_text = hardening_text.replace(
              '''    assert versions[-5:] == (
                  "20260728040000",
                  "20260728041000",
                  "20260731033000",
                  "20260731210000",
                  "20261020000000",
              )''',
              '''    assert versions[-5:] == (
                  "20260728041000",
                  "20260731033000",
                  "20260731210000",
                  "20261020000000",
                  "20261021000000",
              )'''
          )
          hardening_text = hardening_text.replace("assert len(names) == 54", "assert len(names) == 55")
          hardening_text = hardening_text.replace('assert len(contract["required_ledger_names"]) == 54', 'assert len(contract["required_ledger_names"]) == 55')
          hardening.write_text(hardening_text)

          # Focused acceptance contract.
          Path("tests/test_api_contract_tournament_setup_event_division_refine.py").write_text(r'''from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          WEB = ROOT / "apps" / "web"

          def read(path: str) -> str:
              return (WEB / path).read_text(encoding="utf-8")

          def test_setup_wizard_has_separate_event_and_division_steps() -> None:
              nav = read("components/TournamentSetupWizardNav.tsx")
              panel = read("app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")
              assert '| "divisions"' in nav
              assert 'label: "Events"' in nav
              assert 'label: "Divisions"' in nav
              assert "Step {definition.number} of 7" in panel
              assert "TournamentSetupEventFamilyCard" in panel
              assert "TournamentSetupDivisionCard" in panel
              assert 'saveDraftAndContinue("divisions")' in panel
              assert 'saveDraftAndContinue("registration-rules")' in panel
              assert (WEB / "app/admin/tournaments/setup/divisions/page.tsx").exists()

          def test_basics_has_location_timezone_sponsors_and_no_save_confirmation() -> None:
              panel = read("app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")
              basics = panel.split("function renderBasics()", 1)[1].split("function renderEvents()", 1)[0]
              assert "Location or venue" in basics
              assert "Timezone" in basics
              assert "Add sponsor" in basics
              assert "Sponsor name" in basics
              assert "Remove sponsor" in basics
              assert "ConfirmAction" not in basics
              assert "void saveBasics()" in basics

          def test_divisions_do_not_expose_registration_status() -> None:
              division = read("app/admin/tournaments/setup/TournamentSetupDivisionCard.tsx")
              rules = read("app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")
              assert "Registration status" not in division
              assert "DIVISION_STATUSES" not in division
              assert "Tournament-wide registration status" in rules
              assert "Divisions do not have separate registration statuses" in rules
              assert "configurationWithGlobalStatus" in rules

          def test_setup_metadata_is_structured_and_migrated() -> None:
              migration = (ROOT / "supabase/migrations/20261021000000_tournament_setup_basics_metadata.sql").read_text()
              routes = (ROOT / "services/api/admin_tournament_setup_routes.py").read_text()
              service = (ROOT / "jupr_app/services/admin_tournament_setup_service.py").read_text()
              repo = (ROOT / "jupr_app/domain/tournament_registration_repo.py").read_text()
              for field in ("location_name", "timezone", "sponsors_json"):
                  assert field in migration
                  assert field in routes
                  assert field in service
                  assert field in repo
          ''')

          git_diff = Path(".git")
          PY
          git diff --check

      - name: Run focused source and migration checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_event_division_refine.py \
            tests/test_production_deployment_hardening.py

      - name: Commit application patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-tournament-setup-event-division-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Tournament Setup events and divisions"
          git push origin HEAD:agent/tournament-setup-event-division-refine
