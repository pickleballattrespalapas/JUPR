name: Temporary migration inventory test restoration

on:
  push:
    branches:
      - agent/acceptance-fixes-20260731
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  restore:
    if: (github.head_ref == 'agent/acceptance-fixes-20260731' || github.ref_name == 'agent/acceptance-fixes-20260731') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/acceptance-fixes-20260731
          fetch-depth: 0
      - name: Restore complete test and update migration inventory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging --no-tags
          git show origin/staging:tests/test_production_deployment_hardening.py > tests/test_production_deployment_hardening.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_production_deployment_hardening.py')
          text = path.read_text()
          replacements = {
              'assert len(versions) == 53': 'assert len(versions) == 54',
              '''assert versions[-5:] == (\n        "20260728030000",\n        "20260728040000",\n        "20260728041000",\n        "20260731033000",\n        "20261020000000",\n    )''': '''assert versions[-5:] == (\n        "20260728040000",\n        "20260728041000",\n        "20260731033000",\n        "20260731210000",\n        "20261020000000",\n    )''',
              'assert len(names) == 53': 'assert len(names) == 54',
              'assert len(contract["required_ledger_names"]) == 53': 'assert len(contract["required_ledger_names"]) == 54',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one migration inventory pattern: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/tmp-restore-migration-inventory-test.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore migration inventory safety test'
          git push origin HEAD:agent/acceptance-fixes-20260731
