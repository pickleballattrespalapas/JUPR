name: Temporary build production tournament activation

on:
  push:
    branches:
      - agent/enable-production-tournaments-20260803
    paths:
      - .github/production-tournament-code.trigger

permissions:
  contents: write

concurrency:
  group: build-production-tournament-activation
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enable-production-tournaments-20260803
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply explicit production tournament authorization gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex replacement did not match exactly once")
              target.write_text(updated, encoding="utf-8")

          Path("jupr_app/services/production_tournament_guard.py").write_text(
              '''from __future__ import annotations

import os


TRUTHY = {"1", "true", "yes", "y", "on"}
PRODUCTION_TOURNAMENT_WRITE_FLAG = "JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION"


def _truthy(name: str) -> bool:
    return os.getenv(name, "").strip().lower() in TRUTHY


def production_tournament_writes_enabled() -> bool:
    """Require an explicit production-wide gate in addition to surface flags."""

    return bool(
        os.getenv("JUPR_ENV", "").strip().lower() == "production"
        and os.getenv("JUPR_PRODUCTION_WRITE_POLICY", "").strip().lower() == "enabled"
        and _truthy(PRODUCTION_TOURNAMENT_WRITE_FLAG)
        and os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip()
    )


def require_production_tournament_writes() -> None:
    if os.getenv("JUPR_ENV", "").strip().lower() != "production":
        return
    if os.getenv("JUPR_PRODUCTION_WRITE_POLICY", "").strip().lower() != "enabled":
        raise PermissionError(
            "Production tournament writes are disabled by the production write policy."
        )
    if not _truthy(PRODUCTION_TOURNAMENT_WRITE_FLAG):
        raise PermissionError(
            f"Production tournament writes require {PRODUCTION_TOURNAMENT_WRITE_FLAG}=1."
        )
    if not os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip():
        raise RuntimeError(
            "Production tournament writes require the server-only Supabase service credential."
        )
''',
              encoding="utf-8",
          )

          # Central guarded Tournament Admin surfaces.
          replace_once(
              "jupr_app/services/admin_tournament_guarded_operation.py",
              "from jupr_app.domain.tournament_admin_operations import build_tournament_admin_operation_request\n",
              "from jupr_app.domain.tournament_admin_operations import build_tournament_admin_operation_request\n"
              "from jupr_app.services.production_tournament_guard import (\n"
              "    production_tournament_writes_enabled,\n"
              "    require_production_tournament_writes,\n"
              ")\n",
          )
          replace_once(
              "jupr_app/services/admin_tournament_guarded_operation.py",
              "    return environment == \"staging\" and bool(flag) and _truthy_env(flag)\n",
              "    if environment == \"staging\":\n"
              "        return bool(flag) and _truthy_env(flag)\n"
              "    if environment == \"production\":\n"
              "        return bool(\n"
              "            production_tournament_writes_enabled()\n"
              "            and flag\n"
              "            and _truthy_env(flag)\n"
              "        )\n"
              "    return False\n",
          )
          replace_once(
              "jupr_app/services/admin_tournament_guarded_operation.py",
              '''    if environment == "production":
        raise PermissionError(
            "Tournament Admin mutations are staging-only until manual parity acceptance is complete."
        )
''',
              '''    if environment == "production":
        require_production_tournament_writes()
        if not _truthy_env(flag):
            raise PermissionError(
                f"Production Tournament Admin mutation is disabled for {surface}. Enable {flag} only with the approved production tournament gate."
            )
        return
''',
          )
          replace_regex(
              "jupr_app/services/admin_tournament_guarded_operation.py",
              r"def tournament_admin_mutation_status\(\) -> dict\[str, Any\]:.*?\n\n\ndef _safe_rows",
              '''def tournament_admin_mutation_status() -> dict[str, Any]:
    environment = os.getenv("JUPR_ENV", "").strip().lower() or "local"
    return {
        "environment": environment,
        "staging_only": False,
        "production_authorized": production_tournament_writes_enabled(),
        "service_role_ready": bool(os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip()),
        "surface_flags": {
            surface: {
                "name": flag,
                "enabled": tournament_admin_guarded_runtime_enabled(surface),
            }
            for surface, flag in SURFACE_MUTATION_FLAGS.items()
        },
    }


def _safe_rows''',
          )

          # Official match publication and ratings.
          replace_once(
              "jupr_app/services/admin_tournament_ops_service.py",
              "from jupr_app.services.admin_player_updates_service import is_auto_player_updates_enabled\n",
              "from jupr_app.services.admin_player_updates_service import is_auto_player_updates_enabled\n"
              "from jupr_app.services.production_tournament_guard import (\n"
              "    production_tournament_writes_enabled,\n"
              "    require_production_tournament_writes,\n"
              ")\n",
          )
          replace_regex(
              "jupr_app/services/admin_tournament_ops_service.py",
              r"def require_admin_tournament_official_publish_runtime\(\) -> None:.*?\n\n\ndef build_admin_tournament_ops_runtime_status",
              '''def require_admin_tournament_official_publish_runtime() -> None:
    """Apply the extra rating/email gates used only by official publishing."""

    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
    elif environment != "staging":
        return
    if not _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH"):
        raise PermissionError(
            "Tournament official publishing is disabled. Enable JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH only with the approved tournament write gate."
        )
    if is_auto_player_updates_enabled():
        if not _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF"):
            raise PermissionError(
                "Automatic tournament player-update email handoff is disabled. Open its separate gate before official publish."
            )
        allowed_email_modes = {"dry_run"} if environment == "production" else {"dry_run", "staging_redirect"}
        if get_email_mode() not in allowed_email_modes:
            raise PermissionError(
                "Tournament official publishing requires a non-live email mode."
            )


def build_admin_tournament_ops_runtime_status''',
          )
          replace_regex(
              "jupr_app/services/admin_tournament_ops_service.py",
              r"def build_admin_tournament_ops_runtime_status\(\) -> dict\[str, Any\]:.*?\n\n\ndef get_admin_tournament_ops_snapshot",
              '''def build_admin_tournament_ops_runtime_status() -> dict[str, Any]:
    environment = os.getenv("JUPR_ENV", "").strip().lower() or "local"
    production_authorized = production_tournament_writes_enabled()
    hosted_write_runtime = environment == "staging" or production_authorized
    return {
        "environment": environment,
        "operations_mutations_enabled": tournament_admin_guarded_runtime_enabled("operations"),
        "official_publish_enabled": bool(
            hosted_write_runtime
            and _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH")
        ),
        "email_handoff_enabled": bool(
            hosted_write_runtime
            and _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF")
        ),
        "auto_player_updates_enabled": is_auto_player_updates_enabled(),
        "email_mode": get_email_mode(),
        "staging_only": False,
        "production_authorized": production_authorized,
    }


def get_admin_tournament_ops_snapshot''',
          )

          # Four-player/team tournament management.
          replace_once(
              "jupr_app/services/admin_tournament_team_competition_service.py",
              "from jupr_app.services.admin_tournament_service import (\n    is_admin_tournament_admin_enabled,\n)\n",
              "from jupr_app.services.admin_tournament_service import (\n    is_admin_tournament_admin_enabled,\n)\n"
              "from jupr_app.services.production_tournament_guard import require_production_tournament_writes\n",
          )
          replace_regex(
              "jupr_app/services/admin_tournament_team_competition_service.py",
              r"def require_admin_team_tournament_runtime\(\) -> None:.*?\n\n\ndef _safe_rows",
              '''def require_admin_team_tournament_runtime() -> None:
    if not is_admin_team_tournament_enabled():
        raise PermissionError("Team tournament management is disabled.")
    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
    if not os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip():
        raise PermissionError("Team tournament management requires the server database credential.")


def _safe_rows''',
          )

          # Public team invitations and four-player registration.
          replace_once(
              "jupr_app/services/public_tournament_team_service.py",
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n",
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n"
              "from jupr_app.services.production_tournament_guard import require_production_tournament_writes\n",
          )
          replace_regex(
              "jupr_app/services/public_tournament_team_service.py",
              r"def require_public_team_tournament_mutation_runtime\(\) -> None:.*?\n\n\ndef _one",
              '''def require_public_team_tournament_mutation_runtime() -> None:
    """Require the reviewed public-registration gate in hosted environments."""

    if not is_admin_team_tournament_enabled():
        raise PermissionError("Four-player team registration is disabled.")
    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
        if os.getenv(PUBLIC_INTAKE_WRITE_FLAG, "").strip().lower() not in TRUTHY:
            raise PermissionError(
                f"Production four-player team writes require {PUBLIC_INTAKE_WRITE_FLAG}=1."
            )
    elif environment == "staging":
        if (
            not staging_write_wave_allows(PUBLIC_TEAM_WRITE_WAVE)
            or os.getenv(PUBLIC_INTAKE_WRITE_FLAG, "").strip().lower() not in TRUTHY
        ):
            raise PermissionError(
                "Four-player team writes are disabled. Use permanent-open staging "
                f"or the approved {PUBLIC_TEAM_WRITE_WAVE} wave."
            )
    if environment in {"staging", "production"} and not os.getenv(
        "SUPABASE_SERVICE_ROLE_KEY", ""
    ).strip():
        raise RuntimeError(
            "Four-player team hosted writes require the server-only database credential."
        )


def _one''',
          )

          # Offline tournament extras, order quotes, fulfillment and manual payment status.
          replace_once(
              "jupr_app/services/public_tournament_commerce_service.py",
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n",
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n"
              "from jupr_app.services.production_tournament_guard import (\n"
              "    production_tournament_writes_enabled,\n"
              "    require_production_tournament_writes,\n"
              ")\n",
          )
          replace_regex(
              "jupr_app/services/public_tournament_commerce_service.py",
              r"def tournament_commerce_runtime_status\(\) -> dict\[str, Any\]:.*?\n\n\ndef require_tournament_commerce_mutation_runtime",
              '''def tournament_commerce_runtime_status() -> dict[str, Any]:
    environment = os.getenv("JUPR_ENV", "").strip().lower() or "local"
    wave = os.getenv("JUPR_STAGING_WRITE_WAVE", "").strip() or "none"
    production_authorized = production_tournament_writes_enabled()
    mutation_enabled = _truthy(MUTATION_FLAG)
    service_role_ready = bool(os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip())
    return {
        "enabled": is_tournament_commerce_enabled(),
        "environment": environment,
        "staging_only": False,
        "production_authorized": production_authorized,
        "service_role_ready": service_role_ready,
        "mutation_flag": {"name": MUTATION_FLAG, "enabled": mutation_enabled},
        "write_wave": wave,
        "admin_write_ready": bool(
            mutation_enabled
            and service_role_ready
            and (
                production_authorized
                or (
                    environment == "staging"
                    and staging_write_wave_allows(ADMIN_WRITE_WAVE)
                )
            )
        ),
        "public_registration_write_ready": bool(
            mutation_enabled
            and service_role_ready
            and (
                production_authorized
                or (
                    environment == "staging"
                    and staging_write_wave_allows(PUBLIC_WRITE_WAVE)
                )
            )
        ),
        "offline_payment_only": True,
    }


def require_tournament_commerce_mutation_runtime''',
          )
          replace_regex(
              "jupr_app/services/public_tournament_commerce_service.py",
              r"def require_tournament_commerce_mutation_runtime\(\*, actor_type: str\) -> None:.*?\n\n\ndef _clean_text",
              '''def require_tournament_commerce_mutation_runtime(*, actor_type: str) -> None:
    """Require an explicit hosted write gate while keeping payment offline."""

    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
        if not _truthy(MUTATION_FLAG):
            raise PermissionError(
                f"Production tournament commerce writes require {MUTATION_FLAG}=1."
            )
    elif environment == "staging":
        expected_wave = (
            PUBLIC_WRITE_WAVE
            if str(actor_type).upper() == "PUBLIC_REGISTRANT"
            else ADMIN_WRITE_WAVE
        )
        if (
            not staging_write_wave_allows(expected_wave)
            or not _truthy(MUTATION_FLAG)
        ):
            raise PermissionError(
                "Tournament commerce writes are disabled. Use permanent-open staging "
                f"or the approved {expected_wave} wave."
            )
    if environment in {"staging", "production"} and not os.getenv(
        "SUPABASE_SERVICE_ROLE_KEY", ""
    ).strip():
        raise TournamentCommerceUnavailableError(
            "Tournament commerce hosted writes require the server-only Supabase service credential."
        )


def _clean_text''',
          )

          # Expose the dedicated production override in health/secret inventories.
          replace_once(
              "scripts/deployment_verifier.py",
              "PRODUCTION_FEATURE_FLAGS = tuple(\n    sorted(\n        set(PRODUCTION_READ_FEATURE_FLAGS)\n        | set(ALL_STAGING_WRITE_FLAGS)\n        | set(ALWAYS_DISABLED_FLAGS)\n    )\n)\n",
              "PRODUCTION_TOURNAMENT_FEATURE_FLAGS = (\n"
              "    \"JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION\",\n"
              ")\n"
              "PRODUCTION_FEATURE_FLAGS = tuple(\n"
              "    sorted(\n"
              "        set(PRODUCTION_READ_FEATURE_FLAGS)\n"
              "        | set(PRODUCTION_TOURNAMENT_FEATURE_FLAGS)\n"
              "        | set(ALL_STAGING_WRITE_FLAGS)\n"
              "        | set(ALWAYS_DISABLED_FLAGS)\n"
              "    )\n"
              ")\n",
          )

          Path("tests/test_production_tournament_activation.py").write_text(
              '''from __future__ import annotations

import pytest

from jupr_app.services.admin_tournament_guarded_operation import (
    require_tournament_admin_mutation_runtime,
    tournament_admin_guarded_runtime_enabled,
)
from jupr_app.services.admin_tournament_ops_service import (
    require_admin_tournament_official_publish_runtime,
)
from jupr_app.services.admin_tournament_team_competition_service import (
    require_admin_team_tournament_runtime,
)
from jupr_app.services.production_tournament_guard import (
    production_tournament_writes_enabled,
)
from jupr_app.services.public_tournament_commerce_service import (
    require_tournament_commerce_mutation_runtime,
    tournament_commerce_runtime_status,
)
from jupr_app.services.public_tournament_team_service import (
    require_public_team_tournament_mutation_runtime,
)


def _base_production(monkeypatch: pytest.MonkeyPatch) -> None:
    monkeypatch.setenv("JUPR_ENV", "production")
    monkeypatch.setenv("JUPR_PRODUCTION_WRITE_POLICY", "enabled")
    monkeypatch.setenv("JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION", "1")
    monkeypatch.setenv("SUPABASE_SERVICE_ROLE_KEY", "server-only-test-key")
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENTS", "1")
    monkeypatch.setenv("JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION", "1")
    monkeypatch.setenv("JUPR_ENABLE_STAGING_PUBLIC_INTAKE_WRITES", "1")
    monkeypatch.setenv("JUPR_ENABLE_STAGING_TOURNAMENT_COMMERCE_WRITES", "1")
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS", "1")
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH", "1")
    monkeypatch.setenv("JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS", "0")
    monkeypatch.setenv("JUPR_EMAIL_MODE", "dry_run")


def test_production_tournament_gate_fails_closed(monkeypatch: pytest.MonkeyPatch) -> None:
    monkeypatch.setenv("JUPR_ENV", "production")
    monkeypatch.setenv("JUPR_PRODUCTION_WRITE_POLICY", "enabled")
    monkeypatch.setenv("SUPABASE_SERVICE_ROLE_KEY", "server-only-test-key")
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS", "1")
    assert production_tournament_writes_enabled() is False
    with pytest.raises(PermissionError):
        require_tournament_admin_mutation_runtime("operations")


def test_production_tournament_gate_requires_enabled_write_policy(monkeypatch: pytest.MonkeyPatch) -> None:
    _base_production(monkeypatch)
    monkeypatch.setenv("JUPR_PRODUCTION_WRITE_POLICY", "read_only")
    assert production_tournament_writes_enabled() is False
    with pytest.raises(PermissionError):
        require_tournament_admin_mutation_runtime("operations")


def test_production_tournament_surfaces_require_both_keys(monkeypatch: pytest.MonkeyPatch) -> None:
    _base_production(monkeypatch)
    assert production_tournament_writes_enabled() is True
    assert tournament_admin_guarded_runtime_enabled("operations") is True
    require_tournament_admin_mutation_runtime("operations")
    require_admin_tournament_official_publish_runtime()
    require_admin_team_tournament_runtime()
    require_public_team_tournament_mutation_runtime()
    require_tournament_commerce_mutation_runtime(actor_type="PUBLIC_REGISTRANT")
    status = tournament_commerce_runtime_status()
    assert status["production_authorized"] is True
    assert status["public_registration_write_ready"] is True
    assert status["offline_payment_only"] is True


def test_surface_flag_still_fails_closed_in_production(monkeypatch: pytest.MonkeyPatch) -> None:
    _base_production(monkeypatch)
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS", "0")
    assert tournament_admin_guarded_runtime_enabled("operations") is False
    with pytest.raises(PermissionError):
        require_tournament_admin_mutation_runtime("operations")
''',
              encoding="utf-8",
          )
          PY

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt

      - name: Run focused tournament activation tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_production_tournament_activation.py \
            tests/test_tournament_admin_guarded_operations.py \
            tests/test_tournament_team_runtime_security.py \
            tests/test_public_tournament_commerce_service.py \
            tests/test_api_contract_admin_tournament_guarded.py \
            tests/test_api_contract_admin_tournament_setup.py \
            tests/test_api_contract_tournament_registration.py \
            tests/test_api_contract_tournament_registration_edit.py
          python -m compileall -q jupr_app/services services/api

      - name: Reject remaining unconditional tournament production denials
        run: |
          set -euo pipefail
          if grep -R -n -E 'staging-only until manual (parity )?acceptance' \
            jupr_app/services/*tournament*.py; then
            echo "::error::An unconditional tournament production denial remains."
            exit 1
          fi

      - name: Commit verified activation code
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jupr_app/services/production_tournament_guard.py \
            jupr_app/services/admin_tournament_guarded_operation.py \
            jupr_app/services/admin_tournament_ops_service.py \
            jupr_app/services/admin_tournament_team_competition_service.py \
            jupr_app/services/public_tournament_team_service.py \
            jupr_app/services/public_tournament_commerce_service.py \
            scripts/deployment_verifier.py \
            tests/test_production_tournament_activation.py
          git commit -m "Authorize reviewed tournament workflows in production"
          git push origin HEAD:agent/enable-production-tournaments-20260803
