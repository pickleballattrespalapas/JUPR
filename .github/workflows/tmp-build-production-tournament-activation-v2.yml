    if not os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip():
        raise PermissionError("Team tournament management requires the server database credential.")

''',
          )

          public_team = "jupr_app/services/public_tournament_team_service.py"
          replace_once(
              public_team,
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n",
              "from jupr_app.services.staging_write_guard import staging_write_wave_allows\n"
              "from jupr_app.services.production_tournament_guard import require_production_tournament_writes\n",
          )
          replace_regex(
              public_team,
              r"def require_public_team_tournament_mutation_runtime\(\) -> None:.*?(?=\ndef _one)",
              '''def require_public_team_tournament_mutation_runtime() -> None:
    """Require the public-registration surface flag in hosted environments."""

    if not is_admin_team_tournament_enabled():
        raise PermissionError("Four-player team registration is disabled.")
    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
        if os.getenv(PUBLIC_INTAKE_WRITE_FLAG, "").strip().lower() not in TRUTHY:
