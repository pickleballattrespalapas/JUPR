name: Temporary build production tournament activation v2

on:
  push:
    branches:
      - agent/enable-production-tournaments-v2-20260803
    paths:
      - .github/production-tournament-code-v2.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: build-production-tournament-activation-v2
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STATUS_CONTEXT: production-tournament-code-v2
      TARGET_BRANCH: agent/enable-production-tournaments-v2-20260803
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enable-production-tournaments-v2-20260803
          fetch-depth: 0

      - name: Mark build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Building explicit production tournament authorization",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply production tournament authorization patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              write(path, value.replace(old, new))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              value = read(path)
              updated, count = re.subn(pattern, replacement, value, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex did not match exactly once: {pattern[:90]}")
              write(path, updated)

          Path("jupr_app/services/production_tournament_guard.py").write_text(
              '''from __future__ import annotations

import os

TRUTHY = {"1", "true", "yes", "y", "on"}
PRODUCTION_TOURNAMENT_WRITE_FLAG = "JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION"


def _truthy(name: str) -> bool:
    return os.getenv(name, "").strip().lower() in TRUTHY


def production_tournament_writes_enabled() -> bool:
    return bool(
        os.getenv("JUPR_ENV", "").strip().lower() == "production"
        and os.getenv("JUPR_PRODUCTION_WRITE_POLICY", "").strip().lower() == "enabled"
        and _truthy(PRODUCTION_TOURNAMENT_WRITE_FLAG)
        and os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip()
    )


def require_production_tournament_writes() -> None:
    if os.getenv("JUPR_ENV", "").strip().lower() != "production":
        return
    if os.getenv("JUPR_PRODUCTION_WRITE_POLICY", "").strip().lower() != "enabled":
        raise PermissionError("Production tournament writes are disabled by the production write policy.")
    if not _truthy(PRODUCTION_TOURNAMENT_WRITE_FLAG):
        raise PermissionError(
            f"Production tournament writes require {PRODUCTION_TOURNAMENT_WRITE_FLAG}=1."
        )
    if not os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip():
        raise RuntimeError(
            "Production tournament writes require the server-only Supabase service credential."
        )
''',
              encoding="utf-8",
          )

          guarded = "jupr_app/services/admin_tournament_guarded_operation.py"
          replace_once(
              guarded,
              "from jupr_app.domain.tournament_admin_operations import build_tournament_admin_operation_request\n",
              "from jupr_app.domain.tournament_admin_operations import build_tournament_admin_operation_request\n"
              "from jupr_app.services.production_tournament_guard import (\n"
              "    production_tournament_writes_enabled,\n"
              "    require_production_tournament_writes,\n"
              ")\n",
          )
          replace_regex(
              guarded,
              r"def tournament_admin_guarded_runtime_enabled\(surface: str\) -> bool:.*?(?=\ndef require_tournament_admin_mutation_runtime)",
              '''def tournament_admin_guarded_runtime_enabled(surface: str) -> bool:
    """Require both the environment-wide and per-surface write gates."""

    environment = os.getenv("JUPR_ENV", "").strip().lower()
    flag = SURFACE_MUTATION_FLAGS.get(str(surface), "")
    if not flag or not _truthy_env(flag):
        return False
    if environment == "staging":
        return True
    if environment == "production":
        return production_tournament_writes_enabled()
    return False

''',
          )
          replace_regex(
              guarded,
              r"def require_tournament_admin_mutation_runtime\(surface: str\) -> None:.*?(?=\ndef tournament_admin_mutation_status)",
              '''def require_tournament_admin_mutation_runtime(surface: str) -> None:
    environment = os.getenv("JUPR_ENV", "").strip().lower()
    flag = SURFACE_MUTATION_FLAGS.get(str(surface))
    if flag is None:
        raise PermissionError("Unknown Tournament Admin mutation surface.")
    if environment == "production":
        require_production_tournament_writes()
        if not _truthy_env(flag):
            raise PermissionError(
                f"Production Tournament Admin mutation is disabled for {surface}. Enable {flag} only with the approved production tournament gate."
            )
    elif environment == "staging":
        if not _truthy_env(flag):
            raise PermissionError(
                f"Tournament Admin mutation is disabled. Enable {flag} only for the approved staging exercise."
            )
    else:
        return
    if not os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip():
        raise RuntimeError(
            "Tournament Admin hosted mutations require SUPABASE_SERVICE_ROLE_KEY on FastAPI. Never expose this secret to Next or the browser."
        )

''',
          )
          replace_regex(
              guarded,
              r"def tournament_admin_mutation_status\(\) -> dict\[str, Any\]:.*?(?=\ndef _safe_rows)",
              '''def tournament_admin_mutation_status() -> dict[str, Any]:
    environment = os.getenv("JUPR_ENV", "").strip().lower() or "local"
    return {
        "environment": environment,
        "staging_only": False,
        "production_authorized": production_tournament_writes_enabled(),
        "service_role_ready": bool(os.getenv("SUPABASE_SERVICE_ROLE_KEY", "").strip()),
        "surface_flags": {
            surface: {"name": flag, "enabled": tournament_admin_guarded_runtime_enabled(surface)}
            for surface, flag in SURFACE_MUTATION_FLAGS.items()
        },
    }

''',
          )

          ops = "jupr_app/services/admin_tournament_ops_service.py"
          replace_once(
              ops,
              "from jupr_app.services.admin_player_updates_service import is_auto_player_updates_enabled\n",
              "from jupr_app.services.admin_player_updates_service import is_auto_player_updates_enabled\n"
              "from jupr_app.services.production_tournament_guard import (\n"
              "    production_tournament_writes_enabled,\n"
              "    require_production_tournament_writes,\n"
              ")\n",
          )
          replace_regex(
              ops,
              r"def require_admin_tournament_official_publish_runtime\(\) -> None:.*?(?=\ndef build_admin_tournament_ops_runtime_status)",
              '''def require_admin_tournament_official_publish_runtime() -> None:
    """Apply the extra rating/email gates used only by official publishing."""

    environment = os.getenv("JUPR_ENV", "").strip().lower()
    if environment == "production":
        require_production_tournament_writes()
    elif environment != "staging":
        return
    if not _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH"):
        raise PermissionError(
            "Tournament official publishing is disabled. Enable JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH only with the approved tournament write gate."
        )
    if is_auto_player_updates_enabled():
        if not _truthy_env("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF"):
            raise PermissionError(
                "Automatic tournament player-update email handoff is disabled. Open its separate gate before official publish."
