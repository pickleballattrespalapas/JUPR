)
from jupr_app.services.public_tournament_commerce_service import (
    require_tournament_commerce_mutation_runtime,
    tournament_commerce_runtime_status,
)
from jupr_app.services.public_tournament_team_service import (
    require_public_team_tournament_mutation_runtime,
)


def _enable(monkeypatch: pytest.MonkeyPatch) -> None:
    values = {
        "JUPR_ENV": "production",
        "JUPR_PRODUCTION_WRITE_POLICY": "enabled",
        "JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION": "1",
        "SUPABASE_SERVICE_ROLE_KEY": "server-only-test-key",
        "JUPR_ENABLE_NEXT_ADMIN_TOURNAMENTS": "1",
        "JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION": "1",
        "JUPR_ENABLE_STAGING_PUBLIC_INTAKE_WRITES": "1",
        "JUPR_ENABLE_STAGING_TOURNAMENT_COMMERCE_WRITES": "1",
        "JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS": "1",
        "JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH": "1",
        "JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS": "0",
        "JUPR_EMAIL_MODE": "dry_run",
    }
    for key, value in values.items():
        monkeypatch.setenv(key, value)


def test_production_gate_fails_closed_without_top_level_flag(monkeypatch: pytest.MonkeyPatch) -> None:
    _enable(monkeypatch)
    monkeypatch.delenv("JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION")
    assert production_tournament_writes_enabled() is False
    with pytest.raises(PermissionError):
        require_tournament_admin_mutation_runtime("operations")


def test_reviewed_production_surfaces_require_both_keys(monkeypatch: pytest.MonkeyPatch) -> None:
    _enable(monkeypatch)
    assert production_tournament_writes_enabled() is True
    assert tournament_admin_guarded_runtime_enabled("operations") is True
    require_tournament_admin_mutation_runtime("operations")
    require_admin_tournament_official_publish_runtime()
    require_admin_team_tournament_runtime()
    require_public_team_tournament_mutation_runtime()
    require_tournament_commerce_mutation_runtime(actor_type="PUBLIC_REGISTRANT")
    assert build_admin_tournament_ops_runtime_status()["production_authorized"] is True
    status = tournament_commerce_runtime_status()
    assert status["production_authorized"] is True
    assert status["public_registration_write_ready"] is True
    assert status["offline_payment_only"] is True


def test_per_surface_flag_still_fails_closed(monkeypatch: pytest.MonkeyPatch) -> None:
    _enable(monkeypatch)
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS", "0")
    assert tournament_admin_guarded_runtime_enabled("operations") is False
    with pytest.raises(PermissionError):
        require_tournament_admin_mutation_runtime("operations")


def test_live_email_remains_disabled(monkeypatch: pytest.MonkeyPatch) -> None:
    _enable(monkeypatch)
    monkeypatch.setenv("JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS", "1")
    monkeypatch.setenv("JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF", "1")
    monkeypatch.setenv("JUPR_EMAIL_MODE", "live")
    with pytest.raises(PermissionError):
        require_admin_tournament_official_publish_runtime()
''',
