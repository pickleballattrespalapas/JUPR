name: Send Joe's requested Testing email retry once

on:
  push:
    branches: [ops/testing-acceptance-user-retry-20260912]
    paths:
      - .github/workflows/testing-acceptance-email-20260912.yml
      - scripts/testing_acceptance_email_20260912.py

permissions:
  contents: read

concurrency:
  group: testing-acceptance-email-user-retry-20260912
  cancel-in-progress: false

jobs:
  send-accepted-registration-link:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact approved operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pickleballattrespalapas/JUPR
          test "$GITHUB_REF" = refs/heads/ops/testing-acceptance-user-retry-20260912
          test "$(git rev-parse HEAD^)" = bbf5548d7c36f020436b16c458acebe932186696
          python -m py_compile scripts/testing_acceptance_email_20260912.py
      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.49"
      - name: Verify Testing's accepted request and registration link
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          source_b64="$(python -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("scripts/testing_acceptance_email_20260912.py").read_bytes()).decode())')"
          remote="python -c 'import base64;exec(compile(base64.b64decode(\"$source_b64\"),\"testing_acceptance_email_20260912.py\",\"exec\"))'"
          flyctl ssh console --quiet --app juprleagues-api --command "$remote"
      - name: Send the one authorized replacement acceptance email
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          source_b64="$(python -c 'import base64; from pathlib import Path; print(base64.b64encode(Path("scripts/testing_acceptance_email_20260912.py").read_bytes()).decode())')"
          remote="python -c 'import base64,sys;sys.argv=[\"testing_acceptance_email_20260912.py\",\"--send\"];exec(compile(base64.b64decode(\"$source_b64\"),\"testing_acceptance_email_20260912.py\",\"exec\"))'"
          flyctl ssh console --quiet --app juprleagues-api --command "$remote"
