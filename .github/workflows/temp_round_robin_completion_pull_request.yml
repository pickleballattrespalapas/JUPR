name: Temporary Round-Robin completion verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/round-robin-scoring-modes-verify-20260802
          fetch-depth: 0

      - name: Apply readable Round-Robin source edits
        run: python .github/scripts/apply_round_robin_completion.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run focused Round-Robin checks
        run: |
          python -m pytest -q \
            tests/test_round_robin_unscored_flow.py \
            tests/test_admin_play_generator_service.py \
            tests/test_public_play_generator_service.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run component checks and full Next.js build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
          JUPR_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
        run: |
          npm install --no-audit --no-fund
          npm run test:component
          npm run build

      - name: Publish verified code and remove temporary helpers
        run: |
          git rm \
            .github/scripts/apply_round_robin_completion.py \
            .github/workflows/temp_round_robin_completion_patch.yml \
            .github/workflows/temp_round_robin_completion_pull_request.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jupr_app/domain/adaptive_play_engine.py \
            jupr_app/services/admin_play_generator_service.py \
            jupr_app/services/public_play_generator_service.py \
            apps/web/app/admin/play-generators/GeneratorRoundRunner.tsx \
            apps/web/app/admin/play-generators/GeneratorStandings.tsx \
            apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorRoundRunner.tsx \
            apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorStandings.tsx \
            tests/test_round_robin_unscored_flow.py \
            docs/round_robin_scoring_modes.md \
            docs/round_robin_manual_acceptance_checklist.md
          git commit -m "Harden Round-Robin scoring-mode progression"
          git push origin HEAD:agent/round-robin-scoring-modes-verify-20260802
