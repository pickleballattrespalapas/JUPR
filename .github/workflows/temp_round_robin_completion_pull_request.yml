name: Temporary Round-Robin completion verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/round-robin-scoring-modes-verify-20260802
          fetch-depth: 0

      - name: Apply the reviewed patch payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/temp_round_robin_completion_patch.yml').read_text()
          match = re.search(r'payload = """(.*?)"""', workflow, re.S)
          if not match:
              raise SystemExit('Round-Robin patch payload was not found.')
          payload = ''.join(line.strip() for line in match.group(1).splitlines())
          script = zlib.decompress(base64.b64decode(payload)).decode()
          exec(compile(script, 'round_robin_patch.py', 'exec'))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run focused Round-Robin checks
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_round_robin_unscored_flow.py \
            tests/test_admin_play_generator_service.py \
            tests/test_public_play_generator_service.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run component checks and full Next.js build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
          JUPR_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run test:component
          npm run build

      - name: Publish the verified branch and remove temporary workflows
        shell: bash
        run: |
          git rm \
            .github/workflows/temp_round_robin_completion_patch.yml \
            .github/workflows/temp_round_robin_completion_pull_request.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jupr_app/domain/adaptive_play_engine.py \
            jupr_app/services/admin_play_generator_service.py \
            jupr_app/services/public_play_generator_service.py \
            apps/web/app/admin/play-generators/GeneratorRoundRunner.tsx \
            apps/web/app/admin/play-generators/GeneratorStandings.tsx \
            apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorRoundRunner.tsx \
            apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorStandings.tsx \
            tests/test_round_robin_unscored_flow.py \
            tests/test_admin_play_generator_service.py \
            tests/test_public_play_generator_service.py \
            docs/round_robin_scoring_modes.md
          git commit -m "Harden Round-Robin scoring-mode progression"
          git push origin HEAD:agent/round-robin-scoring-modes-verify-20260802
