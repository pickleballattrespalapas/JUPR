name: Temporary Singles Context Metadata Fix

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-singles-context-metadata-fix
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/match-uploader-singles-context-feedback' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-singles-context-feedback
          fetch-depth: 0

      - name: Apply reviewed metadata fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('jupr_app/domain/singles_match_processing.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from jupr_app.domain.match_processing import (
              build_active_league_metadata_expectations,
          )
          '''
          if old_import not in text:
              raise SystemExit('expected league metadata import was not found')
          text = text.replace(old_import, '', 1)

          old_block = '''        league_metadata_expectations = (
              build_active_league_metadata_expectations(
                  df_meta,
                  club_id=str(club_id),
                  league_names={
                      str(row.get("league") or "")
                      for row in db_matches
                  },
                  default_k_factor=int(default_k_factor),
              )
          )
          '''
          new_block = '''        # League and social labels organize singles match history only.
              # Singles never mutate a league-rating island, so the atomic write
              # must not require doubles-league metadata for those labels.
              league_metadata_expectations: list[dict[str, Any]] = []
          '''
          if old_block not in text:
              raise SystemExit('expected league metadata expectation block was not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run singles API contracts
        run: python -m pytest -q tests/test_api_contract_admin_match_uploader_singles.py

      - name: Validate Python syntax
        run: python -m py_compile jupr_app/domain/singles_match_processing.py

      - name: Publish clean application commit
        run: |
          set -euo pipefail
          rm -f .github/tmp/singles-context-metadata-fix.patch
          rmdir .github/tmp 2>/dev/null || true
          rm -f .github/workflows/tmp-singles-context-metadata-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep singles context separate from league rating metadata'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort | tr '\n' ' ')"
          expected='apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/tests/match-uploader-layout.cjs jupr_app/domain/singles_match_processing.py jupr_app/services/admin_singles_match_service.py services/api/admin_match_uploader_routes.py tests/test_api_contract_admin_match_uploader_singles.py '
          test "$actual" = "$expected"
          git push origin HEAD:agent/match-uploader-singles-context-feedback
