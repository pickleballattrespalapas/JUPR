name: Migration Source Guard

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check migration source policy
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/Test; then
            python scripts/check_migration_sources.py --base-ref origin/Test
          else
            python scripts/check_migration_sources.py --base-ref Test
          fi

      - name: Check supabase migration version prefixes
        run: python scripts/check_supabase_migration_versions.py

      - name: Check Next parity matrix
        run: python scripts/check_next_parity_matrix.py

      - name: Check parity closure program
        run: python scripts/check_parity_closure_program.py
