name: Migration Source Guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check migration source policy
        run: |
          set -euo pipefail
          base_branch="${GITHUB_BASE_REF:-staging}"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$base_branch"; then
            echo "::error title=Missing migration guard base::origin/$base_branch was not fetched."
            exit 2
          fi
          python scripts/check_migration_sources.py --base-ref "origin/$base_branch"

      - name: Check supabase migration version prefixes
        run: python scripts/check_supabase_migration_versions.py

      - name: Check Next parity matrix
        run: python scripts/check_next_parity_matrix.py

      - name: Check parity closure program
        run: python scripts/check_parity_closure_program.py

  generator-journal-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/sql/package-lock.json
      - name: Install PostgreSQL test runtime
        working-directory: tests/sql
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify generator journal constraint and protections
        working-directory: tests/sql
        run: npm run test:generator-journal
      - name: Verify hub atomic saves and participant identity leases
        working-directory: tests/sql
        run: npm run test:round-robin-hub
      - name: Verify weekly highlights saves and permissions
        working-directory: tests/sql
        run: npm run test:weekly-highlights
