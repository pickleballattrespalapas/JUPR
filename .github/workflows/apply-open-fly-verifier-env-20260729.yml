name: Apply open Fly verifier environment

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/fix-open-fly-verifier-env-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-open-fly-verifier-env-20260729
          fetch-depth: 0

      - name: Defer missing local read flags to required live API checks
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/check_staging_environment.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''def _check_full_next_flags(summary: dict[str, Any], *, expect_full_next_admin: bool) -> None:
          ''',
                  '''def _check_full_next_flags(
              summary: dict[str, Any],
              *,
              expect_full_next_admin: bool,
              defer_to_api: bool = False,
          ) -> None:
          ''',
              ),
              (
                  '''    if missing and expect_full_next_admin:
              summary["errors"].append("Full Next admin staging requested, but these flags are disabled: " + ", ".join(missing))
              elif missing:
              summary["warnings"].append("Some Next admin workflow flags are disabled: " + ", ".join(missing))
          ''',
                  '''    if missing and expect_full_next_admin and not defer_to_api:
              summary["errors"].append(
                  "Full Next admin staging requested, but these flags are disabled: "
                  + ", ".join(missing)
              )
              elif missing and expect_full_next_admin:
              summary["warnings"].append(
                  "Verifier process does not project every Next admin read flag; "
                  "required live API status checks are authoritative: "
                  + ", ".join(missing)
              )
              elif missing:
              summary["warnings"].append(
                  "Some Next admin workflow flags are disabled: " + ", ".join(missing)
              )
          ''',
              ),
              (
                  '''        if flag_name in expected_gates:
                  return expected_gates[flag_name]
              return _truthy(os.getenv(flag_name))
          ''',
                  '''        if flag_name in expected_gates:
                  return expected_gates[flag_name]
              if expect_full_next_admin and flag_name in FULL_NEXT_ADMIN_FLAGS:
                  return True
              return _truthy(os.getenv(flag_name))
          ''',
              ),
              (
                  '''    _check_full_next_flags(summary, expect_full_next_admin=bool(args.expect_full_next_admin))
          ''',
                  '''    _check_full_next_flags(
              summary,
              expect_full_next_admin=bool(args.expect_full_next_admin),
              defer_to_api=bool(api_base and args.require_api),
          )
          ''',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Unexpected replacement count {count} for: {old[:100]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_check_staging_environment.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    for name in cse.FULL_NEXT_ADMIN_FLAGS:
              monkeypatch.setenv(name, "1")
              for name, enabled in expected_gates.items():
          '''
          replacement = '''    for name in cse.FULL_NEXT_ADMIN_FLAGS:
              monkeypatch.setenv(name, "1")
              monkeypatch.delenv("JUPR_ENABLE_NEXT_ADMIN_PLAYER_UPDATES", raising=False)
              for name, enabled in expected_gates.items():
          '''
          if tests.count(marker) != 1:
              raise SystemExit(f"Unexpected full API flag setup count: {tests.count(marker)}")
          tests = tests.replace(marker, replacement, 1)
          new_test_name = "test_full_next_flag_check_can_defer_to_required_live_api"
          if new_test_name not in tests:
              tests += '''

          def test_full_next_flag_check_can_defer_to_required_live_api(monkeypatch):
              for name in cse.FULL_NEXT_ADMIN_FLAGS:
                  monkeypatch.delenv(name, raising=False)
              summary = {"errors": [], "warnings": []}

              cse._check_full_next_flags(
                  summary,
                  expect_full_next_admin=True,
                  defer_to_api=True,
              )

              assert summary["errors"] == []
              assert len(summary["warnings"]) == 1
              assert "live API status checks are authoritative" in summary["warnings"][0]
          '''
          test_path.write_text(tests, encoding="utf-8")

      - name: Run focused verification
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest
          python -m py_compile scripts/check_staging_environment.py tests/test_check_staging_environment.py
          python -m pytest -q \
            tests/test_check_staging_environment.py \
            tests/test_staging_deployment_config.py \
            tests/test_permanent_staging_write_mode.py
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/check_staging_environment.py tests/test_check_staging_environment.py
          git commit -m 'Trust required live API status for staging read surfaces'
          git push origin HEAD:agent/fix-open-fly-verifier-env-20260729
