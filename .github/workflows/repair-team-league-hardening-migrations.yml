name: One-time team-league migration repair

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/repair-team-league-hardening-migrations.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pickleballattrespalapas/JUPR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-team-league-hardening-migrations
          fetch-depth: 0

      - name: Repair PostgreSQL special-form qualification
        shell: python
        run: |
          from hashlib import sha256
          import json
          from pathlib import Path
          import subprocess

          files = [
              (
                  Path("supabase/migrations/20260728040000_team_league_awards_hardening.sql"),
                  "411cf46c017e69c7f1220abfc7125e4edac5cc6c",
                  {
                      "pg_catalog.coalesce(": ("coalesce(", 1),
                      "pg_catalog.least(": ("least(", 2),
                      "pg_catalog.greatest(": ("greatest(", 2),
                  },
              ),
              (
                  Path("supabase/migrations/20260728041000_team_league_registration_identity_recovery.sql"),
                  "1aa695149360a6092d3e76471ba0c2bfbece874b",
                  {
                      "pg_catalog.least(": ("least(", 1),
                      "pg_catalog.greatest(": ("greatest(", 1),
                  },
              ),
          ]

          for path, expected_blob, replacements in files:
              actual_blob = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(
                      f"Refusing to repair unexpected migration blob {path}: {actual_blob}."
                  )
              text = path.read_text(encoding="utf-8")
              for old, (new, expected_count) in replacements.items():
                  actual_count = text.count(old)
                  if actual_count != expected_count:
                      raise SystemExit(
                          f"{path}: expected {expected_count} occurrences of {old!r}, "
                          f"found {actual_count}."
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          test = Path(
              "tests/test_team_league_hardening_migration_postgres_compatibility.py"
          )
          test.write_text(
              "from pathlib import Path\n\n\n"
              "def test_team_league_hardening_avoids_qualified_special_forms() -> None:\n"
              "    paths = [\n"
              "        Path('supabase/migrations/20260728040000_team_league_awards_hardening.sql'),\n"
              "        Path('supabase/migrations/20260728041000_team_league_registration_identity_recovery.sql'),\n"
              "    ]\n"
              "    sql = '\\n'.join(path.read_text(encoding='utf-8') for path in paths)\n"
              "    assert 'pg_catalog.coalesce(' not in sql\n"
              "    assert 'pg_catalog.least(' not in sql\n"
              "    assert 'pg_catalog.greatest(' not in sql\n",
              encoding="utf-8",
          )

          migrations = Path("supabase/migrations")
          records = [
              f"{path.name}\t{sha256(path.read_bytes()).hexdigest()}"
              for path in sorted(migrations.glob("*.sql"))
          ]
          fingerprint = sha256("\n".join(records).encode("utf-8")).hexdigest()
          contract_path = Path("config/production_migration_contract.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          contract["repository_migration_content_sha256"] = fingerprint
          contract_path.write_text(
              json.dumps(contract, indent=2) + "\n", encoding="utf-8"
          )

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -c "from pathlib import Path; sql='\n'.join(p.read_text(encoding='utf-8') for p in [Path('supabase/migrations/20260728040000_team_league_awards_hardening.sql'),Path('supabase/migrations/20260728041000_team_league_registration_identity_recovery.sql')]); assert 'pg_catalog.coalesce(' not in sql; assert 'pg_catalog.least(' not in sql; assert 'pg_catalog.greatest(' not in sql"
          python -c "import hashlib,json,pathlib; paths=sorted(pathlib.Path('supabase/migrations').glob('*.sql')); expected=hashlib.sha256('\n'.join(f'{p.name}\t{hashlib.sha256(p.read_bytes()).hexdigest()}' for p in paths).encode()).hexdigest(); actual=json.loads(pathlib.Path('config/production_migration_contract.json').read_text())['repository_migration_content_sha256']; assert actual == expected"

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-team-league-hardening-migrations.yml
          git config user.name "pickleballattrespalapas"
          git config user.email "pickleballattrespalapas@gmail.com"
          git add supabase/migrations/20260728040000_team_league_awards_hardening.sql \
            supabase/migrations/20260728041000_team_league_registration_identity_recovery.sql \
            tests/test_team_league_hardening_migration_postgres_compatibility.py \
            config/production_migration_contract.json \
            .github/workflows/repair-team-league-hardening-migrations.yml
          git commit -m "Fix team-league migration PostgreSQL compatibility"
          git push origin HEAD:agent/fix-team-league-hardening-migrations
