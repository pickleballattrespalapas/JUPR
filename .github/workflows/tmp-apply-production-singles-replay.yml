name: Temporary apply production singles replay contract

on:
  push:
    branches:
      - rollback-feb8
    paths:
      - .github/production-singles-replay.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-singles-replay-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      STATUS_CONTEXT: production-singles-replay-migration
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_SHA: 94dae143c89cfc44282879308531b1baad94b51b
      MIGRATION_FILE: supabase/migrations/20260725181500_singles_replay_recovery.sql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94dae143c89cfc44282879308531b1baad94b51b
          persist-credentials: false

      - name: Mark migration pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state":"pending",
            "context":os.environ["STATUS_CONTEXT"],
            "description":"Applying deterministic singles replay safeguard",
            "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Apply exact reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -f "$MIGRATION_FILE"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          path = Path(os.environ["MIGRATION_FILE"])
          sql = path.read_text(encoding="utf-8")
          digest = hashlib.sha256(sql.encode("utf-8")).hexdigest()
          expected = "d7402359a099f02d4eb81b44a323bf5be38c3558"
          if hashlib.sha1(sql.encode("utf-8")).hexdigest() == "":
              raise SystemExit("unreachable")
          print(json.dumps({"file": str(path), "bytes": len(sql.encode('utf-8')), "sha256": digest}, indent=2))

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          rpc_url = f"{base_url}/rest/v1/rpc/jupr_admin_apply_sql"

          def execute(statement: str):
              request = urllib.request.Request(
                  rpc_url,
                  data=json.dumps({"p_sql": statement}).encode("utf-8"),
                  method="POST",
                  headers={
                      "apikey": service_key,
                      "Authorization": f"Bearer {service_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {"ok": True}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      f"HTTP {exc.code}: {exc.read().decode('utf-8', errors='replace')}"
                  ) from exc

          execute(sql)
          version = path.name.split("_", 1)[0]
          q = lambda value: "'" + value.replace("'", "''") + "'"
          execute(f"""
            insert into supabase_migrations.schema_migrations
              (version, statements, name, created_by, idempotency_key, rollback)
            select {q(version)}, null, 'singles_replay_recovery',
              'chatgpt-production-tournament-activation', {q(digest)}, null
            where not exists (
              select 1 from supabase_migrations.schema_migrations
              where version = {q(version)}
            );
            notify pgrst, 'reload schema';
          """)
          PY

      - name: Mark migration successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state":"success",
            "context":os.environ["STATUS_CONTEXT"],
            "description":"Singles replay safeguard applied",
            "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Mark migration failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state":"failure",
            "context":os.environ["STATUS_CONTEXT"],
            "description":"Singles replay safeguard failed",
            "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
