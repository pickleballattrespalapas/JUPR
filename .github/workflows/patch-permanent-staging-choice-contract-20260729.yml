name: Patch permanent staging choice contract

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/permanent-staging-writes-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/permanent-staging-writes-20260729
          fetch-depth: 0

      - name: Update open-wave choice ordering contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_staging_deployment_config.py")
          text = path.read_text(encoding="utf-8")
          old = "    assert choices == tuple(STAGING_WRITE_WAVES)"
          new = '''    assert choices[0] == "open"
              assert set(choices) == set(STAGING_WRITE_WAVES)
              assert len(choices) == len(STAGING_WRITE_WAVES)'''
          if text.count(old) == 0:
              print("Choice contract already updated.")
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          else:
              raise SystemExit("Unexpected choice assertion count")

      - name: Commit contract update
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_staging_deployment_config.py
          if git diff --quiet -- tests/test_staging_deployment_config.py; then
            exit 0
          fi
          git diff --check
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add tests/test_staging_deployment_config.py
          git commit -m 'Allow open-first staging wave choices'
          git push origin HEAD:agent/permanent-staging-writes-20260729
