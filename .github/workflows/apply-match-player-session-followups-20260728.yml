name: Apply match-player session follow-ups

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/match-player-session-followups-20260728' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-player-session-followups-20260728
          fetch-depth: 0

      - name: Apply reviewed follow-ups
        run: python scripts/apply_match_player_session_followups_20260728.py

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pip install pytest
          python -m pytest -q \
            tests/test_match_player_session_followups.py \
            tests/test_manual_acceptance_ux_regressions.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Commit verified implementation and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_match_player_session_followups_20260728.py
          rm .github/workflows/apply-match-player-session-followups-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            apps/web/components/ConfirmAction.tsx \
            apps/web/app/admin/match-uploader/MatchUploaderForm.tsx \
            apps/web/app/admin/match-log/MatchLogApplyPanel.tsx \
            apps/web/app/admin/match-log/MatchLogQuickReplayPanel.tsx \
            docs/manual_acceptance_match_player_followups_20260728.md \
            tests/test_match_player_session_followups.py \
            scripts/apply_match_player_session_followups_20260728.py \
            .github/workflows/apply-match-player-session-followups-20260728.yml
          git commit -m 'Implement match-player acceptance follow-ups'
          git push origin HEAD:agent/match-player-session-followups-20260728

# Manual retrigger after validating the repaired transform script.
