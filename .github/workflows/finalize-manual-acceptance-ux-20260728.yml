name: Finalize manual acceptance UX

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/manual-acceptance-ux-fixes-v2-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-acceptance-ux-fixes-v2-20260728
          fetch-depth: 0

      - name: Apply final reviewed refinements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('apps/web/app/admin/match-uploader/MatchUploaderForm.tsx')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '''  const hasInvalidFilledRows = filledRows.length !== readyRows.length;
            const scoredRrRows =''',
              '''  const hasInvalidFilledRows = filledRows.length !== readyRows.length;
            const rowHasEnteredData = (row: MatchRow) =>
              isFilled(row)
              || row.date !== defaultDate
              || row.weekTag !== defaultWeekTag
              || row.ratingScope !== "";
            const scoredRrRows =''',
              'entered-row predicate',
          )

          text = replace_once(
              text,
              '''      setResult(payload);
                setSubmissionKind("singles");''',
              '''      if (!payload.ok || payload.match_write_committed === false) {
                setMessage(payload.warnings?.[0] || "The singles match submission could not be confirmed. Review Match Log before retrying.");
                return;
              }
              setResult(payload);
              setSubmissionKind("singles");''',
              'singles response guard',
          )

          text = replace_once(
              text,
              '''      setResult(payload);
                setSubmissionKind(kind);''',
              '''      if (!payload.ok || payload.match_write_committed === false) {
                setMessage(payload.warnings?.[0] || "The match submission could not be confirmed. Review Match Log before retrying.");
                return;
              }
              setResult(payload);
              setSubmissionKind(kind);''',
              'batch response guard',
          )

          text = replace_once(
              text,
              '''<select value={context} onChange={(event) => setContext(event.target.value as "league" | "popup")} style={inputStyle}>''',
              '''<select value={context} onChange={(event) => { clearEntryFeedback(); setContext(event.target.value as "league" | "popup"); }} style={inputStyle}>''',
              'context feedback reset',
          )
          text = replace_once(
              text,
              '''<select value={defaultLeague} onChange={(event) => setDefaultLeague(event.target.value)} disabled={context === "popup"} style={inputStyle}>''',
              '''<select value={defaultLeague} onChange={(event) => { clearEntryFeedback(); setDefaultLeague(event.target.value); }} disabled={context === "popup"} style={inputStyle}>''',
              'league feedback reset',
          )
          text = replace_once(
              text,
              '''<input value={popupEventName} onChange={(event) => setPopupEventName(event.target.value)} style={inputStyle} />''',
              '''<input value={popupEventName} onChange={(event) => { clearEntryFeedback(); setPopupEventName(event.target.value); }} style={inputStyle} />''',
              'event feedback reset',
          )

          if text.count('rows.some(isFilled)') != 1:
              raise SystemExit(f'Expected one Remove All predicate, found {text.count("rows.some(isFilled)")}')
          text = text.replace('rows.some(isFilled)', 'rows.some(rowHasEnteredData)', 1)

          if text.count('background: isFilled(row) ?') != 1:
              raise SystemExit(f'Expected one row background predicate, found {text.count("background: isFilled(row) ?")}')
          text = text.replace('background: isFilled(row) ?', 'background: rowHasEnteredData(row) ?', 1)

          if text.count('{isFilled(row) ? (') != 1:
              raise SystemExit(f'Expected one row removal predicate, found {text.count("{isFilled(row) ? (")}')
          text = text.replace('{isFilled(row) ? (', '{rowHasEnteredData(row) ? (', 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_manual_acceptance_ux_regressions.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    assert "matchingPlayers.length === 0" in source\n'
          addition = '''    assert "matchingPlayers.length === 0" in source
              assert "rowHasEnteredData" in source
              assert "payload.match_write_committed === false" in source
              assert "Review Match Log before retrying" in source
          '''
          if tests.count(anchor) != 1:
              raise SystemExit('Unexpected uploader test anchor')
          test_path.write_text(tests.replace(anchor, addition, 1), encoding='utf-8')

      - name: Verify refined source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pip install pytest
          python -m pytest -q tests/test_manual_acceptance_ux_regressions.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Commit refinements and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-manual-acceptance-ux-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            apps/web/app/admin/match-uploader/MatchUploaderForm.tsx \
            tests/test_manual_acceptance_ux_regressions.py \
            .github/workflows/finalize-manual-acceptance-ux-20260728.yml
          git commit -m 'Harden Match Uploader acceptance UX'
          git push origin HEAD:agent/manual-acceptance-ux-fixes-v2-20260728
