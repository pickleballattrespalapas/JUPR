name: Apply open staging verifier fix

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/fix-open-staging-verifier-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-open-staging-verifier-20260729
          fetch-depth: 0

      - name: Add permanent-open verifier support
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/check_staging_environment.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              (
                  '''    NO_WRITE_WAVE,
              REGISTRATION_SECRET_WAVES,
              STAGING_WRITE_WAVES,
          ''',
                  '''    NO_WRITE_WAVE,
              OPEN_WRITE_WAVE,
              PUBLIC_LIVE_SECRET_WAVES,
              REGISTRATION_SECRET_WAVES,
              STAGING_WRITE_WAVES,
          ''',
              ),
              (
                  '    if requested_wave is not None and requested_wave not in STAGING_WRITE_WAVES:',
                  '    if (\n        requested_wave is not None\n        and requested_wave != OPEN_WRITE_WAVE\n        and requested_wave not in STAGING_WRITE_WAVES\n    ):',
              ),
              (
                  '    if requested_wave == "public-live":',
                  '    if requested_wave in PUBLIC_LIVE_SECRET_WAVES:',
              ),
              (
                  '        "known": actual_wave in STAGING_WRITE_WAVES,',
                  '        "known": actual_wave == OPEN_WRITE_WAVE or actual_wave in STAGING_WRITE_WAVES,',
              ),
              (
                  '        if expected_write_wave in STAGING_WRITE_WAVES',
                  '        if expected_write_wave == OPEN_WRITE_WAVE or expected_write_wave in STAGING_WRITE_WAVES',
              ),
              (
                  '            and expected_write_wave == "public-live"',
                  '            and expected_write_wave in PUBLIC_LIVE_SECRET_WAVES',
              ),
              (
                  '    parser.add_argument("--write-wave", choices=tuple(STAGING_WRITE_WAVES))',
                  '    parser.add_argument(\n        "--write-wave",\n        choices=(OPEN_WRITE_WAVE, *tuple(STAGING_WRITE_WAVES)),\n    )',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Unexpected replacement count {count} for: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_check_staging_environment.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_open_write_wave_is_a_supported_full_staging_posture"
          if marker not in tests:
              tests += '''

          def test_open_write_wave_is_a_supported_full_staging_posture(monkeypatch):
              args = cse.build_parser().parse_args(["--write-wave", "open"])
              assert args.write_wave == "open"

              monkeypatch.setenv("JUPR_ENV", "staging")
              monkeypatch.setenv("JUPR_STAGING_WRITE_WAVE", "open")
              monkeypatch.setenv("JUPR_EMAIL_MODE", "dry_run")
              monkeypatch.setenv("JUPR_REGISTRATION_EDIT_SECRET", "edit-" + "a" * 40)
              monkeypatch.setenv("JUPR_REGISTRATION_CONFIRMATION_SECRET", "confirm-" + "b" * 40)
              monkeypatch.setenv("JUPR_PUBLIC_LIVE_TOKEN_SECRET", "token-" + "c" * 40)
              monkeypatch.setenv("JUPR_PUBLIC_LIVE_RATE_LIMIT_SECRET", "rate-" + "d" * 40)
              for name in cse.FULL_NEXT_ADMIN_FLAGS:
                  monkeypatch.setenv(name, "1")
              for name, enabled in cse.expected_write_flags("open").items():
                  monkeypatch.setenv(name, "1" if enabled else "0")
              for name in cse.ALWAYS_DISABLED_FLAGS:
                  monkeypatch.setenv(name, "0")

              rc, summary = cse.run_checks(
                  _args(expect_full_next_admin=True, write_wave="open")
              )

              assert rc == 0, summary
              assert summary["ok"] is True
              assert summary["staging_write_wave"]["known"] is True
              assert summary["staging_write_wave"]["expected"] == "open"
              assert summary["staging_write_wave"]["actual"] == "open"
              assert summary["staging_write_wave"]["public_live_token_secret_configured"] is True
              assert summary["staging_write_wave"]["public_live_rate_limit_secret_configured"] is True
          '''
              test_path.write_text(tests, encoding="utf-8")

      - name: Run focused verification
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest
          python -m py_compile scripts/check_staging_environment.py tests/test_check_staging_environment.py
          python -m pytest -q \
            tests/test_check_staging_environment.py \
            tests/test_staging_deployment_config.py \
            tests/test_permanent_staging_write_mode.py
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/check_staging_environment.py tests/test_check_staging_environment.py
          git commit -m 'Support permanent open mode in staging verifier'
          git push origin HEAD:agent/fix-open-staging-verifier-20260729
