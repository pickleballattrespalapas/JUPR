name: Fix follow-up final-occurrence replacement

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/match-player-session-followups-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-player-session-followups-20260728
          fetch-depth: 0

      - name: Add final-occurrence replacement exception
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply_match_player_session_followups_20260728.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "avoid duplicate manual feedback" and count >= 1:
                  prefix, separator, suffix = text.rpartition(old)
                  if not separator:
                      raise RuntimeError(f"{label}: final occurrence was not found")
                  return prefix + new + suffix
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit('Unexpected replace_once implementation')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')

      - name: Commit repair and remove failed helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-followup-global-feedback-transform-20260728.yml
          rm -f .github/workflows/fix-followup-global-feedback-transform-v2-20260728.yml
          rm .github/workflows/fix-followup-replace-once-last-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            scripts/apply_match_player_session_followups_20260728.py \
            .github/workflows/fix-followup-global-feedback-transform-20260728.yml \
            .github/workflows/fix-followup-global-feedback-transform-v2-20260728.yml \
            .github/workflows/fix-followup-replace-once-last-20260728.yml
          git commit -m 'Handle final follow-up feedback replacement'
          git push origin HEAD:agent/match-player-session-followups-20260728
