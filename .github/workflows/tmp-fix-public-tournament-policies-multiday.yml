name: Temporary public Tournament Setup projection fixer

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.head_ref == 'agent/fix-public-tournament-policies-multiday' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-tournament-policies-multiday
          fetch-depth: 0

      - name: Apply public projection patch
        run: python scripts/tmp_fix_public_tournament_policies_multiday.py

      - name: Check patch formatting
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run focused public Tournament tests
        run: |
          python -m pytest -q \
            tests/test_public_tournament_registration_service.py \
            tests/test_public_tournament_roster_service.py \
            tests/test_api_contract_tournament_setup_flow_policies_multiday.py \
            tests/test_production_deployment_hardening.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean public projection patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-public-tournament-policies-multiday.yml
          rm scripts/tmp_fix_public_tournament_policies_multiday.py
          git checkout -- apps/web/next-env.d.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose Tournament Setup policies and multi-day schedules publicly"
          git push origin HEAD:agent/fix-public-tournament-policies-multiday
