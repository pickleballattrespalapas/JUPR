name: Watch production tournament cutover

on:
  push:
    branches: [rollback-feb8]
    paths: [.github/watch-production-tournament-cutover.trigger]

permissions:
  actions: read
  contents: write

concurrency:
  group: watch-production-tournament-cutover
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Wait for builder and deploy workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api=os.environ['GITHUB_API_URL']
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          builder_name='Build final production tournament activation v2'
          deploy_name='Deploy operational production tournaments v2'

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.loads(response.read().decode())

          def recent_runs():
              return get(f'{api}/repos/{repo}/actions/runs?per_page=100').get('workflow_runs',[])

          def wait_for_run(name, created_after=None, timeout=5400):
              deadline=time.time()+timeout
              selected=None
              while time.time()<deadline:
                  rows=[]
                  for row in recent_runs():
                      if row.get('name')!=name:
                          continue
                      if created_after and str(row.get('created_at','')) < created_after:
                          continue
                      rows.append(row)
                  if rows:
                      selected=max(rows,key=lambda row:row.get('created_at',''))
                      if selected.get('status')=='completed':
                          return selected
                  time.sleep(10)
              raise TimeoutError(f'Timed out waiting for {name}; last={selected}')

          def describe(run):
              jobs=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100').get('jobs',[])
              return {
                  'id':run.get('id'),
                  'name':run.get('name'),
                  'status':run.get('status'),
                  'conclusion':run.get('conclusion'),
                  'head_sha':run.get('head_sha'),
                  'created_at':run.get('created_at'),
                  'updated_at':run.get('updated_at'),
                  'url':run.get('html_url'),
                  'jobs':[
                      {
                          'name':job.get('name'),
                          'conclusion':job.get('conclusion'),
                          'failed_steps':[step.get('name') for step in job.get('steps',[]) if step.get('conclusion')=='failure'],
                          'steps':[{key:step.get(key) for key in ('number','name','status','conclusion')} for step in job.get('steps',[])],
                      }
                      for job in jobs
                  ],
              }

          builder=wait_for_run(builder_name)
          report={
              'status':'failed',
              'scope':'production-tournaments',
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'builder':describe(builder),
              'deploy':None,
          }
          if builder.get('conclusion')=='success':
              deploy=wait_for_run(deploy_name,created_after=builder.get('created_at'))
              report['deploy']=describe(deploy)
              report['status']='operational' if deploy.get('conclusion')=='success' else 'failed'
          Path('/tmp/production-tournament-pipeline-status.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY

      - uses: actions/checkout@v4
        with:
          ref: rollback-feb8
          fetch-depth: 0

      - name: Publish pipeline status without replacing application source
        run: |
          set -euo pipefail
          git fetch origin rollback-feb8
          git checkout -B rollback-feb8 origin/rollback-feb8
          mkdir -p apps/web/public
          cp /tmp/production-tournament-pipeline-status.json apps/web/public/production-tournament-pipeline-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/production-tournament-pipeline-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish production tournament cutover status"
          git push origin HEAD:rollback-feb8

      - name: Wait for public status marker
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error https://pickleballclubsandwich.com/production-tournament-pipeline-status.json > "$RUNNER_TEMP/status.json"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - uses: actions/upload-artifact@v4
        with:
          name: production-tournament-cutover-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/status.json
          retention-days: 90
