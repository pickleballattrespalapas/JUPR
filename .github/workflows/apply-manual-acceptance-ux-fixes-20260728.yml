name: Apply manual acceptance UX fixes

on:
  push:
    branches:
      - agent/manual-acceptance-ux-fixes-20260728
    paths:
      - .github/workflows/apply-manual-acceptance-ux-fixes-20260728.yml

permissions:
  contents: write

