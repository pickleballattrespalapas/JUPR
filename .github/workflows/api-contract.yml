name: API Contract Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  finish-guided-setup:
    if: github.head_ref == 'agent/guided-tournament-setup-wizard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/guided-tournament-setup-wizard
          fetch-depth: 0

      - name: Complete guided setup routing and contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def require_once(text: str, needle: str, path: str) -> None:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {needle[:100]!r}")

          # Resolve the new event editor directly against the existing setup modules.
          event_card_path = Path("apps/web/app/admin/tournaments/setup/TournamentSetupEventCard.tsx")
          event_card = event_card_path.read_text()
          event_card = event_card.replace(
              'from "../../../../tournament-setup/tournamentSetupBuilder";',
              'from "../../tournament-setup/tournamentSetupBuilder";',
          ).replace(
              'from "../../../../tournament-setup/TournamentSetupBuilder.module.css";',
              'from "../../tournament-setup/TournamentSetupBuilder.module.css";',
          )
          if '../../../../tournament-setup/' in event_card:
              raise SystemExit("TournamentSetupEventCard.tsx still contains the invalid import path")
          event_card_path.write_text(event_card)

          wizard_path = Path("apps/web/app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")
          wizard = wizard_path.read_text()
          wizard = wizard.replace(
              'import { useMemo, useState } from "react";',
              'import { useMemo, useState, type ReactNode } from "react";',
          ).replace(
              'function footerRow(children: React.ReactNode)',
              'function footerRow(children: ReactNode)',
          )
          wizard_path.write_text(wizard)

          # Keep Setup highlighted across every nested wizard step.
          nav_path = Path("apps/web/components/TournamentAdminNav.tsx")
          nav = nav_path.read_text()
          old_nav = '''      match: (pathname) =>
            pathname === "/admin/tournaments/setup" ||
            pathname === "/admin/tournament-setup" ||
            pathname === "/admin/tournaments/team-competition"
          '''
          new_nav = '''      match: (pathname) =>
            pathname === "/admin/tournaments/setup" ||
            pathname.startsWith("/admin/tournaments/setup/") ||
            pathname === "/admin/tournament-setup" ||
            pathname === "/admin/tournaments/team-competition"
          '''
          if old_nav in nav:
              nav = nav.replace(old_nav, new_nav, 1)
          if 'pathname.startsWith("/admin/tournaments/setup/")' not in nav:
              raise SystemExit("TournamentAdminNav.tsx does not keep Setup active for wizard routes")
          nav_path.write_text(nav)

          # Point the Setup phase subnavigation to the six actual wizard pages.
          phase_nav_path = Path("apps/web/components/TournamentPhaseNav.tsx")
          phase_nav = phase_nav_path.read_text()
          start = phase_nav.index('  if (phase === "setup") {')
          end = phase_nav.index('\n  if (phase === "registration") {', start)
          setup_block = '''  if (phase === "setup") {
            return [
              {
                label: "1. Basics",
                href: selectedHref("/admin/tournaments/setup/basics", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/basics"
              },
              {
                label: "2. Events & formats",
                href: selectedHref("/admin/tournaments/setup/events", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/events"
              },
              {
                label: "3. Registration rules",
                href: selectedHref("/admin/tournaments/setup/registration-rules", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/registration-rules"
              },
              {
                label: "4. Pricing & extras",
                href: selectedHref("/admin/tournaments/setup/pricing", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/pricing"
              },
              {
                label: "5. Schedule & courts",
                href: selectedHref("/admin/tournaments/setup/schedule", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/schedule"
              },
              {
                label: "6. Review & open",
                href: selectedHref("/admin/tournaments/setup/review", tournamentId, tournamentName),
                match: (pathname) => pathname === "/admin/tournaments/setup/review"
              }
            ];
          }
          '''
          phase_nav_path.write_text(phase_nav[:start] + setup_block + phase_nav[end:])

          # Link every Setup overview card into the matching guided step.
          lifecycle_path = Path("apps/web/app/admin/tournaments/TournamentLifecycleOverviewPanel.tsx")
          lifecycle = lifecycle_path.read_text()
          replacements = {
              '"/admin/tournaments/tournament",\n        tournamentId,\n        tournamentName\n      ),\n      state: datesReady': '"/admin/tournaments/setup/basics",\n        tournamentId,\n        tournamentName\n      ),\n      state: datesReady',
              '"/admin/tournaments/team-competition",\n        tournamentId,\n        tournamentName\n      ),\n      state: eventsReady': '"/admin/tournaments/setup/events",\n        tournamentId,\n        tournamentName\n      ),\n      state: eventsReady',
              '"/admin/tournament-setup",\n        tournamentId,\n        tournamentName\n      ),\n      state: detail.settings': '"/admin/tournaments/setup/registration-rules",\n        tournamentId,\n        tournamentName\n      ),\n      state: detail.settings',
              '"/admin/tournaments/commerce",\n        tournamentId,\n        tournamentName\n      ),\n      state: "In progress"': '"/admin/tournaments/setup/pricing",\n        tournamentId,\n        tournamentName\n      ),\n      state: "In progress"',
              '"/admin/tournament-setup",\n        tournamentId,\n        tournamentName\n      ),\n      state: daysReady': '"/admin/tournaments/setup/schedule",\n        tournamentId,\n        tournamentName\n      ),\n      state: daysReady',
              '"/admin/tournament-setup",\n        tournamentId,\n        tournamentName\n      ),\n      state: reviewReady': '"/admin/tournaments/setup/review",\n        tournamentId,\n        tournamentName\n      ),\n      state: reviewReady',
          }
          for old, new in replacements.items():
              require_once(lifecycle, old, str(lifecycle_path))
              lifecycle = lifecycle.replace(old, new, 1)
          lifecycle_path.write_text(lifecycle)

          # Tournament Home remains a dashboard; all setup edits now start in Step 1.
          home_path = Path("apps/web/app/admin/tournaments/tournament/TournamentHomePanel.tsx")
          home = home_path.read_text()
          home = home.replace(
              '        "/admin/tournaments/tournament",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Tournament dates are incomplete."',
              '        "/admin/tournaments/setup/basics",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Tournament dates are incomplete."',
              1,
          )
          home = home.replace(
              '        "/admin/tournaments/setup",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Events or tournament days still need attention."',
              '        "/admin/tournaments/setup/events",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Events or tournament days still need attention."',
              1,
          )
          home = home.replace(
              '        "/admin/tournaments/setup",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Core setup is ready; registration is not open."',
              '        "/admin/tournaments/setup/review",\n        tournamentId,\n        tournamentName\n      ),\n      reason: "Core setup is ready; registration is not open."',
              1,
          )
          form_marker = '          <article style={cardStyle}>\n            <h2 style={{ marginTop: 0 }}>Tournament basics</h2>'
          require_once(home, form_marker, str(home_path))
          form_start = home.index(form_marker)
          form_end = home.index('\n          <p style={{ display: "flex", gap: "0.75rem", flexWrap: "wrap" }}>', form_start)
          summary = '''          <article style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "center", flexWrap: "wrap" }}>
              <div>
                <h2 style={{ marginTop: 0 }}>Tournament basics</h2>
                <p style={{ color: "#475569", marginBottom: 0 }}>
                  {tournamentName} · {dateValue(detail.tournament.start_date) || "Date not set"} – {dateValue(detail.tournament.end_date) || "Date not set"}
                </p>
              </div>
              <Link
                href={selectedHref("/admin/tournaments/setup/basics", tournamentId, tournamentName)}
                style={{ display: "inline-block", padding: "0.6rem 0.9rem", borderRadius: "999px", background: "#0f172a", color: "white", textDecoration: "none", fontWeight: 800 }}
              >
                Edit in guided setup
              </Link>
            </div>
          </article>
          '''
          home_path.write_text(home[:form_start] + summary + home[form_end:])

          # Align lifecycle contracts with the intentional Setup redirect and wizard.
          contract_path = Path("tests/test_api_contract_tournament_lifecycle_rebuild.py")
          contract = contract_path.read_text()
          function_start = contract.index('def test_lifecycle_phase_overviews_and_subnavigation_exist() -> None:')
          function_end = contract.index('\n\ndef test_admin_session_is_shared_across_admin_route_mounts()', function_start)
          replacement = '''def test_lifecycle_phase_overviews_and_subnavigation_exist() -> None:
            overview = read("app/admin/tournaments/TournamentLifecycleOverviewPanel.tsx")
            phase_nav = read("components/TournamentPhaseNav.tsx")
            setup_entry = read("app/admin/tournaments/setup/page.tsx")
            setup_nav = read("components/TournamentSetupWizardNav.tsx")
            setup_panel = read("app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")

            assert "tournamentSetupStepHref" in setup_entry
            assert '"basics"' in setup_entry
            assert 'redirect("/admin/tournaments")' in setup_entry

            for page in (
                "app/admin/tournaments/registration/page.tsx",
                "app/admin/tournaments/live-operations/page.tsx",
                "app/admin/tournaments/publish/page.tsx",
            ):
                source = read(page)
                assert "TournamentLifecycleOverviewPanel" in source
                assert 'redirect("/admin/tournaments")' in source

            for label in (
                "Tournament basics",
                "Events and formats",
                "Registration rules",
                "Pricing, extras, and fulfillment",
                "Schedule and courts",
                "Review and open registration",
                "Partners and teams",
                "Payments and extras",
                "Preflight and check-in",
                "Draws and scheduling",
                "Live scoring",
                "Corrections and recovery",
                "Review results",
                "Publish divisions",
                "Tournament closeout",
            ):
                assert label in overview

            assert 'export type TournamentPhase = "setup" | "registration" | "live" | "publish";' in phase_nav
            for label in (
                "1. Basics",
                "2. Events & formats",
                "3. Registration rules",
                "4. Pricing & extras",
                "5. Schedule & courts",
                "6. Review & open",
            ):
                assert label in phase_nav

            for key in (
                'key: "basics"',
                'key: "events"',
                'key: "registration-rules"',
                'key: "pricing"',
                'key: "schedule"',
                'key: "review"',
            ):
                assert key in setup_nav

            assert 'goTo("events")' in setup_panel
            assert "Save and continue" in setup_panel
            assert "Review setup" in setup_panel
            assert "Open registration" in setup_panel
          '''
          contract_path.write_text(contract[:function_start] + replacement + contract[function_end:])

          # The direct import fix supersedes the temporary compatibility links.
          for path in (
              Path("apps/web/tournament-setup/tournamentSetupBuilder.ts"),
              Path("apps/web/tournament-setup/TournamentSetupBuilder.module.css"),
          ):
              if path.exists() or path.is_symlink():
                  path.unlink()
          PY

          git diff --check

      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          git checkout origin/staging -- .github/workflows/api-contract.yml
          rm -f .github/workflows/tmp-guided-tournament-setup-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete guided Tournament Setup wizard"
          git push origin HEAD:agent/guided-tournament-setup-wizard

  api-contract:
    runs-on: ubuntu-latest
    env:
      JUPR_CI_REQUIRE_API_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run API contract tests
        run: |
          python -m pytest -q \
            tests/test_api_health.py \
            tests/test_api_contract_*.py \
            tests/test_api_admin_score_entry_disabled.py \
            tests/test_check_staging_environment.py \
            tests/test_smoke_public_web.py \
            tests/test_staging_deployment_config.py

      - name: Run deployment and admin UX safety contracts
        run: |
          python -m pytest -q \
            tests/test_production_deployment_hardening.py \
            tests/test_admin_action_token_guards_static.py \
            tests/test_authenticated_auto_load_contract.py \
            tests/test_ci_safety_contracts.py \
            tests/test_staging_evidence_automation.py \
            tests/test_staging_evidence_automation_workflow.py \
            tests/test_staging_write_session.py \
            tests/test_staging_write_session_workflow.py \
            tests/test_staging_write_wave_guards.py \
            tests/test_league_awards_static_contract.py \
            tests/test_league_core_static_contract.py \
            tests/test_league_live_domain_static_contract.py \
            tests/test_league_printout_auto_load_static.py \
            tests/test_static_support_parity_contract.py \
            tests/test_support_requests_auto_load_static.py \
            tests/test_top_players_printable_auto_load_static.py \
            tests/test_tournament_live_static_contract.py \
            tests/test_tournament_ops_operator_safety_static.py \
            tests/test_tournament_setup_request_safety_static.py \
            tests/test_tournament_setup_selection_ux.py

      - name: Validate parity final-evidence scaffold and manifest
        run: |
          make check-parity-final-evidence
          python -m pytest -q \
            tests/test_next_parity_matrix.py \
            tests/test_parity_closure_program.py \
            tests/test_parity_manual_book.py \
            tests/test_parity_staging_wave.py \
            tests/test_prepare_parity_tournament_live_fixture.py
