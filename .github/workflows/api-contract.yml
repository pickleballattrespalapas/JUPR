name: API Contract Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    env:
      JUPR_CI_REQUIRE_API_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run API contract tests
        run: |
          python -m pytest -q \
            tests/test_api_health.py \
            tests/test_api_contract_*.py \
            tests/test_api_admin_score_entry_disabled.py \
            tests/test_check_staging_environment.py \
            tests/test_smoke_public_web.py \
            tests/test_staging_deployment_config.py

      - name: Run deployment and admin UX safety contracts
        run: |
          python -m pytest -q \
            tests/test_production_deployment_hardening.py \
            tests/test_admin_action_token_guards_static.py \
            tests/test_authenticated_auto_load_contract.py \
            tests/test_ci_safety_contracts.py \
            tests/test_league_awards_static_contract.py \
            tests/test_league_core_static_contract.py \
            tests/test_league_live_domain_static_contract.py \
            tests/test_league_printout_auto_load_static.py \
            tests/test_static_support_parity_contract.py \
            tests/test_support_requests_auto_load_static.py \
            tests/test_top_players_printable_auto_load_static.py \
            tests/test_tournament_live_static_contract.py \
            tests/test_tournament_ops_operator_safety_static.py \
            tests/test_tournament_setup_request_safety_static.py \
            tests/test_tournament_setup_selection_ux.py

      - name: Validate parity final-evidence scaffold and manifest
        run: |
          make check-parity-final-evidence
          python -m pytest -q \
            tests/test_next_parity_matrix.py \
            tests/test_parity_closure_program.py \
            tests/test_parity_manual_book.py \
            tests/test_parity_staging_wave.py \
            tests/test_prepare_parity_tournament_live_fixture.py
