name: API Contract Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    env:
      JUPR_CI_REQUIRE_API_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run API contract tests
        run: |
          python -m pytest -q \
            tests/test_api_health.py \
            tests/test_api_contract_*.py \
            tests/test_admin_tournament_broadcast_service.py \
            tests/test_tournament_broadcast_edit_links.py \
            tests/test_admin_tournament_registration_reporting_service.py \
            tests/test_tournament_registrant_broadcast_email.py \
            tests/test_tournament_email_sponsors.py \
            tests/test_api_admin_score_entry_disabled.py \
            tests/test_check_staging_environment.py \
            tests/test_smoke_public_web.py \
            tests/test_staging_deployment_config.py

      - name: Run deployment and admin UX safety contracts
        run: |
          python -m pytest -q \
            tests/test_production_deployment_hardening.py \
            tests/test_production_schema_window.py \
            tests/test_admin_action_token_guards_static.py \
            tests/test_app_wide_interaction_standard.py \
            tests/test_authenticated_auto_load_contract.py \
            tests/test_ci_safety_contracts.py \
            tests/test_combined_rating_team_tournament_migration_postgres_compatibility.py \
            tests/test_tournament_draw_child_trigger_postgres_compatibility.py \
            tests/test_staging_evidence_automation.py \
            tests/test_staging_evidence_automation_workflow.py \
            tests/test_staging_write_session.py \
            tests/test_staging_write_session_workflow.py \
            tests/test_staging_write_wave_guards.py \
            tests/test_league_awards_static_contract.py \
            tests/test_league_core_static_contract.py \
            tests/test_league_live_domain_static_contract.py \
            tests/test_league_printout_auto_load_static.py \
            tests/test_static_support_parity_contract.py \
            tests/test_support_requests_auto_load_static.py \
            tests/test_top_players_printable_auto_load_static.py \
            tests/test_tournament_admin_guarded_operations.py \
            tests/test_tournament_live_static_contract.py \
            tests/test_tournament_ops_operator_safety_static.py \
            tests/test_tournament_setup_request_safety_static.py \
            tests/test_tournament_setup_selection_ux.py

      - name: Run tournament and league testing-fix contracts
        run: |
          python -m pytest -q \
            tests/test_admin_league_manager_create.py \
            tests/test_admin_league_manager_roster_batch_service.py \
            tests/test_admin_league_manager_service.py \
            tests/test_admin_match_uploader_service.py \
            tests/test_admin_player_editor_service.py \
            tests/test_jupr_live_admin_roster_builder.py \
            tests/test_league_manager_operator_ux_static.py \
            tests/test_league_roster_rating_integrity_migration.py \
            tests/test_public_tournament_registration_edit_service.py \
            tests/test_public_tournament_registration_service.py \
            tests/test_partner_email_invitations.py \
            tests/test_public_tournament_roster_service.py \
            tests/test_tournament_testing_fixes_static.py \
            tests/test_staging_candidate_handoff.py

      - name: Validate parity final-evidence scaffold and manifest
        run: |
          make check-parity-final-evidence
          python -m pytest -q \
            tests/test_next_parity_matrix.py \
            tests/test_parity_closure_program.py \
            tests/test_parity_manual_book.py \
            tests/test_parity_staging_wave.py \
            tests/test_prepare_parity_tournament_live_fixture.py

      - name: Verify selected operations and badge release
        run: |
          python -m pytest -q tests/test_production_operations_release.py tests/test_badge_activation_output.py tests/test_club_leaderboard_settings_api.py tests/test_club_website_settings_api.py tests/test_badge_reactivation.py tests/test_badge_rivalry_activation.py tests/test_badge_seasons_and_community.py tests/test_program_badges.py tests/test_program_badge_service.py tests/test_api_badge_management.py tests/test_generator_submissions.py tests/test_leaderboard_seasons.py tests/test_overall_leaderboard_metrics.py tests/test_club_staff_access.py tests/test_admin_notifications.py tests/test_admin_notification_sources.py tests/test_admin_dashboard.py tests/test_admin_weekly_recap_delete.py

      - name: Verify Tres team league release
        run: |
          python -m pytest -q tests/test_production_team_league_release.py tests/test_team_league_service.py tests/test_team_league_composition.py tests/test_team_league_normalized_rosters.py tests/test_team_league_static_contract.py tests/test_team_league_composition_static.py tests/test_team_league_partner_invitation_email.py tests/test_team_league_hardening_migration_postgres_compatibility.py
