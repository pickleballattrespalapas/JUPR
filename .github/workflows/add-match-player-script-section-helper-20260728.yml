name: Add match-player follow-up section helper

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/match-player-session-followups-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-player-session-followups-20260728
          fetch-depth: 0

      - name: Add section helper
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply_match_player_session_followups_20260728.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\ndef update_confirm_action() -> None:\n'
          helper = '''

          def section(text: str, start_marker: str, end_marker: str) -> tuple[str, str, str]:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start], text[start:end], text[end:]
          '''
          if text.count(marker) != 1:
              raise SystemExit('Unexpected update_confirm_action marker')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-match-player-script-section-helper-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/apply_match_player_session_followups_20260728.py .github/workflows/add-match-player-script-section-helper-20260728.yml
          git commit -m 'Add follow-up script section helper'
          git push origin HEAD:agent/match-player-session-followups-20260728
