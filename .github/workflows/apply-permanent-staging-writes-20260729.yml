name: Apply permanent staging writes

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/permanent-staging-writes-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/permanent-staging-writes-20260729
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply permanent staging mode
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'OPEN_WRITE_WAVE = "open"' scripts/staging_write_waves.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Permanent staging mode is already applied."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_permanent_staging_writes_20260729.py")
          text = path.read_text(encoding="utf-8")
          old = "    old = 'fetch(url, { next: { revalidate: 30 } })'\n    new = 'fetch(url, { cache: \"no-store\" })'\n"
          new = "    old = 'next: { revalidate: 30 }'\n    new = 'cache: \"no-store\"'\n"
          if text.count(old) != 1:
              raise SystemExit("Unexpected admin-fetch conversion block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile scripts/apply_permanent_staging_writes_20260729.py
          python scripts/apply_permanent_staging_writes_20260729.py
          git diff --check
          mkdir -p workflow-payload/.github/workflows
          cp .github/workflows/fly_api_staging_deploy.yml workflow-payload/.github/workflows/
          cp .github/workflows/staging-write-session.yml workflow-payload/.github/workflows/
          cp .github/workflows/staging-write-recovery.yml workflow-payload/.github/workflows/
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run focused Python verification
        if: steps.apply.outputs.changed == 'true'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_permanent_staging_write_mode.py

      - name: Set up Node
        if: steps.apply.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        if: steps.apply.outputs.changed == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Run component checks
        if: steps.apply.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next.js
        if: steps.apply.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run build

      - name: Upload workflow changes
        if: steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: permanent-staging-workflow-payload
          path: workflow-payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified non-workflow implementation
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- \
            .github/workflows/fly_api_staging_deploy.yml \
            .github/workflows/staging-write-session.yml \
            .github/workflows/staging-write-recovery.yml \
            scripts/apply_permanent_staging_writes_20260729.py
          rm -rf workflow-payload
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add -A
          git commit -m 'Keep staging permanently writable for testing'
          git push origin HEAD:agent/permanent-staging-writes-20260729
