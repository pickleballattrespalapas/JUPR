name: Temporary Round-Robin unscored flow publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/round-robin-unscored-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-unscored-flow
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply unscored and standings-flow patch
        run: python scripts/tmp_round_robin_unscored_flow_patch.py

      - name: Install focused Python dependency
        run: python -m pip install pytest

      - name: Run focused generator tests
        run: |
          python -m pytest -q \
            tests/test_round_robin_unscored_flow.py \
            tests/test_play_generator_full_standings.py \
            tests/test_adaptive_play_engine.py \
            tests/test_play_generator_player_count_setup.py \
            tests/test_play_generator_pdf_and_draft_persistence.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:components --if-present

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_round_robin_unscored_flow_patch.py
          rm -f .github/workflows/tmp-round-robin-unscored-flow-publisher.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No application changes to commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add unscored Round-Robin flow'
          git push origin HEAD:agent/round-robin-unscored-flow
