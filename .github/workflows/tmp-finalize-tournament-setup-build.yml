name: Temporary Tournament Setup finalizer

on:
  push:
    branches:
      - agent/tournament-setup-flow-policies-multiday

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-flow-policies-multiday
          fetch-depth: 0

      - name: Restore registration API compatibility and finish policy UI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          git show origin/staging:apps/web/lib/tournamentRegistrationApi.ts > apps/web/lib/tournamentRegistrationApi.ts
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          api = "apps/web/lib/tournamentRegistrationApi.ts"
          replace_once(
              api,
              "  refund_policy_markdown?: string | null;\n  sponsor_markdown?: string | null;\n",
              "  refund_policy_markdown?: string | null;\n  weather_policy_markdown?: string | null;\n  sponsor_markdown?: string | null;\n",
          )
          replace_once(
              api,
              "  registration_day_id: string;\n  label: string;\n",
              "  registration_day_id: string;\n  scheduled_day_ids?: string[] | null;\n  label: string;\n",
          )

          card = "apps/web/app/admin/tournaments/setup/TournamentSetupDivisionCard.tsx"
          for import_line in (
              "  ageRuleText,\n",
              "  clearIncompatibleAgeRuleFields,\n",
              "  finiteNumber,\n",
              "  setEventDivisionName,\n",
              "  setEventSkillLabel,\n",
              "  setRecordBoolean,\n",
          ):
              replace_once(card, import_line, "")

          replace_once(
              card,
              '''function optionLabel(value: string): string {
            return value
              .toLowerCase()
              .split("_")
              .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
              .join(" ");
          }
          ''',
              '''function optionLabel(value: string): string {
            return value
              .toLowerCase()
              .split("_")
              .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
              .join(" ");
          }

          function setRecordBoolean(
            value: SetupRecord,
            key: string,
            checked: boolean
          ): SetupRecord {
            return { ...value, [key]: checked };
          }

          function setEventDivisionName(value: SetupRecord, name: string): SetupRecord {
            const next: SetupRecord = { ...value };
            if (
              Object.prototype.hasOwnProperty.call(value, "division_name") ||
              !Object.prototype.hasOwnProperty.call(value, "label")
            ) {
              next.division_name = name;
            }
            if (Object.prototype.hasOwnProperty.call(value, "label")) {
              next.label = name;
            }
            return next;
          }

          function setEventSkillLabel(value: SetupRecord, skill: string): SetupRecord {
            const next: SetupRecord = { ...value, skill_label: skill };
            if (
              Object.prototype.hasOwnProperty.call(value, "skill_mode") ||
              Object.prototype.hasOwnProperty.call(value, "event_type")
            ) {
              next.skill_mode = skill.trim().toLowerCase() === "open"
                ? "OPEN"
                : "SKILL_BRACKET";
            }
            return next;
          }

          function ageRuleText(value: SetupRecord, key: string): string {
            const direct = key === "notes"
              ? value.division_notes ?? value.notes
              : value[key];
            if (direct != null && String(direct).trim()) return cleanString(direct);
            const raw = value.age_rules;
            if (raw && typeof raw === "object" && !Array.isArray(raw)) {
              return cleanString((raw as SetupRecord)[key]);
            }
            if (typeof raw === "string" && raw.trim()) {
              try {
                const parsed: unknown = JSON.parse(raw);
                if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
                  return cleanString((parsed as SetupRecord)[key]);
                }
              } catch {
                return "";
              }
            }
            return "";
          }
          ''',
          )

          replace_once(
              card,
              '''              onChange(
                        clearIncompatibleAgeRuleFields(
                          setRecordString(
                            value,
                            ["event_format_override", "division_format"],
                            event.target.value
                          ),
                          ageMode
                        )
                      )
          ''',
              '''              onChange(
                        setRecordString(
                          value,
                          ["event_format_override", "division_format"],
                          event.target.value
                        )
                      )
          ''',
          )

          page = "apps/web/app/clubs/[clubSlug]/tournament-registration/page.tsx"
          replace_once(
              page,
              '''      {tournament && settings?.refund_policy_markdown ? (
                  <article style={{ ...cardStyle, marginBottom: "1rem" }}>
                    <h2 style={{ marginTop: 0 }}>Refund policy</h2>
                    {markdownish(settings.refund_policy_markdown)}
                  </article>
                ) : null}

                {tournament ? (
          ''',
              '''      {tournament && settings?.refund_policy_markdown ? (
                  <article style={{ ...cardStyle, marginBottom: "1rem" }}>
                    <h2 style={{ marginTop: 0 }}>Refund policy</h2>
                    {markdownish(settings.refund_policy_markdown)}
                  </article>
                ) : null}

                {tournament && settings?.weather_policy_markdown ? (
                  <article style={{ ...cardStyle, marginBottom: "1rem" }}>
                    <h2 style={{ marginTop: 0 }}>Weather policy</h2>
                    {markdownish(settings.weather_policy_markdown)}
                  </article>
                ) : null}

                {tournament ? (
          ''',
          )

          tests = "tests/test_api_contract_tournament_setup_flow_policies_multiday.py"
          text = Path(tests).read_text()
          addition = '''\n\ndef test_public_registration_displays_required_weather_policy() -> None:\n    public_api = read("lib/tournamentRegistrationApi.ts")\n    public_page = read("app/clubs/[clubSlug]/tournament-registration/page.tsx")\n    assert "weather_policy_markdown?: string | null" in public_api\n    assert "scheduled_day_ids?: string[] | null" in public_api\n    assert "settings?.weather_policy_markdown" in public_page\n    assert ">Weather policy<" in public_page\n'''
          if "def test_public_registration_displays_required_weather_policy" not in text:
              Path(tests).write_text(text.rstrip() + addition + "\n")
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Test Tournament Setup payload builder
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/tournament-setup-builder"
          npx tsc app/admin/tournament-setup/tournamentSetupBuilder.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/tournament-setup-builder"
          JUPR_TOURNAMENT_SETUP_BUILDER_MODULE="$RUNNER_TEMP/tournament-setup-builder/tournamentSetupBuilder.js" \
            node app/admin/tournament-setup/tournamentSetupBuilder.test.mjs

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          python -m pip install pytest

      - name: Run Tournament Setup and safety contracts
        run: |
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_flow_policies_multiday.py \
            tests/test_api_contract_tournament_lifecycle_rebuild.py \
            tests/test_tournament_setup_request_safety_static.py \
            tests/test_production_deployment_hardening.py
          git diff --check

      - name: Commit clean final patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-finalize-tournament-setup-build.yml
          git checkout -- apps/web/next-env.d.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Tournament Setup policies and multi-day scheduling"
          git push origin HEAD:agent/tournament-setup-flow-policies-multiday
