name: Temporary navigation follow-up patcher

on:
  push:
    branches:
      - agent/navigation-followup-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/navigation-followup-fixes
          fetch-depth: 0

      - name: Keep inactive leagues out of public league selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("jupr_app/services/public_league_results_service.py")
          text = service.read_text()
          old = '''    meta_rows = _fetch_table(supabase, "leagues_metadata", LEAGUE_META_SELECT, club_id=cid)
              meta_by_name: dict[str, dict[str, Any]] = {}
              for row in meta_rows:
                  league_name = _active_league_name(row)
                  if league_name:
                      names.add(league_name)
                      meta_by_name[league_name] = row

              rating_rows = _fetch_table(supabase, "league_ratings", "league_name,is_active", club_id=cid, limit=5000)
              for row in rating_rows:
                  league_name = _active_league_name(row)
                  if league_name:
                      names.add(league_name)
          '''
          new = '''    meta_rows = _fetch_table(supabase, "leagues_metadata", LEAGUE_META_SELECT, club_id=cid)
              meta_by_name: dict[str, dict[str, Any]] = {}
              inactive_meta_names: set[str] = set()
              for row in meta_rows:
                  raw_name = str(row.get("league_name") or row.get("league") or "").strip()
                  league_name = _active_league_name(row)
                  if league_name:
                      names.add(league_name)
                      meta_by_name[league_name] = row
                  elif raw_name and raw_name.upper() not in {"OVERALL", "POPUP"}:
                      inactive_meta_names.add(raw_name)

              rating_rows = _fetch_table(supabase, "league_ratings", "league_name,is_active", club_id=cid, limit=5000)
              for row in rating_rows:
                  league_name = _active_league_name(row)
                  if league_name and league_name not in inactive_meta_names:
                      names.add(league_name)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"service metadata block match count={text.count(old)}")
          text = text.replace(old, new, 1)
          old_match = '''        if league_name and match_type != "PopUp" and (score_t1 + score_t2) > 0:
                  names.add(league_name)
          '''
          new_match = '''        if (
                  league_name
                  and league_name not in inactive_meta_names
                  and match_type != "PopUp"
                  and (score_t1 + score_t2) > 0
              ):
                  names.add(league_name)
          '''
          if text.count(old_match) != 1:
              raise SystemExit(f"service match block match count={text.count(old_match)}")
          service.write_text(text.replace(old_match, new_match, 1))

          test_file = Path("tests/test_public_league_results_service.py")
          test_text = test_file.read_text()
          anchor = '''                {
                      "id": 14,
                      "club_id": "club",
                      "league": "Deleted Only",
                      "match_type": "Live Match",
                      "week_tag": "Week 1",
                      "score_t1": 11,
                      "score_t2": 7,
                      "deleted_at": "2026-01-16T00:00:00Z",
                  },
          '''
          addition = anchor + '''                {
                      "id": 15,
                      "club_id": "club",
                      "league": "Archived",
                      "match_type": "Live Match",
                      "week_tag": "Week 1",
                      "score_t1": 11,
                      "score_t2": 7,
                      "deleted_at": None,
                  },
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit(f"test anchor match count={test_text.count(anchor)}")
          test_file.write_text(test_text.replace(anchor, addition, 1))
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-navigation-followup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude inactive leagues from public selection"
          git push origin HEAD:agent/navigation-followup-fixes
