name: Temporary Match Uploader Singles API Follow-up

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-match-uploader-singles-api-followup
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/match-uploader-singles-context-feedback' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-singles-context-feedback
          fetch-depth: 0

      - name: Apply reviewed API follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          processing_path = Path("jupr_app/domain/singles_match_processing.py")
          processing = processing_path.read_text(encoding="utf-8")
          old_week = '            week_tag=str(match.get("week_tag") or "Singles"),'
          new_week = '''            week_tag=(
                          "Singles"
                          if match.get("week_tag") is None
                          else str(match.get("week_tag"))
                      ),'''
          if processing.count(old_week) != 1:
              raise SystemExit("Expected one singles week-tag fallback line")
          processing_path.write_text(
              processing.replace(old_week, new_week),
              encoding="utf-8",
          )

          test_path = Path("tests/test_api_contract_admin_match_uploader_singles.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_fixture = '''    players = pd.DataFrame(supabase.tables["players"])
              empty = pd.DataFrame()
              name_to_id = {"Alex": 1, "Blair": 2}
              id_to_name = {1: "Alex", 2: "Blair"}
              return (players, players, empty, empty, empty, empty, empty, name_to_id, id_to_name, False, "")'''
          new_fixture = '''    players = pd.DataFrame(supabase.tables["players"])
              empty = pd.DataFrame()
              metadata = pd.DataFrame(
                  [
                      {
                          "id": "league-summer-social",
                          "club_id": club_id,
                          "league_name": "Summer Social",
                          "k_factor": 32,
                          "status": "active",
                          "is_active": True,
                          "ended_at": None,
                      }
                  ]
              )
              name_to_id = {"Alex": 1, "Blair": 2}
              id_to_name = {1: "Alex", 2: "Blair"}
              return (
                  players,
                  players,
                  empty,
                  empty,
                  metadata,
                  empty,
                  empty,
                  name_to_id,
                  id_to_name,
                  False,
                  "",
              )'''
          if test_text.count(old_fixture) != 1:
              raise SystemExit("Expected one singles fake load-data fixture")
          test_path.write_text(
              test_text.replace(old_fixture, new_fixture),
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Install focused API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Run focused singles API contract
        run: python -m pytest -q tests/test_api_contract_admin_match_uploader_singles.py

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            jupr_app/domain/singles_match_processing.py \
            tests/test_api_contract_admin_match_uploader_singles.py

      - name: Publish clean follow-up commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/match-uploader-singles-api-followup.patch.gz.b64
          rmdir .github/tmp 2>/dev/null || true
          rm -f .github/workflows/tmp-match-uploader-singles-api-followup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve singles social context metadata'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort | tr '\n' ' ')"
          expected='apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/tests/match-uploader-layout.cjs jupr_app/domain/singles_match_processing.py jupr_app/services/admin_singles_match_service.py services/api/admin_match_uploader_routes.py tests/test_api_contract_admin_match_uploader_singles.py '
          test "$actual" = "$expected"
          git push origin HEAD:agent/match-uploader-singles-context-feedback
