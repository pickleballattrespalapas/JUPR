name: Inspect staging write-session controller

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  inspect:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/inspect-write-session-controller-20260728' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: 6da9ea8a2d86d4c2236b7f34fa8f1246dd418d2a
    steps:
      - name: Check out isolated inspector
        uses: actions/checkout@v4
        with:
          ref: agent/inspect-write-session-controller-20260728
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact staging source and one-file diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$EXPECTED_SHA"
          test "$PR_HEAD_SHA" = "$(git rev-parse HEAD)"
          FILES="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --paginate \
              "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename' \
              | sort
          )"
          test "$FILES" = ".github/workflows/inspect-write-session-controller-20260728.yml"

      - name: Capture recent issue-event workflow runs and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p controller-status
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/actions/runs?event=issues&per_page=100" \
            > controller-status/recent-issue-runs.json
          jq '[.workflow_runs[] | {
                id, name, display_title, status, conclusion, event,
                head_branch, head_sha, created_at, updated_at, html_url
              }][0:30]' \
            controller-status/recent-issue-runs.json \
            > controller-status/recent-issue-runs-summary.json
          jq -r '.[] | [.id,.name,.display_title,.status,(.conclusion // ""),.created_at] | @tsv' \
            controller-status/recent-issue-runs-summary.json \
            | tee controller-status/recent-issue-runs.txt
          mapfile -t IDS < <(
            jq -r '.workflow_runs[0:15][].id' \
              controller-status/recent-issue-runs.json
          )
          for id in "${IDS[@]:-}"; do
            [ -n "$id" ] || continue
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              > "controller-status/jobs-$id.json"
          done

      - name: Upload controller status
        uses: actions/upload-artifact@v4
        with:
          name: staging-write-session-controller-status
          path: controller-status
          if-no-files-found: error
          retention-days: 2
