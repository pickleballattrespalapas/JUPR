name: One-time tournament commerce migration repair

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/repair-tournament-commerce-migration.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pickleballattrespalapas/JUPR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-tournament-commerce-migration
          fetch-depth: 0

      - name: Repair PostgreSQL composite-row assignments
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          migration = Path("supabase/migrations/20260728010000_tournament_commerce.sql")
          expected_blob = "5f08b38747b582a725ff704149fa4af2cdb8efcb"
          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(migration)], text=True
          ).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"Refusing to repair unexpected migration blob {actual_blob}."
              )

          text = migration.read_text(encoding="utf-8")

          def block(lines: list[str]) -> str:
              return "\n".join(lines)

          replacements = [
              (
                  "pair declaration for order apply",
                  block([
                      "  v_line_id uuid;",
                      "begin",
                  ]),
                  block([
                      "  v_line_id uuid;",
                      "  v_pair record;",
                      "begin",
                  ]),
              ),
              (
                  "order-line catalog lookup",
                  block([
                      "      select variant, item",
                      "      into v_variant, v_item",
                      "      from public.tournament_commerce_item_variants variant",
                      "      join public.tournament_commerce_items item on item.id = variant.item_id",
                      "      where variant.id = (v_line ->> 'variant_id')::uuid",
                      "        and item.id = (v_line ->> 'item_id')::uuid",
                      "        and item.tournament_id = p_tournament_id",
                      "        and item.club_id = p_club_id",
                      "        and item.status = 'ACTIVE'",
                      "        and variant.status = 'ACTIVE';",
                      "      if not found",
                      "         or v_item.base_price_minor + v_variant.price_delta_minor",
                      "            <> (v_line ->> 'list_unit_minor')::integer then",
                      "        raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_ITEM_PRICE_INVALID';",
                      "      end if;",
                  ]),
                  block([
                      "      select variant as variant_row, item as item_row",
                      "      into v_pair",
                      "      from public.tournament_commerce_item_variants variant",
                      "      join public.tournament_commerce_items item on item.id = variant.item_id",
                      "      where variant.id = (v_line ->> 'variant_id')::uuid",
                      "        and item.id = (v_line ->> 'item_id')::uuid",
                      "        and item.tournament_id = p_tournament_id",
                      "        and item.club_id = p_club_id",
                      "        and item.status = 'ACTIVE'",
                      "        and variant.status = 'ACTIVE';",
                      "      if not found then",
                      "        raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_ITEM_PRICE_INVALID';",
                      "      end if;",
                      "      v_variant := v_pair.variant_row;",
                      "      v_item := v_pair.item_row;",
                      "      if v_item.base_price_minor + v_variant.price_delta_minor",
                      "            <> (v_line ->> 'list_unit_minor')::integer then",
                      "        raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_ITEM_PRICE_INVALID';",
                      "      end if;",
                  ]),
              ),
              (
                  "inventory catalog lookup",
                  block([
                      "    select variant, item",
                      "    into v_variant, v_item",
                      "    from public.tournament_commerce_item_variants variant",
                      "    join public.tournament_commerce_items item on item.id = variant.item_id",
                      "    where variant.id = (v_inventory ->> 'variant_id')::uuid",
                      "      and item.id = (v_inventory ->> 'item_id')::uuid",
                      "      and item.tournament_id = p_tournament_id",
                      "      and item.club_id = p_club_id",
                      "      and item.status = 'ACTIVE'",
                      "      and variant.status = 'ACTIVE';",
                      "    if not found then",
                      "      raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_INVENTORY_TARGET_INVALID';",
                      "    end if;",
                  ]),
                  block([
                      "    select variant as variant_row, item as item_row",
                      "    into v_pair",
                      "    from public.tournament_commerce_item_variants variant",
                      "    join public.tournament_commerce_items item on item.id = variant.item_id",
                      "    where variant.id = (v_inventory ->> 'variant_id')::uuid",
                      "      and item.id = (v_inventory ->> 'item_id')::uuid",
                      "      and item.tournament_id = p_tournament_id",
                      "      and item.club_id = p_club_id",
                      "      and item.status = 'ACTIVE'",
                      "      and variant.status = 'ACTIVE';",
                      "    if not found then",
                      "      raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_INVENTORY_TARGET_INVALID';",
                      "    end if;",
                      "    v_variant := v_pair.variant_row;",
                      "    v_item := v_pair.item_row;",
                  ]),
              ),
              (
                  "pair declaration for fulfillment update",
                  block([
                      "declare",
                      "  v_fulfillment public.tournament_commerce_fulfillment%rowtype;",
                      "  v_order public.tournament_commerce_orders%rowtype;",
                      "  v_before jsonb;",
                      "  v_operation public.tournament_commerce_operations%rowtype;",
                      "  v_result jsonb;",
                      "begin",
                  ]),
                  block([
                      "declare",
                      "  v_fulfillment public.tournament_commerce_fulfillment%rowtype;",
                      "  v_order public.tournament_commerce_orders%rowtype;",
                      "  v_before jsonb;",
                      "  v_operation public.tournament_commerce_operations%rowtype;",
                      "  v_result jsonb;",
                      "  v_pair record;",
                      "begin",
                  ]),
              ),
              (
                  "fulfillment order lookup",
                  block([
                      "  select fulfillment, orders",
                      "  into v_fulfillment, v_order",
                      "  from public.tournament_commerce_fulfillment fulfillment",
                      "  join public.tournament_commerce_orders orders on orders.id = fulfillment.order_id",
                      "  where fulfillment.id = p_fulfillment_id",
                      "    and fulfillment.tournament_id = p_tournament_id",
                      "    and orders.club_id = p_club_id",
                      "  for update of fulfillment, orders;",
                      "  if not found then",
                      "    raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_FULFILLMENT_NOT_FOUND';",
                      "  end if;",
                  ]),
                  block([
                      "  select fulfillment as fulfillment_row, orders as order_row",
                      "  into v_pair",
                      "  from public.tournament_commerce_fulfillment fulfillment",
                      "  join public.tournament_commerce_orders orders on orders.id = fulfillment.order_id",
                      "  where fulfillment.id = p_fulfillment_id",
                      "    and fulfillment.tournament_id = p_tournament_id",
                      "    and orders.club_id = p_club_id",
                      "  for update of fulfillment, orders;",
                      "  if not found then",
                      "    raise exception using errcode = '22023', message = 'JUPR_TOURNAMENT_COMMERCE_FULFILLMENT_NOT_FOUND';",
                      "  end if;",
                      "  v_fulfillment := v_pair.fulfillment_row;",
                      "  v_order := v_pair.order_row;",
                  ]),
              ),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one source block, found {count}.")
              text = text.replace(old, new, 1)

          forbidden = (
              "into v_variant, v_item",
              "into v_fulfillment, v_order",
          )
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"Unrepaired PostgreSQL row assignment remains: {marker}")

          if text.count("into v_pair") != 3 or text.count("v_pair record;") != 2:
              raise SystemExit("Unexpected repaired composite-row assignment count.")

          migration.write_text(text, encoding="utf-8")

          test = Path("tests/test_tournament_commerce_migration_postgres_compatibility.py")
          test.write_text(
              "from pathlib import Path\n\n\n"
              "def test_tournament_commerce_migration_avoids_composite_multi_target_into() -> None:\n"
              "    sql = Path(\n"
              "        'supabase/migrations/20260728010000_tournament_commerce.sql'\n"
              "    ).read_text(encoding='utf-8')\n"
              "    assert 'into v_variant, v_item' not in sql\n"
              "    assert 'into v_fulfillment, v_order' not in sql\n"
              "    assert sql.count('into v_pair') == 3\n"
              "    assert sql.count('v_pair record;') == 2\n",
              encoding="utf-8",
          )

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q tests/test_tournament_commerce_migration_postgres_compatibility.py

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-tournament-commerce-migration.yml
          git config user.name "pickleballattrespalapas"
          git config user.email "pickleballattrespalapas@gmail.com"
          git add supabase/migrations/20260728010000_tournament_commerce.sql \
            tests/test_tournament_commerce_migration_postgres_compatibility.py \
            .github/workflows/repair-tournament-commerce-migration.yml
          git commit -m "Fix tournament commerce migration compatibility"
          git push origin HEAD:agent/fix-tournament-commerce-migration
