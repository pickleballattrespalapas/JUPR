name: Temporary singles validation and reset fix

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-singles-validation-reset-fix
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/singles-validation-reset-20260730' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/singles-validation-reset-20260730
          fetch-depth: 0

      - name: Apply reviewed singles fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp/apply_singles_validation_reset_fix.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused component checks
        working-directory: apps/web
        run: node tests/match-uploader-layout.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run focused singles checks
        run: |
          python -m pytest -q \
            tests/test_api_contract_admin_match_uploader_singles.py \
            tests/test_manual_acceptance_ux_regressions.py

      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/tmp/apply_singles_validation_reset_fix.py \
            .github/workflows/tmp-singles-validation-reset-fix.yml
          rmdir .github/tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix singles validation and post-submit reset'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort | tr '\n' ' ')"
          expected='apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/tests/match-uploader-layout.cjs tests/test_manual_acceptance_ux_regressions.py '
          test "$actual" = "$expected"
          git push origin HEAD:agent/singles-validation-reset-20260730
