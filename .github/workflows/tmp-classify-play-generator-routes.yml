name: Temporary play generator route classification

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  classify:
    if: github.head_ref == 'agent/round-robin-ladder-generators' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-ladder-generators
          fetch-depth: 0

      - name: Classify generator routes
        run: python scripts/tmp_classify_play_generator_routes.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install -r requirements.txt -r services/api/requirements.txt pytest

      - name: Verify exact unsafe-route inventory
        run: |
          python -m pytest -q \
            tests/test_staging_write_wave_guards.py \
            tests/test_production_deployment_hardening.py \
            tests/test_api_contract_play_generators.py
          git diff --check

      - name: Commit clean route classification
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-classify-play-generator-routes.yml
          rm -f scripts/tmp_classify_play_generator_routes.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Classify play generator staging routes"
          git push origin HEAD:agent/round-robin-ladder-generators
