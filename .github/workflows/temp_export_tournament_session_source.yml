name: Temporary Apply Tournament Session Improvements

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/tournament-session-improvements-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified product patch and remove temporary payloads
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/session-fix/tournament-session-improvements.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/session.patch"
          test "$(sha256sum "$RUNNER_TEMP/session.patch" | awk '{print $1}')" = "c8bc5bc1c46a24904fedd1d158e0051d20d60d5b2ec2cf44aec68cc69958a684"
          git apply --check "$RUNNER_TEMP/session.patch"
          git apply "$RUNNER_TEMP/session.patch"
          rm -rf .github/session-fix
          rm -f .github/workflows/temp_export_tournament_session_source.yml
          python -m py_compile \
            jupr_app/domain/tournament_registration_compiler.py \
            jupr_app/domain/tournament_registration_repo.py \
            jupr_app/services/admin_tournament_setup_service.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement tournament acceptance session improvements'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
