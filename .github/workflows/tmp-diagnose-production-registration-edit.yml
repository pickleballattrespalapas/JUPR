name: Temporary diagnose production registration edit safety

on:
  push:
    branches:
      - rollback-feb8
    paths:
      - .github/production-registration-edit-diagnostic.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-registration-edit-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FLY_APP_NAME: juprleagues-api
      FLY_ORIGIN: https://juprleagues-api.fly.dev
      STATUS_CONTEXT: production-registration-edit-diagnostic
      GH_SMTP_HOST: ${{ secrets.SMTP_HOST }}
      GH_SMTP_PORT: ${{ secrets.SMTP_PORT }}
      GH_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      GH_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      GH_SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      GH_SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      GH_SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
      GH_SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94dae143c89cfc44282879308531b1baad94b51b
          persist-credentials: false

      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.49"

      - name: Inspect secret names and fail-closed runtime
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          flyctl secrets list --app "$FLY_APP_NAME" --json > "$RUNNER_TEMP/secrets.json"
          curl --fail --silent --show-error --max-time 20 "$FLY_ORIGIN/health" > "$RUNNER_TEMP/health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = json.loads(Path(os.environ["RUNNER_TEMP"] + "/secrets.json").read_text())
          entries = (raw.get("secrets") or raw.get("data") or []) if isinstance(raw, dict) else raw
          names = {
              str(entry.get("Name") or entry.get("name"))
              for entry in (entries or [])
              if isinstance(entry, dict) and (entry.get("Name") or entry.get("name"))
          }
          required_smtp = {
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_FROM_EMAIL",
          }
          gh_map = {
              "SMTP_HOST": os.getenv("GH_SMTP_HOST", ""),
              "SMTP_PORT": os.getenv("GH_SMTP_PORT", ""),
              "SMTP_USERNAME": os.getenv("GH_SMTP_USERNAME", ""),
              "SMTP_PASSWORD": os.getenv("GH_SMTP_PASSWORD", ""),
              "SMTP_FROM_EMAIL": os.getenv("GH_SMTP_FROM_EMAIL", ""),
              "SMTP_FROM_NAME": os.getenv("GH_SMTP_FROM_NAME", ""),
              "SMTP_REPLY_TO": os.getenv("GH_SMTP_REPLY_TO", ""),
              "SMTP_USE_TLS": os.getenv("GH_SMTP_USE_TLS", ""),
          }
          gh_present = {name for name, value in gh_map.items() if str(value or "").strip()}
          health = json.loads(Path(os.environ["RUNNER_TEMP"] + "/health.json").read_text())
          result = {
              "signing_secret_configured_on_fly": "JUPR_REGISTRATION_EDIT_SECRET" in names,
              "confirmation_secret_configured_on_fly": "JUPR_REGISTRATION_CONFIRMATION_SECRET" in names,
              "fly_smtp_required_ready": required_smtp <= names,
              "fly_missing_smtp_required": sorted(required_smtp - names),
              "github_smtp_required_ready": required_smtp <= gh_present,
              "github_missing_smtp_required": sorted(required_smtp - gh_present),
              "github_optional_smtp_present": sorted(gh_present - required_smtp),
              "environment": health.get("environment"),
              "production_write_policy": health.get("production_business_write_policy"),
              "candidate_sha": health.get("git_commit_sha"),
              "tournament_write_gate": (health.get("feature_flags") or {}).get("JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION"),
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          Path(os.environ["RUNNER_TEMP"] + "/registration-edit-diagnostic.json").write_text(
              json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: production-registration-edit-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/registration-edit-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Mark diagnostic successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "success",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Registration edit safety diagnostic completed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Mark diagnostic failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "failure",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Registration edit safety diagnostic failed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
