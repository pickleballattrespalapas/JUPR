name: Temporary Apply Mixed Round-Robin Feature

on:
  push:
    branches:
      - agent/mixed-round-robin-format

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/mixed-round-robin-format
          fetch-depth: 0

      - name: Validate temporary branch state
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="f9559fa1829177f18cfc5127f86d3f9d2095be1a"
          unexpected="$(git diff --name-only "$BASE_SHA" HEAD | grep -Ev '^\.github/(mixed-round-robin-patch/part[0-9]+\.b64|workflows/temp_mixed_round_robin_source_archive\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pre-feature paths:"
            echo "$unexpected"
            exit 1
          fi
          test "$(find .github/mixed-round-robin-patch -maxdepth 1 -name 'part*.b64' | wc -l)" -eq 6

      - name: Apply verified mixed-format patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mixed-round-robin-patch/part*.b64 > "$RUNNER_TEMP/mixed-feature.diff.gz.b64"
          base64 --decode "$RUNNER_TEMP/mixed-feature.diff.gz.b64" > "$RUNNER_TEMP/mixed-feature.diff.gz"
          echo "c21ebb2c7a1305450de90dc8a1b00fdcabf360d87aae7fbc0d040d09794922fe  $RUNNER_TEMP/mixed-feature.diff.gz" | sha256sum --check --status
          gzip --decompress --stdout "$RUNNER_TEMP/mixed-feature.diff.gz" > "$RUNNER_TEMP/mixed-feature.diff"
          echo "8c74cee9d074e776104c6a647e26d40b2c6597724872ec9e76d65894064156fb  $RUNNER_TEMP/mixed-feature.diff" | sha256sum --check --status
          git apply --check "$RUNNER_TEMP/mixed-feature.diff"
          git apply --index "$RUNNER_TEMP/mixed-feature.diff"
          git rm -r .github/mixed-round-robin-patch
          git rm .github/workflows/temp_mixed_round_robin_source_archive.yml
          git diff --cached --check

      - name: Commit and publish feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add mixed singles and doubles round robins"
          git push origin HEAD:agent/mixed-round-robin-format
