name: Temporary Source Archive for Tournament Fixes

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  archive-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=source.tar.gz -czf source.tar.gz .
          echo "Archived $(git rev-parse HEAD)"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: tournament-fix-source-${{ github.run_id }}
          path: source.tar.gz
          retention-days: 2
