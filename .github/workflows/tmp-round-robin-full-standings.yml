name: Temporary Round-Robin full standings publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/round-robin-full-standings' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-full-standings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply full standings patch
        run: python scripts/tmp_round_robin_standings_patch.py

      - name: Install focused Python dependency
        run: python -m pip install pytest

      - name: Run focused standings and generator contracts
        run: |
          python -m pytest -q \
            tests/test_play_generator_full_standings.py \
            tests/test_adaptive_play_engine.py \
            tests/test_play_generator_player_count_setup.py \
            tests/test_play_generator_pdf_and_draft_persistence.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-round-robin-full-standings.yml
          rm scripts/tmp_round_robin_standings_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable Round-Robin standings"
          git push origin HEAD:agent/round-robin-full-standings
