name: Automated Staging Evidence
run-name: >-
  Staging evidence control #${{ github.event.issue.number }}

on:
  issues:
    types:
      - reopened

permissions: {}

jobs:
  authorize:
    name: Authorize locked owner control
    if: >-
      github.event.repository.id == 1120897513 &&
      github.event.sender.id == 250933369 &&
      contains(fromJSON('[1046,1047,1048,1049,1050,1051]'), github.event.issue.number)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      authorized: ${{ steps.contract.outputs.authorized }}
      candidate_sha: ${{ steps.contract.outputs.candidate_sha }}
      issue_number: ${{ steps.contract.outputs.issue_number }}
      mode: ${{ steps.contract.outputs.mode }}
      mutation_confirmation: ${{ steps.contract.outputs.mutation_confirmation }}
      write_wave: ${{ steps.contract.outputs.write_wave }}
    steps:
      - name: Check out protected default workflow registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: rollback-feb8

      - name: Verify default registry and canonical staging are synchronized
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/rollback-feb8:refs/remotes/origin/rollback-feb8 \
            +refs/heads/staging:refs/remotes/origin/staging
          DEFAULT_SHA="$(git rev-parse refs/remotes/origin/rollback-feb8)"
          if [ "$GITHUB_REF" != "refs/heads/rollback-feb8" ] || \
             [ "$GITHUB_SHA" != "$DEFAULT_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$DEFAULT_SHA" ]; then
            echo "Controller must execute from the current protected default branch." >&2
            exit 2
          fi
          for path in \
            .github/workflows/fly_api_staging_deploy.yml \
            .github/workflows/parity-final-evidence.yml \
            .github/workflows/staging-evidence-automation.yml \
            .github/workflows/staging-write-recovery.yml \
            scripts/staging_evidence_automation.py \
            scripts/run_parity_staging_wave.py \
            scripts/staging_write_waves.py
          do
            if ! cmp --silent \
              "$path" \
              <(git show "refs/remotes/origin/staging:$path"); then
              echo "Default workflow registry is not synchronized with staging: $path" >&2
              exit 2
            fi
          done

      - name: Authorize exact locked control issue
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTHORIZATION_JSON="$RUNNER_TEMP/staging-evidence-authorization.json"
          python scripts/staging_evidence_automation.py authorize \
            --event-path "$GITHUB_EVENT_PATH" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --issue-mode 1046=public-read \
            --issue-mode 1047=public-intake-auth \
            --issue-mode 1048=admin-read-export \
            --issue-mode 1049=match-rating-writes \
            --issue-mode 1050=match-exclusion-recovery \
            --issue-mode 1051=complete-book \
            > "$AUTHORIZATION_JSON"
          {
            printf 'authorized=%s\n' "$(jq -r '.authorized' "$AUTHORIZATION_JSON")"
            printf 'candidate_sha=%s\n' "$(jq -r '.candidate_sha' "$AUTHORIZATION_JSON")"
            printf 'issue_number=%s\n' "$(jq -r '.issue_number' "$AUTHORIZATION_JSON")"
            printf 'mode=%s\n' "$(jq -r '.mode' "$AUTHORIZATION_JSON")"
            printf 'mutation_confirmation=%s\n' "$(jq -r '.mutation_confirmation' "$AUTHORIZATION_JSON")"
            printf 'write_wave=%s\n' "$(jq -r '.write_wave' "$AUTHORIZATION_JSON")"
          } >> "$GITHUB_OUTPUT"

      - name: Close claimed control issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.contract.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f state=closed \
            -f state_reason=completed \
            --silent

  orchestrate:
    name: Run exact wave, evidence, and recovery
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    environment: staging
    permissions:
      actions: write
      contents: read
    concurrency:
      group: jupr-staging-api-and-parity-evidence
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
      EVIDENCE_MODE: ${{ needs.authorize.outputs.mode }}
      MUTATION_CONFIRMATION: ${{ needs.authorize.outputs.mutation_confirmation }}
      WRITE_WAVE: ${{ needs.authorize.outputs.write_wave }}
    steps:
      - name: Check out exact canonical staging candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: staging

      - name: Verify candidate did not drift before secrets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/staging:refs/remotes/origin/staging
          STAGING_SHA="$(git rev-parse refs/remotes/origin/staging)"
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ] || \
             [ "$STAGING_SHA" != "$CANDIDATE_SHA" ]; then
            echo "Canonical staging changed after controller authorization." >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve exact Vercel candidate while writes are disabled
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py resolve-vercel \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 600 \
            --poll-seconds 10 \
            > "$RUNNER_TEMP/vercel-candidate.json"

      - name: Pre-attest exact safe staging state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-before.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-identity \
            --candidate-sha "$CANDIDATE_SHA" \
            --vercel-json "$RUNNER_TEMP/vercel-candidate.json" \
            --fly-json "$RUNNER_TEMP/fly-before.json" \
            --expected-write-wave none

      - name: Activate exact least-privilege write wave
        id: activate
        if: env.WRITE_WAVE != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input "write_wave=$WRITE_WAVE" \
            --input "expected_candidate_sha=$CANDIDATE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/fly-activation-dispatch.json"
          FLY_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/fly-activation-dispatch.json")"
          printf 'run_id=%s\n' "$FLY_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$FLY_RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 3600

      - name: Attest activated candidate and capture Fly image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-active.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-identity \
            --candidate-sha "$CANDIDATE_SHA" \
            --vercel-json "$RUNNER_TEMP/vercel-candidate.json" \
            --fly-json "$RUNNER_TEMP/fly-active.json" \
            --expected-write-wave "$WRITE_WAVE" \
            > "$RUNNER_TEMP/active-identity.json"

      - name: Run exact parity evidence
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERCEL_DEPLOYMENT_ID="$(
            jq -r '.vercel_deployment_id' "$RUNNER_TEMP/vercel-candidate.json"
          )"
          VERCEL_DEPLOYMENT_ORIGIN="$(
            jq -r '.vercel_deployment_origin' "$RUNNER_TEMP/vercel-candidate.json"
          )"
          FLY_IMAGE_REF="$(jq -r '.fly_image_ref' "$RUNNER_TEMP/fly-active.json")"
          python scripts/staging_evidence_automation.py dispatch \
            --workflow parity-final-evidence.yml \
            --input "mode=$EVIDENCE_MODE" \
            --input "candidate_sha=$CANDIDATE_SHA" \
            --input "vercel_deployment_id=$VERCEL_DEPLOYMENT_ID" \
            --input "vercel_deployment_origin=$VERCEL_DEPLOYMENT_ORIGIN" \
            --input "fly_image_ref=$FLY_IMAGE_REF" \
            --input "mutation_confirmation=$MUTATION_CONFIRMATION" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/parity-dispatch.json"
          PARITY_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/parity-dispatch.json")"
          printf 'run_id=%s\n' "$PARITY_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow parity-final-evidence.yml \
            --run-id "$PARITY_RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 5400

      - name: Always restore and attest no-write mode
        id: restore
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set -euo pipefail
          if [ "$WRITE_WAVE" = "none" ] && \
             [ "$PREFLIGHT_OUTCOME" = "success" ] && \
             [ "$EVIDENCE_OUTCOME" = "success" ]; then
            for attempt in $(seq 1 3); do
              if python scripts/staging_evidence_automation.py fly-health \
                   > "$RUNNER_TEMP/fly-restored.json" && \
                 python scripts/staging_evidence_automation.py verify-final-none \
                   --fly-json "$RUNNER_TEMP/fly-restored.json"; then
                exit 0
              fi
              sleep 10
            done
          fi
          python scripts/staging_evidence_automation.py candidate-sha \
            > "$RUNNER_TEMP/current-staging.json"
          RESTORE_SHA="$(jq -r '.candidate_sha' "$RUNNER_TEMP/current-staging.json")"
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input write_wave=none \
            --input "expected_candidate_sha=$RESTORE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/fly-restore-dispatch.json"
          RESTORE_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/fly-restore-dispatch.json")"
          printf 'run_id=%s\n' "$RESTORE_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$RESTORE_RUN_ID" \
            --candidate-sha "$RESTORE_SHA" \
            --timeout-seconds 3600
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-restored.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-final-none \
            --fly-json "$RUNNER_TEMP/fly-restored.json"

      - name: Record automation links
        if: always()
        shell: bash
        env:
          ACTIVATE_RUN_ID: ${{ steps.activate.outputs.run_id }}
          EVIDENCE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          RESTORE_RUN_ID: ${{ steps.restore.outputs.run_id }}
        run: |
          {
            echo "### Automated staging evidence"
            echo
            echo "- Mode: \`$EVIDENCE_MODE\`"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Controller: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$ACTIVATE_RUN_ID" ]; then
              echo "- Activation: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ACTIVATE_RUN_ID"
            fi
            if [ -n "$EVIDENCE_RUN_ID" ]; then
              echo "- Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID"
            fi
            if [ -n "$RESTORE_RUN_ID" ]; then
              echo "- Safe restore: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RESTORE_RUN_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
