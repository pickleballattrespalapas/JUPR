name: Next Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/next-web-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Vercel preview API isolation config
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_STAGING_SUPABASE_URL: https://staging-project.supabase.co
          NEXT_PUBLIC_STAGING_SUPABASE_ANON_KEY: public-anon-test-value
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const config = require("./next.config.js");
          assert.equal(config.env.JUPR_API_BASE_URL, "https://juprleagues-api-staging.fly.dev");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_API_BASE_URL, "https://juprleagues-api-staging.fly.dev");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_ENV, "staging");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_ENABLE_NEXT_ADMIN_SCORE_ENTRY, "1");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_PREVIEW_ISOLATION, "1");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_PREVIEW_AUTH_ISOLATION, "1");
          assert.equal(config.env.NEXT_PUBLIC_SUPABASE_URL, "https://staging-project.supabase.co");
          assert.equal(config.env.NEXT_PUBLIC_SUPABASE_ANON_KEY, "public-anon-test-value");
          delete process.env.NEXT_PUBLIC_STAGING_SUPABASE_URL;
          delete process.env.NEXT_PUBLIC_STAGING_SUPABASE_ANON_KEY;
          delete require.cache[require.resolve("./next.config.js")];
          const withoutPreviewAuth = require("./next.config.js");
          assert.equal(withoutPreviewAuth.env.NEXT_PUBLIC_JUPR_PREVIEW_AUTH_ISOLATION, "0");
          assert.equal("NEXT_PUBLIC_SUPABASE_URL" in withoutPreviewAuth.env, false);
          assert.equal("NEXT_PUBLIC_SUPABASE_ANON_KEY" in withoutPreviewAuth.env, false);
          NODE
      - name: Test Tournament Setup payload builder
        run: |
          mkdir -p "$RUNNER_TEMP/tournament-setup-builder"
          npx tsc app/admin/tournament-setup/tournamentSetupBuilder.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/tournament-setup-builder"
          JUPR_TOURNAMENT_SETUP_BUILDER_MODULE="$RUNNER_TEMP/tournament-setup-builder/tournamentSetupBuilder.js" \
            node app/admin/tournament-setup/tournamentSetupBuilder.test.mjs
      - name: Test admin-session storage isolation
        run: |
          mkdir -p "$RUNNER_TEMP/admin-auth-client"
          npx tsc lib/adminAuthClient.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/admin-auth-client"
          JUPR_ADMIN_AUTH_CLIENT_MODULE="$RUNNER_TEMP/admin-auth-client/adminAuthClient.js" \
            node lib/adminAuthClient.storage.test.mjs
      - name: Test Challenge Ladder full-result rendering
        run: npm run test:component
      - name: Build Next app
        run: npm run build

  publish-match-uploader-followup:
    needs: build
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/match-uploader-context-layout-followup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-context-layout-followup
          fetch-depth: 0
      - name: Apply reviewed Match Uploader patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/match-uploader-followup.patch.gz.b64.part* > "$RUNNER_TEMP/match-uploader-followup.patch.gz.b64"
          cd "$RUNNER_TEMP"
          echo 'b3aab891aec7c2a7daac792d4f7350bfee3b9710c298e128ffd7cf33cca9276f  match-uploader-followup.patch.gz.b64' | sha256sum --check
          base64 --decode match-uploader-followup.patch.gz.b64 > match-uploader-followup.patch.gz
          echo 'd9964e67d32a9762f9bbd3eb1a2bbe287d43499785f76da6cb7924cb4e91b0f6  match-uploader-followup.patch.gz' | sha256sum --check
          gzip --decompress --stdout match-uploader-followup.patch.gz > match-uploader-followup.patch
          echo 'bc9062bb07f57eeb7c8437e2735c94c64446d565686d996921e9aa80ac3d133e  match-uploader-followup.patch' | sha256sum --check
          cd "$GITHUB_WORKSPACE"
          git apply --check "$RUNNER_TEMP/match-uploader-followup.patch"
          git apply "$RUNNER_TEMP/match-uploader-followup.patch"
          git diff --check
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run focused component checks
        working-directory: apps/web
        run: npm run test:component
      - name: Build Next app
        working-directory: apps/web
        run: npm run build
      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          git show 392057b58cc98bad82ac7da63d17dbf57302f0a0:.github/workflows/next-web-build.yml > .github/workflows/next-web-build.yml
          rm -f .github/tmp/match-uploader-followup.patch.gz.b64.part*
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/tmp/match-uploader-followup.patch.gz.b64.part00 .github/tmp/match-uploader-followup.patch.gz.b64.part01 .github/tmp/match-uploader-followup.patch.gz.b64.part02 .github/tmp/match-uploader-followup.patch.gz.b64.part03 .github/tmp/match-uploader-followup.patch.gz.b64.part04 .github/workflows/next-web-build.yml apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/app/admin/match-uploader/layout.module.css apps/web/tests/match-uploader-layout.cjs "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Match Uploader context and responsive layout'
          git push origin HEAD:agent/match-uploader-context-layout-followup
