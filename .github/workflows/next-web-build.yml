name: Next Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/e2e/generator_submission_api.py"
      - "tests/e2e/recap_builder_api.py"
      - ".github/workflows/next-web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rr-navigation-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local fixture dependencies
        run: |
          pip install -r requirements.txt -r services/api/requirements.txt pytest uvicorn
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build Next app for browser acceptance
        working-directory: apps/web
        env:
          JUPR_API_BASE_URL: http://127.0.0.1:8042
          NEXT_PUBLIC_JUPR_API_BASE_URL: http://127.0.0.1:8042
          NEXT_PUBLIC_JUPR_ENV: staging
        run: npm run build
      - name: Verify full round schedule and navigation
        working-directory: apps/web
        env:
          GENERATOR_BROWSER_NEXT_MODE: start
          GENERATOR_BROWSER_API_PORT: "8042"
        run: node tests/rr-schedule-navigation-browser.cjs
      - name: Verify recap builder, drafts, publishing and mobile editing
        working-directory: apps/web
        env:
          RECAP_BROWSER_ARTIFACTS: test-results/recap-builder
          RECAP_BROWSER_NEXT_MODE: start
        run: node tests/recap-builder-browser.cjs
      - name: Upload round navigation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-navigation-ui-${{ github.sha }}
          path: apps/web/test-results/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Vercel preview API isolation config
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_STAGING_SUPABASE_URL: https://staging-project.supabase.co
          NEXT_PUBLIC_STAGING_SUPABASE_ANON_KEY: public-anon-test-value
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const config = require("./next.config.js");
          assert.equal(config.env.JUPR_API_BASE_URL, "https://juprleagues-api-staging.fly.dev");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_API_BASE_URL, "https://juprleagues-api-staging.fly.dev");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_ENV, "staging");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_ENABLE_NEXT_ADMIN_SCORE_ENTRY, "1");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_PREVIEW_ISOLATION, "1");
          assert.equal(config.env.NEXT_PUBLIC_JUPR_PREVIEW_AUTH_ISOLATION, "1");
          assert.equal(config.env.NEXT_PUBLIC_SUPABASE_URL, "https://staging-project.supabase.co");
          assert.equal(config.env.NEXT_PUBLIC_SUPABASE_ANON_KEY, "public-anon-test-value");
          delete process.env.NEXT_PUBLIC_STAGING_SUPABASE_URL;
          delete process.env.NEXT_PUBLIC_STAGING_SUPABASE_ANON_KEY;
          delete require.cache[require.resolve("./next.config.js")];
          const withoutPreviewAuth = require("./next.config.js");
          assert.equal(withoutPreviewAuth.env.NEXT_PUBLIC_JUPR_PREVIEW_AUTH_ISOLATION, "0");
          assert.equal("NEXT_PUBLIC_SUPABASE_URL" in withoutPreviewAuth.env, false);
          assert.equal("NEXT_PUBLIC_SUPABASE_ANON_KEY" in withoutPreviewAuth.env, false);
          NODE
      - name: Test Tournament Setup state helpers
        run: |
          mkdir -p "$RUNNER_TEMP/tournament-setup-builder"
          npx tsc \
            app/admin/tournament-setup/tournamentSetupBuilder.ts \
            app/admin/tournaments/setup/tournamentSetupPublicationStatus.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/tournament-setup-builder"
          JUPR_TOURNAMENT_SETUP_BUILDER_MODULE="$RUNNER_TEMP/tournament-setup-builder/app/admin/tournament-setup/tournamentSetupBuilder.js" \
            node app/admin/tournament-setup/tournamentSetupBuilder.test.mjs
          JUPR_TOURNAMENT_SETUP_PUBLICATION_STATUS_MODULE="$RUNNER_TEMP/tournament-setup-builder/app/admin/tournaments/setup/tournamentSetupPublicationStatus.js" \
            node app/admin/tournaments/setup/tournamentSetupPublicationStatus.test.mjs
      - name: Test admin-session storage isolation
        run: |
          mkdir -p "$RUNNER_TEMP/admin-auth-client"
          npx tsc lib/adminAuthClient.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/admin-auth-client"
          JUPR_ADMIN_AUTH_CLIENT_MODULE="$RUNNER_TEMP/admin-auth-client/adminAuthClient.js" \
            node lib/adminAuthClient.storage.test.mjs
      - name: Test Players Needing Partners grouping
        run: |
          mkdir -p "$RUNNER_TEMP/tournament-partner-board"
          npx tsc lib/tournamentPartnerBoard.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --rootDir . \
            --outDir "$RUNNER_TEMP/tournament-partner-board"
          JUPR_TOURNAMENT_PARTNER_BOARD_MODULE="$RUNNER_TEMP/tournament-partner-board/lib/tournamentPartnerBoard.js" \
            node lib/tournamentPartnerBoard.test.mjs
      - name: Test Challenge Ladder full-result rendering
        run: npm run test:component
      - name: Lint Next app
        run: npm run lint
      - name: Build Next app
        run: npm run build

      - name: Install browser for selected release checks
        run: npx playwright install --with-deps chromium
      - name: Verify settings and notifications in desktop and mobile browsers
        run: npx playwright test e2e/admin-notifications.spec.ts e2e/club-website-settings.spec.ts e2e/team-league-setup.spec.ts e2e/tournament-solo-signup.spec.ts --workers=1 --retries=0
      - name: Preserve browser verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: selected-release-browser-${{ github.sha }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
