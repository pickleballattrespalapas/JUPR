name: Temporary Match Uploader Follow-up Publisher

on:
  push:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-match-uploader-followup-publisher
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-context-layout-followup
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/match-uploader-followup-v2.patch.gz.b64 <<'EOF'

EOF
          echo 'b3aab891aec7c2a7daac792d4f7350bfee3b9710c298e128ffd7cf33cca9276f  /tmp/match-uploader-followup-v2.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/match-uploader-followup-v2.patch.gz.b64 > /tmp/match-uploader-followup-v2.patch.gz
          echo 'd9964e67d32a9762f9bbd3eb1a2bbe287d43499785f76da6cb7924cb4e91b0f6  /tmp/match-uploader-followup-v2.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/match-uploader-followup-v2.patch.gz > /tmp/match-uploader-followup-v2.patch
          echo 'bc9062bb07f57eeb7c8437e2735c94c64446d565686d996921e9aa80ac3d133e  /tmp/match-uploader-followup-v2.patch' | sha256sum --check
          git apply --check /tmp/match-uploader-followup-v2.patch
          git apply /tmp/match-uploader-followup-v2.patch
          git diff --check

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused component checks
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-match-uploader-followup-v2.yml
          rm -f .github/workflows/tmp-apply-match-uploader-followup-v2-push.yml
          rm -f .github/workflows/tmp-publish-match-uploader-followup-from-staging.yml
          rm -f .github/tmp/trigger-match-uploader-followup-v2.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Match Uploader context and responsive layout'
          git push origin HEAD:agent/match-uploader-context-layout-followup
