name: Temporary played-route manifest publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/round-robin-unscored-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-unscored-flow
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify Round Played routes
        run: python scripts/tmp_add_played_wave_routes.py

      - name: Verify the exact route inventory
        run: |
          python -m pip install pytest fastapi httpx2
          python -m pytest -q tests/test_staging_write_wave_guards.py
          git diff --check

      - name: Commit clean route manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_add_played_wave_routes.py
          rm -f .github/workflows/tmp-played-wave-route-publisher.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Classify Round Played write routes'
          git push origin HEAD:agent/round-robin-unscored-flow
