name: Temporary apply production tournament activation v6

on:
  push:
    branches:
      - rollback-feb8
    paths:
      - .github/production-tournament-activation-v6.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: production-tournament-activation-builder-v6
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 1bcb4ccc26875190aae1ace9ff4640f941f5a7ba
      ARCHIVE_SHA: ad910c6bd5b07e626f8601ecb59780a223e248ad
      TARGET_BRANCH: agent/production-tournament-activation-v3
      PATCH_SHA256: 65bf9bfcf7f36c5155d6fdab4552be499dd65a5ad055ceb7604f6fd3bf86e425
      STATUS_CONTEXT: production-tournament-activation-v6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Rebuilding and validating tournament activation",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Recover and apply reviewed activation patch
        run: |
          set -euo pipefail
          for part in 01 02 03; do
            git show "$ARCHIVE_SHA:.github/production-tournament-patch/chunk-$part.txt"
          done | base64 -d | gzip -d > "$RUNNER_TEMP/activation.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/activation.patch" | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --check "$RUNNER_TEMP/activation.patch"
          git apply "$RUNNER_TEMP/activation.patch"

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/test_tournament_admin_guarded_operations.py": [
                  ('match="staging-only"', 'match="production write policy"'),
              ],
              "tests/test_tournament_team_runtime_security.py": [
                  ('match="staging-only"', 'match="production write policy"'),
                  ('match="public-intake-auth"', 'match="Four-player team writes are disabled"'),
              ],
              "tests/test_public_tournament_commerce_service.py": [
                  ('match="staging-only"', 'match="production write policy"'),
                  ('match="tournament-commerce-admin"', 'match="Tournament commerce writes are disabled"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              changed = False
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              if changed:
                  path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git diff --stat
          python -m compileall -q jupr_app/services services/api scripts tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt

      - name: Run tournament contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_production_tournament_activation.py \
            tests/test_tournament_admin_guarded_operations.py \
            tests/test_tournament_team_runtime_security.py \
            tests/test_public_tournament_commerce_service.py \
            tests/test_admin_tournament_live_runner.py \
            tests/test_api_contract_admin_tournament_guarded.py \
            tests/test_api_contract_admin_tournament_setup.py \
            tests/test_api_contract_tournament_registration.py \
            tests/test_api_contract_tournament_registration_edit.py \
            tests/test_api_contract_tournament_partner_flow.py \
            tests/test_api_contract_admin_tournament_game_generation.py \
            tests/test_api_contract_admin_tournament_game_scoring.py \
            tests/test_api_contract_admin_tournament_playoff_generation.py \
            tests/test_api_contract_admin_tournament_match_publish.py \
            tests/test_api_contract_admin_tournament_team_editor.py \
            tests/test_public_tournament_team_setup_recovery.py \
            tests/test_tournament_pairing_lifecycle_email.py

      - name: Run full API contract suite
        run: python -m pytest -q tests/test_api_contract_*.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build production web application
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Publish tested activation branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Authorize reviewed tournament workflows in production"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA" \
            origin HEAD:"refs/heads/$TARGET_BRANCH"

      - name: Mark validation successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-success.json"
          import json, os
          print(json.dumps({
            "state": "success",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Tournament activation passed and branch was published",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-success.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Mark validation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-failure.json"
          import json, os
          print(json.dumps({
            "state": "failure",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Tournament activation validation failed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-failure.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
