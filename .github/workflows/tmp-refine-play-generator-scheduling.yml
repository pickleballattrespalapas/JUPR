name: Temporary play generator scheduling refinement

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/round-robin-ladder-generators' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-ladder-generators
          fetch-depth: 0

      - name: Apply ladder scheduling refinement
        run: python scripts/tmp_refine_play_generator_scheduling.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run scheduling tests
        run: |
          python -m compileall -q jupr_app/domain/adaptive_play_engine.py
          python -m pytest -q tests/test_adaptive_play_engine.py tests/test_admin_play_generator_service.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit clean refinement
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/next-env.d.ts || true
          rm -f .github/workflows/tmp-refine-play-generator-scheduling.yml
          rm -f scripts/tmp_refine_play_generator_scheduling.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine adaptive ladder court scheduling"
          git push origin HEAD:agent/round-robin-ladder-generators
