name: One-time combined-rating migration repair

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/repair-combined-rating-migration.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pickleballattrespalapas/JUPR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-combined-rating-migration
          fetch-depth: 0

      - name: Repair the playoff threshold expression
        shell: python
        run: |
          from hashlib import sha256
          import json
          from pathlib import Path
          import subprocess

          migration = Path(
              "supabase/migrations/20260728020000_combined_rating_team_tournaments.sql"
          )
          expected_blob = "be083eaea450665dc387551d62cf8288ba2c2ac7"
          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(migration)], text=True
          ).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"Refusing to repair unexpected migration blob {actual_blob}."
              )

          text = migration.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  "  if cardinality(v_seed_ids) < case",
                  "       when v_event.team_playoff_format = 'TOP_2_FINAL' then 2 else 4 end then",
              ]
          )
          new = "\n".join(
              [
                  "  if cardinality(v_seed_ids) < (",
                  "       case",
                  "         when v_event.team_playoff_format = 'TOP_2_FINAL' then 2",
                  "         else 4",
                  "       end",
                  "     ) then",
              ]
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f"Expected one invalid playoff threshold expression, found {text.count(old)}."
              )
          text = text.replace(old, new, 1)
          migration.write_text(text, encoding="utf-8")

          test = Path(
              "tests/test_combined_rating_team_tournament_migration_postgres_compatibility.py"
          )
          test.write_text(
              "from pathlib import Path\n\n\n"
              "def test_playoff_threshold_case_is_parenthesized() -> None:\n"
              "    sql = Path(\n"
              "        'supabase/migrations/20260728020000_combined_rating_team_tournaments.sql'\n"
              "    ).read_text(encoding='utf-8')\n"
              "    assert 'if cardinality(v_seed_ids) < case' not in sql\n"
              "    assert \"if cardinality(v_seed_ids) < (\\n       case\" in sql\n",
              encoding="utf-8",
          )

          migrations = Path("supabase/migrations")
          records = [
              f"{path.name}\t{sha256(path.read_bytes()).hexdigest()}"
              for path in sorted(migrations.glob("*.sql"))
          ]
          fingerprint = sha256("\n".join(records).encode("utf-8")).hexdigest()
          contract_path = Path("config/production_migration_contract.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          contract["repository_migration_content_sha256"] = fingerprint
          contract_path.write_text(
              json.dumps(contract, indent=2) + "\n", encoding="utf-8"
          )

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -c "from pathlib import Path; sql=Path('supabase/migrations/20260728020000_combined_rating_team_tournaments.sql').read_text(encoding='utf-8'); assert 'if cardinality(v_seed_ids) < case' not in sql; assert 'if cardinality(v_seed_ids) < (\n       case' in sql"
          python -c "import hashlib,json,pathlib; paths=sorted(pathlib.Path('supabase/migrations').glob('*.sql')); expected=hashlib.sha256('\n'.join(f'{p.name}\t{hashlib.sha256(p.read_bytes()).hexdigest()}' for p in paths).encode()).hexdigest(); actual=json.loads(pathlib.Path('config/production_migration_contract.json').read_text())['repository_migration_content_sha256']; assert actual == expected"

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-combined-rating-migration.yml
          git config user.name "pickleballattrespalapas"
          git config user.email "pickleballattrespalapas@gmail.com"
          git add supabase/migrations/20260728020000_combined_rating_team_tournaments.sql \
            tests/test_combined_rating_team_tournament_migration_postgres_compatibility.py \
            config/production_migration_contract.json \
            .github/workflows/repair-combined-rating-migration.yml
          git commit -m "Fix combined-rating migration CASE syntax"
          git push origin HEAD:agent/fix-combined-rating-migration
