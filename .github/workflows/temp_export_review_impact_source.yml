name: Temporary Export Review Impact Source

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/review-impact-fixes-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Archive exact feature source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/jupr-review-impact-source.tar.gz .

      - name: Upload exact feature source
        uses: actions/upload-artifact@v4
        with:
          name: jupr-review-impact-source
          path: /tmp/jupr-review-impact-source.tar.gz
          if-no-files-found: error
          retention-days: 1
