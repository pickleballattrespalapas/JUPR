name: Patch permanent staging contract tests

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/permanent-staging-writes-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/permanent-staging-writes-20260729
          fetch-depth: 0

      - name: Patch permanent-open contracts
        run: |
          set -euo pipefail
          if [ ! -f scripts/patch_permanent_staging_contract_tests_20260729.py ]; then
            echo "Contract patch already applied."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/patch_permanent_staging_contract_tests_20260729.py")
          text = path.read_text(encoding="utf-8")
          raw_old = "        '''def"
          raw_new = "        r'''def"
          if text.count(raw_old) != 4:
              raise SystemExit(f"Unexpected replacement-body count: {text.count(raw_old)}")
          text = text.replace(raw_old, raw_new)
          sub_old = "    updated, count = re.subn(pattern, body.rstrip(), text, count=1, flags=re.DOTALL)"
          sub_new = "    updated, count = re.subn(pattern, lambda _match: body.rstrip(), text, count=1, flags=re.DOTALL)"
          if text.count(sub_old) != 1:
              raise SystemExit("Unexpected replace_function implementation")
          path.write_text(text.replace(sub_old, sub_new, 1), encoding="utf-8")
          PY
          python scripts/patch_permanent_staging_contract_tests_20260729.py
          python -m py_compile tests/test_staging_deployment_config.py
          git diff --check
          rm scripts/patch_permanent_staging_contract_tests_20260729.py
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add tests/test_staging_deployment_config.py scripts/patch_permanent_staging_contract_tests_20260729.py
          git commit -m 'Update staging deployment contracts for permanent writes'
          git push origin HEAD:agent/permanent-staging-writes-20260729
