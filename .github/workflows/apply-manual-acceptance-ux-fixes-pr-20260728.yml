name: Apply manual acceptance UX fixes from PR

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/manual-acceptance-ux-fixes-20260728' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out UX repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/manual-acceptance-ux-fixes-20260728
          fetch-depth: 0

      - name: Extract and run reviewed repair script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-manual-acceptance-ux-fixes-20260728.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply reviewed Match Uploader and Match Log fixes\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Verify source contracts\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          compile(script, '<manual-acceptance-ux-fixes>', 'exec')
          exec(script, {'__name__': '__main__'})

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q tests/test_manual_acceptance_ux_regressions.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Commit fixes and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-manual-acceptance-ux-fixes-20260728.yml
          rm .github/workflows/apply-manual-acceptance-ux-fixes-pr-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            apps/web/app/admin/match-uploader/MatchUploaderForm.tsx \
            apps/web/app/admin/match-log/MatchLogWorkspace.tsx \
            apps/web/app/admin/match-log/MatchLogApplyPanel.tsx \
            tests/test_manual_acceptance_ux_regressions.py \
            .github/workflows/apply-manual-acceptance-ux-fixes-20260728.yml \
            .github/workflows/apply-manual-acceptance-ux-fixes-pr-20260728.yml
          git commit -m 'Fix manual acceptance UX regressions'
          git push origin HEAD:agent/manual-acceptance-ux-fixes-20260728
