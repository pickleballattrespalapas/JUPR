name: Temporary Apply Tournament Domain Rebuild V3

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply-rebuild:
    if: github.event.pull_request.head.ref == 'agent/tournament-domain-rebuild-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified rebuild and remove transfer files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          root = Path('.github/tournament-domain-patch')
          parts = sorted(root.glob('part-*'))
          if [path.name for path in parts] != [f'part-{index:02d}' for index in range(7)]:
              raise SystemExit('Unexpected tournament patch part set')
          chunks = [path.read_bytes() for path in parts]
          if not chunks[0].endswith(b'=='):
              raise SystemExit('Expected known transfer padding on part-00')
          chunks[0] = chunks[0][:-2]
          compressed = base64.b64decode(b''.join(chunks), validate=True)
          Path('/tmp/tournament-four-domain-rebuild.patch').write_bytes(gzip.decompress(compressed))
          PY

          echo '8349d54a1c8a768f0892b3c9ed32a56cca3e93a3552ecc215ca90380b9dd05a7  /tmp/tournament-four-domain-rebuild.patch' \
            | sha256sum --check --strict

          git apply --check \
            --exclude=.github/workflows/temp_export_tournament_domain_source.yml \
            /tmp/tournament-four-domain-rebuild.patch
          git apply \
            --exclude=.github/workflows/temp_export_tournament_domain_source.yml \
            /tmp/tournament-four-domain-rebuild.patch
          git apply --check .github/tournament-domain-patch/final-test-delta.patch
          git apply .github/tournament-domain-patch/final-test-delta.patch

          rm -rf .github/tournament-domain-patch
          rm -f .github/workflows/temp_export_tournament_domain_source.yml
          rm -f .github/workflows/temp_apply_tournament_domain_rebuild.yml
          rm -f .github/workflows/temp_apply_tournament_domain_rebuild_v2.yml
          rm -f .github/workflows/temp_apply_tournament_domain_rebuild_v3.yml

          git add -A
          git diff --cached --check
          python -m compileall -q jupr_app services/api scripts

          test -z "$(git ls-files '.github/tournament-domain-patch/*')"
          test ! -e .github/workflows/temp_export_tournament_domain_source.yml
          test ! -e .github/workflows/temp_apply_tournament_domain_rebuild.yml
          test ! -e .github/workflows/temp_apply_tournament_domain_rebuild_v2.yml
          test ! -e .github/workflows/temp_apply_tournament_domain_rebuild_v3.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild tournament setup into four domains'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
