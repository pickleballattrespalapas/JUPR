name: Temporary league format contract finalizer

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-league-format-contract-finalizer
  cancel-in-progress: false

jobs:
  finalize-test-publish:
    if: github.head_ref == 'agent/league-match-format-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out league format branch
        uses: actions/checkout@v4
        with:
          ref: agent/league-match-format-20260731
          fetch-depth: 0

      - name: Refresh production migration contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.deployment_verifier import repository_migration_content_fingerprint

          contract_path = Path('config/production_migration_contract.json')
          migrations_dir = Path('supabase/migrations')
          payload = json.loads(contract_path.read_text(encoding='utf-8'))
          names = {str(name).strip() for name in payload['required_ledger_names']}
          names.add('league_match_format')
          payload['required_ledger_names'] = sorted(names)
          payload['repository_migration_content_sha256'] = repository_migration_content_fingerprint(migrations_dir)
          contract_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run league format and deployment safety checks
        run: |
          python -m pytest -q \
            tests/test_league_match_format_contract.py \
            tests/test_api_contract_admin_match_uploader_singles.py \
            tests/test_production_deployment_hardening.py

      - name: Publish clean contract commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-finalize-league-format-contract.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize league match-format migration contract'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort)"
          allowed="$(cat <<'EOF' | sort
          apps/web/app/admin/league-manager/LeagueManagerPanel.tsx
          apps/web/app/admin/match-uploader/MatchUploaderForm.tsx
          apps/web/lib/adminLeagueManagerApi.ts
          apps/web/lib/adminMatchUploaderApi.ts
          apps/web/tests/league-match-format.cjs
          config/production_migration_contract.json
          jupr_app/domain/match_processing.py
          jupr_app/domain/singles_match_processing.py
          jupr_app/services/admin_league_manager_create_service.py
          jupr_app/services/admin_league_manager_service.py
          jupr_app/services/admin_match_uploader_service.py
          services/api/admin_league_manager_routes.py
          supabase/migrations/20260731033000_league_match_format.sql
          tests/test_api_contract_admin_match_uploader_singles.py
          tests/test_league_match_format_contract.py
          EOF
          )"
          test "$actual" = "$allowed"
          git push origin HEAD:agent/league-match-format-20260731
