name: Recover reviewed unavailable API replica

on:
  push:
    branches: [rollback-feb8]
    paths: [.github/workflows/production-machine-diagnostics.yml, scripts/recover_weekly_report_replica.py]

permissions:
  contents: read

concurrency:
  group: jupr-production-api-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replace exact unavailable replica after health and storage checks
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/rollback-feb8
          python -m scripts.recover_weekly_report_replica
