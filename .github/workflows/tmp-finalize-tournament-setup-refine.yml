name: Temporary Tournament Setup refinement finalizer

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/tournament-setup-event-division-refine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-event-division-refine
          fetch-depth: 0

      - name: Remove generated web-file changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/staging -- apps/web/next-env.d.ts apps/web/package-lock.json
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused Python test dependency
        run: python -m pip install pytest

      - name: Run focused Tournament Setup and deployment contracts
        run: |
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_event_division_refine.py \
            tests/test_production_deployment_hardening.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies exactly
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run Tournament Setup builder and component contracts
        working-directory: apps/web
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tournament-setup-builder"
          npx tsc app/admin/tournament-setup/tournamentSetupBuilder.ts \
            --target ES2022 \
            --module CommonJS \
            --moduleResolution Node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir "$RUNNER_TEMP/tournament-setup-builder"
          JUPR_TOURNAMENT_SETUP_BUILDER_MODULE="$RUNNER_TEMP/tournament-setup-builder/tournamentSetupBuilder.js" \
            node app/admin/tournament-setup/tournamentSetupBuilder.test.mjs
          npm run test:component

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application-only refinement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-finalize-tournament-setup-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Tournament Setup events and divisions"
          git push origin HEAD:agent/tournament-setup-event-division-refine
