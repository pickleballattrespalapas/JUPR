name: Temporary unscored Round-Robin verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-unscored-round-robin-38af43'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 38af439e148728958f135802c12bc52389b64c65
      API_BASE: https://juprleagues-api-staging.fly.dev
      CLUB_SLUG: tres-palapas
      CLUB_ID: tres_palapas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 "$API_BASE/health" -o evidence/health.json; then
              source_sha="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image_sha="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$source_sha image=$image_sha"
              if [ "$source_sha" = "$EXPECTED_SHA" ] && { [ -z "$image_sha" ] || [ "$image_sha" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('evidence/health.json').read_text())

          def find_key(value, key):
              if isinstance(value, dict):
                  if key in value:
                      return value[key]
                  for child in value.values():
                      found = find_key(child, key)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_key(child, key)
                      if found is not None:
                          return found
              return None

          def first(*keys):
              for key in keys:
                  value = find_key(payload, key)
                  if value is not None:
                      return value
              return None

          observed = {
              'environment': first('environment'),
              'source_sha': first('git_commit_sha', 'source_commit_sha', 'source_sha', 'commit_sha'),
              'image_sha': first('image_build_git_sha', 'image_git_sha'),
              'fly_app': first('fly_app_name', 'app_name', 'app'),
              'write_wave': first('write_wave'),
              'staging_write_wave': first('staging_write_wave'),
              'business_data_write_wave_active': first('business_data_write_wave_active'),
              'email_mode': first('email_mode'),
              'live_player_update_email_enabled': first('live_player_update_email_enabled'),
              'public_live_production_override_enabled': first('public_live_production_override_enabled'),
              'supabase_project_ref': first('supabase_project_ref', 'supabase_project'),
          }
          expected = {
              'environment': 'staging',
              'source_sha': os.environ['EXPECTED_SHA'],
              'image_sha': os.environ['EXPECTED_SHA'],
              'fly_app': 'juprleagues-api-staging',
              'write_wave': 'open',
              'staging_write_wave': 'open',
              'business_data_write_wave_active': True,
              'email_mode': 'dry_run',
              'live_player_update_email_enabled': False,
              'public_live_production_override_enabled': False,
              'supabase_project_ref': 'sijpxjxvdtrehmqvirfi',
          }
          Path('evidence/observed-health-contract.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          mismatches = {key: {'expected': expected[key], 'actual': observed.get(key)} for key in expected if observed.get(key) != expected[key]}
          print(json.dumps(observed, indent=2, sort_keys=True))
          if mismatches:
              print(json.dumps(mismatches, indent=2, sort_keys=True))
              raise SystemExit(1)
          PY

      - name: Verify Match Uploader remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API_BASE/admin/clubs/$CLUB_ID/match-uploader/status" -o evidence/match-uploader-status.json
          jq -e '(.enabled == true) and (.singles_write_enabled == true) and ((.status // "") != "guarded_off")' evidence/match-uploader-status.json

      - name: Exercise unscored Round-Robin lifecycle
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(date +%s)-${RANDOM}"
          export TITLE="Acceptance Unscored RR ${suffix}"
          export P1="Acceptance U1 ${suffix}"
          export P2="Acceptance U2 ${suffix}"
          export P3="Acceptance U3 ${suffix}"
          export P4="Acceptance U4 ${suffix}"

          jq -n \
            --arg title "$TITLE" \
            --arg p1 "$P1" --arg p2 "$P2" --arg p3 "$P3" --arg p4 "$P4" \
            '{generator_kind:"round_robin",play_format:"singles",title:$title,participant_names:[$p1,$p2,$p3,$p4],participant_player_ids:{},total_rounds:2,court_count:2,standings_sort:"wins",scoring_mode:"unscored"}' \
            > evidence/unscored-preview-request.json

          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-preview-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/preview" \
            -o evidence/unscored-preview.json

          jq -e '.preview.generatorKind == "round_robin" and .preview.scoringMode == "unscored" and (.preview.rounds | length) == 2' evidence/unscored-preview.json
          fingerprint="$(jq -r '.preview.previewFingerprint' evidence/unscored-preview.json)"
          test -n "$fingerprint"

          jq --arg fingerprint "$fingerprint" --arg key "start-unscored-${suffix}" \
            '. + {preview_fingerprint:$fingerprint,idempotency_key:$key}' \
            evidence/unscored-preview-request.json > evidence/unscored-start-request.json

          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-start-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions" \
            -o evidence/unscored-start.json

          session_key="$(jq -r '.session.session_key' evidence/unscored-start.json)"
          edit_token="$(jq -r '.edit_token' evidence/unscored-start.json)"
          version="$(jq -r '.session.version' evidence/unscored-start.json)"
          test -n "$session_key"; test -n "$edit_token"; test -n "$version"
          jq -e '.session.scoring_mode == "unscored" and .session.event.scoringMode == "unscored" and .session.current_round_number == 1 and .session.event.rounds[0].status == "active" and (.session.standings | length) == 0' evidence/unscored-start.json

          jq -n --arg token "$edit_token" --argjson version "$version" --arg key "played-r1-${suffix}" \
            '{edit_token:$token,expected_version:$version,idempotency_key:$key}' > evidence/unscored-played-r1-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-played-r1-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions/$session_key/rounds/1/played" \
            -o evidence/unscored-played-r1.json

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('evidence/unscored-played-r1.json').read_text())
          session = payload['session']
          r1 = next(row for row in session['event']['rounds'] if int(row['number']) == 1)
          assert r1['status'] == 'played', r1
          matches = r1.get('matches') or [match for court in r1.get('courts') or [] for match in court.get('matches') or []]
          assert matches
          assert all(match.get('scoreA') is None and match.get('scoreB') is None for match in matches)
          assert session.get('standings') == []
          PY

          version="$(jq -r '.session.version' evidence/unscored-played-r1.json)"
          jq -n --arg token "$edit_token" --argjson version "$version" --arg key "advance-r1-${suffix}" \
            '{edit_token:$token,expected_version:$version,idempotency_key:$key}' > evidence/unscored-advance-r1-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-advance-r1-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions/$session_key/advance" \
            -o evidence/unscored-advance-r1.json
          jq -e '.session.status == "active" and .session.current_round_number == 2 and (.session.event.rounds[] | select(.number == 2) | .status == "active") and (.session.standings | length) == 0' evidence/unscored-advance-r1.json

          version="$(jq -r '.session.version' evidence/unscored-advance-r1.json)"
          jq -n --arg token "$edit_token" --argjson version "$version" --arg key "played-r2-${suffix}" \
            '{edit_token:$token,expected_version:$version,idempotency_key:$key}' > evidence/unscored-played-r2-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-played-r2-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions/$session_key/rounds/2/played" \
            -o evidence/unscored-played-r2.json

          version="$(jq -r '.session.version' evidence/unscored-played-r2.json)"
          jq -n --arg token "$edit_token" --argjson version "$version" --arg key "finish-unscored-${suffix}" \
            '{edit_token:$token,expected_version:$version,idempotency_key:$key}' > evidence/unscored-finish-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d @evidence/unscored-finish-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions/$session_key/advance" \
            -o evidence/unscored-finish.json
          jq -e '.session.status == "completed" and .session.scoring_mode == "unscored" and (.session.standings | length) == 0' evidence/unscored-finish.json
          printf '%s\n' "$session_key" > evidence/unscored-session-key.txt

      - name: Exercise scored results to standings flow contract
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(date +%s)-${RANDOM}"
          jq -n --arg suffix "$suffix" \
            '{generator_kind:"round_robin",play_format:"singles",title:("Acceptance Scored Flow " + $suffix),participant_names:[("Acceptance S1 " + $suffix),("Acceptance S2 " + $suffix),("Acceptance S3 " + $suffix),("Acceptance S4 " + $suffix)],participant_player_ids:{},total_rounds:2,court_count:2,standings_sort:"points",scoring_mode:"scored"}' \
            > evidence/scored-preview-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' -d @evidence/scored-preview-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/preview" -o evidence/scored-preview.json
          fingerprint="$(jq -r '.preview.previewFingerprint' evidence/scored-preview.json)"
          jq --arg fingerprint "$fingerprint" --arg key "start-scored-${suffix}" '. + {preview_fingerprint:$fingerprint,idempotency_key:$key}' \
            evidence/scored-preview-request.json > evidence/scored-start-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' -d @evidence/scored-start-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions" -o evidence/scored-start.json
          session_key="$(jq -r '.session.session_key' evidence/scored-start.json)"
          edit_token="$(jq -r '.edit_token' evidence/scored-start.json)"
          version="$(jq -r '.session.version' evidence/scored-start.json)"

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('evidence/scored-start.json').read_text())
          session = payload['session']
          r1 = next(row for row in session['event']['rounds'] if int(row['number']) == 1)
          matches = r1.get('matches') or [match for court in r1.get('courts') or [] for match in court.get('matches') or []]
          scores = []
          for index, match in enumerate(matches):
              scores.append({'match_id': match['id'], 'score_a': 11, 'score_b': 5 + index})
          Path('evidence/scored-r1-scores.json').write_text(json.dumps(scores))
          PY
          jq -n --arg token "$edit_token" --argjson version "$version" --arg key "scores-r1-${suffix}" --slurpfile scores evidence/scored-r1-scores.json \
            '{edit_token:$token,expected_version:$version,idempotency_key:$key,scores:$scores[0]}' > evidence/scored-r1-request.json
          curl -fsS --max-time 30 -X PATCH -H 'Content-Type: application/json' -d @evidence/scored-r1-request.json \
            "$API_BASE/clubs/$CLUB_SLUG/play-generators/sessions/$session_key/rounds/1/scores" -o evidence/scored-r1.json
          jq -e '.session.current_round_number == 1 and (.session.event.rounds[] | select(.number == 1) | .status == "saved") and (.session.standings | length) == 4 and .session.standings_sort == "points"' evidence/scored-r1.json
          printf '%s\n' "$session_key" > evidence/scored-session-key.txt

      - name: Verify scored and unscored UI contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          public_setup = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorWorkspace.tsx').read_text()
          admin_setup = Path('apps/web/app/admin/play-generators/GeneratorWorkspace.tsx').read_text()
          public_round = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorRoundRunner.tsx').read_text()
          admin_round = Path('apps/web/app/admin/play-generators/GeneratorRoundRunner.tsx').read_text()
          public_standings = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorStandings.tsx').read_text()
          admin_standings = Path('apps/web/app/admin/play-generators/GeneratorStandings.tsx').read_text()
          public_routes = Path('services/api/public_play_generator_routes.py').read_text()
          admin_routes = Path('services/api/admin_play_generator_routes.py').read_text()
          engine = Path('jupr_app/domain/adaptive_play_engine.py').read_text()

          for setup in (public_setup, admin_setup):
              assert 'Round scoring' in setup
              assert 'Scored — enter scores and show standings' in setup
              assert 'Unscored — mark each round played' in setup
              assert 'Unscored sessions have no score fields or standings between rounds.' in setup
              assert 'scoring_mode:' in setup

          for runner in (public_round, admin_round):
              assert 'Round Played' in runner
              assert 'View standings and continue' in runner
              assert 'scoredSession ?' in runner
              assert 'markRoundPlayed' in runner
              assert '/played' in runner

          for standings in (public_standings, admin_standings):
              assert 'Continue to Round' in standings
              assert 'This unscored Round-Robin does not use standings.' in standings
              assert '/advance' in standings

          assert 'mark_public_play_generator_round_played' in public_routes
          assert 'mark_admin_play_generator_round_played' in admin_routes
          assert 'SCORING_MODES' in engine
          assert 'normalize_scoring_mode' in engine
          assert 'mark_generator_round_played' in engine
          Path('evidence/ui-source-contract.txt').write_text('Scored standings flow and unscored Round-Robin UI contracts passed.\n')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: unscored-round-robin-evidence
          path: evidence
          if-no-files-found: error
