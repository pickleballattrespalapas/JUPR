name: Temporary unscored Round-Robin verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-unscored-round-robin-dd0e38'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: dd0e382690a43df51998ce5b5d8bf127ac9cce2f
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
      MATCH_UPLOADER_STATUS_URL: https://juprleagues-api-staging.fly.dev/admin/clubs/tres_palapas/match-uploader/status
      PUBLIC_PREVIEW_URL: https://juprleagues-api-staging.fly.dev/clubs/tres-palapas/play-generators/preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 20 "$FLY_HEALTH_URL" -o evidence/health.json; then
              source_sha="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image_sha="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$source_sha image=$image_sha"
              if [ "$source_sha" = "$EXPECTED_SHA" ] && { [ -z "$image_sha" ] || [ "$image_sha" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('evidence/health.json').read_text())
          expected_sha = os.environ['EXPECTED_SHA']

          def find_key(value, key):
              if isinstance(value, dict):
                  if key in value:
                      return value[key]
                  for child in value.values():
                      found = find_key(child, key)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_key(child, key)
                      if found is not None:
                          return found
              return None

          def first(*keys):
              for key in keys:
                  value = find_key(payload, key)
                  if value is not None:
                      return value
              return None

          observed = {
              'environment': first('environment'),
              'source_sha': first('git_commit_sha', 'source_commit_sha', 'source_sha', 'commit_sha'),
              'image_sha': first('image_build_git_sha', 'image_git_sha'),
              'fly_app': first('fly_app_name', 'app_name', 'app'),
              'write_wave': first('write_wave'),
              'staging_write_wave': first('staging_write_wave'),
              'business_data_write_wave_active': first('business_data_write_wave_active'),
              'email_mode': first('email_mode'),
              'live_player_update_email_enabled': first('live_player_update_email_enabled'),
              'public_live_production_override_enabled': first('public_live_production_override_enabled'),
              'supabase_project_ref': first('supabase_project_ref', 'supabase_project'),
          }
          expected = {
              'environment': 'staging',
              'source_sha': expected_sha,
              'image_sha': expected_sha,
              'fly_app': 'juprleagues-api-staging',
              'write_wave': 'open',
              'staging_write_wave': 'open',
              'business_data_write_wave_active': True,
              'email_mode': 'dry_run',
              'live_player_update_email_enabled': False,
              'public_live_production_override_enabled': False,
              'supabase_project_ref': 'sijpxjxvdtrehmqvirfi',
          }
          Path('evidence/observed-health-contract.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          mismatches = {
              key: {'expected': expected[key], 'actual': observed.get(key)}
              for key in expected
              if observed.get(key) != expected[key]
          }
          print(json.dumps(observed, indent=2, sort_keys=True))
          if mismatches:
              print('MISMATCHES=' + json.dumps(mismatches, indent=2, sort_keys=True))
              raise SystemExit(1)
          PY

      - name: Verify Match Uploader remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$MATCH_UPLOADER_STATUS_URL" -o evidence/match-uploader-status.json
          jq -e '(.enabled == true) and (.singles_write_enabled == true) and ((.status // "") != "guarded_off")' evidence/match-uploader-status.json

      - name: Verify public unscored preview and Ladder guard
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"generator_kind":"round_robin","play_format":"doubles","title":"Unscored verifier","participant_names":["Verify A","Verify B","Verify C","Verify D"],"participant_player_ids":{},"total_rounds":3,"court_count":1,"standings_sort":"wins","scoring_mode":"unscored"}' \
            "$PUBLIC_PREVIEW_URL" -o evidence/unscored-preview.json
          jq -e '
            (.ok == true)
            and (.preview.generatorKind == "round_robin")
            and (.preview.scoringMode == "unscored")
            and (.preview.rounds | length == 3)
          ' evidence/unscored-preview.json

          status="$(curl -sS -o evidence/unscored-ladder.json -w '%{http_code}' --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"generator_kind":"ladder","play_format":"doubles","title":"Invalid unscored ladder","participant_names":["Verify A","Verify B","Verify C","Verify D"],"participant_player_ids":{},"total_rounds":3,"court_count":1,"standings_sort":"wins","scoring_mode":"unscored"}' \
            "$PUBLIC_PREVIEW_URL")"
          test "$status" = "400"
          jq -e '(.detail | tostring | test("requires scored rounds"; "i"))' evidence/unscored-ladder.json

      - name: Verify domain progression and deployed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from jupr_app.domain.adaptive_play_engine import (
              advance_generator_event,
              create_generator_preview,
              generator_event_standings,
              history_before_round,
              mark_generator_round_played,
              start_generator_event,
          )

          preview = create_generator_preview(
              generator_kind='round_robin',
              play_format='singles',
              title='Verifier',
              participant_names=['A', 'B', 'C'],
              total_rounds=3,
              court_count=1,
              scoring_mode='unscored',
          )
          event = start_generator_event(preview)
          assert generator_event_standings(event) == []
          played = mark_generator_round_played(event, round_number=1)
          assert played['rounds'][0]['status'] == 'played'
          assert sum(history_before_round(played, 2)['games'].values()) == 2
          advanced = advance_generator_event(played)
          assert advanced['currentRoundNumber'] == 2
          assert advanced['rounds'][1]['status'] == 'active'

          admin_setup = Path('apps/web/app/admin/play-generators/GeneratorWorkspace.tsx').read_text()
          public_setup = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorWorkspace.tsx').read_text()
          admin_runner = Path('apps/web/app/admin/play-generators/GeneratorRoundRunner.tsx').read_text()
          public_runner = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorRoundRunner.tsx').read_text()
          admin_standings = Path('apps/web/app/admin/play-generators/GeneratorStandings.tsx').read_text()
          public_standings = Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorStandings.tsx').read_text()
          admin_routes = Path('services/api/admin_play_generator_routes.py').read_text()
          public_routes = Path('services/api/public_play_generator_routes.py').read_text()
          write_manifest = Path('scripts/staging_write_waves.py').read_text()

          for setup in (admin_setup, public_setup):
              assert 'Unscored — mark each round played' in setup
              assert 'scoring_mode' in setup
          for runner in (admin_runner, public_runner):
              assert 'Round Played' in runner
              assert 'View standings and continue' in runner
          for standings in (admin_standings, public_standings):
              assert 'Continue to Round' in standings
              assert 'This unscored Round-Robin does not use standings.' in standings
              assert '/advance' in standings
          assert '/played' in admin_routes
          assert '/played' in public_routes
          assert write_manifest.count('play-generators/sessions/{session_key}/rounds/{round_number}/played') == 2

          Path('evidence/source-contract.txt').write_text(
              'Unscored Round-Robin and scored standings progression contracts passed.\n'
          )
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: unscored-round-robin-evidence
          path: evidence
          if-no-files-found: error
