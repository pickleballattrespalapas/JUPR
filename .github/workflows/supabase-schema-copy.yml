name: Supabase Schema Copy (Prod -> Test)

# WARNING:
# - This workflow is for staging/Test operations only.
# - Never point SUPABASE_TEST_DATABASE_URL at production.
# - Do not use this workflow to copy production data.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose operation mode"
        required: true
        type: choice
        options:
          - dump-prod-schema-artifact
          - apply-prod-schema-to-test
      confirmation:
        description: "For apply mode only, type APPLY SCHEMA TO STAGING"
        required: false
        type: string

jobs:
  schema-copy:
    name: Run schema copy mode
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    env:
      # Secrets are injected at runtime and must never be committed.
      SUPABASE_PROD_DATABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
      SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SCHEMA_COPY_MODE: ${{ inputs.mode }}
      SCHEMA_COPY_CONFIRMATION: ${{ inputs.confirmation }}
      PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg lsb-release

          sudo install -d /usr/share/postgresql-common/pgdg
          wget -qO /tmp/postgresql.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo rm -f /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          sudo gpg --batch --yes --dearmor \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
            /tmp/postgresql.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/pg_dump" --version
          "$PG_BIN/psql" --version

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROD_DATABASE_URL:-}" ]; then
            echo "Missing SUPABASE_PROD_DATABASE_URL secret"
            exit 1
          fi
          if [ -z "${SUPABASE_TEST_DATABASE_URL:-}" ]; then
            echo "Missing SUPABASE_TEST_DATABASE_URL secret"
            exit 1
          fi
          if [ "$SUPABASE_PROD_DATABASE_URL" = "$SUPABASE_TEST_DATABASE_URL" ]; then
            echo "Production and staging database URLs must not match"
            exit 1
          fi
          if [ "$SCHEMA_COPY_MODE" = "apply-prod-schema-to-test" ] && [ "$SCHEMA_COPY_CONFIRMATION" != "APPLY SCHEMA TO STAGING" ]; then
            echo "Apply mode requires the exact confirmation: APPLY SCHEMA TO STAGING"
            exit 1
          fi
          if [ "$SCHEMA_COPY_MODE" = "apply-prod-schema-to-test" ] && [ -z "${EXPECTED_SUPABASE_PROJECT_REF:-}" ]; then
            echo "STAGING_SUPABASE_PROJECT_REF environment variable is required for apply mode"
            exit 1
          fi

      - name: Verify staging database isolation
        if: ${{ inputs.mode == 'apply-prod-schema-to-test' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit

          prod = os.environ["SUPABASE_PROD_DATABASE_URL"].lower()
          staging = os.environ["SUPABASE_TEST_DATABASE_URL"].lower()
          expected = os.environ["EXPECTED_SUPABASE_PROJECT_REF"].strip().lower()
          parsed = urlsplit(staging)
          safe_username = unquote(parsed.username or "<missing>")
          safe_host = parsed.hostname or "<missing>"
          safe_port = parsed.port or "<default>"
          safe_database = (parsed.path or "/<missing>").lstrip("/")
          print(f"Expected staging project ref: {expected}")
          print(
              "Parsed staging target: "
              f"username={safe_username}, host={safe_host}, "
              f"port={safe_port}, database={safe_database}"
          )
          if not expected or expected not in staging:
              raise SystemExit("Staging database URL does not contain the expected staging Supabase project ref")
          if expected in prod:
              raise SystemExit("Production database URL unexpectedly contains the staging Supabase project ref")
          print(f"Verified staging database target project ref: {expected}")
          PY

      - name: Check production database connectivity
        run: |
          echo "Checking production database connectivity..."
          "$PG_BIN/psql" "$SUPABASE_PROD_DATABASE_URL" -c "select current_database(), current_user, now();" >/dev/null

      - name: Check test database connectivity
        if: ${{ inputs.mode == 'apply-prod-schema-to-test' }}
        run: |
          set -euo pipefail
          echo "Checking test database connectivity..."
          "$PG_BIN/psql" "$SUPABASE_TEST_DATABASE_URL" -c "select current_database(), current_user, now();" >/dev/null

      - name: Dump production public schema to artifact file
        if: ${{ inputs.mode == 'dump-prod-schema-artifact' }}
        run: |
          set -euo pipefail
          "$PG_BIN/pg_dump" \
            --schema-only \
            --schema=public \
            --no-owner \
            --no-privileges \
            "$SUPABASE_PROD_DATABASE_URL" \
            > prod_public_schema.sql

      - name: Upload production public schema artifact
        if: ${{ inputs.mode == 'dump-prod-schema-artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-public-schema
          path: prod_public_schema.sql
          if-no-files-found: error

      - name: Apply production public schema to Supabase Test branch
        if: ${{ inputs.mode == 'apply-prod-schema-to-test' }}
        run: |
          set -euo pipefail
          # SAFETY WARNING:
          # This step must target the Supabase Test branch database only.
          # Never set SUPABASE_TEST_DATABASE_URL to a production database.
          # Schema-only copy; this does not copy table data.
          "$PG_BIN/pg_dump" \
            --schema-only \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            "$SUPABASE_PROD_DATABASE_URL" \
            | "$PG_BIN/psql" "$SUPABASE_TEST_DATABASE_URL"
