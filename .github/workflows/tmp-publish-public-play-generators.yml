name: Temporary public play generator publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/public-round-robin-ladder-generators' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-round-robin-ladder-generators
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply public generator mirror
        run: python scripts/tmp_public_play_generator_mirror.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile public generator backend
        run: |
          python -m compileall -q \
            jupr_app/services/public_play_generator_service.py \
            services/api/public_play_generator_routes.py

      - name: Run focused public and compatibility tests
        run: |
          python -m pytest -q \
            tests/test_public_play_generator_service.py \
            tests/test_api_contract_public_play_generators.py \
            tests/test_adaptive_play_engine.py \
            tests/test_admin_play_generator_service.py \
            tests/test_api_contract_play_generators.py \
            tests/test_public_live_write_service.py \
            tests/test_api_live_sessions_contract.py \
            tests/test_production_deployment_hardening.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:component

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Verify clean public product surface
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/clubs/'[clubSlug]'/play/page.tsx
          test -f apps/web/app/clubs/'[clubSlug]'/round-robin-generator/page.tsx
          test -f apps/web/app/clubs/'[clubSlug]'/ladder-generator/page.tsx
          test -f apps/web/app/clubs/'[clubSlug]'/round-robin-generator/sessions/'[sessionKey]'/rounds/'[roundNumber]'/page.tsx
          test -f apps/web/app/clubs/'[clubSlug]'/ladder-generator/sessions/'[sessionKey]'/rounds/'[roundNumber]'/page.tsx
          grep -q 'label: "Play"' apps/web/components/PublicSiteHeader.tsx
          grep -q 'Download one-sheet PDF' apps/web/app/clubs/'[clubSlug]'/play-generators/PublicGeneratorWorkspace.tsx
          grep -q 'View-only link' apps/web/app/clubs/'[clubSlug]'/play-generators/PublicGeneratorRoundRunner.tsx
          if grep -q 'Publish official matches' apps/web/app/clubs/'[clubSlug]'/play-generators/PublicGeneratorRoundRunner.tsx; then
            echo 'Public generator must not expose official publish.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit clean application change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-publish-public-play-generators.yml
          rm scripts/tmp_public_play_generator_mirror.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror play generators on the public site"
          git push origin HEAD:agent/public-round-robin-ladder-generators
