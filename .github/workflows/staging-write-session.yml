name: Retired Staging Write Session

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain persistent staging write mode
        run: |
          echo "Temporary staging write leases are retired."
          echo "Staging writes remain open for ongoing acceptance testing."
          echo "Use the emergency disable workflow only when staging writes must be deliberately closed."
