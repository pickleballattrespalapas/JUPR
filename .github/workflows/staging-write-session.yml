name: Retired Staging Write Session

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain fail-closed staging test mode
        run: |
          echo "Temporary staging write leases are retired."
          echo "Staging is read-only at rest; automatic deployments use write_wave=none."
          echo "Use one explicitly approved named wave for a bounded test, then restore none."
