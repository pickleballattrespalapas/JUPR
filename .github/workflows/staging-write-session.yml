name: Protected Staging Write Session
run-name: >-
  Staging write session #${{ github.event.issue.number }} ·
  ${{ github.event.action }}

on:
  issues:
    types:
      - reopened
      - edited

permissions: {}

jobs:
  authorize:
    name: Authorize exact owner control command
    if: >-
      github.event.repository.id == 1120897513 &&
      github.event.sender.id == 250933369 &&
      github.event.issue.number == 1062 &&
      github.event.issue.title == 'Protected staging write session control' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.contract.outputs.authorized }}
      candidate_sha: ${{ steps.contract.outputs.candidate_sha }}
      command: ${{ steps.contract.outputs.command }}
      expected_write_wave: ${{ steps.contract.outputs.expected_write_wave }}
      issue_number: ${{ steps.contract.outputs.issue_number }}
      lease_expires_at: ${{ steps.contract.outputs.lease_expires_at }}
      lease_started_at: ${{ steps.contract.outputs.lease_started_at }}
      session_nonce: ${{ steps.contract.outputs.session_nonce }}
      superseded: ${{ steps.contract.outputs.superseded }}
      write_wave: ${{ steps.contract.outputs.write_wave }}
    steps:
      - name: Check out protected default controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: rollback-feb8

      - name: Verify protected registry matches canonical staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/rollback-feb8:refs/remotes/origin/rollback-feb8 \
            +refs/heads/staging:refs/remotes/origin/staging
          DEFAULT_SHA="$(git rev-parse refs/remotes/origin/rollback-feb8)"
          if [ "$GITHUB_REF" != "refs/heads/rollback-feb8" ] || \
             [ "$GITHUB_SHA" != "$DEFAULT_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$DEFAULT_SHA" ]; then
            echo "Write-session controller must execute from protected default." >&2
            exit 2
          fi
          for path in \
            .github/workflows/fly_api_staging_deploy.yml \
            .github/workflows/staging-evidence-automation.yml \
            .github/workflows/staging-write-recovery.yml \
            .github/workflows/staging-write-session.yml \
            scripts/staging_evidence_automation.py \
            scripts/staging_write_session.py \
            scripts/staging_write_waves.py
          do
            if ! cmp --silent \
              "$path" \
              <(git show "refs/remotes/origin/staging:$path"); then
              echo "Protected registry is not synchronized with staging: $path" >&2
              exit 2
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authorize exact live issue body
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTHORIZATION_JSON="$RUNNER_TEMP/staging-write-session-authorization.json"
          python scripts/staging_write_session.py authorize \
            --event-path "$GITHUB_EVENT_PATH" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$AUTHORIZATION_JSON"
          for name in \
            authorized \
            candidate_sha \
            command \
            expected_write_wave \
            issue_number \
            lease_expires_at \
            lease_started_at \
            session_nonce \
            superseded \
            write_wave
          do
            printf '%s=%s\n' \
              "$name" \
              "$(jq -r --arg name "$name" '.[$name] // ""' "$AUTHORIZATION_JSON")"
          done >> "$GITHUB_OUTPUT"

  apply-command:
    name: Apply one fail-closed write transition
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: staging
    permissions:
      actions: write
      contents: read
      issues: write
    concurrency:
      group: jupr-staging-api-and-parity-evidence
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
      COMMAND: ${{ needs.authorize.outputs.command }}
      EXPECTED_WRITE_WAVE: ${{ needs.authorize.outputs.expected_write_wave }}
      ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
      LEASE_EXPIRES_AT: ${{ needs.authorize.outputs.lease_expires_at }}
      LEASE_STARTED_AT: ${{ needs.authorize.outputs.lease_started_at }}
      SESSION_NONCE: ${{ needs.authorize.outputs.session_nonce }}
      WRITE_WAVE: ${{ needs.authorize.outputs.write_wave }}
    steps:
      - name: Check out exact canonical staging candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: staging

      - name: Verify candidate did not drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/staging:refs/remotes/origin/staging
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ] || \
             [ "$(git rev-parse refs/remotes/origin/staging)" != "$CANDIDATE_SHA" ]; then
            echo "Canonical staging changed after owner authorization." >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record accepted command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(
            printf '%s\n' \
              "### Staging write session command accepted" \
              "" \
              "- Command: \`$COMMAND\`" \
              "- Expected wave: \`$EXPECTED_WRITE_WAVE\`" \
              "- Target wave: \`$WRITE_WAVE\`" \
              "- Candidate: \`$CANDIDATE_SHA\`" \
              "- Controller: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          )"
          printf '%s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="$STATUS" \
              --silent
          then
            echo "::warning::Protected issue comment unavailable; status is preserved in the workflow summary."
            echo "- Issue comment: unavailable; protected issue remains locked." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve exact Vercel candidate before opening writes
        if: env.COMMAND != 'close'
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py resolve-vercel \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 600 \
            --poll-seconds 10 \
            > "$RUNNER_TEMP/vercel-candidate.json"

      - name: Pre-attest exact expected staging state
        if: env.COMMAND != 'close'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-before.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-identity \
            --candidate-sha "$CANDIDATE_SHA" \
            --vercel-json "$RUNNER_TEMP/vercel-candidate.json" \
            --fly-json "$RUNNER_TEMP/fly-before.json" \
            --expected-write-wave "$EXPECTED_WRITE_WAVE"

      - name: Restore none before advance or close
        id: transition-none
        if: env.COMMAND == 'advance' || env.COMMAND == 'close'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input write_wave=none \
            --input "expected_candidate_sha=$CANDIDATE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/fly-transition-none-dispatch.json"
          NONE_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/fly-transition-none-dispatch.json")"
          printf 'run_id=%s\n' "$NONE_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$NONE_RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 3600
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-transition-none.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-final-none \
            --fly-json "$RUNNER_TEMP/fly-transition-none.json"

      - name: Ensure lease remains live before activation
        if: env.COMMAND == 'open' || env.COMMAND == 'advance'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPIRES_EPOCH="$(date -u -d "$LEASE_EXPIRES_AT" +%s)"
          if [ "$(date -u +%s)" -ge "$EXPIRES_EPOCH" ]; then
            echo "The authorized write lease expired before activation." >&2
            exit 2
          fi
          python scripts/staging_write_session.py should-expire \
            --command "$COMMAND" \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-write-wave "$EXPECTED_WRITE_WAVE" \
            --write-wave "$WRITE_WAVE" \
            --session-nonce "$SESSION_NONCE" \
            --lease-started-at "$LEASE_STARTED_AT" \
            --lease-expires-at "$LEASE_EXPIRES_AT" \
            > "$RUNNER_TEMP/live-command-before-activation.json"
          jq -e \
            --arg nonce "$SESSION_NONCE" \
            'select(
              .expire == false and
              .session_nonce == $nonce and
              (has("reason") | not)
            )' \
            "$RUNNER_TEMP/live-command-before-activation.json" >/dev/null

      - name: Activate exactly one allowlisted write wave
        id: activate
        if: env.COMMAND == 'open' || env.COMMAND == 'advance'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input "write_wave=$WRITE_WAVE" \
            --input "expected_candidate_sha=$CANDIDATE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/fly-write-session-dispatch.json"
          ACTIVE_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/fly-write-session-dispatch.json")"
          printf 'run_id=%s\n' "$ACTIVE_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$ACTIVE_RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 3600

      - name: Attest active wave and dry-run email
        if: env.COMMAND == 'open' || env.COMMAND == 'advance'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/fly-active.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-identity \
            --candidate-sha "$CANDIDATE_SHA" \
            --vercel-json "$RUNNER_TEMP/vercel-candidate.json" \
            --fly-json "$RUNNER_TEMP/fly-active.json" \
            --expected-write-wave "$WRITE_WAVE" \
            > "$RUNNER_TEMP/active-session-identity.json"
          EXPIRES_EPOCH="$(date -u -d "$LEASE_EXPIRES_AT" +%s)"
          if [ "$(date -u +%s)" -ge "$EXPIRES_EPOCH" ]; then
            echo "The write lease expired during activation." >&2
            exit 2
          fi

      - name: Record ready session
        if: env.COMMAND == 'open' || env.COMMAND == 'advance'
        shell: bash
        env:
          ACTIVE_RUN_ID: ${{ steps.activate.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
          NONE_RUN_ID: ${{ steps.transition-none.outputs.run_id }}
        run: |
          set -euo pipefail
          STATUS="$(
            printf '%s\n' \
              "### Staging write session ready" \
              "" \
              "- Active wave: \`$WRITE_WAVE\`" \
              "- Candidate: \`$CANDIDATE_SHA\`" \
              "- Lease expires: \`$LEASE_EXPIRES_AT\`" \
              "- Email: \`dry_run\`" \
              "- Production: untouched" \
              "- Activation: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ACTIVE_RUN_ID" \
              "${NONE_RUN_ID:+- Intermediate safe restore: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$NONE_RUN_ID}"
          )"
          printf '%s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="$STATUS" \
              --silent
          then
            echo "::warning::Protected issue comment unavailable; status is preserved in the workflow summary."
            echo "- Issue comment: unavailable; protected issue remains locked." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record safe close and close control issue
        if: env.COMMAND == 'close'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NONE_RUN_ID: ${{ steps.transition-none.outputs.run_id }}
        run: |
          set -euo pipefail
          STATUS="$(
            printf '%s\n' \
              "### Staging write session closed" \
              "" \
              "- Candidate: \`$CANDIDATE_SHA\`" \
              "- Final wave: \`none\`" \
              "- Business writes: disabled" \
              "- Email: \`dry_run\`" \
              "- Safe restore: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$NONE_RUN_ID"
          )"
          printf '%s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="$STATUS" \
              --silent
          then
            echo "::warning::Protected issue comment unavailable; status is preserved in the workflow summary."
            echo "- Issue comment: unavailable; protected issue remains locked." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f state=closed \
            -f state_reason=completed \
            --silent

      - name: Restore none after any failed transition
        id: failure-restore
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          python scripts/staging_evidence_automation.py candidate-sha \
            > "$RUNNER_TEMP/failure-current-staging.json"
          RESTORE_SHA="$(jq -r '.candidate_sha' "$RUNNER_TEMP/failure-current-staging.json")"
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input write_wave=none \
            --input "expected_candidate_sha=$RESTORE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/failure-none-dispatch.json"
          RESTORE_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/failure-none-dispatch.json")"
          printf 'run_id=%s\n' "$RESTORE_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$RESTORE_RUN_ID" \
            --candidate-sha "$RESTORE_SHA" \
            --timeout-seconds 7200
          python scripts/staging_evidence_automation.py fly-health \
            > "$RUNNER_TEMP/failure-final-health.json"
          python scripts/staging_evidence_automation.py verify-final-none \
            --fly-json "$RUNNER_TEMP/failure-final-health.json"

      - name: Record failed command and close control issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ steps.failure-restore.outputs.run_id }}
        run: |
          set -u
          STATUS="$(
            printf '%s\n' \
              "### Staging write session failed safely" \
              "" \
              "- Requested command: \`$COMMAND\`" \
              "- Requested wave: \`$WRITE_WAVE\`" \
              "- Final requested state: \`none\`" \
              "- Recovery: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RESTORE_RUN_ID" \
              "- Retry by issuing a fresh owner command after recovery completes."
          )"
          printf '%s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="$STATUS" \
              --silent
          then
            echo "::warning::Protected issue comment unavailable; status is preserved in the workflow summary."
            echo "- Issue comment: unavailable; protected issue remains locked." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f state=closed \
            -f state_reason=completed \
            --silent

  wait-for-lease:
    name: Wait without holding the staging lock
    needs:
      - authorize
      - apply-command
    if: >-
      needs.apply-command.result == 'success' &&
      (
        needs.authorize.outputs.command == 'open' ||
        needs.authorize.outputs.command == 'advance'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions: {}
    env:
      LEASE_EXPIRES_AT: ${{ needs.authorize.outputs.lease_expires_at }}
    steps:
      - name: Wait until the absolute lease expiry
        shell: bash
        run: |
          set -euo pipefail
          EXPIRES_EPOCH="$(date -u -d "$LEASE_EXPIRES_AT" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          if [ "$EXPIRES_EPOCH" -gt "$NOW_EPOCH" ]; then
            sleep "$((EXPIRES_EPOCH - NOW_EPOCH))"
          fi

  expire-lease:
    name: Expire this lease only if it is still current
    needs:
      - authorize
      - apply-command
      - wait-for-lease
    if: needs.wait-for-lease.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: staging
    permissions:
      actions: write
      contents: read
      issues: write
    concurrency:
      group: jupr-staging-api-and-parity-evidence
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
      COMMAND: ${{ needs.authorize.outputs.command }}
      EXPECTED_WRITE_WAVE: ${{ needs.authorize.outputs.expected_write_wave }}
      ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
      LEASE_EXPIRES_AT: ${{ needs.authorize.outputs.lease_expires_at }}
      LEASE_STARTED_AT: ${{ needs.authorize.outputs.lease_started_at }}
      SESSION_NONCE: ${{ needs.authorize.outputs.session_nonce }}
      WRITE_WAVE: ${{ needs.authorize.outputs.write_wave }}
    steps:
      - name: Check out protected expiry helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Use the immutable controller registry commit that authorized this
          # lease, not a default branch that may move while the watcher waits.
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recheck exact lease nonce and body
        id: lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/staging_write_session.py should-expire \
            --command "$COMMAND" \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-write-wave "$EXPECTED_WRITE_WAVE" \
            --write-wave "$WRITE_WAVE" \
            --session-nonce "$SESSION_NONCE" \
            --lease-started-at "$LEASE_STARTED_AT" \
            --lease-expires-at "$LEASE_EXPIRES_AT" \
            > "$RUNNER_TEMP/lease-expiry.json"
          printf 'expire=%s\n' "$(jq -r '.expire' "$RUNNER_TEMP/lease-expiry.json")" \
            >> "$GITHUB_OUTPUT"

      - name: Restore canonical staging to none
        id: restore
        if: steps.lease.outputs.expire == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/staging_evidence_automation.py candidate-sha \
            > "$RUNNER_TEMP/expiry-current-staging.json"
          RESTORE_SHA="$(jq -r '.candidate_sha' "$RUNNER_TEMP/expiry-current-staging.json")"
          python scripts/staging_evidence_automation.py dispatch \
            --workflow fly_api_staging_deploy.yml \
            --input write_wave=none \
            --input "expected_candidate_sha=$RESTORE_SHA" \
            --input "orchestration_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/expiry-none-dispatch.json"
          RESTORE_RUN_ID="$(jq -r '.workflow_run_id' "$RUNNER_TEMP/expiry-none-dispatch.json")"
          printf 'run_id=%s\n' "$RESTORE_RUN_ID" >> "$GITHUB_OUTPUT"
          python scripts/staging_evidence_automation.py wait-run \
            --workflow fly_api_staging_deploy.yml \
            --run-id "$RESTORE_RUN_ID" \
            --candidate-sha "$RESTORE_SHA" \
            --timeout-seconds 7200
          for attempt in $(seq 1 6); do
            if python scripts/staging_evidence_automation.py fly-health \
              > "$RUNNER_TEMP/expiry-final-health.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 2
            fi
            sleep 10
          done
          python scripts/staging_evidence_automation.py verify-final-none \
            --fly-json "$RUNNER_TEMP/expiry-final-health.json"

      - name: Close only the unchanged expired control
        if: steps.lease.outputs.expire == 'true' && steps.restore.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ steps.restore.outputs.run_id }}
        run: |
          set -euo pipefail
          python scripts/staging_write_session.py should-expire \
            --command "$COMMAND" \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-write-wave "$EXPECTED_WRITE_WAVE" \
            --write-wave "$WRITE_WAVE" \
            --session-nonce "$SESSION_NONCE" \
            --lease-started-at "$LEASE_STARTED_AT" \
            --lease-expires-at "$LEASE_EXPIRES_AT" \
            > "$RUNNER_TEMP/lease-expiry-after-restore.json"
          if [ "$(jq -r '.expire' "$RUNNER_TEMP/lease-expiry-after-restore.json")" != "true" ]; then
            echo "A newer owner command superseded this lease; leaving the issue open."
            exit 0
          fi
          STATUS="$(
            printf '%s\n' \
              "### Staging write session expired safely" \
              "" \
              "- Expired wave: \`$WRITE_WAVE\`" \
              "- Final wave: \`none\`" \
              "- Business writes: disabled" \
              "- Safe restore: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RESTORE_RUN_ID"
          )"
          printf '%s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="$STATUS" \
              --silent
          then
            echo "::warning::Protected issue comment unavailable; status is preserved in the workflow summary."
            echo "- Issue comment: unavailable; protected issue remains locked." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          CLOSE_BODY="$(
            jq -er \
              '.close_body | select(type == "string" and length > 0)' \
              "$RUNNER_TEMP/lease-expiry-after-restore.json"
          )"
          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f body="$CLOSE_BODY" \
            -f state=closed \
            -f state_reason=completed \
            --silent
