name: Temporary Round-Robin and Ladder Generator publisher

on:
  push:
    branches:
      - agent/round-robin-ladder-generators

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/round-robin-ladder-generators
          fetch-depth: 0

      - name: Apply generator implementation
        run: python scripts/apply_play_generators.py

      - name: Check generated source
        run: |
          python -m compileall -q \
            jupr_app/domain/adaptive_play_engine.py \
            jupr_app/services/admin_play_generator_service.py \
            services/api/admin_play_generator_routes.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run focused generator and regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_adaptive_play_engine.py \
            tests/test_admin_play_generator_service.py \
            tests/test_api_contract_play_generators.py \
            tests/test_live_beta_engine.py \
            tests/test_api_contract_admin_jupr_live.py \
            tests/test_api_contract_admin_jupr_live_full.py \
            tests/test_api_contract_admin_jupr_live_league.py \
            tests/test_production_deployment_hardening.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- apps/web/next-env.d.ts || true
          rm -f .github/workflows/tmp-publish-play-generators.yml
          rm -f scripts/apply_play_generators.py
          rm -f scripts/.play_generator_bundle_*.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Round-Robin and Ladder Generators"
          git push origin HEAD:agent/round-robin-ladder-generators
