name: Temporary Fix PR 1196 CI Blockers

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/tournament-fix-batch-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair remaining CI blockers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page_path = Path("apps/web/app/admin/tournaments/registrations/page.tsx")
          page = page_path.read_text()
          react_import = 'import { Suspense } from "react";\n'
          if react_import not in page:
              anchor = 'import { redirect } from "next/navigation";\n'
              if anchor not in page:
                  raise SystemExit("Registration reports import anchor not found")
              page = page.replace(anchor, anchor + react_import, 1)

          panel_line = '          <RegistrationManagementPanel apiBase={getAdminTournamentApiBaseUrl()} clubId={clubId} status={data} />'
          suspense_block = '''          <Suspense fallback={<p style={{ color: "#64748b" }}>Loading tournament reports...</p>}>
            <RegistrationManagementPanel apiBase={getAdminTournamentApiBaseUrl()} clubId={clubId} status={data} />
          </Suspense>'''
          if suspense_block not in page:
              if panel_line not in page:
                  raise SystemExit("Registration reports panel anchor not found")
              page = page.replace(panel_line, suspense_block, 1)
          page_path.write_text(page)

          waves_path = Path("scripts/staging_write_waves.py")
          waves = waves_path.read_text()

          def insert_after(anchor: str, addition: str) -> None:
              global waves
              if addition in waves:
                  return
              if anchor not in waves:
                  raise SystemExit(f"Write-wave anchor not found: {anchor}")
              waves = waves.replace(anchor, anchor + "\n" + addition, 1)

          insert_after(
              '        ("PATCH", "/admin/clubs/{club_id}/tournaments/admin/tournaments/{tournament_id}/selections/{selection_id}"),',
              '        ("PUT", "/admin/clubs/{club_id}/tournaments/admin/tournaments/{tournament_id}/selections/{selection_id}/partner"),',
          )
          insert_after(
              '        ("PUT", "/admin/clubs/{club_id}/tournaments/commerce/tournaments/{tournament_id}/catalog"),',
              '        ("PUT", "/admin/clubs/{club_id}/tournaments/commerce/tournaments/{tournament_id}/orders/{registration_id}"),',
          )
          insert_after(
              '        ("POST", "/admin/clubs/{club_id}/tournaments/commerce/tournaments/{tournament_id}/orders/{registration_id}/cancel"),',
              '        ("POST", "/admin/clubs/{club_id}/tournaments/commerce/tournaments/{tournament_id}/orders/{registration_id}/quote"),',
          )
          waves_path.write_text(waves)
          PY

          rm -f .github/workflows/temp_fix_pr1196_ci.yml
          git add -A
          git diff --cached --check
          python -m compileall -q scripts services/api
          python -m pytest -q tests/test_staging_write_wave_guards.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clear tournament fix batch CI blockers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
