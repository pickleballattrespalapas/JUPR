          grep -q 'expected_counts' "$RUNNER_TEMP/database-evidence.json"

      - name: Wait for Vercel production source to become reachable
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl -L -fsS "$WEB_URL/clubs/tres-palapas/tournaments" > "$RUNNER_TEMP/vercel-production-page.html"; then
              break
            fi
            sleep 5
          done
          test -s "$RUNNER_TEMP/vercel-production-page.html"

      - name: Publish immutable completion tag and independent status record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          activation_sha="$ACTIVATION_SHA"
          production_sha="$(git ls-remote origin "refs/heads/$PRODUCTION_BRANCH" | awk '{print $1}')"
          test -n "$activation_sha"
          test "$activation_sha" = "$production_sha"
          git tag -f production-tournaments-live-20260803 "$activation_sha"
          git push --force origin refs/tags/production-tournaments-live-20260803

          python - <<'PY'
          from __future__ import annotations
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path

          temp=Path(os.environ['RUNNER_TEMP'])
          runtime_text=(temp/'runtime-evidence.json').read_text(encoding='utf-8',errors='replace')
          database_text=(temp/'database-evidence.json').read_text(encoding='utf-8',errors='replace')
          runtime=json.loads(runtime_text[runtime_text.find('{'):])
          database=json.loads(database_text[database_text.find('{'):])
          openapi=json.loads((temp/'openapi-evidence.json').read_text())
          record={
              'state':'operational',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'activation_sha':os.environ['ACTIVATION_SHA'],
              'production_sha':os.environ['ACTIVATION_SHA'],
              'web_http_status':(temp/'web-status').read_text().strip(),
              'runtime':runtime,
              'openapi':openapi,
              'production_data':database,
              'safeguards':{'payments':'offline','stripe':False,'email_mode':'dry_run','live_email':False},
              'rollback_branch':'backup/production-before-tournaments-20260803',
          }
          (temp/'production-tournament-status.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

          git checkout --orphan production-tournament-status-record
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p evidence
          cp "$RUNNER_TEMP/production-tournament-status.json" evidence/production-tournament-status.json
          git add evidence/production-tournament-status.json
          git commit -m "Record verified production tournament cutover"
          git push --force origin HEAD:"refs/heads/$STATUS_BRANCH"

          python - <<'PY' > "$RUNNER_TEMP/commit-status.json"
          import json,os
          print(json.dumps({
              'state':'success',
              'context':os.environ['STATUS_CONTEXT'],
              'description':'Production tournaments are fully operational',
              'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/commit-status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$activation_sha" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-tournament-final-controller-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/activation-sha
            ${{ runner.temp }}/activation-patch.sha256
            ${{ runner.temp }}/predeploy-health.json
            ${{ runner.temp }}/api-health-gates-closed.json
            ${{ runner.temp }}/tournament-schema-evidence.json
            ${{ runner.temp }}/production-tournament-flags.txt
            ${{ runner.temp }}/api-health-gates-open.json
            ${{ runner.temp }}/runtime-evidence.json
            ${{ runner.temp }}/openapi-evidence.json
            ${{ runner.temp }}/database-evidence.json
            ${{ runner.temp }}/production-tournament-status.json
            ${{ runner.temp }}/fly-releases-before.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed and restore the accepted production source
        if: failure()
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          if [ -n "${FLY_APP:-}" ] && command -v flyctl >/dev/null 2>&1; then
            flyctl secrets set --app "$FLY_APP" \
              JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION=0 \
              JUPR_PRODUCTION_WRITE_POLICY=read_only || true
          fi
          git push --force origin "$BASE_SHA:refs/heads/$PRODUCTION_BRANCH" || true
