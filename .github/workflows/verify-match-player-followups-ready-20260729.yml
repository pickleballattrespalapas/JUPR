name: Diagnose match-player follow-up Fly deployment

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/verify-match-player-window-20260728d' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: jupr-staging-followup-diagnosis-20260729
      cancel-in-progress: true
    env:
      EXPECTED_SHA: f6b2b0ce6fe9521b0b907fbb2dee808efc1d8bc0
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
    steps:
      - name: Check out isolated diagnostic
        uses: actions/checkout@v4
        with:
          ref: agent/verify-match-player-window-20260728d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and one-file diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$EXPECTED_SHA"
          test "$PR_HEAD_SHA" = "$(git rev-parse HEAD)"
          files="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | sort)"
          test "$files" = ".github/workflows/verify-match-player-followups-ready-20260729.yml"

      - name: Capture latest exact-candidate Fly deployment run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/workflows/fly_api_staging_deploy.yml/runs?event=workflow_dispatch&per_page=30" > fly-runs.json
          RUN_ID="$(jq -er --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].id' fly-runs.json)"
          printf '%s\n' "$RUN_ID" > fly-run-id.txt
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > fly-run.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > fly-jobs.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > fly-failed.log 2>&1 || true
          jq '{id, name, display_title, event, status, conclusion, head_sha, created_at, updated_at, html_url}' fly-run.json
          jq '[.jobs[] | {id, name, status, conclusion, steps: [.steps[]? | {name, status, conclusion}]}]' fly-jobs.json

      - name: Capture current Fly health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$FLY_HEALTH_URL" -o fly-health.json
          jq '{ok, git_commit_sha, image_build_git_sha, staging_write_wave, business_data_write_wave_active, supabase_project_ref, write_prerequisites}' fly-health.json

      - name: Upload Fly failure diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: match-player-followup-fly-diagnosis
          path: |
            fly-runs.json
            fly-run-id.txt
            fly-run.json
            fly-jobs.json
            fly-failed.log
            fly-health.json
          if-no-files-found: error
          retention-days: 2
