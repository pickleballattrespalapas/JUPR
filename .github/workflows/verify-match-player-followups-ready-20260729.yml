name: Diagnose skipped protected write session

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  diagnose:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/verify-match-player-window-20260728d' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEASE_STARTED_AT: 2026-07-29T13:30:19Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-match-player-window-20260728d
          fetch-depth: 1
          persist-credentials: false

      - name: Capture latest protected write-session event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-write-session.yml/runs?event=issues&per_page=30" > session-runs.json
          RUN_ID="$(jq -er --arg started "$LEASE_STARTED_AT" '[.workflow_runs[] | select(.created_at >= $started and .head_branch == "rollback-feb8" and (.display_title | contains("#1062")))][0].id' session-runs.json)"
          printf '%s\n' "$RUN_ID" > session-run-id.txt
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > session-run.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > session-jobs.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$GITHUB_REPOSITORY/issues/1062" > issue.json
          jq '{id, name, display_title, event, status, conclusion, head_branch, head_sha, actor, triggering_actor, run_attempt, created_at, updated_at, path, html_url}' session-run.json
          jq '[.jobs[] | {id, name, status, conclusion, steps: [.steps[]? | {name, status, conclusion}]}]' session-jobs.json
          jq '{number, state, locked, user, author_association, updated_at, body}' issue.json

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: skipped-protected-session-diagnosis
          path: |
            session-runs.json
            session-run-id.txt
            session-run.json
            session-jobs.json
            issue.json
          if-no-files-found: error
          retention-days: 2
