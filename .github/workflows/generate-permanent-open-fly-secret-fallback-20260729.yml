name: Generate permanent-open Fly secret fallback

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  generate:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/fix-permanent-open-fly-secrets-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-permanent-open-fly-secrets-20260729
          fetch-depth: 1
          persist-credentials: false

      - name: Generate stable staging-only secret fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/fly_api_staging_deploy.yml')
          text = path.read_text(encoding='utf-8')

          marker = '''      - name: Validate staging-only inputs and secrets
          '''
          step = '''      - name: Resolve stable staging-only public live secrets
                  shell: bash
                  env:
                    SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
                    CONFIGURED_PUBLIC_LIVE_RATE_LIMIT_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET }}
                    CONFIGURED_PUBLIC_LIVE_TOKEN_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_TOKEN_SECRET }}
                  run: |
                    set -euo pipefail
                    token_secret="${CONFIGURED_PUBLIC_LIVE_TOKEN_SECRET:-}"
                    rate_limit_secret="${CONFIGURED_PUBLIC_LIVE_RATE_LIMIT_SECRET:-}"
                    if [ -z "$token_secret" ] && [ -z "$rate_limit_secret" ]; then
                      mapfile -t derived_secrets < <(
                        python - <<'PY'
          import base64
          import hashlib
          import hmac
          import os

          root_secret = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip().encode("utf-8")
          if len(root_secret) < 32:
              raise SystemExit("Staging service role key is unavailable for public-live secret derivation")
          for label in (
              b"jupr:staging:public-live:token:v1",
              b"jupr:staging:public-live:rate-limit:v1",
          ):
              digest = hmac.new(root_secret, label, hashlib.sha256).digest()
              print(base64.urlsafe_b64encode(digest).decode("ascii").rstrip("="))
          PY
                      )
                      token_secret="${derived_secrets[0]}"
                      rate_limit_secret="${derived_secrets[1]}"
                    elif [ -z "$token_secret" ] || [ -z "$rate_limit_secret" ]; then
                      echo "Both dedicated public-live staging secrets must be configured together." >&2
                      exit 1
                    fi
                    if [ "${#token_secret}" -lt 32 ] || [ "${#rate_limit_secret}" -lt 32 ] || [ "$token_secret" = "$rate_limit_secret" ]; then
                      echo "Resolved public-live staging secrets are invalid." >&2
                      exit 1
                    fi
                    echo "::add-mask::$token_secret"
                    echo "::add-mask::$rate_limit_secret"
                    {
                      printf 'STAGING_PUBLIC_LIVE_TOKEN_SECRET=%s\n' "$token_secret"
                      printf 'STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET=%s\n' "$rate_limit_secret"
                      printf 'JUPR_PUBLIC_LIVE_TOKEN_SECRET=%s\n' "$token_secret"
                      printf 'JUPR_PUBLIC_LIVE_RATE_LIMIT_SECRET=%s\n' "$rate_limit_secret"
                    } >> "$GITHUB_ENV"

                '''
          if text.count(marker) != 1:
              raise SystemExit(f'Unexpected validation marker count: {text.count(marker)}')
          text = text.replace(marker, step + marker, 1)

          dedicated_env = '''          STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET }}
                  STAGING_PUBLIC_LIVE_TOKEN_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_TOKEN_SECRET }}
          '''
          if text.count(dedicated_env) != 2:
              raise SystemExit(f'Unexpected dedicated public-live env block count: {text.count(dedicated_env)}')
          text = text.replace(dedicated_env, '', 2)

          verification_env = '''          JUPR_PUBLIC_LIVE_TOKEN_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_TOKEN_SECRET }}
                  JUPR_PUBLIC_LIVE_RATE_LIMIT_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET }}
          '''
          if text.count(verification_env) != 1:
              raise SystemExit(f'Unexpected verification public-live env block count: {text.count(verification_env)}')
          text = text.replace(verification_env, '', 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify generated workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/fly_api_staging_deploy.yml').read_text(encoding='utf-8')
          required = (
              'Resolve stable staging-only public live secrets',
              'jupr:staging:public-live:token:v1',
              'jupr:staging:public-live:rate-limit:v1',
              'STAGING_PUBLIC_LIVE_TOKEN_SECRET=%s',
              'JUPR_PUBLIC_LIVE_TOKEN_SECRET=%s',
              'JUPR_EMAIL_MODE=dry_run',
              'JUPR_ENABLE_NEXT_PLAYER_UPDATES_LIVE_EMAIL=0',
              'JUPR_ENABLE_PUBLIC_LIVE_WRITES_PRODUCTION=0',
              'Refusing any Supabase target except isolated staging',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit('Generated workflow is missing: ' + ', '.join(missing))
          if text.count('${{ secrets.STAGING_PUBLIC_LIVE_TOKEN_SECRET }}') != 1:
              raise SystemExit('Dedicated token secret should appear only in the resolver step')
          if text.count('${{ secrets.STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET }}') != 1:
              raise SystemExit('Dedicated rate-limit secret should appear only in the resolver step')
          PY
          git diff --check

      - name: Upload patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: permanent-open-fly-secret-fallback
          path: .github/workflows/fly_api_staging_deploy.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
