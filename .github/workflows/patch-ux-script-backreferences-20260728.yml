name: Patch UX repair backreferences

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/manual-acceptance-ux-fixes-v2-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-acceptance-ux-fixes-v2-20260728
          fetch-depth: 0
      - name: Preserve regex backreferences without interpreting source escapes
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/apply_manual_acceptance_ux_fixes_20260728.py')
          text = path.read_text(encoding='utf-8')
          old = '''def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return updated
          '''
          new = '''def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              regex = re.compile(pattern, re.DOTALL)
              match = regex.search(text)
              if match is None:
                  raise RuntimeError(f"{label}: expected one regex match, found 0")
              rendered = replacement
              for index, value in enumerate(match.groups(), start=1):
                  rendered = rendered.replace(f"\\\\{index}", value or "")
              return text[:match.start()] + rendered + text[match.end():]
          '''
          if text.count(old) != 1:
              raise SystemExit('Unexpected sub_once implementation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ux-script-backreferences-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/apply_manual_acceptance_ux_fixes_20260728.py .github/workflows/patch-ux-script-backreferences-20260728.yml
          git commit -m 'Fix UX repair backreferences'
          git push origin HEAD:agent/manual-acceptance-ux-fixes-v2-20260728
