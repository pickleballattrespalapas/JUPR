name: One-time protected write-controller synchronization

on:
  pull_request:
    branches:
      - rollback-feb8
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/sync-protected-write-controller-20260728' &&
      github.event.pull_request.base.ref == 'rollback-feb8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-protected-write-controller-20260728
          fetch-depth: 0

      - name: Verify isolated PR and copy exact protected files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/rollback-feb8:refs/remotes/origin/rollback-feb8 \
            +refs/heads/staging:refs/remotes/origin/staging
          test "$PR_BASE_SHA" = "82ca22e51d878b1ae5ac3412b33c4536946496a6"
          test "$(git rev-parse refs/remotes/origin/rollback-feb8)" = "$PR_BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/staging)" = "6da9ea8a2d86d4c2236b7f34fa8f1246dd418d2a"
          test "$PR_HEAD_SHA" = "$(git rev-parse HEAD)"
          FILES="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --paginate \
              "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename' \
              | sort
          )"
          test "$FILES" = ".github/workflows/sync-protected-write-controller-20260728.yml"

          git checkout refs/remotes/origin/staging -- \
            .github/workflows/fly_api_staging_deploy.yml \
            scripts/staging_write_waves.py

          test "$(git hash-object .github/workflows/fly_api_staging_deploy.yml)" = "d52913fa06dfd6d07194c6526170320d37a94267"
          test "$(git hash-object scripts/staging_write_waves.py)" = "75fcbad23352c10c3cb552edfbe3af2af20340a0"

      - name: Verify, commit, and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-protected-write-controller-20260728.yml
          git diff --check
          git config user.name "pickleballattrespalapas"
          git config user.email "pickleballattrespalapas@gmail.com"
          git add \
            .github/workflows/fly_api_staging_deploy.yml \
            scripts/staging_write_waves.py \
            .github/workflows/sync-protected-write-controller-20260728.yml
          git commit -m "Sync protected staging write controller"
          git push origin HEAD:agent/sync-protected-write-controller-20260728
