name: Temporary tournament lifecycle panel patcher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/tournament-lifecycle-rebuild' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-lifecycle-rebuild
          fetch-depth: 0

      - name: Patch selected tournament commerce, formats, and operations panels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text()
              start_at = text.index(start)
              end_at = text.index(end, start_at)
              target.write_text(text[:start_at] + replacement + text[end_at:])

          def remove_article_by_heading(path: str, heading: str) -> None:
              target = Path(path)
              text = target.read_text()
              marker = f'<h2 style={{{{ marginTop: 0 }}}}>{heading}</h2>'
              marker_at = text.index(marker)
              start = text.rfind('<article', 0, marker_at)
              end = text.index('</article>', marker_at) + len('</article>')
              target.write_text(text[:start] + text[end:])

          # Tournament commerce: selected tournament only, no redundant admin/status shell,
          # currency-friendly entry, responsive fields, saved summaries with explicit Edit.
          commerce = "apps/web/app/admin/tournaments/commerce/TournamentCommercePanel.tsx"
          replace_once(commerce, "  getAdminTournamentCommerceStatus,\n", "")
          replace_once(commerce, "  listAdminTournamentCommerceTournaments,\n", "")
          replace_once(commerce, 'import { adminSessionLabel, useAdminSession } from "@/lib/useAdminSession";', 'import { useAdminSession } from "@/lib/useAdminSession";')
          replace_once(commerce, 'type Props = {\n  clubId: string;\n};', 'type Props = {\n  clubId: string;\n  tournamentId: string;\n  tournamentName: string;\n};')
          replace_once(commerce, '  width: "100%",\n  padding: "0.55rem",', '  width: "100%",\n  minWidth: 0,\n  boxSizing: "border-box" as const,\n  padding: "0.55rem",')
          replace_once(commerce, '''export default function TournamentCommercePanel({ clubId }: Props) {
  const {
    session,
    accessToken,
    loading: sessionLoading,
    message: sessionMessage
  } = useAdminSession();
  const [status, setStatus] = useState<Record<string, unknown> | null>(null);
  const [tournaments, setTournaments] = useState<
    Array<{ id: string; name: string; status?: string }>
  >([]);
  const [selectedTournamentId, setSelectedTournamentId] = useState("");''', '''export default function TournamentCommercePanel({ clubId, tournamentId, tournamentName }: Props) {
  const { accessToken, loading: sessionLoading, message: sessionMessage } = useAdminSession();
  const [selectedTournamentId, setSelectedTournamentId] = useState(tournamentId);''')
          replace_between(commerce, '  const runtime = recordValue(status || {}, "runtime");', '  const variantsByItem = useMemo(() => {', '  const variantsByItem = useMemo(() => {')
          replace_between(commerce, '  async function loadWorkspace() {', '  async function loadDetail(tournamentId = selectedTournamentId) {', '''  async function loadWorkspace() {
    await loadDetail(tournamentId);
  }

  async function loadDetail(tournamentId = selectedTournamentId) {''')
          replace_once(commerce, '    setMessage(`Loaded ${response.data.tournament.name}.`);', '    setMessage(null);')
          replace_once(commerce, '  useAuthenticatedAutoLoad(accessToken, loadWorkspace);', '  useAuthenticatedAutoLoad(`${accessToken}\\u0000${tournamentId}`, loadWorkspace);')
          remove_article_by_heading(commerce, "Tournament extras workspace")
          target = Path(commerce)
          text = target.read_text()
          start = text.index('      {tournaments.length ? (')
          end = text.index('      {detail && draft ? (', start)
          text = text[:start] + text[end:]
          text = text.replace('<section style={{ display: "grid", gap: "1rem" }}>', '<section data-commerce-form aria-label={`${tournamentName} payments, extras, and fulfillment`} style={{ display: "grid", gap: "1rem" }}>\n      <style>{`[data-commerce-form] label { min-width: 0; } [data-commerce-form] input, [data-commerce-form] select, [data-commerce-form] textarea, [data-commerce-form] button { box-sizing: border-box; max-width: 100%; } [data-commerce-form] summary { cursor: pointer; }`}</style>', 1)
          marker = '  const eventLabels = useMemo('
          insert_at = text.index(marker)
          saved_sets = '''  const savedItemIds = useMemo(
    () => new Set((detail?.catalog.items || []).map((item) => item.id)),
    [detail?.catalog.items]
  );
  const savedBundleIds = useMemo(
    () => new Set((detail?.catalog.bundles || []).map((bundle) => bundle.id)),
    [detail?.catalog.bundles]
  );

'''
          text = text[:insert_at] + saved_sets + text[insert_at:]

          old = '''                      <input
                        type="number"
                        min="0"
                        step="0.01"
                        value={(item.base_price_minor / 100).toFixed(2)}
                        onChange={(event) =>
                          updateDraft((next) => {
                            next.items.find(
                              (row) => row.id === item.id
                            )!.base_price_minor = moneyMinor(event.target.value);
                          })
                        }
                        style={inputStyle}
                      />'''
          new = '''                      <input
                        key={`${item.id}-${detail?.catalog.catalog_revision || 0}-base-price`}
                        type="text"
                        inputMode="decimal"
                        defaultValue={(item.base_price_minor / 100).toFixed(2)}
                        onBlur={(event) =>
                          updateDraft((next) => {
                            next.items.find(
                              (row) => row.id === item.id
                            )!.base_price_minor = moneyMinor(event.target.value);
                          })
                        }
                        style={inputStyle}
                      />'''
          if old not in text: raise SystemExit("commerce base price block not found")
          text = text.replace(old, new, 1)

          old = '''                          <input
                            type="number"
                            step="0.01"
                            value={(variant.price_delta_minor / 100).toFixed(2)}
                            onChange={(event) =>
                              updateDraft((next) => {
                                next.variants.find(
                                  (row) => row.id === variant.id
                                )!.price_delta_minor = moneyMinor(
                                  event.target.value
                                );
                              })
                            }
                            style={inputStyle}
                          />'''
          new = '''                          <input
                            key={`${variant.id}-${detail?.catalog.catalog_revision || 0}-price-delta`}
                            type="text"
                            inputMode="decimal"
                            defaultValue={(variant.price_delta_minor / 100).toFixed(2)}
                            onBlur={(event) =>
                              updateDraft((next) => {
                                next.variants.find(
                                  (row) => row.id === variant.id
                                )!.price_delta_minor = moneyMinor(
                                  event.target.value
                                );
                              })
                            }
                            style={inputStyle}
                          />'''
          if old not in text: raise SystemExit("commerce option price block not found")
          text = text.replace(old, new, 1)

          old = '''                          <input
                            type="number"
                            min="0"
                            step="0.01"
                            value={(bundle.price_minor / 100).toFixed(2)}
                            onChange={(event) =>
                              updateDraft((next) => {
                                next.bundles.find(
                                  (row) => row.id === bundle.id
                                )!.price_minor = moneyMinor(event.target.value);
                              })
                            }
                            style={inputStyle}
                          />'''
          new = '''                          <input
                            key={`${bundle.id}-${detail?.catalog.catalog_revision || 0}-bundle-price`}
                            type="text"
                            inputMode="decimal"
                            defaultValue={(bundle.price_minor / 100).toFixed(2)}
                            onBlur={(event) =>
                              updateDraft((next) => {
                                next.bundles.find(
                                  (row) => row.id === bundle.id
                                )!.price_minor = moneyMinor(event.target.value);
                              })
                            }
                            style={inputStyle}
                          />'''
          if old not in text: raise SystemExit("commerce bundle price block not found")
          text = text.replace(old, new, 1)

          text = text.replace('repeat(auto-fit, minmax(min(100%, 220px), 1fr))', 'repeat(auto-fit, minmax(240px, 1fr))')
          text = text.replace('repeat(auto-fit, minmax(min(100%, 150px), 1fr))', 'repeat(auto-fit, minmax(200px, 1fr))')
          text = text.replace('repeat(auto-fit, minmax(min(100%, 180px), 1fr))', 'repeat(auto-fit, minmax(220px, 1fr))')

          item_start = text.index('{draft.items.map((item) => (')
          item_open = text.index('<article key={item.id} style={cardStyle}>', item_start)
          item_end_marker = '                </article>\n              ))}'
          item_end = text.index(item_end_marker, item_open)
          item_block = text[item_open:item_end + len('                </article>')]
          item_block = item_block.replace('<article key={item.id} style={cardStyle}>', '''<details key={item.id} open={!savedItemIds.has(item.id)} style={cardStyle}>
                  <summary style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "center", flexWrap: "wrap" }}>
                    <span><strong>{item.name || "Untitled extra"}</strong><br /><small>{formatCommerceMoney(item.base_price_minor)} · {item.status} · {item.kind.toLowerCase()}</small></span>
                    <span style={{ fontWeight: 800 }}>{savedItemIds.has(item.id) ? "Edit" : "New extra"}</span>
                  </summary>
                  <div style={{ marginTop: "1rem" }}>''', 1)
          last = item_block.rfind('</article>')
          item_block = item_block[:last] + '</div>\n                </details>' + item_block[last + len('</article>'):]
          text = text[:item_open] + item_block + text[item_end + len('                </article>'):]

          bundle_start = text.index('{draft.bundles.map((bundle) => (')
          bundle_open = text.index('<section', bundle_start)
          bundle_end_marker = '                    </section>\n                  ))}'
          bundle_end = text.index(bundle_end_marker, bundle_open)
          bundle_block = text[bundle_open:bundle_end + len('                    </section>')]
          first_close = bundle_block.index('>') + 1
          bundle_block = '''<details key={bundle.id} open={!savedBundleIds.has(bundle.id)} style={{ border: "1px solid #e2e8f0", borderRadius: "12px", padding: "0.75rem" }}>
                      <summary style={{ display: "flex", justifyContent: "space-between", gap: "0.75rem", alignItems: "center", flexWrap: "wrap" }}>
                        <span><strong>{bundle.name || "Untitled bundle"}</strong><br /><small>{formatCommerceMoney(bundle.price_minor)} · {bundle.status} · {(componentsByBundle.get(bundle.id) || []).length} required parts</small></span>
                        <span style={{ fontWeight: 800 }}>{savedBundleIds.has(bundle.id) ? "Edit" : "New bundle"}</span>
                      </summary>
                      <section style={{ marginTop: "1rem" }}>''' + bundle_block[first_close:]
          last = bundle_block.rfind('</section>')
          bundle_block = bundle_block[:last] + '</section>\n                    </details>' + bundle_block[last + len('</section>'):]
          text = text[:bundle_open] + bundle_block + text[bundle_end + len('                    </section>'):]
          target.write_text(text)

          # Ratings and team play: selected tournament only, no refresh/admin shell,
          # one primary event format selector, and friendly optional-operation warning.
          team = "apps/web/app/admin/tournaments/team-competition/TeamTournamentAdminPanel.tsx"
          replace_once(team, '  listAdminTeamTournaments,\n', '')
          replace_once(team, 'import { adminSessionLabel, useAdminSession } from "@/lib/useAdminSession";', 'import { useAdminSession } from "@/lib/useAdminSession";')
          replace_once(team, 'type Props = { clubId: string };', 'type Props = { clubId: string; initialTournamentId: string };\ntype EventFormat = "STANDARD" | "COMBINED_RATING_CAP" | "FOUR_PLAYER_TEAM";')
          replace_once(team, 'export default function TeamTournamentAdminPanel({ clubId }: Props) {\n  const {\n    session,\n    accessToken,\n    loading: sessionLoading,\n    message: sessionMessage\n  } = useAdminSession();', 'export default function TeamTournamentAdminPanel({ clubId, initialTournamentId }: Props) {\n  const { accessToken, loading: sessionLoading, message: sessionMessage } = useAdminSession();')
          replace_once(team, '''  const [tournaments, setTournaments] = useState<
    Array<{ id: string; name: string; status?: string }>
  >([]);
  const [tournamentId, setTournamentId] = useState("");''', '  const [tournamentId, setTournamentId] = useState(initialTournamentId);')
          replace_between(team, '  async function loadWorkspace(): Promise<void> {', '  useAuthenticatedAutoLoad(accessToken, loadWorkspace, clubId);', '  useAuthenticatedAutoLoad(`${accessToken}\\u0000${initialTournamentId}`, () => loadSnapshot(initialTournamentId), clubId);')
          target = Path(team)
          text = target.read_text()
          text = text.replace('    setSnapshot(null);\n', '    if (nextTournamentId !== tournamentId) setSnapshot(null);\n', 1)
          text = text.replace('    setMessage(`Loaded ${response.data.tournament.name}.`);', '    setMessage(null);', 1)
          marker = 'function slotLabel(slot: TeamSlot): string {'
          insert_at = text.index(marker)
          helpers = '''function eventFormat(draft: ConfigDraft | null): EventFormat {
  if (draft?.competitionFormat === "FOUR_PLAYER_TEAM") return "FOUR_PLAYER_TEAM";
  if (draft?.eligibilityMode === "COMBINED_RATING_CAP") return "COMBINED_RATING_CAP";
  return "STANDARD";
}

function friendlyWorkspaceWarning(warning: string): string {
  if (/tournament_team_operations unavailable|apierror/i.test(warning)) {
    return "Team scheduling and scoring data is temporarily unavailable. Event-format setup and rating review remain available.";
  }
  return warning;
}

'''
          text = text[:insert_at] + helpers + text[insert_at:]

          toolbar_start = text.index('      <div className={styles.toolbar}>')
          message_start = text.index('      {message ? (', toolbar_start)
          text = text[:toolbar_start] + text[message_start:]
          text = text.replace('            {snapshot.warnings.map((warning) => (\n              <li key={warning}>{warning}</li>\n            ))}', '            {snapshot.warnings.map((warning) => friendlyWorkspaceWarning(warning)).map((warning) => (\n              <li key={warning}>{warning}</li>\n            ))}')

          eligibility_start = text.index('                  <label className={styles.field}>\n                    Registration eligibility')
          team_condition = text.index('                  {configDraft?.competitionFormat === "FOUR_PLAYER_TEAM" ? (', eligibility_start)
          unified = '''                  <label className={styles.field}>
                    Event format
                    <select
                      className={styles.select}
                      value={eventFormat(configDraft)}
                      onChange={(event) =>
                        setConfigDraft((current) => {
                          if (!current) return current;
                          const value = event.target.value as EventFormat;
                          if (value === "COMBINED_RATING_CAP") {
                            return {
                              ...current,
                              eligibilityMode: "COMBINED_RATING_CAP",
                              combinedRatingCap: current.combinedRatingCap || "8.0",
                              competitionFormat: "STANDARD"
                            };
                          }
                          if (value === "FOUR_PLAYER_TEAM") {
                            return {
                              ...current,
                              eligibilityMode: "STANDARD",
                              combinedRatingCap: "",
                              competitionFormat: "FOUR_PLAYER_TEAM"
                            };
                          }
                          return {
                            ...current,
                            eligibilityMode: "STANDARD",
                            combinedRatingCap: "",
                            competitionFormat: "STANDARD"
                          };
                        })
                      }
                    >
                      <option value="STANDARD">Standard singles or doubles</option>
                      <option value="COMBINED_RATING_CAP">Combined-rating doubles</option>
                      <option value="FOUR_PLAYER_TEAM">Four-player team · two men and two women</option>
                    </select>
                  </label>
                  {configDraft?.eligibilityMode === "COMBINED_RATING_CAP" ? (
                    <label className={styles.field}>
                      Maximum combined partner rating
                      <input
                        className={styles.input}
                        type="number"
                        min="0.01"
                        max="14"
                        step="0.01"
                        value={configDraft.combinedRatingCap}
                        onChange={(event) =>
                          setConfigDraft((current) =>
                            current
                              ? { ...current, combinedRatingCap: event.target.value }
                              : current
                          )
                        }
                      />
                      <small>Eligibility is strictly below this cap.</small>
                    </label>
                  ) : null}
'''
          text = text[:eligibility_start] + unified + text[team_condition:]

          actions_marker = '                <div className={styles.actions}>'
          actions_at = text.index(actions_marker, text.index('id="team-setup-heading"'))
          summary = '''                {configDraft ? (
                  <p className={styles.notice}>
                    <strong>Review:</strong>{" "}
                    {eventFormat(configDraft) === "STANDARD"
                      ? "Standard singles or doubles"
                      : eventFormat(configDraft) === "COMBINED_RATING_CAP"
                        ? `Combined-rating doubles · below ${configDraft.combinedRatingCap || "—"}`
                        : `Four-player team · ${configDraft.allowSubstitutes ? "substitutes allowed" : "no substitutes"} · ${configDraft.tiebreakMode === "SKINNY_RELAY" ? "skinny-singles relay" : "one singles game"} · ${configDraft.playoffFormat.replaceAll("_", " ").toLowerCase()}`}
                  </p>
                ) : null}
'''
          text = text[:actions_at] + summary + text[actions_at:]
          target.write_text(text)

          # Tournament Ops: selected tournament only, no legacy session/list shell.
          ops = "apps/web/app/admin/tournaments/ops/TournamentOpsPanel.tsx"
          replace_once(ops, '  AdminTournament,\n  AdminTournamentListResponse,\n', '')
          replace_once(ops, 'import { adminSessionLabel, useAdminSession } from "@/lib/useAdminSession";', 'import { useAdminSession } from "@/lib/useAdminSession";')
          replace_once(ops, 'type Props = { apiBase: string | null; clubId: string; status: AdminTournamentStatusResponse; workflow?: OpsWorkflow };', 'type Props = { apiBase: string | null; clubId: string; status: AdminTournamentStatusResponse; workflow?: OpsWorkflow; initialTournamentId: string };')
          replace_once(ops, 'export default function TournamentOpsPanel({ apiBase, clubId, status, workflow = "all" }: Props) {\n  const { session, accessToken, loading: sessionLoading, message: sessionMessage } = useAdminSession();\n  const [includeArchived, setIncludeArchived] = useState(false);\n  const [tournaments, setTournaments] = useState<AdminTournament[]>([]);\n  const [selectedTournamentId, setSelectedTournamentId] = useState("");', 'export default function TournamentOpsPanel({ apiBase, clubId, status, workflow = "all", initialTournamentId }: Props) {\n  const { accessToken } = useAdminSession();\n  const [selectedTournamentId, setSelectedTournamentId] = useState(initialTournamentId);')
          replace_once(ops, '  const listRequest = useLatestRequestGuard(accessToken, clearProtectedOpsState);\n', '')
          target = Path(ops)
          text = target.read_text()
          text = text.replace('    setTournaments([]); setSelectedTournamentId(""); setSelectedDrawId(""); setSnapshot(null);', '    setSelectedTournamentId(initialTournamentId); setSelectedDrawId(""); setSnapshot(null);', 1)
          load_start = text.index('  async function loadTournaments() {')
          load_end = text.index('  async function loadOps(', load_start)
          text = text[:load_start] + text[load_end:]
          text = text.replace('  useAuthenticatedAutoLoad(status.enabled ? accessToken : "", loadTournaments, includeArchived ? "archived" : "active");', '  useAuthenticatedAutoLoad(status.enabled ? `${accessToken}\\u0000${initialTournamentId}` : "", () => loadOps(initialTournamentId, ""));')
          text = text.replace('      setMessage("Tournament operations snapshot loaded.");', '      setMessage(null);', 1)
          header_start = text.index('      <article style={cardStyle}>\n        <h2 style={{ marginTop: 0 }}>Tournament Ops</h2>')
          banner_start = text.index('      {!operationsWriteReady ? (', header_start)
          text = text[:header_start] + text[banner_start:]
          selector_start = text.index('      {tournaments.length ? (')
          content_start = text.index('      {operationsWriteReady && snapshot && shows("draws") ? (', selector_start)
          text = text[:selector_start] + text[content_start:]
          target.write_text(text)
          PY

          git diff --check

      - name: Commit application patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-tournament-lifecycle-large-panel-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine selected tournament workspaces"
          git push origin HEAD:agent/tournament-lifecycle-rebuild
