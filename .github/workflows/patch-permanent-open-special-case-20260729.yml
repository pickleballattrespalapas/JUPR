name: Patch permanent open registry compatibility

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/permanent-staging-writes-20260729' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/permanent-staging-writes-20260729
          fetch-depth: 0

      - name: Preserve named-wave classification while adding permanent open
        shell: python
        run: |
          from pathlib import Path

          waves_path = Path("scripts/staging_write_waves.py")
          text = waves_path.read_text(encoding="utf-8")
          if "OPEN_WRITE_FLAGS = tuple(" not in text:
              old = '''STAGING_WRITE_WAVES[OPEN_WRITE_WAVE] = tuple(
              sorted(
                  {
                      flag
                      for wave, flags in STAGING_WRITE_WAVES.items()
                      if wave != NO_WRITE_WAVE
                      for flag in flags
                  }
              )
          )'''
              new = '''OPEN_WRITE_FLAGS = tuple(
              sorted({flag for flags in STAGING_WRITE_WAVES.values() for flag in flags})
          )'''
              if text.count(old) != 1:
                  raise SystemExit("Unexpected open flag-union block")
              text = text.replace(old, new, 1)

              old = '''STAGING_WRITE_WAVE_ROUTES[OPEN_WRITE_WAVE] = tuple(
              sorted(
                  {
                      route
                      for wave, routes in STAGING_WRITE_WAVE_ROUTES.items()
                      if wave != NO_WRITE_WAVE
                      for route in routes
                  }
              )
          )'''
              new = '''OPEN_WRITE_ROUTES = tuple(
              sorted(
                  {
                      route
                      for routes in STAGING_WRITE_WAVE_ROUTES.values()
                      for route in routes
                  }
              )
          )'''
              if text.count(old) != 1:
                  raise SystemExit("Unexpected open route-union block")
              text = text.replace(old, new, 1)

              old = '    routes = STAGING_WRITE_WAVE_ROUTES.get(wave, ())'
              new = '    routes = OPEN_WRITE_ROUTES if wave == OPEN_WRITE_WAVE else STAGING_WRITE_WAVE_ROUTES.get(wave, ())'
              if text.count(old) != 1:
                  raise SystemExit("Unexpected route lookup")
              text = text.replace(old, new, 1)

              old = '''def expected_write_flags(wave: str) -> dict[str, bool]:
              if wave not in STAGING_WRITE_WAVES:
                  raise ValueError(f"Unknown staging write wave: {wave}")
              enabled = set(STAGING_WRITE_WAVES[wave])
              return {flag: flag in enabled for flag in ALL_STAGING_WRITE_FLAGS}'''
              new = '''def expected_write_flags(wave: str) -> dict[str, bool]:
              if wave == OPEN_WRITE_WAVE:
                  enabled = set(OPEN_WRITE_FLAGS)
              elif wave in STAGING_WRITE_WAVES:
                  enabled = set(STAGING_WRITE_WAVES[wave])
              else:
                  raise ValueError(f"Unknown staging write wave: {wave}")
              return {flag: flag in enabled for flag in ALL_STAGING_WRITE_FLAGS}'''
              if text.count(old) != 1:
                  raise SystemExit("Unexpected expected_write_flags implementation")
              text = text.replace(old, new, 1)

              old = 'parser.add_argument("--wave", required=True, choices=tuple(STAGING_WRITE_WAVES))'
              new = 'parser.add_argument("--wave", required=True, choices=(OPEN_WRITE_WAVE, *tuple(STAGING_WRITE_WAVES)))'
              if text.count(old) != 1:
                  raise SystemExit("Unexpected wave parser choices")
              text = text.replace(old, new, 1)
              waves_path.write_text(text, encoding="utf-8")

          permanent_test = Path("tests/test_permanent_staging_write_mode.py")
          permanent_test.write_text('''from pathlib import Path

          from scripts.staging_write_waves import (
              ALL_STAGING_WRITE_FLAGS,
              DORMANT_STAGING_WRITE_FLAGS,
              NO_WRITE_WAVE,
              OPEN_WRITE_FLAGS,
              OPEN_WRITE_ROUTES,
              OPEN_WRITE_WAVE,
              STAGING_WRITE_WAVE_ROUTES,
              STAGING_WRITE_WAVES,
              expected_write_flags,
              wave_allows_request,
          )


          def test_open_wave_enables_every_reviewed_staging_gate() -> None:
              expected = {
                  flag
                  for flags in STAGING_WRITE_WAVES.values()
                  for flag in flags
              }
              assert OPEN_WRITE_WAVE not in STAGING_WRITE_WAVES
              assert set(OPEN_WRITE_FLAGS) == expected
              projection = expected_write_flags(OPEN_WRITE_WAVE)
              assert all(projection[flag] for flag in expected)
              assert all(not projection[flag] for flag in DORMANT_STAGING_WRITE_FLAGS)
              assert set(projection) == set(ALL_STAGING_WRITE_FLAGS)


          def test_open_wave_allows_every_reviewed_staging_route() -> None:
              expected = {
                  route
                  for routes in STAGING_WRITE_WAVE_ROUTES.values()
                  for route in routes
              }
              assert OPEN_WRITE_WAVE not in STAGING_WRITE_WAVE_ROUTES
              assert set(OPEN_WRITE_ROUTES) == expected
              for method, template in expected:
                  concrete = template
                  replacements = {
                      "{club_slug}": "tres-palapas",
                      "{club_id}": "tres_palapas",
                      "{league_name}": "Test",
                      "{player_id}": "1",
                      "{league_rating_id}": "1",
                      "{operation_id}": "00000000-0000-4000-8000-000000000001",
                      "{operation_key}": "test-op",
                      "{subscription_id}": "1",
                      "{week_start}": "2026-07-27",
                      "{session_id}": "1",
                      "{round_number}": "1",
                      "{challenge_id}": "1",
                      "{session_key}": "test-session",
                      "{tournament_id}": "1",
                      "{event_option_id}": "1",
                      "{registration_id}": "1",
                      "{selection_id}": "1",
                      "{team_id}": "1",
                      "{draw_id}": "1",
                      "{game_id}": "1",
                      "{matchup_id}": "1",
                      "{match_game_id}": "1",
                      "{fulfillment_id}": "1",
                      "{social_match_id}": "1",
                      "{badge_id}": "1",
                      "{event_id}": "1",
                      "{partner_request_id}": "1",
                  }
                  for marker, value in replacements.items():
                      concrete = concrete.replace(marker, value)
                  assert "{" not in concrete, concrete
                  assert wave_allows_request(OPEN_WRITE_WAVE, method, concrete)
              assert not wave_allows_request(NO_WRITE_WAVE, "POST", "/clubs/tres-palapas/support/intake")


          def test_fly_staging_defaults_to_permanent_open_mode() -> None:
              text = Path("fly.staging.toml").read_text(encoding="utf-8")
              assert 'JUPR_STAGING_WRITE_WAVE = "open"' in text
              assert 'JUPR_ENABLE_NEXT_PLAYER_UPDATES_LIVE_EMAIL = "0"' in text
              assert 'JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_IMPORT_HANDOFF = "0"' in text
              projection = expected_write_flags(OPEN_WRITE_WAVE)
              for flag, enabled in projection.items():
                  assert f'{flag} = "{1 if enabled else 0}"' in text


          def test_staging_deploy_defaults_to_open_and_retains_emergency_none() -> None:
              text = Path(".github/workflows/fly_api_staging_deploy.yml").read_text(encoding="utf-8")
              assert "|| 'open'" in text
              assert 'default: "open"' in text
              assert "- open" in text
              assert "- none" in text
              assert 'JUPR_EMAIL_MODE: dry_run' in text
              assert '"JUPR_ENABLE_NEXT_PLAYER_UPDATES_LIVE_EMAIL=0"' in text
              assert '"JUPR_ENABLE_PUBLIC_LIVE_WRITES_PRODUCTION=0"' in text


          def test_automatic_lease_and_recovery_guards_are_retired() -> None:
              session = Path(".github/workflows/staging-write-session.yml").read_text(encoding="utf-8")
              recovery = Path(".github/workflows/staging-write-recovery.yml").read_text(encoding="utf-8")
              evidence = Path(".github/workflows/staging-evidence-automation.yml").read_text(encoding="utf-8")
              assert "issues:" not in session
              assert "issues:" not in evidence
              assert "schedule:" not in recovery
              assert "workflow_run:" not in recovery
              assert "Staging Emergency Write Disable" in recovery


          def test_admin_status_fetches_do_not_cache_guard_state() -> None:
              uploader = Path("apps/web/lib/adminMatchUploaderApi.ts").read_text(encoding="utf-8")
              assert 'fetch(url, { cache: "no-store" })' in uploader
              for path in Path("apps/web").rglob("*.ts*"):
                  if "/admin" not in path.as_posix() and not path.name.startswith("admin"):
                      continue
                  assert "revalidate: 30" not in path.read_text(encoding="utf-8"), path
          ''', encoding="utf-8")

          deployment_test = Path("tests/test_staging_deployment_config.py")
          deployment = deployment_test.read_text(encoding="utf-8")
          import_old = '''    ALL_STAGING_WRITE_FLAGS,
              ALWAYS_DISABLED_FLAGS,
              STAGING_WRITE_WAVES,'''
          import_new = '''    ALL_STAGING_WRITE_FLAGS,
              ALWAYS_DISABLED_FLAGS,
              OPEN_WRITE_WAVE,
              STAGING_WRITE_WAVES,'''
          if import_old in deployment:
              deployment = deployment.replace(import_old, import_new, 1)
          deployment = deployment.replace(
              '    assert set(choices) == set(STAGING_WRITE_WAVES)\n    assert len(choices) == len(STAGING_WRITE_WAVES)',
              '    assert set(choices) == {OPEN_WRITE_WAVE, *STAGING_WRITE_WAVES}\n    assert len(choices) == len(STAGING_WRITE_WAVES) + 1',
          )
          deployment_test.write_text(deployment, encoding="utf-8")

          guard_test = Path("tests/test_staging_write_wave_guards.py")
          guards = guard_test.read_text(encoding="utf-8")
          old = '''    assert f'{flag} = "0"' in (ROOT / "fly.staging.toml").read_text(
                  encoding="utf-8"
              )'''
          new = '''    assert f'{flag} = "1"' in (ROOT / "fly.staging.toml").read_text(
                  encoding="utf-8"
              )'''
          if guards.count(old) != 3:
              raise SystemExit(f"Unexpected staging flag assertion count: {guards.count(old)}")
          guards = guards.replace(old, new)
          old = '''    assert f'{flag}: "0"' in (
                  ROOT / ".github/workflows/fly_api_staging_deploy.yml"
              ).read_text(encoding="utf-8")'''
          new = '''    assert flag in (
                  ROOT / ".github/workflows/fly_api_staging_deploy.yml"
              ).read_text(encoding="utf-8")'''
          if guards.count(old) != 3:
              raise SystemExit(f"Unexpected workflow flag assertion count: {guards.count(old)}")
          guard_test.write_text(guards.replace(old, new), encoding="utf-8")

      - name: Verify and commit compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/staging_write_waves.py \
            tests/test_permanent_staging_write_mode.py \
            tests/test_staging_deployment_config.py \
            tests/test_staging_write_wave_guards.py
          git diff --check
          if git diff --quiet -- \
            scripts/staging_write_waves.py \
            tests/test_permanent_staging_write_mode.py \
            tests/test_staging_deployment_config.py \
            tests/test_staging_write_wave_guards.py; then
            exit 0
          fi
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            scripts/staging_write_waves.py \
            tests/test_permanent_staging_write_mode.py \
            tests/test_staging_deployment_config.py \
            tests/test_staging_write_wave_guards.py
          git commit -m 'Preserve named staging wave classifications'
          git push origin HEAD:agent/permanent-staging-writes-20260729
