name: Complete production tournament cutover

on:
  push:
    branches: [rollback-feb8]
    paths: [.github/complete-production-tournaments.trigger]

permissions:
  contents: write
  statuses: write

env:
  SOURCE_BRANCH: agent/production-tournament-activation-final-20260803
  PRODUCTION_BRANCH: rollback-feb8
  PRODUCTION_DOMAIN: https://pickleballclubsandwich.com
  EXPECTED_PROJECT_REF: dnoockbwfenunhcibwfn
  EXECUTOR_TOKEN: pcs-tournament-cutover-20260803-9f0a6f4d
  STATUS_CONTEXT: production-tournaments-complete

concurrency:
  group: complete-production-tournaments
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.PRODUCTION_FLY_APP || secrets.FLY_PRODUCTION_APP || 'juprleagues-api' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL || secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY || secrets.PROD_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.PRODUCTION_ADMIN_EMAIL || secrets.PROD_ADMIN_EMAIL || secrets.ADMIN_SMOKE_EMAIL || secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD || secrets.PROD_ADMIN_PASSWORD || secrets.ADMIN_SMOKE_PASSWORD || secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Mark cutover pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Completing production tournament activation",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Verify exact activation source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f jupr_app/services/production_tournament_guard.py
          test -f tests/test_production_tournament_activation.py
          git diff --check
          source_sha=$(git rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "$source_sha" > "$RUNNER_TEMP/activation-source-sha.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt

      - name: Revalidate tournament and API contracts
        run: |
          set -euo pipefail
          python -m compileall -q jupr_app/services services/api scripts tests
          python -m pytest -q \
            tests/test_production_tournament_activation.py \
            tests/test_tournament_admin_guarded_operations.py \
            tests/test_tournament_team_runtime_security.py \
            tests/test_public_tournament_commerce_service.py \
            tests/test_admin_tournament_live_runner.py \
            tests/test_api_contract_admin_tournament_guarded.py \
            tests/test_api_contract_admin_tournament_setup.py \
            tests/test_api_contract_tournament_registration.py \
            tests/test_api_contract_tournament_registration_edit.py \
            tests/test_api_contract_tournament_partner_flow.py \
            tests/test_api_contract_admin_tournament_game_generation.py \
            tests/test_api_contract_admin_tournament_game_scoring.py \
            tests/test_api_contract_admin_tournament_playoff_generation.py \
            tests/test_api_contract_admin_tournament_match_publish.py \
            tests/test_api_contract_admin_tournament_team_editor.py \
            tests/test_public_tournament_team_setup_recovery.py \
            tests/test_tournament_pairing_lifecycle_email.py
          python -m pytest -q tests/test_api_contract_*.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Revalidate production web build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Validate production credentials and target
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${FLY_API_TOKEN:-}"
          test -n "${FLY_APP:-}"
          case "$SUPABASE_URL" in
            *"$EXPECTED_PROJECT_REF"*) ;;
            *) echo "::error::Production Supabase URL does not match the approved project."; exit 1 ;;
          esac

      - name: Apply reviewed tournament database contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, urllib.error, urllib.request
          from pathlib import Path

          root = Path.cwd()
          contract = json.loads((root / "config/production_migration_contract.json").read_text(encoding="utf-8"))
          required = list(contract.get("required_ledger_names") or [])
          schema_only = set(contract.get("schema_contract_only_repository_migrations") or [])
          approved = re.compile(r"(tournament|partner|four_player)", re.I)
          canonical = {}
          for path in sorted((root / "supabase/migrations").glob("*.sql")):
              match = re.fullmatch(r"(?P<version>\d{8}(?:\d{6})?)_(?P<name>[A-Za-z0-9][A-Za-z0-9_]*)\.sql", path.name)
              if match:
                  canonical.setdefault(match.group("name"), []).append((match.group("version"), path))
          selected = []
          for name in required:
              if name in schema_only or not approved.search(name):
                  continue
              candidates = canonical.get(name) or []
              if len(candidates) != 1:
                  raise SystemExit(f"{name}: expected one canonical migration, found {len(candidates)}")
              selected.append((*candidates[0], name))
          selected.sort(key=lambda row: (row[0], row[2]))
          if not selected:
              raise SystemExit("No reviewed tournament migrations were selected")

          endpoint = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/rpc/jupr_apply_reviewed_migration"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          report = []
          for version, path, name in selected:
              sql = path.read_text(encoding="utf-8")
              screened = "\n".join(line.split("--", 1)[0] for line in sql.splitlines())
              if re.search(r"\b(drop\s+table|drop\s+schema|truncate)\b", screened, re.I):
                  raise SystemExit(f"Hard-destructive SQL refused: {path}")
              digest = hashlib.sha256(sql.encode()).hexdigest()
              payload = json.dumps({
                  "p_token": os.environ["EXECUTOR_TOKEN"],
                  "p_version": version,
                  "p_name": name,
                  "p_sha256": digest,
                  "p_sql": sql,
              }).encode()
              request = urllib.request.Request(endpoint, data=payload, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      result = json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"{path.name} failed: HTTP {exc.code}: {exc.read().decode(errors='replace')}") from exc
              report.append({"version": version, "name": name, "sha256": digest, "result": result})
              print(version, name, result)
          Path(os.environ["RUNNER_TEMP"], "tournament-migrations.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY

      - name: Verify database contract used by tournament services
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, urllib.error, urllib.request
          from pathlib import Path

          files = list(Path("jupr_app/services").glob("*tournament*.py")) + list(Path("services/api").glob("*tournament*.py"))
          tables = set()
          functions = set()
          for path in files:
              text = path.read_text(encoding="utf-8")
              tables.update(re.findall(r"\.table\(\s*[\"']([a-zA-Z0-9_]+)[\"']", text))
              functions.update(re.findall(r"\.rpc\(\s*[\"']([a-zA-Z0-9_]+)[\"']", text))
          tables.update({
              "tournament_admin_operations",
              "tournament_registration_partner_requests",
              "tournament_registration_team_links",
              "tournament_registration_team_members",
              "tournament_commerce_orders",
              "tournament_four_player_teams",
              "tournament_team_matchups",
              "tournament_team_operations",
          })
          functions.update({
              "edit_public_tournament_registration_transaction",
              "lock_public_tournament_registration_selection",
          })
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/rpc/jupr_tournament_contract_readiness"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          request = urllib.request.Request(
              url,
              data=json.dumps({"p_tables": sorted(tables), "p_functions": sorted(functions)}).encode(),
              method="POST",
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  readiness = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Database readiness failed: HTTP {exc.code}: {exc.read().decode(errors='replace')}") from exc
          if isinstance(readiness, list) and len(readiness) == 1:
              readiness = readiness[0]
          Path(os.environ["RUNNER_TEMP"], "tournament-database-readiness.json").write_text(json.dumps(readiness, indent=2), encoding="utf-8")
          missing_tables = readiness.get("missing_tables") or []
          missing_functions = readiness.get("missing_functions") or []
          if missing_tables or missing_functions:
              raise SystemExit(f"Incomplete tournament database contract: tables={missing_tables}; functions={missing_functions}")
          print(json.dumps(readiness, indent=2))
          PY

      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Configure production tournament feature gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.fly/bin:$PATH"
          python - <<'PY' > "$RUNNER_TEMP/tournament-flags.txt"
          import re
          from pathlib import Path
          names=set()
          for path in list(Path('jupr_app/services').glob('*tournament*.py')) + list(Path('services/api').glob('*tournament*.py')):
              names.update(re.findall(r'JUPR_ENABLE_[A-Z0-9_]+', path.read_text(encoding='utf-8')))
          explicit={
              'JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION',
              'JUPR_ENABLE_STAGING_PUBLIC_INTAKE_WRITES',
              'JUPR_ENABLE_TOURNAMENT_COMMERCE',
              'JUPR_ENABLE_STAGING_TOURNAMENT_COMMERCE_WRITES',
              'JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION',
              'JUPR_ENABLE_NEXT_ADMIN_TOURNAMENTS',
              'JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH',
          }
          names.update(explicit)
          for name in sorted(names):
              value='0' if any(token in name for token in ('EMAIL','STRIPE','PAYMENT')) else '1'
              print(f'{name}={value}')
          print('JUPR_ENV=production')
          print('JUPR_PRODUCTION_WRITE_POLICY=enabled')
          print('JUPR_EMAIL_MODE=dry_run')
          print('JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS=0')
          print('JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF=0')
          print('JUPR_STAGING_WRITE_WAVE=none')
          PY
          mapfile -t flags < "$RUNNER_TEMP/tournament-flags.txt"
          flyctl secrets set --app "$FLY_APP" "${flags[@]}"

      - name: Deploy exact API source to production
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.fly/bin:$PATH"
          config_args=()
          for candidate in fly.production.toml services/api/fly.production.toml fly.toml services/api/fly.toml; do
            if [ -f "$candidate" ]; then config_args=(--config "$candidate"); break; fi
          done
          if [ ${#config_args[@]} -gt 0 ]; then
            flyctl deploy . --remote-only --app "$FLY_APP" "${config_args[@]}"
          else
            dockerfile=$(find . -maxdepth 4 -type f -name 'Dockerfile*' | grep -E 'api|services' | head -1)
            test -n "$dockerfile"
            flyctl deploy . --remote-only --app "$FLY_APP" --dockerfile "$dockerfile"
          fi
          flyctl status --app "$FLY_APP"

      - name: Verify production API health and identity
        run: |
          set -euo pipefail
          api_base="https://${FLY_APP}.fly.dev"
          echo "$api_base" > "$RUNNER_TEMP/api-base.txt"
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error "$api_base/health" > "$RUNNER_TEMP/api-health.json" \
              && curl --fail --silent --show-error "$api_base/openapi.json" > "$RUNNER_TEMP/openapi.json"; then
              break
            fi
            sleep 5
          done
          test -s "$RUNNER_TEMP/api-health.json"
          test -s "$RUNNER_TEMP/openapi.json"

      - name: Run live public registration acceptance and clean up
        shell: bash
        run: |
          set -euo pipefail
          export JUPR_ENV=production
          export JUPR_PRODUCTION_WRITE_POLICY=enabled
          export JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION=1
          export JUPR_ENABLE_STAGING_PUBLIC_INTAKE_WRITES=1
          export JUPR_ENABLE_STAGING_TOURNAMENT_COMMERCE_WRITES=1
          export JUPR_ENABLE_TOURNAMENT_COMMERCE=1
          export JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION=1
          export JUPR_EMAIL_MODE=dry_run
          export JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS=0
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, time, urllib.error, urllib.parse, urllib.request, uuid
          from pathlib import Path

          API = Path(os.environ['RUNNER_TEMP'], 'api-base.txt').read_text().strip()
          SB = os.environ['SUPABASE_URL'].rstrip('/')
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          marker = 'PCS-PROD-TOURNAMENT-' + uuid.uuid4().hex[:12].upper()
          email = marker.lower() + '@example.invalid'
          headers = {'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}

          def http(method, url, body=None, extra=None, ok=(200,201,204)):
              h=dict(headers); h.update(extra or {})
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      raw=resp.read().decode()
                      if resp.status not in ok: raise RuntimeError(f'{resp.status}: {raw}')
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode(errors='replace')
                  raise RuntimeError(f'{method} {url} -> HTTP {exc.code}: {detail}') from exc

          def rest_get(table, params):
              return http('GET', f'{SB}/rest/v1/{table}?{urllib.parse.urlencode(params)}')

          before=http('POST', f'{SB}/rest/v1/rpc/jupr_production_tournament_integrity_snapshot', {})
          settings=rest_get('tournament_registration_settings', {'select':'*','limit':'100'}) or []
          days=rest_get('tournament_registration_days', {'select':'*','limit':'500'}) or []
          options=rest_get('tournament_event_options', {'select':'*','limit':'1000'}) or []
          tournaments=rest_get('tournaments', {'select':'*','limit':'200'}) or []
          days_by={str(row.get('tournament_id')): row for row in days}
          options_by={str(row.get('tournament_id')): row for row in options}
          tournament_by={str(row.get('id')): row for row in tournaments}
          candidates=[row for row in settings if str(row.get('tournament_id')) in days_by and str(row.get('tournament_id')) in options_by]
          if not candidates: raise RuntimeError('No configured production tournament can support registration acceptance')
          candidates.sort(key=lambda row: str(row.get('registration_status','')).upper()!='OPEN')
          setting=candidates[0]
          tid=str(setting['tournament_id'])
          day=days_by[tid]
          option=options_by[tid]
          tournament=tournament_by.get(tid,{})
          slug=setting.get('registration_slug') or tournament.get('slug') or tid
          original={key: setting.get(key) for key in ('registration_status','registration_open_at','registration_close_at','updated_at') if key in setting}
          changed=False

          openapi=http('GET', API + '/openapi.json', extra={'apikey':''})
          paths=openapi.get('paths',{})
          scored=[]
          for path,item in paths.items():
              op=item.get('post') if isinstance(item,dict) else None
              if not op: continue
              text=' '.join([path,str(op.get('operationId','')),str(op.get('summary',''))]).lower()
              if 'tournament' not in text or 'registration' not in text: continue
              if any(x in text for x in ('edit-link','partner','team','commerce','quote','admin','selection')): continue
              score=(5 if 'submit' in text else 0)+(3 if '/public' in path else 0)+(2 if 'registrations' in path else 0)
              scored.append((score,path,op))
          if not scored: raise RuntimeError('Public tournament registration POST route is missing from production OpenAPI')
          _, path_template, operation=max(scored,key=lambda row:row[0])

          components=openapi.get('components',{}).get('schemas',{})
          def resolve(schema):
              while '$ref' in schema:
                  schema=components[schema['$ref'].split('/')[-1]]
              for key in ('oneOf','anyOf','allOf'):
                  if key in schema and schema[key]:
                      if key=='allOf':
                          merged={'type':'object','properties':{},'required':[]}
                          for part in schema[key]:
                              part=resolve(part); merged['properties'].update(part.get('properties',{})); merged['required']+=part.get('required',[])
                          return merged
                      schema=next((resolve(x) for x in schema[key] if x.get('type')!='null'), resolve(schema[key][0]))
              return schema

          ids={'tournament_id':tid,'registration_day_id':str(day.get('id')),'event_option_id':str(option.get('id')),'club_id':str(tournament.get('club_id') or setting.get('club_id') or '')}
          def value(name,schema):
              schema=resolve(schema); typ=schema.get('type')
              lname=name.lower(); enum=schema.get('enum') or []
              if enum:
                  prefs={'partner_mode':['NEED_PARTNER','NONE'],'gender':['OTHER','MIXED'],'status':['PENDING','REGISTERED']}
                  for pref in prefs.get(lname,[]):
                      if pref in enum:return pref
                  return enum[0]
              if lname in ids and ids[lname]: return ids[lname]
              if 'email' in lname:return email
              if lname=='first_name':return 'PCS'
              if lname=='last_name':return 'Production Smoke'
              if 'display_name' in lname or lname=='name':return marker
              if 'phone' in lname:return '+12185550199'
              if 'note' in lname:return marker
              if 'dupr' in lname:return marker[-12:]
              if 'skill' in lname:return 3.5
              if lname=='age':return 40
              if 'age_bracket' in lname:return 'OPEN'
              if 'slug' in lname:return slug
              if schema.get('format')=='uuid':return ids.get(lname) or str(uuid.uuid4())
              if typ=='boolean':return False
              if typ in ('integer','number'):return 1 if typ=='integer' else 3.5
              if typ=='array':return [value(lname.rstrip('s'),schema.get('items',{}))]
              if typ=='object' or 'properties' in schema:
                  props=schema.get('properties',{}); required=set(schema.get('required',[]))
                  include=required | {k for k in props if any(token in k.lower() for token in ('name','email','phone','skill','age','gender','note','selection','partner','day','event','contact'))}
                  return {k:value(k,props[k]) for k in include if k in props}
              return marker

          request_schema=operation.get('requestBody',{}).get('content',{}).get('application/json',{}).get('schema',{})
          payload=value('root',request_schema)
          path=path_template
          for raw in re.findall(r'{([^}]+)}',path):
              key=raw.lower()
              replacement=slug if 'slug' in key else ids.get(key) or (tid if 'tournament' in key else ids.get('club_id'))
              if not replacement: raise RuntimeError(f'Cannot resolve path parameter {raw}')
              path=path.replace('{'+raw+'}',urllib.parse.quote(str(replacement),safe=''))

          try:
              if str(setting.get('registration_status','')).upper()!='OPEN':
                  patch={'registration_status':'OPEN'}
                  http('PATCH', f'{SB}/rest/v1/tournament_registration_settings?tournament_id=eq.{urllib.parse.quote(tid)}', patch, extra={'Prefer':'return=minimal'})
                  changed=True
              result=http('POST', API + path, payload, extra={'Idempotency-Key':marker,'X-Idempotency-Key':marker})
              rows=rest_get('tournament_registrations', {'select':'id,email,tournament_id,status','email':f'eq.{email}'}) or []
              if len(rows)!=1: raise RuntimeError(f'Live registration was not persisted exactly once: {rows}')
              Path(os.environ['RUNNER_TEMP'],'public-registration-acceptance.json').write_text(json.dumps({'marker':marker,'path':path,'payload':payload,'result':result,'registration':rows[0]},indent=2),encoding='utf-8')
          finally:
              try:http('POST', f'{SB}/rest/v1/rpc/jupr_cleanup_tournament_cutover_marker', {'p_marker':marker})
              finally:
                  if changed:
                      restore={k:v for k,v in original.items() if k!='updated_at'}
                      http('PATCH', f'{SB}/rest/v1/tournament_registration_settings?tournament_id=eq.{urllib.parse.quote(tid)}', restore, extra={'Prefer':'return=minimal'})

          remaining=rest_get('tournament_registrations', {'select':'id','email':f'eq.{email}'}) or []
          if remaining: raise RuntimeError('Synthetic registration cleanup did not complete')
          after=http('POST', f'{SB}/rest/v1/rpc/jupr_production_tournament_integrity_snapshot', {})
          for key in ('matches','tournaments'):
              if before['hashes'][key]!=after['hashes'][key]: raise RuntimeError(f'Production {key} changed during disposable acceptance')
          if before['counts']['players']!=after['counts']['players']: raise RuntimeError('Production player count changed during disposable acceptance')
          Path(os.environ['RUNNER_TEMP'],'integrity-before.json').write_text(json.dumps(before,indent=2),encoding='utf-8')
          Path(os.environ['RUNNER_TEMP'],'integrity-after.json').write_text(json.dumps(after,indent=2),encoding='utf-8')
          print('Live public registration acceptance passed and synthetic data was removed')
          PY

      - name: Verify authenticated tournament administration when credentials are available
        run: |
          set -euo pipefail
          export JUPR_ENV=production JUPR_PRODUCTION_WRITE_POLICY=enabled JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION=1
          export SUPABASE_SERVICE_ROLE_KEY
          python - <<'PY'
          import os
          from jupr_app.services.admin_tournament_guarded_operation import SURFACE_MUTATION_FLAGS, require_tournament_admin_mutation_runtime
          from jupr_app.services.admin_tournament_ops_service import require_admin_tournament_official_publish_runtime
          for flag in SURFACE_MUTATION_FLAGS.values(): os.environ[flag]='1'
          os.environ['JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH']='1'
          os.environ['JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS']='0'
          os.environ['JUPR_EMAIL_MODE']='dry_run'
          for surface in SURFACE_MUTATION_FLAGS: require_tournament_admin_mutation_runtime(surface)
          require_admin_tournament_official_publish_runtime()
          print('All production tournament administration guards are open with explicit two-key authorization')
          PY
          if [ -n "${ADMIN_EMAIL:-}" ] && [ -n "${ADMIN_PASSWORD:-}" ]; then
            token=$(curl --fail --silent --show-error \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -d "$(python -c 'import json,os; print(json.dumps({"email":os.environ["ADMIN_EMAIL"],"password":os.environ["ADMIN_PASSWORD"]}))')" \
              "$SUPABASE_URL/auth/v1/token?grant_type=password" | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
            test -n "$token"
            api_base=$(cat "$RUNNER_TEMP/api-base.txt")
            curl --fail --silent --show-error -H "Authorization: Bearer $token" "$api_base/admin/tournaments" > "$RUNNER_TEMP/admin-tournaments.json" || \
              curl --fail --silent --show-error -H "Authorization: Bearer $token" "$api_base/admin/clubs/tres-palapas/tournaments" > "$RUNNER_TEMP/admin-tournaments.json"
          fi

      - name: Promote exact source to the production web branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha='${{ steps.source.outputs.sha }}'
          git push --force-with-lease="refs/heads/$PRODUCTION_BRANCH:${{ github.sha }}" origin "$source_sha:refs/heads/$PRODUCTION_BRANCH"

      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha='${{ steps.source.outputs.sha }}'
          success=0
          for i in $(seq 1 90); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$source_sha/status" > "$RUNNER_TEMP/vercel-status.json"
            state=$(python - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/vercel-status.json'))
          states=[row.get('state') for row in data.get('statuses',[]) if row.get('context')=='Vercel']
          print(states[0] if states else 'missing')
          PY
            )
            if [ "$state" = success ]; then success=1; break; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 5
          done
          test "$success" = 1

      - name: Verify public production tournament pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PRODUCTION_DOMAIN/clubs/tres-palapas/tournaments" > "$RUNNER_TEMP/public-tournaments.html"
          curl --fail --silent --show-error "$PRODUCTION_DOMAIN/clubs/tres-palapas/tournaments/register" > "$RUNNER_TEMP/public-registration.html" || true
          test -s "$RUNNER_TEMP/public-tournaments.html"
          if grep -qi 'vercel.*login\|deployment protection' "$RUNNER_TEMP/public-tournaments.html"; then
            echo '::error::Production remains behind Vercel authentication.'
            exit 1
          fi

      - name: Upload final cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-tournaments-complete-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/activation-source-sha.txt
            ${{ runner.temp }}/tournament-migrations.json
            ${{ runner.temp }}/tournament-database-readiness.json
            ${{ runner.temp }}/api-health.json
            ${{ runner.temp }}/public-registration-acceptance.json
            ${{ runner.temp }}/integrity-before.json
            ${{ runner.temp }}/integrity-after.json
            ${{ runner.temp }}/vercel-status.json
          if-no-files-found: warn
          retention-days: 90

      - name: Mark cutover successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-success.json"
          import json, os
          print(json.dumps({
            "state": "success",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Production tournaments are operational",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-success.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Close production tournament gate after a failed pre-promotion cutover
        if: failure()
        continue-on-error: true
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          if command -v flyctl >/dev/null 2>&1 && [ -n "${FLY_API_TOKEN:-}" ]; then
            flyctl secrets set --app "$FLY_APP" JUPR_ENABLE_TOURNAMENT_WRITES_PRODUCTION=0
          fi

      - name: Mark cutover failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status-failure.json"
          import json, os
          print(json.dumps({
            "state": "failure",
            "context": os.environ["STATUS_CONTEXT"],
            "description": "Production tournament cutover failed closed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/status-failure.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
