name: Fix match-player global feedback transform v2

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/match-player-session-followups-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-player-session-followups-20260728
          fetch-depth: 0

      - name: Replace final global feedback transform by label
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply_match_player_session_followups_20260728.py')
          text = path.read_text(encoding='utf-8')
          label = '        "avoid duplicate manual feedback",'
          label_pos = text.index(label)
          start = text.rfind('    text = replace_once(', 0, label_pos)
          end = text.index('    )', label_pos) + len('    )')
          if start < 0:
              raise SystemExit('Could not locate feedback transform start')
          replacement = '''    global_feedback = \'''      {message && !result ? <p aria-live="polite" role={messageIsError ? "alert" : "status"} style={{ color: messageIsError ? "#b91c1c" : "#166534" }}>{message}</p> : null}\'''
          global_feedback_replacement = \'''      {message && !result && entryMethod !== "manual" ? <p aria-live="polite" role={messageIsError ? "alert" : "status"} style={{ color: messageIsError ? "#b91c1c" : "#166534" }}>{message}</p> : null}\'''
          if global_feedback not in text:
              raise RuntimeError("global feedback block not found")
          prefix, separator, suffix = text.rpartition(global_feedback)
          if not separator:
              raise RuntimeError("global feedback block could not be isolated")
          text = prefix + global_feedback_replacement + suffix'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')

      - name: Commit repair and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-followup-global-feedback-transform-20260728.yml
          rm .github/workflows/fix-followup-global-feedback-transform-v2-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add \
            scripts/apply_match_player_session_followups_20260728.py \
            .github/workflows/fix-followup-global-feedback-transform-20260728.yml \
            .github/workflows/fix-followup-global-feedback-transform-v2-20260728.yml
          git commit -m 'Fix follow-up global feedback transform'
          git push origin HEAD:agent/match-player-session-followups-20260728
