name: Temporary Tournament lifecycle verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-tournament-lifecycle-d0a372'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: d0a372d5848386140af79693f398f60416f2f6a6
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
      MATCH_UPLOADER_STATUS_URL: https://juprleagues-api-staging.fly.dev/admin/clubs/tres_palapas/match-uploader/status
      CANONICAL_URL: https://jupr-git-staging-pickleballattrespalapas1.vercel.app
      TEST_TOURNAMENT_ID: 00000000-0000-0000-0000-000000000001
      TEST_TOURNAMENT_NAME: Staging%20Summer%20Classic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 20 "$FLY_HEALTH_URL" -o evidence/health.json; then
              actual="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$actual image=$image"
              if [ "$actual" = "$EXPECTED_SHA" ] && { [ -z "$image" ] || [ "$image" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('evidence/health.json').read_text())
          expected_sha = os.environ['EXPECTED_SHA']

          def find_key(value, key):
              if isinstance(value, dict):
                  if key in value:
                      return value[key]
                  for child in value.values():
                      found = find_key(child, key)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_key(child, key)
                      if found is not None:
                          return found
              return None

          def first(*keys):
              for key in keys:
                  value = find_key(payload, key)
                  if value is not None:
                      return value
              return None

          observed = {
              'environment': first('environment'),
              'source_sha': first('git_commit_sha', 'source_commit_sha', 'source_sha', 'commit_sha'),
              'image_sha': first('image_build_git_sha', 'image_git_sha'),
              'fly_app': first('fly_app_name', 'app_name', 'app'),
              'write_wave': first('write_wave'),
              'staging_write_wave': first('staging_write_wave'),
              'business_data_write_wave_active': first('business_data_write_wave_active'),
              'email_mode': first('email_mode'),
              'live_player_update_email_enabled': first('live_player_update_email_enabled'),
              'public_live_production_override_enabled': first('public_live_production_override_enabled'),
              'supabase_project_ref': first('supabase_project_ref', 'supabase_project'),
          }
          expected = {
              'environment': 'staging',
              'source_sha': expected_sha,
              'image_sha': expected_sha,
              'fly_app': 'juprleagues-api-staging',
              'write_wave': 'open',
              'staging_write_wave': 'open',
              'business_data_write_wave_active': True,
              'email_mode': 'dry_run',
              'live_player_update_email_enabled': False,
              'public_live_production_override_enabled': False,
              'supabase_project_ref': 'sijpxjxvdtrehmqvirfi',
          }
          Path('evidence/observed-health-contract.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          mismatches = {
              key: {'expected': expected[key], 'actual': observed.get(key)}
              for key in expected
              if observed.get(key) != expected[key]
          }
          print(json.dumps(observed, indent=2, sort_keys=True))
          if mismatches:
              print('MISMATCHES=' + json.dumps(mismatches, indent=2, sort_keys=True))
              raise SystemExit(1)
          PY

      - name: Verify Match Uploader remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$MATCH_UPLOADER_STATUS_URL" -o evidence/match-uploader-status.json
          jq . evidence/match-uploader-status.json
          jq -e '(.enabled == true) and (.singles_write_enabled == true) and ((.status // "") != "guarded_off")' evidence/match-uploader-status.json

      - name: Wait for canonical lifecycle routes
        shell: bash
        run: |
          set -euo pipefail
          context="tournament=$TEST_TOURNAMENT_ID&name=$TEST_TOURNAMENT_NAME"
          registration_id="00000000-0000-0000-0000-000000000002"
          routes=(
            "/admin/tournaments"
            "/admin/tournaments/create"
            "/admin/tournaments/tournament?$context"
            "/admin/tournaments/setup?$context"
            "/admin/tournaments/registration?$context"
            "/admin/tournaments/registration/registrants?$context"
            "/admin/tournaments/registration/registrants/$registration_id?$context"
            "/admin/tournaments/registration/partners?$context"
            "/admin/tournaments/live-operations?$context"
            "/admin/tournaments/live-operations/check-in?$context"
            "/admin/tournaments/publish?$context"
            "/admin/tournaments/publish/closeout?$context"
            "/admin/tournament-setup?$context"
            "/admin/tournaments/team-competition?$context"
            "/admin/tournaments/commerce?$context"
            "/admin/tournaments/registrations?$context"
            "/admin/tournaments/ops?$context"
            "/admin/tournaments/ops/draws?$context"
            "/admin/tournaments/ops/results?$context"
            "/admin/tournaments/ops/publish?$context"
            "/admin/tournament-live?$context"
            "/admin/tournaments/status?$context"
            "/admin/match-uploader"
          )
          for attempt in $(seq 1 90); do
            : > evidence/vercel-routes.txt
            all_ready=1
            for path in "${routes[@]}"; do
              status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "$CANONICAL_URL$path" || true)"
              echo "$path $status" | tee -a evidence/vercel-routes.txt
              if [ "$status" != "200" ]; then all_ready=0; fi
            done
            if [ "$all_ready" -eq 1 ]; then break; fi
            if [ "$attempt" -eq 90 ]; then
              echo "Canonical lifecycle routes did not all become ready." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify lifecycle source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web')
          nav = (root / 'components/TournamentAdminNav.tsx').read_text()
          home = (root / 'app/admin/tournaments/tournament/TournamentHomePanel.tsx').read_text()
          session = (root / 'lib/useAdminSession.ts').read_text()
          commerce = (root / 'app/admin/tournaments/commerce/TournamentCommercePanel.tsx').read_text()
          registration = (root / 'app/admin/tournaments/registration/registrants/TournamentRegistrantListPanel.tsx').read_text()
          ops = (root / 'app/admin/tournaments/ops/TournamentOpsPanel.tsx').read_text()

          required_nav = ['Tournament Home', 'Setup', 'Registration', 'Live Operations', 'Publish']
          for label in required_nav:
              assert label in nav, label
          for old in ['Bulk actions', 'Extras & fulfillment', 'Ratings & team play', 'Official publish', 'Status & recovery']:
              assert f'label: "{old}"' not in nav, old
          assert 'Next action' in home
          assert 'Tournament workflow' in home
          assert 'useSyncExternalStore' in session
          assert 'let sharedSnapshot' in session
          assert 'Tournament extras workspace' not in commerce
          assert 'inputMode="decimal"' in commerce
          assert 'savedItemIds' in commerce and 'savedBundleIds' in commerce
          assert 'Edit registration' in registration
          assert 'Amount' in registration and 'Events' in registration and 'Extras' in registration
          assert 'loadTournaments' not in ops
          assert 'Refresh tournaments' not in ops
          Path('evidence/source-contract.txt').write_text('Tournament lifecycle source contracts passed.\n')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: tournament-lifecycle-rebuild-evidence
          path: evidence
          if-no-files-found: error
