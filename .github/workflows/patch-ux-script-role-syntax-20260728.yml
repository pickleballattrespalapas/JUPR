name: Patch UX repair role syntax

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/manual-acceptance-ux-fixes-v2-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-acceptance-ux-fixes-v2-20260728
          fetch-depth: 0
      - name: Patch malformed role attributes
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/apply_manual_acceptance_ux_fixes_20260728.py')
          text = path.read_text(encoding='utf-8')
          bad = 'role={messageIsError ? "alert" : "status" style='
          good = 'role={messageIsError ? "alert" : "status"} style='
          count = text.count(bad)
          if count != 2:
              raise SystemExit(f'Expected two malformed role attributes, found {count}')
          path.write_text(text.replace(bad, good), encoding='utf-8')
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ux-script-role-syntax-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/apply_manual_acceptance_ux_fixes_20260728.py .github/workflows/patch-ux-script-role-syntax-20260728.yml
          git commit -m 'Fix UX repair role syntax'
          git push origin HEAD:agent/manual-acceptance-ux-fixes-v2-20260728
