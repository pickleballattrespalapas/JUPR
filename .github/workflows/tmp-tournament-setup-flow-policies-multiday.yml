name: Temporary Tournament Setup flow and policy refinement publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.head_ref == 'agent/tournament-setup-flow-policies-multiday' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-flow-policies-multiday
          fetch-depth: 0

      - name: Apply flow, policy, modal, and multi-day patch
        run: PYTHONPATH=. python scripts/tmp_tournament_setup_flow_policies_multiday.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_event_division_refine.py \
            tests/test_api_contract_tournament_setup_flow_policies_multiday.py \
            tests/test_production_deployment_hardening.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-tournament-setup-flow-policies-multiday.yml
          rm scripts/tmp_tournament_setup_flow_policies_multiday.py
          git checkout -- apps/web/next-env.d.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine Tournament Setup flow and multi-day scheduling"
          git push origin HEAD:agent/tournament-setup-flow-policies-multiday
