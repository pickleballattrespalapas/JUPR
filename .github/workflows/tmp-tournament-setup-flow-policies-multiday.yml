name: Temporary Tournament Setup flow and policy refinement publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.head_ref == 'agent/tournament-setup-flow-policies-multiday' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tournament-setup-flow-policies-multiday
          fetch-depth: 0

      - name: Apply flow, policy, modal, and multi-day patch
        run: PYTHONPATH=. python scripts/tmp_tournament_setup_flow_policies_multiday.py

      - name: Refresh migration and focused-test contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          migrations = Path("supabase/migrations")
          contract_path = Path("config/production_migration_contract.json")
          contract = json.loads(contract_path.read_text())
          ledger_name = "tournament_setup_policies_multiday"
          names = set(contract["required_ledger_names"])
          names.add(ledger_name)
          contract["required_ledger_names"] = sorted(names)
          records = [
              f"{path.name}\t{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in sorted(migrations.glob("*.sql"))
          ]
          contract["repository_migration_content_sha256"] = hashlib.sha256(
              "\n".join(records).encode("utf-8")
          ).hexdigest()
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")

          policies_path = Path("apps/web/app/admin/tournaments/setup/TournamentSetupPolicies.tsx")
          policies_text = policies_path.read_text()
          function_start = "export function withDefaultTournamentPolicies(settings: SetupRecord): SetupRecord {"
          first = policies_text.find(function_start)
          second = policies_text.find(function_start, first + 1) if first >= 0 else -1
          if second >= 0:
              end_marker = "\n\nfunction text(value: unknown): string {"
              end = policies_text.find(end_marker, second)
              if end < 0:
                  raise SystemExit("Unable to locate duplicate policy hydrator end marker")
              policies_text = policies_text[:second] + policies_text[end + 2 :]
              policies_path.write_text(policies_text)

          panel_path = Path("apps/web/app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx")
          panel_text = panel_path.read_text()
          duplicate_review = "async function reviewImpact()\n\nasync function reviewImpact() {"
          if duplicate_review in panel_text:
              panel_text = panel_text.replace(
                  duplicate_review,
                  "async function reviewImpact() {",
                  1,
              )
              panel_path.write_text(panel_text)

          setup_test = Path("tests/test_api_contract_tournament_setup_event_division_refine.py")
          setup_text = setup_test.read_text()
          setup_replacements = {
              "    assert 'onClick={() => void saveRegistrationRules()}' in panel\n": "    assert 'onClick={() => void saveBasics()}' in panel\n",
              "    assert 'onClick={() => void saveDraftAndContinue(\"review\")}' in panel\n": "    assert 'onClick={() => void saveDraftAndContinue(\"events\")}' in panel\n",
          }
          for old_value, new_value in setup_replacements.items():
              if setup_text.count(old_value) != 1:
                  raise SystemExit(f"setup contract marker match count={setup_text.count(old_value)} for {old_value!r}")
              setup_text = setup_text.replace(old_value, new_value, 1)
          setup_test.write_text(setup_text)

          production_test = Path("tests/test_production_deployment_hardening.py")
          production_text = production_test.read_text()
          replacements = {
              "    assert len(versions) == 55\n": "    assert len(versions) == 56\n",
              "    assert len(names) == 55\n": "    assert len(names) == 56\n",
              "    assert len(contract[\"required_ledger_names\"]) == 55\n": "    assert len(contract[\"required_ledger_names\"]) == 56\n",
              '''    assert versions[-5:] == (\n        "20260728041000",\n        "20260731033000",\n        "20260731210000",\n        "20261020000000",\n        "20261021000000",\n    )\n''': '''    assert versions[-5:] == (\n        "20260731033000",\n        "20260731210000",\n        "20261020000000",\n        "20261021000000",\n        "20261022000000",\n    )\n''',
          }
          for old_value, new_value in replacements.items():
              if production_text.count(old_value) != 1:
                  raise SystemExit(f"production contract marker match count={production_text.count(old_value)} for {old_value!r}")
              production_text = production_text.replace(old_value, new_value, 1)
          production_test.write_text(production_text)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused contracts
        run: |
          python -m pytest -q \
            tests/test_api_contract_tournament_setup_event_division_refine.py \
            tests/test_api_contract_tournament_setup_flow_policies_multiday.py \
            tests/test_production_deployment_hardening.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-tournament-setup-flow-policies-multiday.yml
          rm scripts/tmp_tournament_setup_flow_policies_multiday.py
          git checkout -- apps/web/next-env.d.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine Tournament Setup flow and multi-day scheduling"
          git push origin HEAD:agent/tournament-setup-flow-policies-multiday
