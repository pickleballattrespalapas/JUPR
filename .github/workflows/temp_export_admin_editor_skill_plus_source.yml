name: Temporary Export Admin Editor and Skill Plus Source

on:
  push:
    branches:
      - agent/complete-admin-registration-and-skill-plus-20260806
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/complete-admin-registration-and-skill-plus-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-admin-registration-and-skill-plus-20260806
          fetch-depth: 1

      - name: Archive exact feature source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/jupr-admin-editor-skill-plus-source.tar.gz HEAD

      - name: Upload exact feature source
        uses: actions/upload-artifact@v4
        with:
          name: jupr-admin-editor-skill-plus-source
          path: /tmp/jupr-admin-editor-skill-plus-source.tar.gz
          retention-days: 1
          if-no-files-found: error
