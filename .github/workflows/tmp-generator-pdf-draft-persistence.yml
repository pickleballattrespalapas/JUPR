name: Temporary generator PDF and draft persistence publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/generator-pdf-draft-persistence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generator-pdf-draft-persistence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply PDF and draft persistence patch
        run: python scripts/tmp_generator_pdf_draft_patch.py

      - name: Install focused Python dependency
        run: python -m pip install pytest

      - name: Run focused generator contracts
        run: |
          python -m pytest -q \
            tests/test_play_generator_pdf_and_draft_persistence.py \
            tests/test_play_generator_player_count_setup.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Run component checks
        working-directory: apps/web
        run: npm run test:components

      - name: Build Next app
        working-directory: apps/web
        run: npm run build

      - name: Commit clean application patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-generator-pdf-draft-persistence.yml
          rm scripts/tmp_generator_pdf_draft_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve generator drafts when opening PDFs"
          git push origin HEAD:agent/generator-pdf-draft-persistence
