name: Compute migration contract fingerprint

on:
  push:
    branches:
      - agent/fix-tournament-commerce-migration
    paths:
      - .github/workflows/compute-migration-contract-fingerprint.yml

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'pickleballattrespalapas/JUPR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tournament-commerce-migration
          fetch-depth: 0
      - name: Update reviewed migration fingerprint
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          migrations = Path('supabase/migrations')
          records = [
              f"{path.name}\t{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in sorted(migrations.glob('*.sql'))
          ]
          fingerprint = hashlib.sha256('\n'.join(records).encode('utf-8')).hexdigest()
          contract = Path('config/production_migration_contract.json')
          payload = json.loads(contract.read_text(encoding='utf-8'))
          payload['repository_migration_content_sha256'] = fingerprint
          contract.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(fingerprint)
      - name: Commit fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pickleballattrespalapas"
          git config user.email "pickleballattrespalapas@gmail.com"
          git add config/production_migration_contract.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh reviewed migration fingerprint"
          git push origin HEAD:agent/fix-tournament-commerce-migration
