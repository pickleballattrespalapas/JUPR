name: Patch match-player follow-up script

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'pickleballattrespalapas/JUPR' &&
      github.event.pull_request.head.ref == 'agent/match-player-session-followups-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-player-session-followups-20260728
          fetch-depth: 0

      - name: Scope player-input transforms to the single-player component
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply_match_player_session_followups_20260728.py')
          text = path.read_text(encoding='utf-8')
          start_marker = "    text = replace_once(\n        text,\n        '''  players,\n"
          end_marker = "\n\n    dialog_component = '''"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    before, searchable, after = section(
              text,
              "function SearchablePlayerInput({",
              "function SearchablePlayerMultiInput({",
          )
          searchable = replace_once(
              searchable,
              """  players,
            disabled = false,
            onChange,""",
              """  players,
            disabled = false,
            invalid = false,
            onChange,""",
              "player invalid destructure",
          )
          searchable = replace_once(
              searchable,
              "  const numericStartingJupr = Number(startingJupr);",
              """  const numericStartingJupr = Number(startingJupr);
            const validatedInputStyle = invalid
              ? { ...inputStyle, border: "2px solid #dc2626", background: "#fef2f2" }
              : inputStyle;""",
              "player invalid style",
          )
          searchable = replace_once(
              searchable,
              """            style={{ ...inputStyle, minHeight: "2.4rem", display: "flex", alignItems: "center", whiteSpace: "normal", overflowWrap: "anywhere", background: "#f8fafc" }}""",
              """            style={{ ...validatedInputStyle, minHeight: "2.4rem", display: "flex", alignItems: "center", whiteSpace: "normal", overflowWrap: "anywhere", background: invalid ? "#fef2f2" : "#f8fafc" }}""",
              "selected player invalid style",
          )
          searchable = replace_once(
              searchable,
              """          disabled={disabled || creating}
            onChange={(event) => {""",
              """          disabled={disabled || creating}
            aria-invalid={invalid || undefined}
            onChange={(event) => {""",
              "player aria invalid",
          )
          searchable = replace_once(
              searchable,
              """          style={inputStyle}
                  />""",
              """          style={validatedInputStyle}
                  />""",
              "player invalid input style",
          )
          text = before + searchable + after
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-match-player-followup-script-20260728.yml
          git config user.name 'pickleballattrespalapas'
          git config user.email 'pickleballattrespalapas@gmail.com'
          git add scripts/apply_match_player_session_followups_20260728.py .github/workflows/patch-match-player-followup-script-20260728.yml
          git commit -m 'Scope Match Uploader follow-up transforms'
          git push origin HEAD:agent/match-player-session-followups-20260728
