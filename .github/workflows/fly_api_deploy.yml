name: Deploy FastAPI production to Fly

on:
  push:
    branches:
      - rollback-feb8
    paths:
      - .github/production-api-release.trigger
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact accepted production candidate SHA (40 lowercase hex characters)"
        required: true
        type: string
      confirmation:
        description: "Production owner approval phrase: DEPLOY PRODUCTION API"
        required: true
        type: string
      legacy_baseline_image_digest:
        description: "One-time only: reviewed current sha256 Fly image digest when /health has no Git SHA"
        required: false
        default: ""
        type: string
      legacy_baseline_config_sha256:
        description: "One-time only: reviewed sha256 of the current saved Fly config"
        required: false
        default: ""
        type: string
      legacy_baseline_confirmation:
        description: "One-time only: BOOTSTRAP REVIEWED LEGACY ROLLBACK"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: jupr-production-api-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy and verify exact production API candidate
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_MIGRATION_HEAD: ${{ vars.PRODUCTION_MIGRATION_LEDGER_HEAD || '20261022000000' }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF || 'dnoockbwfenunhcibwfn' }}
      FLY_APP_NAME: juprleagues-api
      JUPR_ENV: production
      PRODUCTION_API_ORIGIN: https://api.juprleagues.com
      PRODUCTION_FLY_ORIGIN: https://juprleagues-api.fly.dev
      PRODUCTION_SOURCE_BRANCH: rollback-feb8
    steps:
      - name: Check out canonical production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: rollback-feb8

      - name: Verify exact production candidate provenance
        shell: bash
        env:
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          EVENT_NAME: ${{ github.event_name }}
          LEGACY_BASELINE_CONFIG_SHA256: ${{ inputs.legacy_baseline_config_sha256 }}
          LEGACY_BASELINE_CONFIRMATION: ${{ inputs.legacy_baseline_confirmation }}
          LEGACY_BASELINE_IMAGE_DIGEST: ${{ inputs.legacy_baseline_image_digest }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$PRODUCTION_SOURCE_BRANCH" ]; then
            echo "::error title=Source branch rejected::Production API deploys must run from refs/heads/$PRODUCTION_SOURCE_BRANCH."
            exit 2
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          PRODUCTION_SHA="$(git rev-parse "refs/remotes/origin/$PRODUCTION_SOURCE_BRANCH")"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ] \
            || [ "$HEAD_SHA" != "$PRODUCTION_SHA" ]; then
            echo "::error title=Production provenance rejected::Checked-out HEAD, GITHUB_SHA, and the canonical production branch must be identical."
            exit 2
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            trigger_path=".github/production-api-release.trigger"
            read -r -a commit_identity <<< "$(
              git rev-list --parents -n 1 "$HEAD_SHA"
            )"
            parent_args=()
            for parent_sha in "${commit_identity[@]:1}"; do
              parent_args+=(--parent-sha "$parent_sha")
            done
            trigger_status_path="$RUNNER_TEMP/production-trigger-status.tsv"
            if [ "${#commit_identity[@]}" -eq 2 ]; then
              git diff-tree --no-commit-id --name-status -r \
                "${commit_identity[1]}" "$HEAD_SHA" \
                > "$trigger_status_path"
            else
              touch "$trigger_status_path"
            fi
            trigger_resolution="$RUNNER_TEMP/production-trigger-resolution.json"
            python3 scripts/deployment_verifier.py release-trigger \
              --trigger-json "$trigger_path" \
              --head-sha "$HEAD_SHA" \
              "${parent_args[@]}" \
              --changed-status "$trigger_status_path" \
              --output-json "$trigger_resolution"
            CANDIDATE_SHA="$(jq -er '.candidate_sha' "$trigger_resolution")"
            PRODUCTION_CONFIRMATION="$(jq -er '.confirmation' "$trigger_resolution")"
            LEGACY_BASELINE_IMAGE_DIGEST="$(jq -r '.legacy_baseline_image_digest' "$trigger_resolution")"
            LEGACY_BASELINE_CONFIG_SHA256="$(jq -r '.legacy_baseline_config_sha256' "$trigger_resolution")"
            LEGACY_BASELINE_CONFIRMATION="$(jq -r '.legacy_baseline_confirmation' "$trigger_resolution")"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CANDIDATE_SHA="$CANDIDATE_SHA_INPUT"
          else
            echo "::error title=Production event rejected::Only a protected manual dispatch or exact trigger-file push may deploy production."
            exit 2
          fi

          if [ "$PRODUCTION_CONFIRMATION" != "DEPLOY PRODUCTION API" ]; then
            echo "::error title=Production approval missing::The protected production approval phrase is incorrect."
            exit 2
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$CANDIDATE_SHA" != "$HEAD_SHA" ]; then
            echo "::error title=Candidate SHA rejected::The accepted candidate must be the exact checked-out 40-character commit SHA."
            exit 2
          fi

          if [ -n "$LEGACY_BASELINE_IMAGE_DIGEST" ] \
            || [ -n "$LEGACY_BASELINE_CONFIG_SHA256" ] \
            || [ -n "$LEGACY_BASELINE_CONFIRMATION" ]; then
            if [[ ! "$LEGACY_BASELINE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || [[ ! "$LEGACY_BASELINE_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              || [ "$LEGACY_BASELINE_CONFIRMATION" != "BOOTSTRAP REVIEWED LEGACY ROLLBACK" ]; then
              echo "::error title=Legacy baseline rejected::The one-time legacy rollback bootstrap requires the exact reviewed image digest, saved-config fingerprint, and approval phrase."
              exit 2
            fi
          fi

          {
            echo "LEGACY_BASELINE_IMAGE_DIGEST=$LEGACY_BASELINE_IMAGE_DIGEST"
            echo "LEGACY_BASELINE_CONFIG_SHA256=$LEGACY_BASELINE_CONFIG_SHA256"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.49"

      - name: Validate protected production inputs and config
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_SSH_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          python scripts/deployment_verifier.py preflight \
            --config fly.toml \
            --migrations-dir supabase/migrations \
            --migration-contract config/production_migration_contract.json

      - name: Require the exact existing production Fly app
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP_NAME" --json > "$RUNNER_TEMP/fly-status-before.json"
          flyctl machines list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-machines-before.json"
          mkdir -p "$RUNNER_TEMP/production-fly-config-before"
          (
            cd "$RUNNER_TEMP/production-fly-config-before"
            flyctl config save \
              --app "$FLY_APP_NAME" \
              --yes
          )
          test -s "$RUNNER_TEMP/production-fly-config-before/fly.toml"

      - name: Capture exact pre-deploy rollback identity
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "$PRODUCTION_FLY_ORIGIN/health" \
            --output "$RUNNER_TEMP/production-health-before.json"
          legacy_snapshot_args=()
          if [ -n "$LEGACY_BASELINE_IMAGE_DIGEST" ]; then
            legacy_snapshot_args+=(
              --reviewed-legacy-image-digest "$LEGACY_BASELINE_IMAGE_DIGEST"
              --reviewed-legacy-config-sha256 "$LEGACY_BASELINE_CONFIG_SHA256"
            )
          fi
          python scripts/deployment_verifier.py snapshot \
            --health-json "$RUNNER_TEMP/production-health-before.json" \
            --fly-status-json "$RUNNER_TEMP/fly-machines-before.json" \
            --fly-config "$RUNNER_TEMP/production-fly-config-before/fly.toml" \
            --output-json "$RUNNER_TEMP/production-rollback-snapshot.json" \
            --capture-unreviewed-legacy-evidence \
            "${legacy_snapshot_args[@]}"

      - name: Preserve pre-deploy baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-api-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-rollback-snapshot.json
            ${{ runner.temp }}/production-fly-config-before/fly.toml
          if-no-files-found: error
          retention-days: 90

      - name: Stop before mutation for legacy baseline review
        shell: bash
        run: |
          set -euo pipefail
          if jq -e \
            '.identity_mode == "legacy-unreviewed-evidence"' \
            "$RUNNER_TEMP/production-rollback-snapshot.json" \
            > /dev/null; then
            image_digest="$(
              jq -er '.fly_image_digest' \
                "$RUNNER_TEMP/production-rollback-snapshot.json"
            )"
            config_sha256="$(
              jq -er '.fly_config_sha256' \
                "$RUNNER_TEMP/production-rollback-snapshot.json"
            )"
            echo "::error title=Legacy baseline review required::No production state was mutated. Review artifact production-api-baseline-${GITHUB_RUN_ID}, then run a new approved trigger with legacy_baseline_image_digest=$image_digest and legacy_baseline_config_sha256=$config_sha256."
            exit 3
          fi

      - name: Verify production migration head before deploy
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          psql "$SUPABASE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command="select version || E'\t' || coalesce(name, '') from supabase_migrations.schema_migrations order by version" \
            > "$RUNNER_TEMP/production-migration-ledger-before.tsv"
          psql "$SUPABASE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command="select json_build_object('tournament_registrations_player_id_column', exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'tournament_registrations' and column_name = 'player_id'), 'idx_tournament_registrations_player_id', to_regclass('public.idx_tournament_registrations_player_id') is not null, 'uq_tournament_registrations_tournament_player', to_regclass('public.uq_tournament_registrations_tournament_player') is not null, 'tournament_player_duplicate_groups', (select count(*) from (select tournament_id, player_id from public.tournament_registrations where player_id is not null group by tournament_id, player_id having count(*) > 1) duplicates))::text" \
            > "$RUNNER_TEMP/production-schema-contract-before.json"
          python scripts/deployment_verifier.py migrations \
            --migrations-dir supabase/migrations \
            --migration-contract config/production_migration_contract.json \
            --remote-ledger "$RUNNER_TEMP/production-migration-ledger-before.tsv" \
            --schema-contract-json "$RUNNER_TEMP/production-schema-contract-before.json"

      - name: Reject pending Fly secret deployments before mutation
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-prechange.json"
          python scripts/deployment_verifier.py secrets \
            --no-pending-only \
            --fly-secrets-json "$RUNNER_TEMP/fly-secrets-prechange.json"

      - name: Preserve and verify current live production runtime
        id: baseline_projection
        shell: bash
        env:
          JUPR_FLY_DEPLOY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          JUPR_FLY_SSH_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          live_feature_profile="$(
            jq -er '.feature_profile' \
              "$RUNNER_TEMP/production-rollback-snapshot.json"
          )"
          case "$live_feature_profile" in
            baseline|release) ;;
            *)
              echo "::error title=Live feature profile rejected::The pre-deploy runtime is not an exact reviewed production profile."
              exit 2
              ;;
          esac
          runtime_secrets=(
            "JUPR_ENV=production"
            "JUPR_EMAIL_MODE=dry_run"
            "JUPR_PRODUCTION_WRITE_POLICY=enabled"
            "JUPR_STAGING_WRITE_WAVE=none"
            "JUPR_WEB_BASE_URL=https://pickleballclubsandwich.com"
            "JUPR_ALLOWED_ORIGINS=https://juprleagues.com,https://www.juprleagues.com,https://pickleballclubsandwich.com,https://www.pickleballclubsandwich.com"
            "JUPR_REQUIRE_API_AUDIT_LOG=1"
            "JUPR_REQUIRE_WORKER_RUN_LOG=1"
            "JUPR_SUPABASE_JWT_MODE=jwks"
            "JUPR_EXPECTED_MIGRATION_CONTRACT=$EXPECTED_MIGRATION_CONTRACT"
            "JUPR_EXPECTED_MIGRATION_HEAD=$EXPECTED_MIGRATION_HEAD"
            "JUPR_EXPECTED_MIGRATION_PROFILE=$EXPECTED_MIGRATION_PROFILE"
            "SUPABASE_URL=$SUPABASE_URL"
            "SUPABASE_JWKS_URL=${SUPABASE_URL%/}/auth/v1/.well-known/jwks.json"
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          )
          while IFS= read -r setting; do
            runtime_secrets+=("$setting")
          done < <(
            PRODUCTION_FEATURE_PROFILE="$live_feature_profile" python -c \
              'import os; from scripts.deployment_verifier import expected_production_feature_flags; expected=expected_production_feature_flags(profile=os.environ["PRODUCTION_FEATURE_PROFILE"]); print("\n".join(f"{name}={int(enabled)}" for name, enabled in expected.items()))'
          )

          # Keep the already-live reviewed projection exact. Candidate-only
          # gates never open on a different image.
          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets set \
            --app "$FLY_APP_NAME" \
            "${runtime_secrets[@]}"

          expected_flags_b64="$(
            PRODUCTION_FEATURE_PROFILE="$live_feature_profile" python -c 'import base64,json,os; from scripts.deployment_verifier import expected_production_feature_flags; expected=expected_production_feature_flags(profile=os.environ["PRODUCTION_FEATURE_PROFILE"]); print(base64.b64encode(json.dumps(expected,sort_keys=True).encode()).decode())'
          )"
          remote_check="python -c 'import base64,json,os,sys;expected=json.loads(base64.b64decode(\"$expected_flags_b64\"));actual={name:os.getenv(name,\"\").strip().lower() in {\"1\",\"true\",\"yes\",\"y\",\"on\"} for name in expected};ok=actual==expected and os.getenv(\"JUPR_STAGING_WRITE_WAVE\")==\"none\" and os.getenv(\"JUPR_PRODUCTION_WRITE_POLICY\")==\"enabled\" and os.getenv(\"JUPR_EMAIL_MODE\")==\"dry_run\";sys.exit(0 if ok else 3)'"
          FLY_API_TOKEN="$JUPR_FLY_SSH_TOKEN" flyctl ssh console \
            --quiet \
            --app "$FLY_APP_NAME" \
            --command "$remote_check"

      - name: Verify required Fly secret names without values
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-before.json"
          python scripts/deployment_verifier.py secrets \
            --fly-secrets-json "$RUNNER_TEMP/fly-secrets-before.json"

      - name: Validate exact production Fly config
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl config validate \
            --app "$FLY_APP_NAME" \
            --config fly.toml

      - name: Deploy exact production API candidate
        id: deploy
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy \
            --remote-only \
            --app "$FLY_APP_NAME" \
            --config fly.toml \
            --build-arg "JUPR_DEPLOYMENT_GIT_SHA=$GITHUB_SHA"

      - name: Activate and verify reviewed candidate runtime
        id: candidate_activation
        shell: bash
        env:
          JUPR_FLY_DEPLOY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          JUPR_FLY_SSH_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          runtime_secrets=(
            "JUPR_ENV=production"
            "JUPR_EMAIL_MODE=dry_run"
            "JUPR_PRODUCTION_WRITE_POLICY=enabled"
            "JUPR_STAGING_WRITE_WAVE=none"
            "JUPR_WEB_BASE_URL=https://pickleballclubsandwich.com"
            "JUPR_ALLOWED_ORIGINS=https://juprleagues.com,https://www.juprleagues.com,https://pickleballclubsandwich.com,https://www.pickleballclubsandwich.com"
            "JUPR_REQUIRE_API_AUDIT_LOG=1"
            "JUPR_REQUIRE_WORKER_RUN_LOG=1"
            "JUPR_SUPABASE_JWT_MODE=jwks"
            "JUPR_EXPECTED_MIGRATION_CONTRACT=$EXPECTED_MIGRATION_CONTRACT"
            "JUPR_EXPECTED_MIGRATION_HEAD=$EXPECTED_MIGRATION_HEAD"
            "JUPR_EXPECTED_MIGRATION_PROFILE=$EXPECTED_MIGRATION_PROFILE"
            "SUPABASE_URL=$SUPABASE_URL"
            "SUPABASE_JWKS_URL=${SUPABASE_URL%/}/auth/v1/.well-known/jwks.json"
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          )
          while IFS= read -r setting; do
            runtime_secrets+=("$setting")
          done < <(
            python -c \
              'from scripts.deployment_verifier import expected_production_feature_flags; print("\n".join(f"{name}={int(enabled)}" for name, enabled in expected_production_feature_flags(profile="release").items()))'
          )
          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets set \
            --app "$FLY_APP_NAME" \
            "${runtime_secrets[@]}"

          expected_flags_b64="$(
            python -c 'import base64,json; from scripts.deployment_verifier import expected_production_feature_flags; print(base64.b64encode(json.dumps(expected_production_feature_flags(profile="release"),sort_keys=True).encode()).decode())'
          )"
          remote_check="python -c 'import base64,json,os,sys;expected=json.loads(base64.b64decode(\"$expected_flags_b64\"));actual={name:os.getenv(name,\"\").strip().lower() in {\"1\",\"true\",\"yes\",\"y\",\"on\"} for name in expected};ok=actual==expected and os.getenv(\"JUPR_STAGING_WRITE_WAVE\")==\"none\" and os.getenv(\"JUPR_PRODUCTION_WRITE_POLICY\")==\"enabled\" and os.getenv(\"JUPR_EMAIL_MODE\")==\"dry_run\";sys.exit(0 if ok else 3)'"
          FLY_API_TOKEN="$JUPR_FLY_SSH_TOKEN" flyctl ssh console \
            --quiet \
            --app "$FLY_APP_NAME" \
            --command "$remote_check"

      - name: Wait for exact Fly production health
        id: wait_health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$PRODUCTION_FLY_ORIGIN/health" \
              --output "$RUNNER_TEMP/production-health.json" \
              && jq -e --arg sha "$GITHUB_SHA" \
                '.git_commit_sha == $sha and .image_build_git_sha == $sha' \
                "$RUNNER_TEMP/production-health.json" \
                > /dev/null; then
              exit 0
            fi
            echo "Production health attempt $attempt/18 failed; retrying in 10 seconds."
            sleep 10
          done
          echo "::error title=Production API unhealthy::$PRODUCTION_FLY_ORIGIN/health did not become healthy."
          exit 1

      - name: Collect deployed production identity
        id: collect_identity
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "$PRODUCTION_FLY_ORIGIN/openapi.json" \
            --output "$RUNNER_TEMP/production-openapi.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "$PRODUCTION_API_ORIGIN/health" \
            --output "$RUNNER_TEMP/production-custom-domain-health.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$PRODUCTION_FLY_ORIGIN/clubs/tres-palapas/leaderboards?limit=1" \
            --output "$RUNNER_TEMP/production-public-database-read.json"
          flyctl machines list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-machines-after.json"
          flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-after.json"

      - name: Verify migration head after deploy
        id: migration_after
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command="select version || E'\t' || coalesce(name, '') from supabase_migrations.schema_migrations order by version" \
            > "$RUNNER_TEMP/production-migration-ledger-after.tsv"
          psql "$SUPABASE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command="select json_build_object('tournament_registrations_player_id_column', exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'tournament_registrations' and column_name = 'player_id'), 'idx_tournament_registrations_player_id', to_regclass('public.idx_tournament_registrations_player_id') is not null, 'uq_tournament_registrations_tournament_player', to_regclass('public.uq_tournament_registrations_tournament_player') is not null, 'tournament_player_duplicate_groups', (select count(*) from (select tournament_id, player_id from public.tournament_registrations where player_id is not null group by tournament_id, player_id having count(*) > 1) duplicates))::text" \
            > "$RUNNER_TEMP/production-schema-contract-after.json"
          python scripts/deployment_verifier.py migrations \
            --migrations-dir supabase/migrations \
            --migration-contract config/production_migration_contract.json \
            --remote-ledger "$RUNNER_TEMP/production-migration-ledger-after.tsv" \
            --schema-contract-json "$RUNNER_TEMP/production-schema-contract-after.json"

      - name: Verify exact runtime, image, environment, and write policy
        id: runtime_verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deployment_verifier.py runtime \
            --health-json "$RUNNER_TEMP/production-health.json" \
            --secondary-health-json "$RUNNER_TEMP/production-custom-domain-health.json" \
            --openapi-json "$RUNNER_TEMP/production-openapi.json" \
            --fly-machines-json "$RUNNER_TEMP/fly-machines-after.json" \
            --fly-secrets-json "$RUNNER_TEMP/fly-secrets-after.json"

      - name: Verify production Supabase credentials with a public database read
        id: public_read
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deployment_verifier.py public-read \
            --payload-json "$RUNNER_TEMP/production-public-database-read.json"

      - name: Verify exact production CORS allowlist
        id: cors_verify
        shell: bash
        run: |
          set -euo pipefail
          headers_dir="$RUNNER_TEMP/production-cors"
          mkdir -p "$headers_dir"
          api_origins=(
            "$PRODUCTION_FLY_ORIGIN"
            "$PRODUCTION_API_ORIGIN"
          )
          origins=(
            "https://juprleagues.com"
            "https://www.juprleagues.com"
            "https://pickleballclubsandwich.com"
            "https://www.pickleballclubsandwich.com"
          )
          for api_index in "${!api_origins[@]}"; do
            for origin_index in "${!origins[@]}"; do
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 20 \
                --request OPTIONS \
                --header "Origin: ${origins[$origin_index]}" \
                --header "Access-Control-Request-Method: GET" \
                --dump-header "$headers_dir/$api_index-$origin_index.headers" \
                --output /dev/null \
                "${api_origins[$api_index]}/health"
            done
            curl \
              --silent \
              --show-error \
              --max-time 20 \
              --request OPTIONS \
              --header "Origin: https://not-allowed.invalid" \
              --header "Access-Control-Request-Method: GET" \
              --dump-header "$headers_dir/$api_index-blocked.headers" \
              --output /dev/null \
              "${api_origins[$api_index]}/health"
          done
          python scripts/deployment_verifier.py cors \
            --headers-dir "$headers_dir"

      - name: Restore and attest final approved production state
        if: ${{ always() && steps.baseline_projection.outcome != 'skipped' }}
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROMOTION_ACCEPTED: ${{ steps.baseline_projection.outcome == 'success' && steps.deploy.outcome == 'success' && steps.candidate_activation.outcome == 'success' && steps.wait_health.outcome == 'success' && steps.collect_identity.outcome == 'success' && steps.migration_after.outcome == 'success' && steps.runtime_verify.outcome == 'success' && steps.public_read.outcome == 'success' && steps.cors_verify.outcome == 'success' }}
          JUPR_FLY_DEPLOY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          JUPR_FLY_SSH_TOKEN: ${{ secrets.FLY_SSH_TOKEN || secrets.FLY_API_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail

          rollback_feature_profile="$(
            jq -er '.feature_profile' \
              "$RUNNER_TEMP/production-rollback-snapshot.json"
          )"
          case "$rollback_feature_profile" in
            baseline|release) ;;
            *)
              echo "::error title=Rollback feature profile rejected::The saved baseline is not an exact reviewed production profile."
              exit 2
              ;;
          esac
          final_feature_profile="$rollback_feature_profile"
          if [ "$PROMOTION_ACCEPTED" = "true" ]; then
            final_feature_profile="release"
          fi

          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-final-initial.json"

          # Any rejected candidate converges to its exact pre-release live
          # feature profile before its image is rolled back. Unknown
          # external pending secret names remain a hard stop.
          if [ "$PROMOTION_ACCEPTED" != "true" ]; then
            python scripts/deployment_verifier.py secrets \
              --safe-convergence-only \
              --fly-secrets-json "$RUNNER_TEMP/fly-secrets-final-initial.json"
            runtime_secrets=(
              "JUPR_ENV=production"
              "JUPR_EMAIL_MODE=dry_run"
              "JUPR_PRODUCTION_WRITE_POLICY=enabled"
              "JUPR_STAGING_WRITE_WAVE=none"
              "JUPR_WEB_BASE_URL=https://pickleballclubsandwich.com"
              "JUPR_ALLOWED_ORIGINS=https://juprleagues.com,https://www.juprleagues.com,https://pickleballclubsandwich.com,https://www.pickleballclubsandwich.com"
              "JUPR_REQUIRE_API_AUDIT_LOG=1"
              "JUPR_REQUIRE_WORKER_RUN_LOG=1"
              "JUPR_SUPABASE_JWT_MODE=jwks"
              "JUPR_EXPECTED_MIGRATION_CONTRACT=$EXPECTED_MIGRATION_CONTRACT"
              "JUPR_EXPECTED_MIGRATION_HEAD=$EXPECTED_MIGRATION_HEAD"
              "JUPR_EXPECTED_MIGRATION_PROFILE=$EXPECTED_MIGRATION_PROFILE"
              "SUPABASE_URL=$SUPABASE_URL"
              "SUPABASE_JWKS_URL=${SUPABASE_URL%/}/auth/v1/.well-known/jwks.json"
              "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
              "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            )
            while IFS= read -r setting; do
              runtime_secrets+=("$setting")
            done < <(
              PRODUCTION_FEATURE_PROFILE="$final_feature_profile" python -c \
                'import os; from scripts.deployment_verifier import expected_production_feature_flags; expected=expected_production_feature_flags(profile=os.environ["PRODUCTION_FEATURE_PROFILE"]); print("\n".join(f"{name}={int(enabled)}" for name, enabled in expected.items()))'
            )
            FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets set \
              --app "$FLY_APP_NAME" \
              "${runtime_secrets[@]}"
          fi

          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-final-converged.json"
          python scripts/deployment_verifier.py secrets \
            --no-pending-only \
            --fly-secrets-json "$RUNNER_TEMP/fly-secrets-final-converged.json"

          if [ "$PROMOTION_ACCEPTED" != "true" ] \
            && [ "$DEPLOY_OUTCOME" != "skipped" ]; then
            PREDEPLOY_IMMUTABLE_IMAGE="$(
              jq -er '.fly_immutable_image_ref' \
                "$RUNNER_TEMP/production-rollback-snapshot.json"
            )"
            PREDEPLOY_CONFIG="$RUNNER_TEMP/production-fly-config-before/fly.toml"
            EXPECTED_CONFIG_SHA="$(
              jq -er '.fly_config_sha256' \
                "$RUNNER_TEMP/production-rollback-snapshot.json"
            )"
            ACTUAL_CONFIG_SHA="$(sha256sum "$PREDEPLOY_CONFIG" | awk '{print $1}')"
            if [[ ! "$PREDEPLOY_IMMUTABLE_IMAGE" =~ ^registry\.fly\.io/juprleagues-api@sha256:[0-9a-f]{64}$ ]]; then
              echo "::error title=Rollback identity rejected::The saved rollback image is not an immutable image for the exact production app."
              exit 2
            fi
            if [[ ! "$EXPECTED_CONFIG_SHA" =~ ^[0-9a-f]{64}$ ]] \
              || [ "$ACTUAL_CONFIG_SHA" != "$EXPECTED_CONFIG_SHA" ]; then
              echo "::error title=Rollback config rejected::The saved pre-deploy Fly config does not match its snapshot fingerprint."
              exit 2
            fi
            FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl deploy \
              --app "$FLY_APP_NAME" \
              --config "$PREDEPLOY_CONFIG" \
              --image "$PREDEPLOY_IMMUTABLE_IMAGE"
          fi

          expected_flags_b64="$(
            PRODUCTION_FEATURE_PROFILE="$final_feature_profile" python -c 'import base64,json,os; from scripts.deployment_verifier import expected_production_feature_flags; expected=expected_production_feature_flags(profile=os.environ["PRODUCTION_FEATURE_PROFILE"]); print(base64.b64encode(json.dumps(expected,sort_keys=True).encode()).decode())'
          )"
          remote_check="python -c 'import base64,json,os,sys;expected=json.loads(base64.b64decode(\"$expected_flags_b64\"));actual={name:os.getenv(name,\"\").strip().lower() in {\"1\",\"true\",\"yes\",\"y\",\"on\"} for name in expected};ok=actual==expected and os.getenv(\"JUPR_STAGING_WRITE_WAVE\")==\"none\" and os.getenv(\"JUPR_PRODUCTION_WRITE_POLICY\")==\"enabled\" and os.getenv(\"JUPR_EMAIL_MODE\")==\"dry_run\";sys.exit(0 if ok else 3)'"
          FLY_API_TOKEN="$JUPR_FLY_SSH_TOKEN" flyctl ssh console \
            --quiet \
            --app "$FLY_APP_NAME" \
            --command "$remote_check"

          for attempt in $(seq 1 18); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$PRODUCTION_FLY_ORIGIN/health" \
              --output "$RUNNER_TEMP/production-health-final.json"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error title=Final production health unavailable::Unable to attest the restored approved runtime."
              exit 1
            fi
            sleep 10
          done

          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl machines list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-machines-final.json"
          FLY_API_TOKEN="$JUPR_FLY_DEPLOY_TOKEN" flyctl secrets list \
            --app "$FLY_APP_NAME" \
            --json \
            > "$RUNNER_TEMP/fly-secrets-final.json"
          python scripts/deployment_verifier.py final \
            --health-json "$RUNNER_TEMP/production-health-final.json" \
            --fly-machines-json "$RUNNER_TEMP/fly-machines-final.json" \
            --fly-secrets-json "$RUNNER_TEMP/fly-secrets-final.json" \
            --rollback-snapshot-json "$RUNNER_TEMP/production-rollback-snapshot.json" \
            --promotion-accepted "$PROMOTION_ACCEPTED"
