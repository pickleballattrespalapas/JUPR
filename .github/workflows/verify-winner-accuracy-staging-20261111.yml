name: Verify exact season winner correction on staging
on:
  push:
    branches:
      - agent/verify-winner-accuracy-staging-20261111
    paths:
      - .github/workflows/verify-winner-accuracy-staging-20261111.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch-reviewed-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify candidate and dispatch supported backend verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = "pickleballattrespalapas/JUPR"
          candidate = "e1266ffaa5ef7831ba4dfaedfed5f6cdc6f8a15e"
          if os.environ["GH_REPOSITORY"] != repository:
              raise SystemExit("Unexpected repository")
          def api(path, data=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json",
                           "User-Agent": "JUPR-staging-verification"},
                  method="GET" if data is None else "POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          branch = api("/branches/staging")
          if branch["commit"]["sha"] != candidate:
              raise SystemExit("Staging moved; refusing to deploy a different candidate")
          prior = api("/actions/runs/43049793598")
          if prior["head_sha"] != candidate or prior["head_branch"] != "staging" or prior["path"] != ".github/workflows/fly_api_staging_deploy.yml":
              raise SystemExit("Unexpected prior staging run")
          if prior["status"] in {"queued", "in_progress"}:
              jobs = api("/actions/runs/43049793598/jobs?filter=latest&per_page=20")["jobs"]
              if not any(step["name"] == "Install club QA browser" and step["status"] == "in_progress"
                         for job in jobs for step in job.get("steps", [])):
                  raise SystemExit("Prior staging run is not waiting for browser installation")
              api("/actions/runs/43049793598/cancel", {})
          api("/actions/workflows/fly_api_staging_deploy.yml/dispatches", {
              "ref": "staging",
              "inputs": {"app_name": "juprleagues-api-staging", "primary_region": "dfw",
                         "club_slug": "tres-palapas", "club_id": "tres_palapas",
                         "qa_admin": "off", "write_wave": "open",
                         "expected_candidate_sha": candidate,
                         "interclub_rehearsal": "false"}})
          print("Dispatched the exact staging candidate with health, database, feature, web-smoke and handoff checks enabled; optional cross-club browser QA is off because Ubuntu package DNS failed.")
          PY
