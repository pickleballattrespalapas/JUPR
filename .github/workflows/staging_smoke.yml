name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional isolated staging FastAPI URL. Must be https://juprleagues-api-staging.fly.dev. Uses STAGING_JUPR_API_BASE_URL when blank."
        required: false
        type: string
      web_base_url:
        description: "Optional isolated staging web URL. Must be https://jupr-git-staging-pickleballattrespalapas1.vercel.app. Uses STAGING_WEB_BASE_URL when blank."
        required: false
        type: string
      club_slug:
        description: "Public club slug to smoke-test."
        required: false
        default: "tres-palapas"
        type: string
      club_id:
        description: "Club ID for disabled-admin guard check."
        required: false
        default: "tres_palapas"
        type: string
      allow_live_unconfigured:
        description: "Allow 503 from /live-sessions while staging live_sessions setup is incomplete."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  public-smoke:
    name: API + web + browser smoke
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_JUPR_API_BASE_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || secrets.STAGING_JUPR_API_BASE_URL }}
      STAGING_WEB_BASE_URL: ${{ inputs.web_base_url != '' && inputs.web_base_url || secrets.STAGING_WEB_BASE_URL }}
      JUPR_SMOKE_CLUB_SLUG: ${{ inputs.club_slug || 'tres-palapas' }}
      JUPR_SMOKE_CLUB_ID: ${{ inputs.club_id || 'tres_palapas' }}
      JUPR_SMOKE_ARGS: ${{ inputs.allow_live_unconfigured && '--allow-live-unconfigured' || '' }}
      JUPR_EXPECT_PREVIEW_AUTH_ISOLATION: "1"
      JUPR_EXPECTED_STAGING_API_ORIGIN: "https://juprleagues-api-staging.fly.dev"
      JUPR_EXPECTED_STAGING_WEB_ORIGIN: "https://jupr-git-staging-pickleballattrespalapas1.vercel.app"
      JUPR_EXPECTED_STAGING_AUTH_ORIGIN: ${{ secrets.STAGING_SUPABASE_URL }}
    steps:
      - name: Validate staging smoke configuration
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_JUPR_API_BASE_URL//[[:space:]]/}" ]]; then
            echo "::error title=Missing staging API URL::Set the staging environment secret STAGING_JUPR_API_BASE_URL or pass api_base_url."
            exit 1
          fi
          if [ "${STAGING_JUPR_API_BASE_URL%/}" != "$JUPR_EXPECTED_STAGING_API_ORIGIN" ]; then
            echo "::error title=Unsafe staging API URL::The staging smoke may target only $JUPR_EXPECTED_STAGING_API_ORIGIN."
            exit 1
          fi
          if [[ -z "${STAGING_WEB_BASE_URL//[[:space:]]/}" ]]; then
            echo "::error title=Missing staging web URL::Set the staging environment secret STAGING_WEB_BASE_URL or pass web_base_url."
            exit 1
          fi
          if [ "${STAGING_WEB_BASE_URL%/}" != "$JUPR_EXPECTED_STAGING_WEB_ORIGIN" ]; then
            echo "::error title=Unsafe staging web URL::The staging smoke may target only $JUPR_EXPECTED_STAGING_WEB_ORIGIN."
            exit 1
          fi
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET//[[:space:]]/}" ]]; then
            echo "::error title=Missing Vercel automation bypass secret::Set VERCEL_AUTOMATION_BYPASS_SECRET in the GitHub staging environment."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python --version

      - name: Run public smoke checks
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: make public-web-smoke

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Next browser smoke dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser staging smoke
        working-directory: apps/web
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e:staging

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
