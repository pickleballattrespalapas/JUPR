name: Temporary generator PDF label compatibility fixer

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/generator-pdf-draft-persistence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_JUPR_API_BASE_URL: http://localhost:8000
      JUPR_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_JUPR_WEB_BASE_URL: https://pickleballclubsandwich.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generator-pdf-draft-persistence
          fetch-depth: 0

      - name: Preserve established PDF label while clarifying new-tab behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('apps/web/app/admin/play-generators/GeneratorWorkspace.tsx'),
              Path('apps/web/app/clubs/[clubSlug]/play-generators/PublicGeneratorWorkspace.tsx'),
              Path('tests/test_play_generator_pdf_and_draft_persistence.py'),
          ]
          for path in paths:
              text = path.read_text()
              old = 'Open / print one-sheet PDF'
              new = 'Download one-sheet PDF (opens new tab)'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one label, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused contracts
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_play_generator_pdf_and_draft_persistence.py \
            tests/test_play_generator_player_count_setup.py \
            tests/test_api_contract_play_generators.py \
            tests/test_api_contract_public_play_generators.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build web app
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run test:component
          npm run build

      - name: Commit clean compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-generator-pdf-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify generator PDF new-tab behavior"
          git push origin HEAD:agent/generator-pdf-draft-persistence
