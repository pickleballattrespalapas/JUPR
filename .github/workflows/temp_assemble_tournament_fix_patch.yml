name: Temporary Assemble Tournament Fix Patch

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble uploaded patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tournament_fix_patch/part*.txt > combined.txt
          base64 --decode combined.txt > payload.bin
          file combined.txt payload.bin | tee payload-info.txt
          sha256sum combined.txt payload.bin | tee -a payload-info.txt
          xxd -l 64 payload.bin | tee -a payload-info.txt

      - name: Upload assembled payload
        uses: actions/upload-artifact@v4
        with:
          name: tournament-fix-assembled-${{ github.run_id }}
          path: |
            combined.txt
            payload.bin
            payload-info.txt
          retention-days: 2
