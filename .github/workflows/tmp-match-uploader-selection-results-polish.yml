name: Temporary Match Uploader selection and result polish

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-match-uploader-selection-results-polish-primary
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/match-uploader-selection-results-polish' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-selection-results-polish
          fetch-depth: 0

      - name: Apply reviewed Match Uploader fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-match-uploader-selection-results-polish-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw_script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_script.splitlines()
          )
          bad = r'=== next.replace(/\\s+/g, \" \"").trim()'
          good = r'=== next.replace(/\\s+/g, \" \").trim()'
          if bad not in script:
              raise SystemExit('expected malformed suggestion-selection source was not found')
          script = script.replace(bad, good, 1)
          exec(compile(script, '<reviewed-match-uploader-fix>', 'exec'))
          RUNNER
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused web checks
        working-directory: apps/web
        run: node tests/match-uploader-layout.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run focused Python checks
        run: |
          python -m pytest -q \
            tests/test_direct_match_feedback_stats.py \
            tests/test_api_contract_admin_match_uploader.py \
            tests/test_api_contract_admin_match_uploader_singles.py
          python -m py_compile jupr_app/services/direct_match_entry_service.py

      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-match-uploader-selection-results-polish.yml \
            .github/workflows/tmp-match-uploader-selection-results-polish-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Match Uploader selection and result recovery'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort | tr '\n' ' ')"
          expected='apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/lib/adminMatchUploaderApi.ts apps/web/tests/match-uploader-layout.cjs jupr_app/services/direct_match_entry_service.py tests/test_direct_match_feedback_stats.py '
          test "$actual" = "$expected"
          git push origin HEAD:agent/match-uploader-selection-results-polish
