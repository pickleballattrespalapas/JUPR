      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused web checks
        working-directory: apps/web
        run: node tests/match-uploader-layout.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run focused Python checks
        run: |
          python -m pytest -q \
            tests/test_direct_match_feedback_stats.py \
            tests/test_admin_match_log_service.py \
            tests/test_api_contract_admin_match_uploader.py \
            tests/test_api_contract_admin_match_uploader_singles.py
          python -m py_compile \
            jupr_app/services/direct_match_entry_service.py \
            jupr_app/services/admin_match_log_service.py \
            services/api/admin_match_log_routes.py

      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-match-uploader-selection-results-polish.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Match Uploader selection and result recovery'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort | tr '\n' ' ')"
          expected='apps/web/app/admin/match-log/MatchLogWorkspace.tsx apps/web/app/admin/match-uploader/MatchUploaderForm.tsx apps/web/lib/adminMatchLogApi.ts apps/web/lib/adminMatchUploaderApi.ts apps/web/tests/match-uploader-layout.cjs jupr_app/services/admin_match_log_service.py jupr_app/services/direct_match_entry_service.py services/api/admin_match_log_routes.py tests/test_admin_match_log_service.py tests/test_direct_match_feedback_stats.py '
          test "$actual" = "$expected"
          git push origin HEAD:agent/match-uploader-selection-results-polish
