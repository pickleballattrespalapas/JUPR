name: Temporary Match Uploader selection and result polish

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-match-uploader-selection-results-polish
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/match-uploader-selection-results-polish' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-uploader-selection-results-polish
          fetch-depth: 0

      - name: Apply reviewed Match Uploader fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          form_path = "apps/web/app/admin/match-uploader/MatchUploaderForm.tsx"
          form = Path(form_path).read_text(encoding="utf-8")

          old = '''type SearchablePlayerInputProps = {
            inputId: string;
            label: string;
            value: string;
            players: PublicPlayer[];
            disabled?: boolean;
          '''
          new = '''type SearchablePlayerInputProps = {
            inputId: string;
            label: string;
            value: string;
            players: PublicPlayer[];
            allPlayers?: PublicPlayer[];
            disabled?: boolean;
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInputProps block not found")
          form = form.replace(old, new, 1)

          old = '''function SearchablePlayerInput({
            inputId,
            label,
            value,
            players,
            disabled = false,
          '''
          new = '''function SearchablePlayerInput({
            inputId,
            label,
            value,
            players,
            allPlayers = players,
            disabled = false,
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInput signature not found")
          form = form.replace(old, new, 1)

          old = '''  const selected = players.find((player) => String(player.id) === value);
            const selectedName = selected ? String(selected.name) : "";
            const [query, setQuery] = useState(selectedName);
            const [startingJupr, setStartingJupr] = useState("3.5");
            const [creating, setCreating] = useState(false);
            const cleanedQuery = query.replace(/\s+/g, " ").trim();
            const exactPlayer = players.find(
              (player) =>
                String(player.name).trim().toLocaleLowerCase()
                === cleanedQuery.toLocaleLowerCase(),
            );
            const matchingPlayers = cleanedQuery
              ? players.filter((player) =>
                  String(player.name).trim().toLocaleLowerCase().includes(cleanedQuery.toLocaleLowerCase()),
                )
              : players;
            const numericStartingJupr = Number(startingJupr);
            const startingJuprMessage = cleanedQuery && !exactPlayer && matchingPlayers.length === 0
              ? validateStartingJupr(startingJupr)
              : null;
            const validatedInputStyle = invalid
              ? { ...inputStyle, border: "2px solid #dc2626", background: "#fef2f2" }
              : inputStyle;
          '''
          new = '''  const selected = allPlayers.find((player) => String(player.id) === value);
            const selectedName = selected ? String(selected.name) : "";
            const [query, setQuery] = useState(selectedName);
            const [startingJupr, setStartingJupr] = useState("3.5");
            const [creating, setCreating] = useState(false);
            const cleanedQuery = query.replace(/\s+/g, " ").trim();
            const exactPlayer = players.find(
              (player) =>
                String(player.name).trim().toLocaleLowerCase()
                === cleanedQuery.toLocaleLowerCase(),
            );
            const exactKnownPlayer = allPlayers.find(
              (player) =>
                String(player.name).trim().toLocaleLowerCase()
                === cleanedQuery.toLocaleLowerCase(),
            );
            const blockedExactPlayer = exactKnownPlayer && !exactPlayer ? exactKnownPlayer : null;
            const matchingPlayers = cleanedQuery
              ? players.filter((player) =>
                  String(player.name).trim().toLocaleLowerCase().includes(cleanedQuery.toLocaleLowerCase()),
                )
              : players;
            const numericStartingJupr = Number(startingJupr);
            const startingJuprMessage = cleanedQuery && !exactKnownPlayer && matchingPlayers.length === 0
              ? validateStartingJupr(startingJupr)
              : null;
            const duplicatePlayerMessage = blockedExactPlayer
              ? "This player is already selected in this match."
              : null;
            const inputIsInvalid = invalid || Boolean(duplicatePlayerMessage);
            const validatedInputStyle = inputIsInvalid
              ? { ...inputStyle, border: "2px solid #dc2626", background: "#fef2f2" }
              : inputStyle;
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInput state block not found")
          form = form.replace(old, new, 1)

          old = '''  useEffect(() => {
              setQuery(selectedName);
            }, [selectedName]);

            async function createAndSelect() {
          '''
          new = '''  useEffect(() => {
              setQuery(selectedName);
            }, [selectedName]);

            useEffect(() => {
              if (!value && exactPlayer) {
                onChange(String(exactPlayer.id));
              }
            }, [exactPlayer, onChange, value]);

            async function createAndSelect() {
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInput effect block not found")
          form = form.replace(old, new, 1)

          old = '''      !cleanedQuery
                || exactPlayer
                || startingJuprMessage
          '''
          new = '''      !cleanedQuery
                || exactKnownPlayer
                || startingJuprMessage
          '''
          if old not in form:
              raise SystemExit("createAndSelect guard not found")
          form = form.replace(old, new, 1)

          old = '''          aria-invalid={invalid || undefined}
          '''
          new = '''          aria-invalid={inputIsInvalid || undefined}
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInput aria-invalid not found")
          form = form.replace(old, new, 1)

          old = '''      </datalist>
            {cleanedQuery && !exactPlayer && matchingPlayers.length === 0 ? (
          '''
          new = '''      </datalist>
            {duplicatePlayerMessage ? (
              <p role="alert" style={{ color: "#b91c1c", margin: "0.35rem 0 0", fontWeight: 700 }}>
                {duplicatePlayerMessage}
              </p>
            ) : null}
            {cleanedQuery && !exactKnownPlayer && matchingPlayers.length === 0 ? (
          '''
          if old not in form:
              raise SystemExit("SearchablePlayerInput creation block not found")
          form = form.replace(old, new, 1)

          old = '''          value={query}
                    onChange={(event) => setQuery(event.target.value)}
                    onKeyDown={(event) => {
          '''
          new = '''          value={query}
                    onChange={(event) => {
                      const next = event.target.value;
                      setQuery(next);
                      const selectedSuggestion = players.find(
                        (player) =>
                          String(player.name).trim().toLocaleLowerCase()
                          === next.replace(/\s+/g, " ").trim().toLocaleLowerCase(),
                      );
                      if (selectedSuggestion && !selectedNames.has(String(selectedSuggestion.name).trim().toLocaleLowerCase())) {
                        addPlayerName(String(selectedSuggestion.name));
                      }
                    }}
                    onKeyDown={(event) => {
          '''
          if old not in form:
              raise SystemExit("Round-robin multi-input change handler not found")
          form = form.replace(old, new, 1)

          for value_name in ("t1p1", "t1p2", "t2p1", "t2p2"):
              old = f'players={{playerOptionsFor(row, row.{value_name})}} invalid='
              new = f'players={{playerOptionsFor(row, row.{value_name})}} allPlayers={{knownPlayers}} invalid='
              if old not in form:
                  raise SystemExit(f"Manual player input call not found for {value_name}")
              form = form.replace(old, new, 1)

          for value_name in ("playerA", "playerB"):
              old = f'players={{singlesPlayerOptions(singlesRow.{value_name})}} invalid='
              new = f'players={{singlesPlayerOptions(singlesRow.{value_name})}} allPlayers={{knownPlayers}} invalid='
              if old not in form:
                  raise SystemExit(f"Singles player input call not found for {value_name}")
              form = form.replace(old, new, 1)

          old = '''function deltaLabel(value?: number | null): string {
            if (value == null) return "—";
            const juprDelta = Number(value) / 400;
            const normalized = Math.abs(juprDelta) < 0.005 ? 0 : juprDelta;
            return `${normalized >= 0 ? "+" : ""}${normalized.toFixed(2)}`;
          }

          function isUploaderErrorMessage'''
          new = '''function deltaLabel(value?: number | null): string {
            if (value == null) return "—";
            const juprDelta = Number(value) / 400;
            const normalized = Math.abs(juprDelta) < 0.005 ? 0 : juprDelta;
            return `${normalized >= 0 ? "+" : ""}${normalized.toFixed(2)}`;
          }

          function countDeltaLabel(
            before?: number | null,
            after?: number | null,
            delta?: number | null,
          ): string {
            if (delta != null && Number.isFinite(Number(delta))) return String(Math.trunc(Number(delta)));
            if (before == null || after == null) return "—";
            const calculated = Number(after) - Number(before);
            return Number.isFinite(calculated) ? String(Math.trunc(calculated)) : "—";
          }

          function isUploaderErrorMessage'''
          if old not in form:
              raise SystemExit("deltaLabel insertion point not found")
          form = form.replace(old, new, 1)

          old = '''  const emailSummary = email?.mode === "auto_sent"
              ? `${email.sent ?? 0} sent, ${email.skipped ?? 0} skipped, ${email.errors ?? 0} error(s).`
              : "Not sent in staging.";

            return (
          '''
          new = '''  const emailSummary = email?.mode === "auto_sent"
              ? `${email.sent ?? 0} sent, ${email.skipped ?? 0} skipped, ${email.errors ?? 0} error(s).`
              : "Not sent in staging.";
            const matchIds = (result.operation?.match_ids || [])
              .map((value) => String(value).trim())
              .filter(Boolean);
            const correctionHref = matchIds.length
              ? `/admin/match-log/edit?match_ids=${encodeURIComponent(matchIds.join(","))}`
              : (result.feedback?.latest_match_id != null
                ? `/admin/match-log/edit?match_id=${encodeURIComponent(String(result.feedback.latest_match_id))}`
                : (result.recovery?.match_log_route || "/admin/match-log/edit"));

            return (
          '''
          if old not in form:
              raise SystemExit("SubmissionResultDialog summary block not found")
          form = form.replace(old, new, 1)

          old = '''              <thead><tr><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Player</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Before</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>After</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Change</th></tr></thead>
          '''
          new = '''              <thead><tr><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Player</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Before</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>After</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Change</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Wins</th><th style={{ textAlign: "left", padding: "0.5rem", borderBottom: "1px solid #cbd5e1" }}>Losses</th></tr></thead>
          '''
          if old not in form:
              raise SystemExit("SubmissionResultDialog table header not found")
          form = form.replace(old, new, 1)

          old = '''                  <tr key={player.id}><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{player.name}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{ratingLabel(player.rating_before)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{ratingLabel(player.rating_after)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{deltaLabel(player.rating_delta)}</td></tr>
          '''
          new = '''                  <tr key={player.id}><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{player.name}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{ratingLabel(player.rating_before)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{ratingLabel(player.rating_after)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{deltaLabel(player.rating_delta)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{countDeltaLabel(player.wins_before, player.wins_after, player.wins_delta)}</td><td style={{ padding: "0.5rem", borderBottom: "1px solid #e2e8f0" }}>{countDeltaLabel(player.losses_before, player.losses_after, player.losses_delta)}</td></tr>
          '''
          if old not in form:
              raise SystemExit("SubmissionResultDialog player row not found")
          form = form.replace(old, new, 1)

          old = '''        <p style={{ display: "flex", justifyContent: "flex-end", marginBottom: 0 }}>
                  <button type="button" onClick={onClose} style={buttonStyle}>OK</button>
                </p>
          '''
          new = '''        <p style={{ display: "flex", justifyContent: "flex-end", gap: "0.5rem", flexWrap: "wrap", marginBottom: 0 }}>
                  <Link href={correctionHref} style={{ ...ghostButtonStyle, textDecoration: "none" }}>Correct results</Link>
                  <button type="button" onClick={onClose} style={buttonStyle}>OK</button>
                </p>
          '''
          if old not in form:
              raise SystemExit("SubmissionResultDialog footer not found")
          form = form.replace(old, new, 1)

          Path(form_path).write_text(form, encoding="utf-8")

          api_type_path = Path("apps/web/lib/adminMatchUploaderApi.ts")
          api_type = api_type_path.read_text(encoding="utf-8")
          old = '''      matches_played_before?: number | null;
                matches_played_after?: number | null;
          '''
          new = '''      matches_played_before?: number | null;
                matches_played_after?: number | null;
                wins_before?: number | null;
                wins_after?: number | null;
                wins_delta?: number | null;
                losses_before?: number | null;
                losses_after?: number | null;
                losses_delta?: number | null;
          '''
          if old not in api_type:
              raise SystemExit("AdminMatchUploaderWriteResult player fields not found")
          api_type_path.write_text(api_type.replace(old, new, 1), encoding="utf-8")

          direct_path = Path("jupr_app/services/direct_match_entry_service.py")
          direct = direct_path.read_text(encoding="utf-8")
          old = '''    matches_key = (
                  "singles_matches_played"
                  if match_format == "singles"
                  else "matches_played"
              )
              affected_players: list[dict[str, Any]] = []
          '''
          new = '''    matches_key = (
                  "singles_matches_played"
                  if match_format == "singles"
                  else "matches_played"
              )
              wins_key = "singles_wins" if match_format == "singles" else "wins"
              losses_key = "singles_losses" if match_format == "singles" else "losses"

              def numeric_delta(before: Any, after: Any) -> int | None:
                  try:
                      return int(float(after)) - int(float(before))
                  except Exception:
                      return None

              affected_players: list[dict[str, Any]] = []
          '''
          if old not in direct:
              raise SystemExit("Direct-match feedback key block not found")
          direct = direct.replace(old, new, 1)

          old = '''                "matches_played_before": expected.get(matches_key),
                        "matches_played_after": after.get(matches_key),
          '''
          new = '''                "matches_played_before": expected.get(matches_key),
                        "matches_played_after": after.get(matches_key),
                        "wins_before": expected.get(wins_key),
                        "wins_after": after.get(wins_key),
                        "wins_delta": numeric_delta(
                            expected.get(wins_key),
                            after.get(wins_key),
                        ),
                        "losses_before": expected.get(losses_key),
                        "losses_after": after.get(losses_key),
                        "losses_delta": numeric_delta(
                            expected.get(losses_key),
                            after.get(losses_key),
                        ),
          '''
          if old not in direct:
              raise SystemExit("Direct-match feedback player payload not found")
          direct_path.write_text(direct.replace(old, new, 1), encoding="utf-8")

          layout_test_path = Path("apps/web/tests/match-uploader-layout.cjs")
          layout_test = layout_test_path.read_text(encoding="utf-8")
          marker = '\nconsole.log("Match Uploader context and responsive layout checks passed.");\n'
          additions = '''
          assert.match(form, /allPlayers\?: PublicPlayer\[\]/, "manual player inputs must know excluded roster players");
          assert.match(form, /This player is already selected in this match\./, "duplicate known players must show a warning instead of inline creation");
          assert.match(form, /if \(!value && exactPlayer\)/, "an exact query must select automatically when the player becomes available again");
          assert.match(form, /selectedSuggestion[\s\S]*addPlayerName/, "round-robin suggestion selection must add the player immediately");
          assert.match(form, />Wins<\/th>[\s\S]*>Losses<\/th>/, "submission results must show wins and losses");
          assert.match(form, /Correct results/, "submission results must provide a direct correction action");
          assert.match(form, /match_ids=/, "correction action must preserve every inserted match ID");
          '''
          if marker not in layout_test:
              raise SystemExit("Match Uploader layout test marker not found")
          layout_test_path.write_text(layout_test.replace(marker, additions + marker, 1), encoding="utf-8")

          match_log_api_path = Path("apps/web/lib/adminMatchLogApi.ts")
          match_log_api = match_log_api_path.read_text(encoding="utf-8")
          old = '''    match_id?: number | null;
                league?: string | null;
          '''
          new = '''    match_id?: number | null;
                match_ids?: number[];
                league?: string | null;
          '''
          if old not in match_log_api:
              raise SystemExit("AdminMatchLogResponse filters block not found")
          match_log_api = match_log_api.replace(old, new, 1)

          old = '''  matchId?: string | number | null;
              league?: string | null;
          '''
          new = '''  matchId?: string | number | null;
              matchIds?: string | Array<string | number> | null;
              league?: string | null;
          '''
          if old not in match_log_api:
              raise SystemExit("getAdminMatchLog params block not found")
          match_log_api = match_log_api.replace(old, new, 1)

          old = '''  if (params?.matchId) query.set("match_id", String(params.matchId));
              if (params?.league) query.set("league", String(params.league));
          '''
          new = '''  if (params?.matchId) query.set("match_id", String(params.matchId));
              if (params?.matchIds) {
                const matchIds = Array.isArray(params.matchIds)
                  ? params.matchIds.map((value) => String(value).trim()).filter(Boolean).join(",")
                  : String(params.matchIds).trim();
                if (matchIds) query.set("match_ids", matchIds);
              }
              if (params?.league) query.set("league", String(params.league));
          '''
          if old not in match_log_api:
              raise SystemExit("getAdminMatchLog match-id query block not found")
          match_log_api_path.write_text(match_log_api.replace(old, new, 1), encoding="utf-8")

          workspace_path = Path("apps/web/app/admin/match-log/MatchLogWorkspace.tsx")
          workspace = workspace_path.read_text(encoding="utf-8")
          old = '''  match_id?: string;
              league?: string;
          '''
          new = '''  match_id?: string;
              match_ids?: string;
              league?: string;
          '''
          if old not in workspace:
              raise SystemExit("MatchLogSearchParams block not found")
          workspace = workspace.replace(old, new, 1)

          old = '''  const matchIdParam = searchParams?.match_id || null;
              const leagueParam = searchParams?.league || null;
          '''
          new = '''  const matchIdParam = searchParams?.match_id || null;
              const matchIdsParam = searchParams?.match_ids || null;
              const leagueParam = searchParams?.league || null;
          '''
          if old not in workspace:
              raise SystemExit("MatchLogWorkspace match parameter block not found")
          workspace = workspace.replace(old, new, 1)

          old = '''    matchIdParam || "",
                leagueParam || "",
          '''
          new = '''    matchIdParam || "",
                matchIdsParam || "",
                leagueParam || "",
          '''
          if old not in workspace:
              raise SystemExit("MatchLogWorkspace request scope block not found")
          workspace = workspace.replace(old, new, 1)

          old = '''        matchId: matchIdParam,
                  league: leagueParam,
          '''
          new = '''        matchId: matchIdParam,
                  matchIds: matchIdsParam,
                  league: leagueParam,
          '''
          if old not in workspace:
