          workspace = workspace.replace(old, new, 1)

          old = '''    matchIdParam,
                reloadNonce,
          '''
          new = '''    matchIdParam,
                matchIdsParam,
                reloadNonce,
          '''
          if old not in workspace:
              raise SystemExit("MatchLogWorkspace effect dependencies not found")
          workspace = workspace.replace(old, new, 1)

          old = '''            <label>Match ID<br /><input key={`match-${matchIdParam || "all"}`} name="match_id" defaultValue={matchIdParam || ""} style={{ width: "100%" }} /></label>
          '''
          new = '''            <label>Match ID<br /><input key={`match-${matchIdParam || "all"}`} name="match_id" defaultValue={matchIdParam || ""} style={{ width: "100%" }} /></label>
                      {matchIdsParam ? <input type="hidden" name="match_ids" value={matchIdsParam} /> : null}
          '''
          if old not in workspace:
              raise SystemExit("MatchLogWorkspace Match ID filter field not found")
          workspace_path.write_text(workspace.replace(old, new, 1), encoding="utf-8")

          route_path = Path("services/api/admin_match_log_routes.py")
          route = route_path.read_text(encoding="utf-8")
          old = '''        match_id: int | None = Query(default=None),
                  league: str | None = Query(default=None),
          '''
          new = '''        match_id: int | None = Query(default=None),
                  match_ids: str | None = Query(default=None, max_length=4000),
                  league: str | None = Query(default=None),
          '''
          if old not in route:
              raise SystemExit("Match Log route query block not found")
          route = route.replace(old, new, 1)

          old = '''                match_id=match_id,
                          league=league,
          '''
          new = '''                match_id=match_id,
                          match_ids=match_ids,
                          league=league,
          '''
          if old not in route:
              raise SystemExit("Match Log route service call not found")
          route_path.write_text(route.replace(old, new, 1), encoding="utf-8")

          service_path = Path("jupr_app/services/admin_match_log_service.py")
          service = service_path.read_text(encoding="utf-8")
          old = '''MAX_CONTEXT_IDS = 200
          MAX_CONTEXT_ID_LENGTH = 200
          '''
          new = '''MAX_CONTEXT_IDS = 200
          MAX_CONTEXT_ID_LENGTH = 200
          MAX_MATCH_IDS = 200
          '''
          if old not in service:
              raise SystemExit("Match Log constants block not found")
          service = service.replace(old, new, 1)

          marker = '\n\ndef _fetch_match_rows(\n'
          normalize_fn = '''

          def _normalize_match_ids(
              *,
              match_id: int | None = None,
              match_ids: str | list[int] | tuple[int, ...] | None = None,
          ) -> list[int]:
              raw_values: list[Any] = []
              if match_id is not None:
                  raw_values.append(match_id)
              if isinstance(match_ids, str):
                  raw_values.extend(match_ids.split(","))
              elif match_ids:
                  raw_values.extend(match_ids)

              normalized: list[int] = []
              seen: set[int] = set()
              for value in raw_values:
                  clean = str(value or "").strip()
                  if not clean:
                      continue
                  try:
                      parsed = int(clean)
                  except Exception as exc:
                      raise ValueError(f"Invalid match ID: {clean}") from exc
                  if parsed <= 0:
                      raise ValueError("Match IDs must be positive integers.")
                  if parsed in seen:
                      continue
                  seen.add(parsed)
                  normalized.append(parsed)
              if len(normalized) > MAX_MATCH_IDS:
                  raise ValueError(
                      f"No more than {MAX_MATCH_IDS} match IDs may be loaded at once."
                  )
              return normalized
          '''
          if marker not in service:
              raise SystemExit("Match Log fetch marker not found")
          service = service.replace(marker, normalize_fn + marker, 1)

          old = '''    fetch_limit: int,
              match_id: int | None = None,
              context_type: str | None = None,
          '''
          new = '''    fetch_limit: int,
              match_id: int | None = None,
              match_ids: list[int] | None = None,
              context_type: str | None = None,
          '''
          if old not in service:
              raise SystemExit("_fetch_match_rows signature not found")
