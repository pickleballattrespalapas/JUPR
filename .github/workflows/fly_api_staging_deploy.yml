name: Deploy FastAPI staging to Fly
run-name: >-
  Fly staging ·
  ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write_wave || 'open' }} ·
  ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_candidate_sha || github.sha }}

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      app_name:
        description: "Dedicated Fly staging app name"
        required: true
        default: "juprleagues-api-staging"
      primary_region:
        description: "Fly primary region"
        required: true
        default: "dfw"
      fly_org:
        description: "Optional Fly organization slug"
        required: false
        default: ""
      club_slug:
        description: "Public club slug used by staging verification"
        required: true
        default: "tres-palapas"
      club_id:
        description: "Club ID used by staging admin verification"
        required: true
        default: "tres_palapas"
      write_wave:
        description: "Staging write posture. Normal staging deployments remain open; select none only to close writes temporarily."
        required: true
        type: choice
        default: "open"
        options:
          - none
          - open
          - public-intake-auth
          - communications
          - match-player
          - match-exclusion-recovery
          - support-requests
          - league-manager
          - league-awards
          - league-live-domain
          - league-live-submit
          - badge-diagnostics
          - admin-tools
          - challenge-ladder
          - moneyball
          - jupr-live
          - public-live
          - tournament-mutations
          - tournament-setup
          - tournament-registration
          - tournament-operations
          - tournament-official-publish
          - tournament-email-handoff
          - tournament-live
          - tournament-live-official-publish
          - tournament-commerce-admin
      expected_candidate_sha:
        description: "Optional canonical staging SHA"
        required: false
        default: ""
        type: string
      orchestration_run_id:
        description: "Reserved controller run ID"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: jupr-staging-api-and-parity-evidence
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy and verify isolated staging API
    concurrency:
      group: jupr-staging-fly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: staging
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      FLY_APP_NAME: juprleagues-api-staging
      JUPR_ENV: staging
      JUPR_EMAIL_MODE: dry_run
      JUPR_REQUIRE_API_AUDIT_LOG: "1"
      JUPR_REQUIRE_WORKER_RUN_LOG: "1"
      JUPR_SUPABASE_JWT_MODE: jwks
      JUPR_STAGING_WRITE_WAVE: none
    steps:
      - name: Check out canonical staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact staging candidate
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_candidate_sha || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/staging:refs/remotes/origin/staging
          HEAD_SHA="$(git rev-parse HEAD)"
          STAGING_SHA="$(git rev-parse refs/remotes/origin/staging)"
          test "$GITHUB_REF" = "refs/heads/staging"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$HEAD_SHA" = "$STAGING_SHA"
          if [ -n "$EXPECTED_CANDIDATE_SHA" ]; then
            [[ "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_CANDIDATE_SHA" = "$HEAD_SHA"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.49"

      - name: Configure staging write posture
        id: staging-posture
        shell: bash
        env:
          SELECTED_WRITE_WAVE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write_wave || 'open' }}
        run: |
          set -euo pipefail
          python scripts/staging_write_waves.py \
            --wave "$SELECTED_WRITE_WAVE" \
            --fly-config fly.staging.toml \
            --github-env "$GITHUB_ENV"
          printf 'write_wave=%s\n' "$SELECTED_WRITE_WAVE" >> "$GITHUB_OUTPUT"

      - name: Resolve stable staging-only public live secrets
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CONFIGURED_PUBLIC_LIVE_RATE_LIMIT_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET }}
          CONFIGURED_PUBLIC_LIVE_TOKEN_SECRET: ${{ secrets.STAGING_PUBLIC_LIVE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          token_secret="${CONFIGURED_PUBLIC_LIVE_TOKEN_SECRET:-}"
          rate_limit_secret="${CONFIGURED_PUBLIC_LIVE_RATE_LIMIT_SECRET:-}"
          if [ -z "$token_secret" ] && [ -z "$rate_limit_secret" ]; then
            mapfile -t derived_secrets < <(
              python - <<'PY'
          import base64
          import hashlib
          import hmac
          import os

          root_secret = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip().encode("utf-8")
          if len(root_secret) < 32:
              raise SystemExit("Staging service role key is unavailable for public-live secret derivation")
          for label in (
              b"jupr:staging:public-live:token:v1",
              b"jupr:staging:public-live:rate-limit:v1",
          ):
              digest = hmac.new(root_secret, label, hashlib.sha256).digest()
              print(base64.urlsafe_b64encode(digest).decode("ascii").rstrip("="))
          PY
            )
            token_secret="${derived_secrets[0]}"
            rate_limit_secret="${derived_secrets[1]}"
          elif [ -z "$token_secret" ] || [ -z "$rate_limit_secret" ]; then
            echo "Both dedicated public-live staging secrets must be configured together." >&2
            exit 1
          fi
          if [ "${#token_secret}" -lt 32 ] || [ "${#rate_limit_secret}" -lt 32 ] || [ "$token_secret" = "$rate_limit_secret" ]; then
            echo "Resolved public-live staging secrets are invalid." >&2
            exit 1
          fi
          echo "::add-mask::$token_secret"
          echo "::add-mask::$rate_limit_secret"
          {
            printf 'STAGING_PUBLIC_LIVE_TOKEN_SECRET=%s\n' "$token_secret"
            printf 'STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET=%s\n' "$rate_limit_secret"
            printf 'JUPR_PUBLIC_LIVE_TOKEN_SECRET=%s\n' "$token_secret"
            printf 'JUPR_PUBLIC_LIVE_RATE_LIMIT_SECRET=%s\n' "$rate_limit_secret"
          } >> "$GITHUB_ENV"

      - name: Validate staging-only inputs and secrets
        shell: bash
        env:
          APP_NAME_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app_name || 'juprleagues-api-staging' }}
          PRIMARY_REGION_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.primary_region || 'dfw' }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_REGISTRATION_CONFIRMATION_SECRET: ${{ secrets.STAGING_REGISTRATION_CONFIRMATION_SECRET }}
          STAGING_REGISTRATION_EDIT_SECRET: ${{ secrets.STAGING_REGISTRATION_EDIT_SECRET }}
        run: |
          set -euo pipefail
          test "$APP_NAME_INPUT" = "juprleagues-api-staging"
          [[ "$PRIMARY_REGION_INPUT" =~ ^[a-z]{3}$ ]]
          test "$EXPECTED_SUPABASE_PROJECT_REF" = "sijpxjxvdtrehmqvirfi"
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}"
          done
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["SUPABASE_URL"])
          expected = os.environ["EXPECTED_SUPABASE_PROJECT_REF"]
          if (
              url.scheme != "https"
              or url.hostname != f"{expected}.supabase.co"
              or url.username is not None
              or url.password is not None
              or url.port is not None
              or url.path not in {"", "/"}
              or url.query
              or url.fragment
          ):
              raise SystemExit("Refusing any Supabase target except isolated staging")

          wave = os.environ["JUPR_STAGING_WRITE_WAVE"]
          def require_pair(first: str, second: str, label: str) -> None:
              a = os.environ.get(first, "").strip()
              b = os.environ.get(second, "").strip()
              if len(a) < 32 or len(b) < 32 or a == b:
                  raise SystemExit(f"{label} staging secrets are missing or invalid")

          if wave in {"open", "public-intake-auth", "tournament-registration"}:
              require_pair(
                  "STAGING_REGISTRATION_EDIT_SECRET",
                  "STAGING_REGISTRATION_CONFIRMATION_SECRET",
                  "Registration",
              )
          if wave in {"open", "public-live"}:
              require_pair(
                  "STAGING_PUBLIC_LIVE_TOKEN_SECRET",
                  "STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET",
                  "Public live",
              )
          PY
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("fly.staging.toml")
          text = path.read_text(encoding="utf-8")
          region = os.environ["PRIMARY_REGION_INPUT"]
          text = re.sub(r'^app\s*=\s*"[^"]+"', 'app = "juprleagues-api-staging"', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^primary_region\s*=\s*"[^"]+"', f'primary_region = "{region}"', text, count=1, flags=re.MULTILINE)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Stage isolated staging secrets and flags
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_REGISTRATION_CONFIRMATION_SECRET: ${{ secrets.STAGING_REGISTRATION_CONFIRMATION_SECRET }}
          STAGING_REGISTRATION_EDIT_SECRET: ${{ secrets.STAGING_REGISTRATION_EDIT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          secret_args=(
            "JUPR_ENV=staging"
            "JUPR_EMAIL_MODE=dry_run"
            "JUPR_REQUIRE_API_AUDIT_LOG=1"
            "JUPR_REQUIRE_WORKER_RUN_LOG=1"
            "JUPR_WEB_BASE_URL=https://jupr-git-staging-pickleballattrespalapas1.vercel.app"
            "SUPABASE_URL=$SUPABASE_URL"
            "SUPABASE_JWKS_URL=${SUPABASE_URL%/}/auth/v1/.well-known/jwks.json"
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            "JUPR_SUPABASE_JWT_MODE=jwks"
            "JUPR_DEPLOYMENT_GIT_SHA=$GITHUB_SHA"
            "JUPR_STAGING_WRITE_WAVE=$JUPR_STAGING_WRITE_WAVE"
            "JUPR_ENABLE_NEXT_ADMIN_PLAYER_UPDATES=1"
            "JUPR_ENABLE_NEXT_ADMIN_WEEKLY_RECAP=1"
            "JUPR_ENABLE_TOURNAMENT_COMMERCE=1"
            "JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION=1"
            "JUPR_ENABLE_TEAM_LEAGUES=1"
            "JUPR_ENABLE_NEXT_PLAYER_UPDATES_LIVE_EMAIL=0"
            "JUPR_ENABLE_PUBLIC_LIVE_WRITES_PRODUCTION=0"
          )
          while IFS= read -r name; do
            secret_args+=("$name=${!name}")
          done < <(python -c 'from scripts.staging_write_waves import ALL_STAGING_WRITE_FLAGS; print("\n".join(ALL_STAGING_WRITE_FLAGS))')
          if [ "$JUPR_STAGING_WRITE_WAVE" = "open" ] || [ "$JUPR_STAGING_WRITE_WAVE" = "public-intake-auth" ] || [ "$JUPR_STAGING_WRITE_WAVE" = "tournament-registration" ]; then
            secret_args+=(
              "JUPR_REGISTRATION_EDIT_SECRET=$STAGING_REGISTRATION_EDIT_SECRET"
              "JUPR_REGISTRATION_CONFIRMATION_SECRET=$STAGING_REGISTRATION_CONFIRMATION_SECRET"
            )
          fi
          if [ "$JUPR_STAGING_WRITE_WAVE" = "open" ] || [ "$JUPR_STAGING_WRITE_WAVE" = "public-live" ]; then
            secret_args+=(
              "JUPR_PUBLIC_LIVE_TOKEN_SECRET=$STAGING_PUBLIC_LIVE_TOKEN_SECRET"
              "JUPR_PUBLIC_LIVE_RATE_LIMIT_SECRET=$STAGING_PUBLIC_LIVE_RATE_LIMIT_SECRET"
            )
          fi
          flyctl secrets set --stage -a "$FLY_APP_NAME" "${secret_args[@]}"

      - name: Validate and deploy staging API
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl config validate --config fly.staging.toml -a "$FLY_APP_NAME"
          flyctl deploy \
            --remote-only \
            -a "$FLY_APP_NAME" \
            --config fly.staging.toml \
            --build-arg "JUPR_DEPLOYMENT_GIT_SHA=$GITHUB_SHA"

      - name: Verify exact staging health and write posture
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${FLY_APP_NAME}.fly.dev"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$base_url/health" -o fly-health.json; then
              if python - <<'PY'
          import hashlib
          import json
          import os
          from scripts.staging_write_waves import expected_write_flags

          with open("fly-health.json", encoding="utf-8") as handle:
              health = json.load(handle)
          wave = os.environ["JUPR_STAGING_WRITE_WAVE"]
          flags = expected_write_flags(wave)
          fingerprint = hashlib.sha256(
              "\n".join(
                  f"{name}={1 if enabled else 0}"
                  for name, enabled in sorted(flags.items())
              ).encode("utf-8")
          ).hexdigest()
          expected = {
              "ok": True,
              "environment": "staging",
              "git_commit_sha": os.environ["GITHUB_SHA"],
              "image_build_git_sha": os.environ["GITHUB_SHA"],
              "fly_app_name": "juprleagues-api-staging",
              "supabase_project_ref": "sijpxjxvdtrehmqvirfi",
              "staging_write_wave": wave,
              "write_wave": wave,
              "business_data_write_wave_active": wave != "none",
              "controlled_write_flags": flags,
              "controlled_write_flag_fingerprint": fingerprint,
              "public_live_production_override_enabled": False,
              "web_origin": "https://jupr-git-staging-pickleballattrespalapas1.vercel.app",
              "jwt_verification_configured": True,
              "jwt_verification_mode": "jwks",
              "jwt_verification_project_ref": "sijpxjxvdtrehmqvirfi",
          }
          failures = [key for key, value in expected.items() if health.get(key) != value]
          prerequisites = health.get("write_prerequisites") or {}
          if prerequisites.get("email_mode") != "dry_run":
              failures.append("email_mode")
          if prerequisites.get("live_player_update_email_enabled") is not False:
              failures.append("live_player_update_email_enabled")
          if failures:
              raise SystemExit("Health mismatch: " + ", ".join(failures))
          PY
              then
                cat fly-health.json
                exit 0
              fi
            fi
            echo "Health verification attempt $attempt/30 failed; retrying."
            sleep 10
          done
          cat fly-health.json 2>/dev/null || true
          exit 1

      - name: Verify full staging feature surface
        shell: bash
        env:
          CLUB_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.club_id || 'tres_palapas' }}
          CLUB_SLUG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.club_slug || 'tres-palapas' }}
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          JUPR_REGISTRATION_CONFIRMATION_SECRET: ${{ secrets.STAGING_REGISTRATION_CONFIRMATION_SECRET }}
          JUPR_REGISTRATION_EDIT_SECRET: ${{ secrets.STAGING_REGISTRATION_EDIT_SECRET }}
        run: |
          set -euo pipefail
          python -m pip install -r services/api/requirements.txt
          python scripts/check_staging_environment.py \
            --expect-full-next-admin \
            --require-api \
            --require-supabase \
            --require-supabase-isolation \
            --expected-supabase-project-ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            --expected-git-sha "$GITHUB_SHA" \
            --expected-fly-app-name "$FLY_APP_NAME" \
            --expected-web-origin "https://jupr-git-staging-pickleballattrespalapas1.vercel.app" \
            --write-wave "$JUPR_STAGING_WRITE_WAVE" \
            --api-base-url "https://${FLY_APP_NAME}.fly.dev" \
            --club-slug "$CLUB_SLUG" \
            --club-id "$CLUB_ID" \
            --json

      - name: Build exact-candidate staging handoff
        if: steps.staging-posture.outputs.write_wave == 'open'
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          python scripts/staging_candidate_handoff.py \
            --candidate-sha "$GITHUB_SHA" \
            --workflow-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output-dir "$RUNNER_TEMP/staging-handoff"

      - name: Detect explicit League Live browser acceptance
        id: league-live-e2e
        if: github.event_name == 'push' && steps.staging-posture.outputs.write_wave == 'open'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" | grep -Fxq 'apps/web/e2e/league-live-session.staging.spec.ts'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The exact staging candidate includes an explicitly reviewed League Live browser acceptance change."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No explicit League Live browser acceptance change is present."
          fi

      - name: Set up Node for League Live browser acceptance
        if: steps.league-live-e2e.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install League Live browser acceptance dependencies
        if: steps.league-live-e2e.outputs.run == 'true'
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for League Live browser acceptance
        if: steps.league-live-e2e.outputs.run == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Prepare League Live browser acceptance auth session
        if: steps.league-live-e2e.outputs.run == 'true'
        shell: bash
        env:
          STAGING_API_BASE_URL: "https://juprleagues-api-staging.fly.dev"
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_URL: "https://sijpxjxvdtrehmqvirfi.supabase.co"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/league-live-e2e"
          test -n "$GITHUB_ENV"
          python scripts/prepare_parity_staging_session.py \
            public-intake-auth \
            --report-dir "$RUNNER_TEMP/league-live-e2e"

      - name: Run authorized League Live browser acceptance
        if: steps.league-live-e2e.outputs.run == 'true'
        shell: bash
        working-directory: apps/web
        env:
          JUPR_EXPECT_PREVIEW_AUTH_ISOLATION: "1"
          JUPR_EXPECTED_STAGING_API_ORIGIN: "https://juprleagues-api-staging.fly.dev"
          JUPR_EXPECTED_STAGING_AUTH_ORIGIN: "https://sijpxjxvdtrehmqvirfi.supabase.co"
          JUPR_SMOKE_CLUB_SLUG: "tres-palapas"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/staging-handoff/staging-handoff.json"
          test -f "$handoff"
          test "$(jq -r '.candidate_sha' "$handoff")" = "$GITHUB_SHA"
          deployment_origin="$(jq -r '.deployment.vercel_deployment_origin' "$handoff")"
          [[ "$deployment_origin" =~ ^https://[a-z0-9]([a-z0-9-]{0,180}[a-z0-9])?-[a-z0-9]{8,64}-pickleballattrespalapas1\.vercel\.app$ ]]
          export STAGING_WEB_BASE_URL="$deployment_origin"
          export JUPR_ATTESTED_VERCEL_DEPLOYMENT_ORIGIN="$deployment_origin"
          export JUPR_LEAGUE_LIVE_ALLOW_MUTATION_E2E=1
          export JUPR_PARITY_MUTATION_CONFIRMATION="RUN DISPOSABLE STAGING WRITES"
          export JUPR_LEAGUE_LIVE_E2E_SESSION_ID=d7221db1-db24-52d2-90fc-b667c16e0193
          export JUPR_LEAGUE_LIVE_E2E_OPERATION_ID=87a15480-a0d4-4a1d-922f-f200d6e4f259
          export JUPR_LEAGUE_LIVE_E2E_LEAGUE_NAME="Acceptance Flex 0822A"
          export JUPR_LEAGUE_LIVE_E2E_MATCH_DATE=2026-08-24
          export JUPR_LEAGUE_LIVE_E2E_REPORT_PATH="$RUNNER_TEMP/staging-handoff/league-live-e2e.json"
          npx playwright test e2e/league-live-session.staging.spec.ts

      - name: End League Live browser acceptance auth session
        if: always() && steps.league-live-e2e.outputs.run == 'true'
        shell: bash
        env:
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_URL: "https://sijpxjxvdtrehmqvirfi.supabase.co"
        run: |
          python scripts/prepare_parity_staging_session.py \
            cleanup \
            --report-dir "$RUNNER_TEMP/league-live-e2e"

      - name: Upload successful staging handoff
        if: steps.staging-posture.outputs.write_wave == 'open'
        uses: actions/upload-artifact@v4
        with:
          name: staging-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/staging-handoff
          if-no-files-found: error
          retention-days: 90

      - name: Publish staging handoff summary
        if: steps.staging-posture.outputs.write_wave == 'open'
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/staging-handoff/staging-handoff.md" >> "$GITHUB_STEP_SUMMARY"
