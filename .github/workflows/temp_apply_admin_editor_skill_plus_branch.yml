name: Temporary Branch Apply Admin Editor and Skill Eligibility Patch

on:
  pull_request:
    branches:
      - staging
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/admin-editor-skill-plus-release-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-editor-skill-plus-release-20260807
          fetch-depth: 0

      - name: Apply preserved product patch
        shell: bash
        run: |
          set -euo pipefail
          chunk_dir='.github/session-new-files/admin-editor-skill-plus-release'
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re
          chunk_dir = Path('.github/session-new-files/admin-editor-skill-plus-release')
          expected = {
              'chunk_00': (18000, '0f761c8aa327d35d812b5b3ddfad3091a06f671c7a108df72432d958041f7fbf'),
              'chunk_01': (18000, 'd32f569663400e0df00f9b09ac27d083569c18103f478870c9ead9ae288f70fd'),
              'chunk_02': (18000, 'ec1d9584432694275d4e45196f56667e1d8f2c7b27fe354042bd4728cdbebf3d'),
              'chunk_03': (18000, '6267f693ace70be534717a0395299fe624a981a661dc2a5c1b1b172165ee371f'),
              'chunk_04': (16540, '82bea07176c5e9e4fe52d770805fcc2258023aac1214be0f6107cd7999c93d15'),
          }
          parts = []
          for name in sorted(expected):
              path = chunk_dir / name
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              print(f'{name}: bytes={len(data)} sha256={digest} expected={expected[name]}')
              parts.append(data)
          joined = b''.join(parts)
          print(f'joined: bytes={len(joined)} sha256={hashlib.sha256(joined).hexdigest()}')
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', joined)
          print(f'clean: bytes={len(clean)} sha256={hashlib.sha256(clean).hexdigest()}')
          decoded = base64.b64decode(clean, validate=False)
          patch = gzip.decompress(decoded)
          Path('/tmp/admin-editor-skill-plus.patch').write_bytes(patch)
          print(f'patch: bytes={len(patch)} sha256={hashlib.sha256(patch).hexdigest()}')
          PY
          git apply --binary --index /tmp/admin-editor-skill-plus.patch
          rm -rf "$chunk_dir"
          rm -f .github/workflows/temp_apply_admin_editor_skill_plus_branch.yml
          rm -f .github/workflows/temp_apply_admin_editor_skill_plus.yml
          rm -f .github/workflows/temp_pr1211_executor.yml
          git add -A
          git diff --cached --check
          python -m py_compile \
            jupr_app/domain/tournament_registration_compiler.py \
            jupr_app/domain/tournament_registration_repo.py \
            jupr_app/services/admin_tournament_service.py \
            jupr_app/services/admin_tournament_setup_service.py \
            jupr_app/services/public_tournament_registration_service.py \
            services/api/admin_tournament_routes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement complete tournament registration editor and explicit skill eligibility'
          git push origin HEAD:agent/admin-editor-skill-plus-release-20260807
