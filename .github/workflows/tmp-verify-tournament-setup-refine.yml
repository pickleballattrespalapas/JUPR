name: Temporary Tournament Setup refinement verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-tournament-setup-refine-391400'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 391400b29681d6f6167ba321622a4715e7e5607e
      FLY_HEALTH_URL: https://juprleagues-api-staging.fly.dev/health
      MATCH_UPLOADER_STATUS_URL: https://juprleagues-api-staging.fly.dev/admin/clubs/tres_palapas/match-uploader/status
      CANONICAL_URL: https://jupr-git-staging-pickleballattrespalapas1.vercel.app
      TEST_TOURNAMENT_ID: 93000000-0000-4000-8000-000000000001
      TEST_TOURNAMENT_NAME: Staging%20Summer%20Classic
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 20 "$FLY_HEALTH_URL" -o evidence/health.json; then
              source_sha="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image_sha="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$source_sha image=$image_sha"
              if [ "$source_sha" = "$EXPECTED_SHA" ] && { [ -z "$image_sha" ] || [ "$image_sha" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('evidence/health.json').read_text())
          expected_sha = os.environ['EXPECTED_SHA']

          def find_key(value, key):
              if isinstance(value, dict):
                  if key in value:
                      return value[key]
                  for child in value.values():
                      found = find_key(child, key)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_key(child, key)
                      if found is not None:
                          return found
              return None

          def first(*keys):
              for key in keys:
                  value = find_key(payload, key)
                  if value is not None:
                      return value
              return None

          observed = {
              'environment': first('environment'),
              'source_sha': first('git_commit_sha', 'source_commit_sha', 'source_sha', 'commit_sha'),
              'image_sha': first('image_build_git_sha', 'image_git_sha'),
              'fly_app': first('fly_app_name', 'app_name', 'app'),
              'write_wave': first('write_wave'),
              'staging_write_wave': first('staging_write_wave'),
              'business_data_write_wave_active': first('business_data_write_wave_active'),
              'email_mode': first('email_mode'),
              'live_player_update_email_enabled': first('live_player_update_email_enabled'),
              'public_live_production_override_enabled': first('public_live_production_override_enabled'),
              'supabase_project_ref': first('supabase_project_ref', 'supabase_project'),
          }
          expected = {
              'environment': 'staging',
              'source_sha': expected_sha,
              'image_sha': expected_sha,
              'fly_app': 'juprleagues-api-staging',
              'write_wave': 'open',
              'staging_write_wave': 'open',
              'business_data_write_wave_active': True,
              'email_mode': 'dry_run',
              'live_player_update_email_enabled': False,
              'public_live_production_override_enabled': False,
              'supabase_project_ref': 'sijpxjxvdtrehmqvirfi',
          }
          Path('evidence/observed-health-contract.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          mismatches = {
              key: {'expected': expected[key], 'actual': observed.get(key)}
              for key in expected
              if observed.get(key) != expected[key]
          }
          print(json.dumps(observed, indent=2, sort_keys=True))
          if mismatches:
              print('MISMATCHES=' + json.dumps(mismatches, indent=2, sort_keys=True))
              raise SystemExit(1)
          PY

      - name: Verify Match Uploader remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$MATCH_UPLOADER_STATUS_URL" -o evidence/match-uploader-status.json
          jq -e '(.enabled == true) and (.singles_write_enabled == true) and ((.status // "") != "guarded_off")' evidence/match-uploader-status.json

      - name: Verify Vercel bypass is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Wait for canonical Tournament Setup routes
        shell: bash
        run: |
          set -euo pipefail
          context="tournament=$TEST_TOURNAMENT_ID&name=$TEST_TOURNAMENT_NAME"
          routes=(
            "/admin/tournaments/tournament?$context"
            "/admin/tournaments/setup?$context"
            "/admin/tournaments/setup/basics?$context"
            "/admin/tournaments/setup/events?$context"
            "/admin/tournaments/setup/divisions?$context"
            "/admin/tournaments/setup/registration-rules?$context"
            "/admin/tournaments/setup/pricing?$context"
            "/admin/tournaments/setup/schedule?$context"
            "/admin/tournaments/setup/review?$context"
            "/admin/match-uploader"
          )
          for attempt in $(seq 1 90); do
            : > evidence/vercel-routes.txt
            all_ready=1
            for path in "${routes[@]}"; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                -H "x-vercel-set-bypass-cookie: true" \
                "$CANONICAL_URL$path" || true)"
              echo "$path $status" | tee -a evidence/vercel-routes.txt
              if [ "$status" != "200" ]; then all_ready=0; fi
            done
            if [ "$all_ready" -eq 1 ]; then break; fi
            if [ "$attempt" -eq 90 ]; then
              echo "Canonical Tournament Setup routes did not all become ready." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify Tournament Setup source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web')
          panel = (root / 'app/admin/tournaments/setup/TournamentSetupWizardPanel.tsx').read_text()
          nav = (root / 'components/TournamentSetupWizardNav.tsx').read_text()
          event_card = (root / 'app/admin/tournaments/setup/TournamentSetupEventFamilyCard.tsx').read_text()
          division_card = (root / 'app/admin/tournaments/setup/TournamentSetupDivisionCard.tsx').read_text()
          migration = Path('supabase/migrations/20261021000000_tournament_setup_basics_metadata.sql').read_text()

          assert 'Step {definition.number} of 7' in panel
          assert 'Location or venue' in panel
          assert 'Timezone' in panel
          assert 'Add sponsor' in panel
          assert 'void saveBasics()' in panel
          basics = panel.split('function renderBasics()', 1)[1].split('function renderEvents()', 1)[0]
          assert 'ConfirmAction' not in basics
          assert 'saveDraftAndContinue("divisions")' in panel
          assert 'saveDraftAndContinue("registration-rules")' in panel
          assert 'Tournament-wide registration status' in panel
          assert 'Divisions do not have separate registration statuses' in panel
          assert '| "divisions"' in nav
          assert 'label: "Events"' in nav
          assert 'label: "Divisions"' in nav
          assert 'Event name' in event_card
          assert 'Tournament day' in event_card
          assert 'Division name' in division_card
          assert 'Skill division' in division_card
          assert 'Registration status' not in division_card
          for field in ('location_name', 'timezone', 'sponsors_json'):
              assert field in migration
          Path('evidence/source-contract.txt').write_text('Tournament Setup refinement source contracts passed.\n')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: tournament-setup-refinement-evidence
          path: evidence
          if-no-files-found: error
