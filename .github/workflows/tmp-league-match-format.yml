name: Temporary league match-format publisher

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: temporary-league-match-format
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/league-match-format-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out format branch
        uses: actions/checkout@v4
        with:
          ref: agent/league-match-format-20260731
          fetch-depth: 0

      - name: Apply reviewed league format changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp/apply_league_match_format.py
          python .github/tmp/patch_league_match_format_test.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run focused web checks
        working-directory: apps/web
        run: |
          node tests/league-match-format.cjs
          node tests/match-uploader-layout.cjs

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run focused Python checks
        run: |
          python -m py_compile \
            jupr_app/domain/match_processing.py \
            jupr_app/domain/singles_match_processing.py \
            jupr_app/services/admin_match_uploader_service.py \
            jupr_app/services/admin_league_manager_service.py \
            jupr_app/services/admin_league_manager_create_service.py \
            services/api/admin_league_manager_routes.py
          python -m pytest -q \
            tests/test_league_match_format_contract.py \
            tests/test_api_contract_admin_match_uploader_singles.py \
            tests/test_manual_acceptance_ux_regressions.py

      - name: Publish clean application commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/tmp/apply_league_match_format.py \
            .github/tmp/patch_league_match_format_test.py \
            .github/workflows/tmp-league-match-format.yml
          rmdir .github/tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate singles and doubles leagues'
          git fetch origin staging --no-tags
          actual="$(git diff --name-only origin/staging...HEAD | sort)"
          expected="$(cat <<'EOF' | sort
          apps/web/app/admin/league-manager/LeagueManagerPanel.tsx
          apps/web/app/admin/match-uploader/MatchUploaderForm.tsx
          apps/web/lib/adminLeagueManagerApi.ts
          apps/web/lib/adminMatchUploaderApi.ts
          apps/web/tests/league-match-format.cjs
          jupr_app/domain/match_processing.py
          jupr_app/domain/singles_match_processing.py
          jupr_app/services/admin_league_manager_create_service.py
          jupr_app/services/admin_league_manager_service.py
          jupr_app/services/admin_match_uploader_service.py
          services/api/admin_league_manager_routes.py
          supabase/migrations/20260731033000_league_match_format.sql
          tests/test_api_contract_admin_match_uploader_singles.py
          tests/test_league_match_format_contract.py
          EOF
          )"
          test "$actual" = "$expected"
          git push origin HEAD:agent/league-match-format-20260731
