name: Temporary Export Directional Eligibility Source

on:
  push:
    branches:
      - agent/directional-eligibility-review-20260806

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/directional-eligibility-review-20260806
          fetch-depth: 1

      - name: Archive exact feature source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/jupr-directional-eligibility-source.tar.gz HEAD

      - name: Upload exact feature source
        uses: actions/upload-artifact@v4
        with:
          name: jupr-directional-eligibility-source
          path: /tmp/jupr-directional-eligibility-source.tar.gz
          retention-days: 1
          if-no-files-found: error
