name: Temporary Apply Review Age Dependency Fixes

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/review-age-dependency-fixes-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply product patch and remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/review-age-dependency/review-age-dependency-fixes.patch.gz.b64 | gzip -dc > /tmp/review-age-dependency.patch
          git apply --check /tmp/review-age-dependency.patch
          git apply /tmp/review-age-dependency.patch
          rm -rf .github/review-age-dependency
          rm -f .github/workflows/temp_export_review_age_dependency_source.yml
          rm -f .github/workflows/temp_apply_review_age_dependency_fixes.yml
          git add -A
          git diff --cached --check
          python -m py_compile \
            jupr_app/domain/tournament_age_policy.py \
            jupr_app/domain/tournament_registration_repo.py \
            jupr_app/services/admin_tournament_setup_service.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Review age grouping and dependency resolution'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
