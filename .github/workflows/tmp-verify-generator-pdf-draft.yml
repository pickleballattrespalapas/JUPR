name: Temporary generator PDF and draft verifier

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-generator-pdf-e7d51b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: e7d51bb1a0fae9146fccde9c3dc7b429d3481d52
      FLY_BASE: https://juprleagues-api-staging.fly.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Wait for exact Fly candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 20 "$FLY_BASE/health" -o evidence/health.json; then
              source_sha="$(jq -r '.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha // empty' evidence/health.json)"
              image_sha="$(jq -r '.image_build_git_sha // .image_git_sha // empty' evidence/health.json)"
              echo "attempt=$attempt source=$source_sha image=$image_sha"
              if [ "$source_sha" = "$EXPECTED_SHA" ] && { [ -z "$image_sha" ] || [ "$image_sha" = "$EXPECTED_SHA" ]; }; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Fly did not reach the exact staging candidate." >&2
              cat evidence/health.json >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify permanent-open staging safety
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$EXPECTED_SHA" '
            (.environment == "staging") and
            ((.git_commit_sha // .source_commit_sha // .source_sha // .commit_sha) == $sha) and
            ((.image_build_git_sha // .image_git_sha // $sha) == $sha) and
            (.fly_app_name == "juprleagues-api-staging") and
            (.write_wave == "open") and
            (.staging_write_wave == "open") and
            (.business_data_write_wave_active == true) and
            (.write_prerequisites.email_mode == "dry_run") and
            (.write_prerequisites.live_player_update_email_enabled == false) and
            (.public_live_production_override_enabled == false) and
            (.supabase_project_ref == "sijpxjxvdtrehmqvirfi")
          ' evidence/health.json

      - name: Verify Match Uploader remains enabled
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            "$FLY_BASE/admin/clubs/tres_palapas/match-uploader/status" \
            -o evidence/match-uploader-status.json
          jq -e '(.enabled == true) and (.singles_write_enabled == true) and ((.status // "") != "guarded_off")' \
            evidence/match-uploader-status.json

      - name: Verify public generator API still responds
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            "$FLY_BASE/clubs/tres-palapas/players?status=active&sort=name&limit=5" \
            -o evidence/players.json
          jq -e '(.players | type == "array") and (.players | length > 0)' evidence/players.json

          cat > evidence/preview-request.json <<'JSON'
          {
            "generator_kind": "round_robin",
            "play_format": "singles",
            "title": "PDF draft verification",
            "participant_names": ["PDF Test A", "PDF Test B", "PDF Test C", "PDF Test D"],
            "participant_player_ids": {},
            "total_rounds": 3,
            "court_count": 2
          }
          JSON
          curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            --data @evidence/preview-request.json \
            "$FLY_BASE/clubs/tres-palapas/play-generators/preview" \
            -o evidence/preview.json
          jq -e '(.ok == true) and (.preview.rounds | length == 3)' evidence/preview.json

      - name: Verify PDF and draft source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web')
          helper = (root / 'lib/playGeneratorDraft.ts').read_text()
          public = (root / 'app/clubs/[clubSlug]/play-generators/PublicGeneratorWorkspace.tsx').read_text()
          admin = (root / 'app/admin/play-generators/GeneratorWorkspace.tsx').read_text()

          assert 'window.open("", "_blank")' in helper
          assert 'preparedWindow.location.replace(href)' in helper
          assert 'anchor.target = "_blank"' in helper
          assert 'window.sessionStorage.getItem' in helper
          assert 'window.sessionStorage.setItem' in helper
          assert 'window.sessionStorage.removeItem' in helper

          for name, source in [('public', public), ('admin', admin)]:
              assert 'Download one-sheet PDF (opens new tab)' in source, name
              assert 'const pdfWindow = preparePdfWindow();' in source, name
              assert 'await import("jspdf")' in source, name
              assert source.index('const pdfWindow = preparePdfWindow();') < source.index('await import("jspdf")'), name
              assert 'const blob = doc.output("blob")' in source, name
              assert 'openPdfBlobInNewTab(blob, filename, pdfWindow)' in source, name
              assert 'doc.save(' not in source, name
              assert 'readPlayGeneratorDraft<PreviewEvent>' in source, name
              assert 'writePlayGeneratorDraft' in source, name
              assert 'Restored your unsaved schedule preview.' in source, name
              assert 'clearPlayGeneratorDraft(draftKey)' in source, name
              start = source.index('async function startSession')
              clear = source.index('clearPlayGeneratorDraft(draftKey)', start)
              route = source.index('router.push', start)
              assert start < clear < route, name

          Path('evidence/source-contract.txt').write_text(
              'Generator PDF new-tab and unsaved-draft contracts passed.\n'
          )
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: generator-pdf-draft-evidence
          path: evidence
          if-no-files-found: error
