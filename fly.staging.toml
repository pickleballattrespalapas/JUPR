# Isolated Fly.io deployment config for full Next/FastAPI staging validation.
# This app must use staging Supabase credentials only. It is deliberately
# separate from fly.toml and the production juprleagues-api app.
app = "juprleagues-api-staging"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile.api"

[env]
  PORT = "8080"
  JUPR_ENV = "staging"
  JUPR_EMAIL_MODE = "dry_run"
  JUPR_STAGING_WRITE_WAVE = "open"
  JUPR_ENABLE_STAGING_PUBLIC_INTAKE_WRITES = "1"
  JUPR_ENABLE_STAGING_TOURNAMENT_COMMERCE_WRITES = "1"
  JUPR_WEB_BASE_URL = "https://jupr-git-staging-pickleballattrespalapas1.vercel.app"
  JUPR_REQUIRE_API_AUDIT_LOG = "1"
  JUPR_REQUIRE_WORKER_RUN_LOG = "1"
  JUPR_SUPABASE_JWT_MODE = "jwks"
  JUPR_STREAMLIT_FALLBACK_URL = "https://juprtrespalapas.streamlit.app"
  JUPR_ENABLE_NEXT_ADMIN_WRITE_PILOT = "1"
  JUPR_ENABLE_NEXT_ADMIN_SHELL = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_LOG = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_LOG_APPLY = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_LOG_DESTRUCTIVE = "1"
  JUPR_ENABLE_NEXT_ADMIN_REPLAY = "1"
  JUPR_ENABLE_NEXT_ADMIN_SCORE_ENTRY = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_UPLOADER = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_UPLOADER_PREVIEW = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_UPLOADER_SINGLES = "1"
  JUPR_ENABLE_NEXT_ADMIN_PLAYER_EDITOR = "1"
  JUPR_ENABLE_NEXT_ADMIN_PLAYER_UPDATES = "1"
  JUPR_ENABLE_NEXT_PLAYER_UPDATES_LIVE_EMAIL = "0"
  JUPR_ENABLE_NEXT_ADMIN_SUPPORT_REQUESTS = "1"
  JUPR_ENABLE_NEXT_ADMIN_LEAGUE_MANAGER = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_LEAGUE_MANAGER_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_LEAGUE_LIVE_DOMAIN = "1"
  JUPR_ENABLE_NEXT_ADMIN_LEAGUE_LIVE_SUBMIT = "1"
  JUPR_ENABLE_NEXT_ADMIN_LEAGUE_AWARDS_WRITE = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENTS = "1"
  JUPR_ENABLE_TOURNAMENT_COMMERCE = "1"
  JUPR_ENABLE_TOURNAMENT_TEAM_COMPETITION = "1"
  JUPR_ENABLE_TEAM_LEAGUES = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_MUTATIONS = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_SETUP_MUTATIONS = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_REGISTRATION_MUTATIONS = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_IMPORT_HANDOFF = "0"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OPERATIONS_MUTATIONS = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_OFFICIAL_PUBLISH = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOURNAMENT_EMAIL_HANDOFF = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_TOURNAMENT_LIVE_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_WEEKLY_RECAP = "1"
  JUPR_ENABLE_NEXT_ADMIN_COMMUNICATIONS_MUTATIONS = "1"
  JUPR_ENABLE_NEXT_ADMIN_BADGE_DIAGNOSTICS = "1"
  JUPR_ENABLE_NEXT_ADMIN_MONEYBALL = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_MONEYBALL_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_JUPR_LIVE = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_JUPR_LIVE_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_CHALLENGE_LADDER = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_CHALLENGE_LADDER_WRITES = "1"
  JUPR_ENABLE_PUBLIC_LIVE_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_MATCH_CANONICAL_AUDIT = "1"
  JUPR_ENABLE_STAGING_NEXT_ADMIN_MATCH_CANONICAL_NORMALIZE_WRITES = "1"
  JUPR_ENABLE_NEXT_ADMIN_TOOLS = "1"
  JUPR_ENABLE_AUTO_PLAYER_UPDATE_EMAILS = "1"
  JUPR_ALLOWED_ORIGINS = "https://jupr-git-test-pickleballattrespalapas1.vercel.app,https://jupr-rho.vercel.app,https://juprleagues.com,https://www.juprleagues.com,https://pickleballclubsandwich.com,https://www.pickleballclubsandwich.com,http://localhost:3000,http://127.0.0.1:3000"
  JUPR_ALLOWED_ORIGIN_REGEX = '^https://jupr(?:-[a-z0-9-]+)?-pickleballattrespalapas1\.vercel\.app$'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
